<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Física i Química - Índex de Continguts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f1eb;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Encabezado / Hero Section -->
    <header class="bg-slate-900 text-white py-16 px-6 relative overflow-hidden shadow-lg">
        <div class="absolute inset-0 opacity-10">
            <svg width="100%" height="100%"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" /></svg>
        </div>
        <div class="max-w-6xl mx-auto relative z-10 text-center">
            <div class="inline-flex items-center justify-center p-3 bg-blue-600/20 rounded-full mb-4">
                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">Física i Química</h1>
            <p class="text-lg md:text-xl text-slate-300 max-w-2xl mx-auto">
                Portal d'aprenentatge interactiu. Selecciona una unitat per accedir al temari teòric i als exercicis pràctics.
            </p>
        </div>
    </header>

    <!-- Cuadrícula de Temas -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <script>
                // Array con objetos: Título + Icono SVG asociado
                const unitats = [
                    {
                        titol: "La física i la química com a ciències experimentals",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" /></svg>`
                    },
                    {
                        titol: "Estructura atòmica",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(30 12 12)" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(90 12 12)" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(150 12 12)" stroke-width="1.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>`
                    },
                    {
                        titol: "Lleis i conceptes bàsics en química",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="18" cy="6" r="3" stroke-width="1.5"/><circle cx="6" cy="12" r="3" stroke-width="1.5"/><circle cx="18" cy="18" r="3" stroke-width="1.5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.5 7.5l-7 3M8.5 13.5l7 3" /></svg>`
                    },
                    {
                        titol: "Estequiometria i química industrial",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 21h18M4 21V8l6-4v17M10 11l5-3v13M15 14l5-3v10" /></svg>`
                    },
                    {
                        titol: "Química del carboni",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3l7 4v10l-7 4-7-4V7l7-4z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.5l4.5 2.5v5l-4.5 2.5-4.5-2.5v-5L12 6.5z" /></svg>`
                    },
                    {
                        titol: "Cinemàtica del punt material. Elements i magnituds del moviment",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
                    },
                    {
                        titol: "Dinàmica",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-width="1.5"/><path d="M9 12h6m-3-3l3 3-3 3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>`
                    },
                    {
                        titol: "Treball i energia mecànica",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`
                    },
                    {
                        titol: "Termodinàmica",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 16.5A4.5 4.5 0 0012 21a4.5 4.5 0 003-4.5c0-1.66-1-3.1-2.5-3.88V5.5a2.5 2.5 0 00-5 0v7.12c-1.5.78-2.5 2.22-2.5 3.88z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 16.5v-4" /></svg>`
                    },
                    {
                        titol: "Interacció electroestàtica",
                        icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>`
                    }
                ];

                const container = document.currentScript.parentNode;

                unitats.forEach((unit, index) => {
                    const temaNum = index + 1;
                    
                    // AQUÍ CONTROLAS QUÉ TEMAS ESTÁN "ACTIVOS" VISUALMENTE
                    const temesActius = [7, 8]; // Añade más números separados por comas según los vayas terminando
                    
                    const isTemaActiu = temesActius.includes(temaNum);
                    
                    const temesAmbLaboratori = [7, 8]; 
const hasLab = temesAmbLaboratori.includes(temaNum);

const cardHTML = `
    <article class="bg-white rounded-2xl p-6 border border-slate-200 card-hover flex flex-col h-full ${isTemaActiu ? 'ring-2 ring-blue-500 shadow-md relative' : ''}">
        ${isTemaActiu ? '<span class="absolute -top-3 -right-3 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm z-20">Actiu</span>' : ''}
        
        <div class="mb-4 flex-grow flex justify-between items-start gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-1 rounded-md">Tema ${temaNum}</span>
                <h2 class="text-xl font-bold mt-3 text-slate-800 leading-tight">${unit.titol}</h2>
            </div>
            <div class="p-3 bg-slate-50 text-blue-500 rounded-xl flex-shrink-0 border border-slate-100">
                ${unit.icon}
            </div>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-100">
            <a href="TEMA ${temaNum}-TEORÍA.html" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold rounded-lg border border-slate-200 transition-colors">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477-4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                Teoria
            </a>
            <a href="TEMA ${temaNum}-EJERCICIOS.html" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Pràctica
            </a>
            ${hasLab ? `
            <a href="laboratorio-tema-${temaNum}/index.html" class="col-span-2 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-sm transition-colors mt-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                Laboratori Virtual
            </a>
            ` : ''}
        </div>
    </article>
`;
                    
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            </script>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <p class="text-sm">Plataforma d'Aprenentatge - Física i Química</p>
        </div>
    </footer>

</body>
</html>
