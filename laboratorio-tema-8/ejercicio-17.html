<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Equilibrio y Energía Elástica</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #06b6d4; /* Cyan 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        .spring-path {
            transition: d 0.3s ease-out;
        }
        .ruler-bg {
            background-image: repeating-linear-gradient(to bottom, #475569 0, #475569 1px, transparent 1px, transparent 10px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const ZapIcon = getIcon('Zap');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const SettingsIcon = getIcon('Settings');
            const InfoIcon = getIcon('Info');
            const ArrowDownIcon = getIcon('ArrowDown');
            const ArrowUpIcon = getIcon('ArrowUp');
            const ImagePlusIcon = getIcon('ImagePlus');
            const WeightIcon = getIcon('Scale');

            const App = () => {
                const g = 9.8; // m/s^2

                // Estados interactivos inicializados con los datos del enunciado
                const [masa, setMasa] = useState(5.00); // kg
                const [elongacionCm, setElongacionCm] = useState(12.5); // cm

                // --- CÁLCULOS FÍSICOS ---
                const elongacionM = elongacionCm / 100;
                const peso = masa * g; // Fuerza que estira el muelle
                
                // a) Constante elástica: F = k * x  => k = F / x
                // En equilibrio, F_elástica = Peso
                const constanteK = elongacionM > 0 ? peso / elongacionM : 0;
                
                // b) Energía potencial elástica: Epe = 1/2 * k * x^2
                const energiaPotencialElastica = 0.5 * constanteK * Math.pow(elongacionM, 2);

                // --- PARÁMETROS VISUALES ---
                const l0 = 100; // Longitud natural visual (px)
                const pxPerCm = 15; // Escala visual: 1 cm = 15 px
                const currentSpringLength = l0 + (elongacionCm * pxPerCm);

                // Generador del muelle SVG vertical
                const generateSpringPath = (height) => {
                    const coils = 15;
                    const width = 20;
                    const padding = 15;
                    let path = `M 50 0 L 50 ${padding} `;
                    const coilHeight = (height - padding * 2) / coils;
                    for(let i=0; i<coils; i++) {
                        const x = i % 2 === 0 ? 50 - width : 50 + width;
                        const y = padding + coilHeight * (i + 0.5);
                        path += `L ${x} ${y} `;
                    }
                    path += `L 50 ${height - padding} L 50 ${height}`;
                    return path;
                };

                // DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un bloque colgado de un muelle vertical. Vector Peso P hacia abajo. Vector Fuerza Elástica Fe hacia arriba. Los dos vectores tienen la misma longitud. Una cota marca el alargamiento x. Fondo blanco, minimalista, estilo educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error de red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-cyan-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Dinámica y Energía</span>
                                <h1 className="text-3xl font-black text-cyan-400 uppercase tracking-tight tracking-widest">Equilibrio Elástico</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed font-medium italic">
                                    "Cuando se cuelga un cuerpo de 5,00 kg de un muelle vertical se produce un alargamiento de 12,5 cm. Calcula: a) La constante elástica. b) La energía potencial elástica almacenada."
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col pt-16">
                                
                                {/* HUD de Datos en Vivo */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza Elástica (Fe)</p>
                                        <p className="text-xl font-mono font-black text-white">{peso.toFixed(2)} N</p>
                                    </div>
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-cyan-500/50 backdrop-blur-md text-right border-b-4 border-b-cyan-500 shadow-[0_0_20px_rgba(6,182,212,0.2)]">
                                        <p className="text-[10px] text-cyan-300 uppercase font-black flex items-center justify-end gap-1">
                                            <ZapIcon size={12} className="text-cyan-400" /> Energía (Epe)
                                        </p>
                                        <p className="text-2xl font-mono font-black text-cyan-400">
                                            {energiaPotencialElastica.toFixed(3)} <span className="text-sm">J</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Escena del Muelle */}
                                <div className="relative w-full h-full flex justify-center mt-4">
                                    {/* Soporte superior */}
                                    <div className="absolute top-0 w-48 h-4 bg-slate-600 border-b-4 border-slate-500 rounded-b-md z-20 flex justify-center">
                                        <div className="w-4 h-6 bg-slate-400 rounded-b-sm"></div>
                                    </div>

                                    {/* Muelle SVG */}
                                    <div className="absolute top-4 z-10">
                                        <svg width="100" height={currentSpringLength + 20} className="overflow-visible">
                                            <path 
                                                d={generateSpringPath(currentSpringLength)} 
                                                fill="none" stroke="#94a3b8" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"
                                                className="spring-path"
                                            />
                                        </svg>
                                    </div>

                                    {/* Regla Lateral */}
                                    <div className="absolute top-4 left-[calc(50%+80px)] w-8 h-[400px] border-l-2 border-slate-600 ruler-bg">
                                        {/* Marca 0 */}
                                        <div className="absolute top-0 -left-6 w-5 border-b-2 border-cyan-500"></div>
                                        <span className="absolute -top-2 left-2 text-[10px] font-bold text-cyan-400 font-mono">0 cm</span>
                                        
                                        {/* Marca longitud natural L0 */}
                                        <div className="absolute -left-6 w-5 border-b-2 border-dashed border-slate-500" style={{ top: `${l0}px` }}></div>
                                        <span className="absolute left-2 text-[8px] text-slate-500 uppercase font-black" style={{ top: `${l0 - 6}px` }}>L₀ (Reposo)</span>
                                        
                                        {/* Marca Elongación Actual */}
                                        <div className="absolute -left-12 w-11 border-b-4 border-cyan-500 transition-all duration-300" style={{ top: `${currentSpringLength}px` }}></div>
                                        <div className="absolute left-2 transition-all duration-300 bg-slate-900 px-1 rounded border border-cyan-900/50" style={{ top: `${currentSpringLength - 10}px` }}>
                                            <span className="text-xs font-mono font-bold text-cyan-300">{elongacionCm.toFixed(1)} cm</span>
                                        </div>
                                    </div>

                                    {/* El Cuerpo (Masa) */}
                                    <div 
                                        className="absolute w-20 h-20 bg-orange-600 border-4 border-orange-400 rounded-xl flex items-center justify-center shadow-2xl transition-all duration-300 z-20"
                                        style={{ top: `${currentSpringLength + 4}px` }}
                                    >
                                        <span className="font-black text-orange-200 text-sm">{masa.toFixed(2)} kg</span>

                                        {/* VECTORES DCL */}
                                        <div className="absolute top-1/2 left-1/2 w-0 h-0 pointer-events-none">
                                            {/* Vector Fuerza Elástica (Arriba) */}
                                            <div className="absolute bottom-0 flex flex-col items-center pb-2" style={{ height: Math.min(100, peso * 5) }}>
                                                <span className="mb-1 text-[9px] font-black text-cyan-300 bg-slate-900/80 px-1 rounded shadow">Fe</span>
                                                <div className="w-1.5 bg-cyan-400 h-full relative shadow-[0_0_8px_rgba(34,211,238,0.6)]">
                                                    <div className="absolute top-0 -translate-x-[7px]">{ArrowUpIcon && <ArrowUpIcon size={16} className="text-cyan-400" />}</div>
                                                </div>
                                            </div>
                                            
                                            {/* Vector Peso (Abajo) */}
                                            <div className="absolute top-0 flex flex-col items-center pt-2" style={{ height: Math.min(100, peso * 5) }}>
                                                <div className="w-1.5 bg-orange-400 h-full relative shadow-[0_0_8px_rgba(251,146,60,0.4)]">
                                                    <div className="absolute bottom-0 -translate-x-[7px]">{ArrowDownIcon && <ArrowDownIcon size={16} className="text-orange-400" />}</div>
                                                </div>
                                                <span className="mt-1 text-[9px] font-black text-orange-300 bg-slate-900/80 px-1 rounded shadow">P</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-cyan-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Configuración del Sistema
                                    </h3>
                                    
                                    <div className="space-y-6 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase flex items-center gap-1"><WeightIcon size={14}/> Masa colgada (m)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-white">{masa.toFixed(2)} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="0.5" max="15" step="0.1" value={masa} 
                                                onChange={e => setMasa(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-cyan-400 font-bold uppercase">Alargamiento observado (x)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-cyan-300">{elongacionCm.toFixed(1)} cm</span>
                                            </div>
                                            <input 
                                                type="range" min="1" max="25" step="0.1" value={elongacionCm} 
                                                onChange={e => setElongacionCm(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500" 
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => {setMasa(5.00); setElongacionCm(12.5);}} 
                                        className="w-full py-2 text-[10px] font-black uppercase text-slate-500 hover:text-slate-300 flex items-center justify-center gap-2 border border-slate-700 rounded-lg transition-colors"
                                    >
                                        <RotateCcwIcon size={14} /> Restaurar datos del enunciado
                                    </button>
                                </div>

                                <div className="bg-cyan-950/20 p-6 rounded-3xl border border-cyan-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-cyan-500/30 pb-2">
                                        <h4 className="font-bold text-cyan-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Detallada
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Dibujando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg shadow-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>Paso previo:</strong> Pasamos el alargamiento al S.I.<br/>
                                        x = {elongacionCm} cm / 100 = <strong>{elongacionM.toFixed(3)} m</strong></p>

                                        <p><strong>a) Constante elástica (k):</strong><br/>
                                        En equilibrio, la fuerza elástica compensa al peso (m·g).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            Peso = {masa} kg · 9.8 m/s² = <strong>{peso.toFixed(1)} N</strong><br/>
                                            k = Peso / x = {peso.toFixed(1)} / {elongacionM.toFixed(3)}<br/>
                                            <strong>k = {constanteK.toFixed(1)} N/m</strong>
                                        </div>

                                        <p><strong>b) Energía Potencial Elástica (Epe):</strong><br/>
                                        Es el trabajo realizado por el muelle para deformarse.</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-cyan-500 font-mono text-cyan-200 shadow-inner overflow-x-auto">
                                            Epe = ½ · k · x²<br/>
                                            Epe = 0.5 · {constanteK.toFixed(1)} · ({elongacionM.toFixed(3)})²<br/>
                                            Epe = 0.5 · {constanteK.toFixed(1)} · {Math.pow(elongacionM, 2).toFixed(5)}<br/>
                                            <strong>Epe = {energiaPotencialElastica.toFixed(4)} Julios (J)</strong>
                                        </div>
                                        
                                        <div className="bg-indigo-900/20 p-3 rounded-lg flex items-start gap-2 border border-indigo-500/20 mt-2">
                                            <InfoIcon size={16} className="text-indigo-400 shrink-0 mt-0.5" />
                                            <p className="text-[10px] text-indigo-300 italic">
                                                Nota: Si la masa fuera el doble, el alargamiento también sería el doble (25 cm), pero la energía almacenada sería <strong>cuatro veces mayor</strong> (aprox. 12.25 J).
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Energía | Ley de Hooke
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
