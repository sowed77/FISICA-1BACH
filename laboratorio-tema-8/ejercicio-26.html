<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Distancia de Frenado</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ef4444; /* Red 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .floor-pattern {
            background-color: #1e293b;
            background-image: repeating-linear-gradient(90deg, #334155 0, #334155 20px, transparent 20px, transparent 40px);
            background-position: bottom;
            background-size: 40px 6px;
            background-repeat: repeat-x;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const InfoIcon = getIcon('Info');
            const CalculatorIcon = getIcon('Calculator');
            const ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            const BatteryChargingIcon = getIcon('BatteryCharging');
            const ImagePlusIcon = getIcon('ImagePlus');
            const FlameIcon = getIcon('Flame');
            const SettingsIcon = getIcon('Settings');

            const App = () => {
                // Parámetros fijos
                const g = 9.8; // m/s^2

                // Estados interactivos (Inicializados con el enunciado)
                const [v0, setV0] = useState(5.0); // m/s
                const [mu, setMu] = useState(0.30); // Coeficiente de rozamiento
                const [masa, setMasa] = useState(10.0); // kg

                // Animación
                const [time, setTime] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // Cálculos Físicos
                // Trabajo = Variación de Energía Cinética
                // W_fr = - Fr * d = - mu * m * g * d
                // dEc = Ec_f - Ec_0 = 0 - 0.5 * m * v0^2
                // - mu * m * g * d = - 0.5 * m * v0^2  => d = v0^2 / (2 * mu * g)
                
                const aceleracionMag = mu * g; // Valor absoluto de la aceleración de frenado
                const dStop = (v0 * v0) / (2 * aceleracionMag);
                const tStop = v0 / aceleracionMag;
                const energiaCinInicial = 0.5 * masa * v0 * v0;

                // Cinemática instantánea
                const currentV = Math.max(0, v0 - (aceleracionMag * time));
                const currentPos = (v0 * time) - (0.5 * aceleracionMag * time * time);
                const currentEc = 0.5 * masa * currentV * currentV;
                const trabajoFriccion = energiaCinInicial - currentEc;

                // Escala visual dinámica (para que siempre quepa en pantalla)
                const maxWidthPx = 350;
                const pxPerMeter = maxWidthPx / Math.max(5, dStop + 1);
                const visualPos = currentPos * pxPerMeter;

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tStop) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                const nextTime = prev + 0.05; // dt visual
                                if (nextTime >= tStop) {
                                    setIsMoving(false);
                                    return tStop;
                                }
                                return nextTime;
                            });
                        }, 20); // ~50 fps
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tStop]);

                const handlePlay = () => {
                    if (time < tStop) setIsMoving(true);
                };

                const reset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Forzar reset al cambiar variables
                useEffect(() => {
                    reset();
                }, [v0, mu, masa]);

                // DCL Generador
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de la conservación de la energía. Un bloque desplazándose hacia la derecha. Un vector Velocidad v hacia la derecha. Un vector Fuerza de Fricción Fr hacia la izquierda. Vector desplazamiento d. Estilo educativo minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Trabajo y Energía</span>
                                <h1 className="text-3xl font-black text-red-400 uppercase tracking-tight tracking-widest">Distancia de Frenado</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Se lanza un cuerpo a lo largo de un plano horizontal con una velocidad inicial de 5,0 m/s. El coeficiente de rozamiento entre el cuerpo y el plano es 0,30. ¿Qué distancia recorre hasta que se para?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-8">
                                
                                {/* HUD de Energía y Distancia */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Distancia (d)</p>
                                        <p className={`text-xl font-mono font-black ${time >= tStop ? 'text-green-400' : 'text-slate-300'}`}>
                                            {currentPos.toFixed(2)} <span className="text-sm">m</span>
                                        </p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right border-b-4 border-b-red-500">
                                        <p className="text-[10px] text-slate-500 uppercase font-black flex items-center justify-end gap-1">
                                            {BatteryChargingIcon && <BatteryChargingIcon size={12} className="text-emerald-400" />} Energía Cinética (Ec)
                                        </p>
                                        <p className={`text-2xl font-mono font-black ${currentEc > 0 ? 'text-emerald-400' : 'text-slate-500'}`}>
                                            {currentEc.toFixed(1)} <span className="text-sm">J</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Escenario */}
                                <div className="relative w-full h-64 flex justify-center items-end">
                                    {/* Suelo */}
                                    <div className="absolute bottom-0 w-full h-8 floor-pattern border-t-4 border-slate-600"></div>

                                    {/* Contenedor relativo para margen */}
                                    <div className="absolute bottom-8 left-10 w-[400px] h-full pointer-events-none">
                                        
                                        {/* Marca de Detención */}
                                        <div className="absolute bottom-0 border-l-2 border-dashed border-red-500/50 h-24 z-10" style={{ left: `${dStop * pxPerMeter}px` }}>
                                            <div className="absolute -top-4 -left-6 bg-slate-900/80 text-red-300 px-2 py-1 rounded text-[10px] font-black uppercase shadow border border-red-500/30 whitespace-nowrap">
                                                Parada: {dStop.toFixed(2)} m
                                            </div>
                                        </div>

                                        {/* El Bloque */}
                                        <div 
                                            className="absolute bottom-0 w-16 h-16 bg-blue-600 border-4 border-blue-400 rounded-lg flex items-center justify-center shadow-lg transition-transform z-20"
                                            style={{ transform: `translateX(${visualPos}px)`, left: '-32px' }}
                                        >
                                            <span className="font-black text-blue-200 text-xs">{masa.toFixed(0)}kg</span>

                                            {/* Vector Velocidad (Verde) */}
                                            {currentV > 0 && (
                                                <div className="absolute bottom-full mb-1 flex items-center" style={{ width: Math.max(20, currentV * 15), left: '50%' }}>
                                                    <div className="h-1 bg-emerald-400 w-full relative">
                                                        <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon size={16} className="text-emerald-400" />}</div>
                                                    </div>
                                                    <span className="ml-1 text-[10px] font-black text-emerald-300 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">v={currentV.toFixed(1)}</span>
                                                </div>
                                            )}

                                            {/* Vector Fuerza Fricción (Rojo) */}
                                            {currentV > 0 && (
                                                <div className="absolute top-1/2 right-full flex items-center pr-1 -translate-y-1/2" style={{ width: Math.max(30, mu * 100) }}>
                                                    <span className="mr-1 text-[10px] font-black text-red-400 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">Fr</span>
                                                    <div className="h-1.5 bg-red-500 w-full relative shadow-[0_0_8px_rgba(239,68,68,0.8)]">
                                                        <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon size={16} className="text-red-500" />}</div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Efecto Calor por Fricción */}
                                            {currentV > 0 && isMoving && (
                                                <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 text-orange-500 animate-pulse">
                                                    {FlameIcon && <FlameIcon size={16} />}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-red-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Modificar Parámetros
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-emerald-400 font-bold uppercase">Velocidad Inicial (v₀)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-emerald-300">{v0.toFixed(1)} m/s</span>
                                            </div>
                                            <input 
                                                type="range" min="1" max="15" step="0.5" value={v0} 
                                                onChange={e => setV0(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-red-400 font-bold uppercase">Coeficiente de Rozamiento (μ)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-red-300">{mu.toFixed(2)}</span>
                                            </div>
                                            <input 
                                                type="range" min="0.05" max="0.8" step="0.05" value={mu} 
                                                onChange={e => setMu(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" 
                                            />
                                        </div>

                                        <div className="pt-2 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-slate-300 font-bold uppercase">Masa del Bloque (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{masa.toFixed(1)} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="1" max="50" step="1" value={masa} 
                                                onChange={e => setMasa(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400" 
                                            />
                                            <p className="text-[10px] text-slate-500 mt-2 text-center italic">
                                                ¡Cambia la masa y observa la distancia de parada! (Spoiler: la masa se cancela en el cálculo).
                                            </p>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tStop}
                                            className={`flex-1 font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 ${time >= tStop ? 'bg-slate-600 text-slate-400' : 'bg-red-600 hover:bg-red-500 text-white'}`}
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} {time >= tStop ? 'BLOQUE DETENIDO' : 'LANZAR BLOQUE'}
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-red-950/20 p-6 rounded-3xl border border-red-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-red-500/30 pb-2">
                                        <h4 className="font-bold text-red-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Teorema de las Fuerzas Vivas
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700 text-center font-bold text-white mb-2 font-mono">
                                            W = ΔE_c  ⇒  W_fr = E_cf - E_c0
                                        </div>

                                        <p><strong>1. Trabajo de la Fricción (W_fr):</strong><br/>
                                        La fuerza de rozamiento ($F_r = \mu \cdot m \cdot g$) actúa en sentido opuesto al movimiento, por lo que su ángulo es 180º ($\cos(180º) = -1$).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-red-500 font-mono text-red-200">
                                            W_fr = F_r · d · cos(180º) = <strong>-μ · m · g · d</strong>
                                        </div>

                                        <p className="mt-3"><strong>2. Energía Cinética (ΔEc):</strong><br/>
                                        Como el cuerpo se detiene, su velocidad final y su energía cinética final son 0.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200">
                                            ΔE_c = 0 - ½ · m · v₀² = <strong>-½ · m · v₀²</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Igualamos y Despejamos 'd':</strong><br/>
                                        <span className="text-yellow-400 font-bold">¡Atención!</span> La masa (m) aparece multiplicando a ambos lados, por lo que <strong>se cancela</strong>.</p>
                                        
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200 shadow-inner overflow-x-auto">
                                            - μ · <span className="line-through opacity-50">m</span> · g · d = -½ · <span className="line-through opacity-50">m</span> · v₀²<br/>
                                            μ · g · d = ½ · v₀²<br/>
                                            d = v₀² / (2 · μ · g)<br/>
                                            d = {v0.toFixed(1)}² / (2 · {mu.toFixed(2)} · 9.8)<br/>
                                            d = {(v0*v0).toFixed(2)} / {(2 * mu * g).toFixed(3)} = <strong>{dStop.toFixed(2)} m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Trabajo, Energía Cinética y Fricción
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
