<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Trabajo Vertical</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981; /* Emerald 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .wall-pattern {
            background-color: #334155;
            background-image: 
                linear-gradient(90deg, transparent 50%, rgba(255,255,255,.05) 50%),
                linear-gradient(rgba(255,255,255,.05) 50%, transparent 50%);
            background-size: 40px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ArrowUpIcon = getIcon('ArrowUp');
            var ArrowDownIcon = getIcon('ArrowDown');
            var BatteryChargingIcon = getIcon('BatteryCharging');
            var PersonStandingIcon = getIcon('PersonStanding') || getIcon('User');
            var SettingsIcon = getIcon('Settings');
            var ImagePlusIcon = getIcon('ImagePlus');

            var App = () => {
                // Parámetros fijos
                const g = 9.8; // m/s^2

                // Estados interactivos (Inicializados con el enunciado)
                const [masa, setMasa] = useState(60.0); // kg
                const [altura, setAltura] = useState(10.0); // m

                // Animación
                const [pos, setPos] = useState(0); // m
                const [isMoving, setIsMoving] = useState(false);

                // Cálculos Físicos
                // Para subir a velocidad constante, F_aplicada = Peso
                const peso = masa * g; // N
                const fuerza = peso; // N
                
                // Trabajo W = F * d * cos(0º) = F * h
                const trabajoTotal = fuerza * altura; // J
                const trabajoActual = fuerza * pos; // J

                // Velocidad visual constante para la animación
                const velSubida = 2.0; // m/s (velocidad simulada)

                useEffect(() => {
                    let interval;
                    if (isMoving && pos < altura) {
                        interval = setInterval(() => {
                            setPos(p => {
                                const newP = p + (velSubida * 0.05); // dt = 0.05s visual
                                if (newP >= altura) {
                                    setIsMoving(false);
                                    return altura;
                                }
                                return newP;
                            });
                        }, 20); // 50 fps
                    }
                    return () => clearInterval(interval);
                }, [isMoving, pos, altura]);

                const handlePlay = () => {
                    if (pos < altura) setIsMoving(true);
                };

                const reset = () => {
                    setPos(0);
                    setIsMoving(false);
                };

                // Si se cambian los parámetros, reiniciamos
                useEffect(() => {
                    reset();
                }, [masa, altura]);

                // Escala visual (20m máximo mapeados a 300px)
                const maxH = 25;
                const pxPerMeter = 300 / maxH;
                const posVisualY = pos * pxPerMeter;

                // Generador de Diagrama de Cuerpo Libre
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un bloque representando una persona escalando. Vector Fuerza F apuntando verticalmente hacia arriba. Vector Peso P apuntando verticalmente hacia abajo. Ambos vectores son de igual tamaño para representar velocidad constante. Fondo blanco, minimalista, educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                // Escala para vectores
                const vScale = 60 / 600; // 600N = 60px

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-emerald-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Energía y Trabajo</span>
                                <h1 className="text-3xl font-black text-emerald-400 uppercase tracking-tight tracking-widest">El Ascenso Vertical</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> ¿Qué trabajo mecánico hace una persona de 60,0 kg cuando sube a una altura de 10,0 m? ¿Qué fuerza ejerce?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col items-center">
                                
                                {/* HUD de Energía (Trabajo) */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza Ejercida (F)</p>
                                        <p className="text-xl font-mono font-black text-sky-400">{fuerza.toFixed(1)} N</p>
                                    </div>
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 ${trabajoActual > 0 ? 'border-b-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'border-b-slate-600'}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black flex items-center justify-end gap-1">
                                            {BatteryChargingIcon && <BatteryChargingIcon size={12} className={trabajoActual > 0 ? "text-emerald-400" : "text-slate-500"} />} Trabajo Mecánico (W)
                                        </p>
                                        <p className={`text-2xl font-mono font-black ${trabajoActual > 0 ? 'text-emerald-400' : 'text-slate-400'}`}>
                                            {trabajoActual.toFixed(0)} <span className="text-sm">J</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Escena: Pared de escalada / Edificio */}
                                <div className="relative w-full h-[450px] flex justify-center items-end mt-20">
                                    
                                    {/* Regla de Altura */}
                                    <div className="absolute left-10 bottom-10 h-[300px] border-l-2 border-dashed border-slate-600 flex flex-col justify-between items-start pl-2">
                                        <span className="text-[10px] text-slate-500 font-mono font-bold">25 m</span>
                                        <span className="text-[10px] text-slate-500 font-mono font-bold">0 m</span>
                                    </div>

                                    {/* Marca de Meta */}
                                    <div 
                                        className="absolute left-10 w-full border-t-2 border-dashed border-emerald-500/50 z-10"
                                        style={{ bottom: `${40 + altura * pxPerMeter}px` }}
                                    >
                                        <span className="absolute -top-4 left-10 text-[10px] font-bold text-emerald-400 bg-slate-900 px-1 rounded">Meta: {altura.toFixed(1)}m</span>
                                    </div>

                                    {/* Muro */}
                                    <div className="w-48 h-[400px] wall-pattern border-x-4 border-t-4 border-slate-600 rounded-t-lg z-0 relative"></div>

                                    {/* La Persona */}
                                    <div 
                                        className="absolute z-20 flex flex-col items-center transition-transform"
                                        style={{ bottom: `${40 + posVisualY}px` }}
                                    >
                                        <div className="w-12 h-12 bg-white rounded-full border-4 border-slate-300 shadow-xl flex items-center justify-center relative overflow-visible">
                                            <PersonStandingIcon size={24} className="text-slate-800" />
                                            <span className="absolute -left-12 bg-slate-900/80 px-1 rounded text-[9px] font-black text-slate-300 whitespace-nowrap">{pos.toFixed(1)} m</span>
                                            
                                            {/* Vectores (Desde el centro de la persona) */}
                                            <div className="absolute top-1/2 left-1/2 w-0 h-0 flex flex-col items-center pointer-events-none">
                                                {/* Fuerza Ejercida (Arriba) */}
                                                <div className="absolute bottom-0 flex flex-col items-center pb-8" style={{ height: Math.max(30, fuerza * vScale) + 32 }}>
                                                    <span className="mb-1 text-[10px] font-black text-sky-300 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">F = {fuerza.toFixed(0)} N</span>
                                                    <div className="w-1 bg-sky-400 h-full relative shadow-[0_0_8px_rgba(56,189,248,0.8)]">
                                                        <div className="absolute top-0 -translate-x-1.5">{ArrowUpIcon && <ArrowUpIcon size={16} className="text-sky-400" />}</div>
                                                    </div>
                                                </div>
                                                
                                                {/* Peso (Abajo) */}
                                                <div className="absolute top-0 flex flex-col items-center pt-8" style={{ height: Math.max(30, peso * vScale) + 32 }}>
                                                    <div className="w-1 bg-orange-400 h-full relative shadow-[0_0_8px_rgba(249,115,22,0.8)]">
                                                        <div className="absolute bottom-0 -translate-x-1.5">{ArrowDownIcon && <ArrowDownIcon size={16} className="text-orange-400" />}</div>
                                                    </div>
                                                    <span className="mt-1 text-[10px] font-black text-orange-300 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">P = {peso.toFixed(0)} N</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Suelo */}
                                    <div className="absolute bottom-0 w-full h-10 bg-slate-700 border-t-4 border-slate-500 z-30 flex items-center justify-center">
                                        <div className="w-48 h-full bg-slate-600"></div>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Datos del Ascenso
                                    </h3>
                                    
                                    <div className="space-y-6 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Masa Corporal (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{masa.toFixed(1)} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="30" max="120" step="1" value={masa} 
                                                onChange={e => {setMasa(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500" 
                                            />
                                        </div>

                                        <div className="pt-2 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-emerald-400 font-bold uppercase">Altura a escalar (h)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-emerald-300">{altura.toFixed(1)} m</span>
                                            </div>
                                            <input 
                                                type="range" min="1" max="25" step="0.5" value={altura} 
                                                onChange={e => {setAltura(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || pos >= altura}
                                            className={`flex-1 font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 ${pos >= altura ? 'bg-slate-600 text-slate-400' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} {pos >= altura ? 'META ALCANZADA' : 'INICIAR ASCENSO'}
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-emerald-950/20 p-6 rounded-3xl border border-emerald-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-emerald-500/30 pb-2">
                                        <h4 className="font-bold text-emerald-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. ¿Qué fuerza ejerce? (Dinámica)</strong><br/>
                                        Para subir sin acelerar (velocidad constante), la fuerza que hace la persona con sus piernas hacia arriba debe anular exactamente a su peso hacia abajo.</p>
                                        
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-sky-500 font-mono text-sky-200">
                                            F = P = m · g<br/>
                                            F = {masa.toFixed(1)} · 9.8 = <strong>{fuerza.toFixed(1)} N</strong>
                                        </div>

                                        <p><strong>2. ¿Qué trabajo realiza? (Energía)</strong><br/>
                                        El trabajo ($W$) es la fuerza aplicada multiplicada por la distancia desplazada <strong>en la misma dirección</strong> de la fuerza.</p>
                                        
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200 shadow-[inset_0_0_15px_rgba(16,185,129,0.1)]">
                                            W = F · d · cos(0º)<br/>
                                            W = {fuerza.toFixed(1)} · {altura.toFixed(1)} · 1<br/>
                                            <strong>W = {trabajoTotal.toFixed(0)} J</strong>
                                        </div>
                                        <p className="text-[10px] text-slate-400 italic text-center mt-2">
                                            (Nota: Este trabajo equivale exactamente al aumento de Energía Potencial Gravitatoria: Ep = m·g·h)
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Trabajo Mecánico y Energía Potencial
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
</html>
