<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Trabajo Mecánico</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #0ea5e9; /* Sky 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }
        .rail-pattern {
            background-color: #334155;
            background-image: repeating-linear-gradient(90deg, #475569 0, #475569 10px, transparent 10px, transparent 40px);
            background-position: bottom;
            background-size: 40px 6px;
            background-repeat: repeat-x;
        }
        .wood-plank {
            background-color: #78350f; /* Amber 900 */
            border: 2px solid #451a03;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var TrainIcon = getIcon('Train');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowUpRightIcon = getIcon('ArrowUpRight');
            var BatteryChargingIcon = getIcon('BatteryCharging');
            var ImagePlusIcon = getIcon('ImagePlus');
            var SettingsIcon = getIcon('Settings');

            var App = () => {
                // Definición de los casos del enunciado
                const casos = {
                    'A': { id: 'A', f: 50, d: 0, angulo: 0, desc: "F = 50 N, sin que se mueva." },
                    'B': { id: 'B', f: 180, d: 12, angulo: 0, desc: "F = 180 N, paralela a la vía, d = 12 m." },
                    'C': { id: 'C', f: 200, d: 25, angulo: 30, desc: "F = 200 N, con ángulo de 30°, d = 25 m." }
                };

                const [activeCase, setActiveCase] = useState('A');
                
                // Estados interactivos
                const [fuerza, setFuerza] = useState(casos['A'].f);
                const [distancia, setDistancia] = useState(casos['A'].d);
                const [angulo, setAngulo] = useState(casos['A'].angulo);

                // Animación
                const [pos, setPos] = useState(0); // Metros recorridos visualmente
                const [isMoving, setIsMoving] = useState(false);

                // Cálculos Físicos
                const anguloRad = angulo * (Math.PI / 180);
                
                // W = F * d * cos(theta)
                const trabajoTotal = fuerza * distancia * Math.cos(anguloRad); // Julios (J)
                const componenteFx = fuerza * Math.cos(anguloRad);
                const componenteFy = fuerza * Math.sin(anguloRad);

                // Trabajo instantáneo durante la animación
                const trabajoActual = fuerza * pos * Math.cos(anguloRad);

                // Escala visual (Queremos que 25m quepan en ~300px)
                const pxPerMeter = 300 / 25; 

                useEffect(() => {
                    if (activeCase) {
                        setFuerza(casos[activeCase].f);
                        setDistancia(casos[activeCase].d);
                        setAngulo(casos[activeCase].angulo);
                        reset();
                    }
                }, [activeCase]);

                useEffect(() => {
                    let interval;
                    if (isMoving && pos < distancia) {
                        interval = setInterval(() => {
                            setPos(p => {
                                // Velocidad de animación constante (no evaluamos cinemática aquí)
                                const newP = p + (distancia > 0 ? distancia / 40 : 0); 
                                if (newP >= distancia) {
                                    setIsMoving(false);
                                    return distancia;
                                }
                                return newP;
                            });
                        }, 30); // ~30 fps
                    } else if (distancia === 0 && isMoving) {
                        // Caso A: se intenta mover pero d=0
                        setTimeout(() => setIsMoving(false), 500);
                    }
                    return () => clearInterval(interval);
                }, [isMoving, pos, distancia]);

                const handlePlay = () => {
                    if (pos < distancia || distancia === 0) setIsMoving(true);
                };

                const reset = () => {
                    setPos(0);
                    setIsMoving(false);
                };

                // DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Una vagoneta sobre rieles horizontales. Vector de desplazamiento delta x hacia la derecha. Vector Fuerza F apuntando en diagonal hacia arriba y la derecha. Líneas punteadas mostrando el ángulo theta entre el vector F y la horizontal. Fondo blanco, minimalista, estilo educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-sky-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Energía y Trabajo</span>
                                <h1 className="text-3xl font-black text-sky-400 uppercase tracking-tight tracking-widest">Trabajo Mecánico</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Una vagoneta está en una vía recta horizontal. Calcula el trabajo mecánico en los casos siguientes:<br/>
                                    a) Se ejerce una fuerza constante de 50 N en la dirección de la vía sin que se mueva.<br/>
                                    b) Se ejerce una fuerza de 180 N en la dirección de la vía y se recorren 12 m.<br/>
                                    c) Se empuja con una fuerza de 200 N que forma un ángulo de 30° con la vía, y recorre 25 m.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-12">
                                
                                {/* HUD de Energía (Trabajo) */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Distancia Recorrida (Δx)</p>
                                        <p className="text-xl font-mono font-black text-emerald-400">{pos.toFixed(1)} m</p>
                                    </div>
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 ${trabajoActual === 0 && pos === distancia && distancia === 0 ? 'border-b-red-500' : 'border-b-sky-500 shadow-[0_0_15px_rgba(14,165,233,0.2)]'}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black flex items-center justify-end gap-1">
                                            {BatteryChargingIcon && <BatteryChargingIcon size={12} className={trabajoActual > 0 ? "text-sky-400" : "text-slate-500"} />} Trabajo Realizado (W)
                                        </p>
                                        <p className={`text-2xl font-mono font-black ${trabajoActual > 0 ? 'text-sky-400' : 'text-slate-400'}`}>
                                            {trabajoActual.toFixed(0)} <span className="text-sm">J</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Caso A: Alerta especial */}
                                {distancia === 0 && isMoving && (
                                    <div className="absolute top-24 left-1/2 -translate-x-1/2 z-40 bg-red-900/80 text-red-200 px-6 py-2 rounded-full border border-red-500 text-xs font-bold uppercase tracking-widest shadow-lg animate-pulse whitespace-nowrap">
                                        Empujando... ¡Pero no se mueve! (W = 0)
                                    </div>
                                )}

                                {/* Escena Vagoneta */}
                                <div className="relative w-full h-48 flex justify-center items-end">
                                    {/* Vías del tren */}
                                    <div className="absolute bottom-0 w-full h-8 rail-pattern border-t-2 border-slate-500"></div>

                                    {/* Marcador de meta visual (solo si d > 0) */}
                                    {distancia > 0 && (
                                        <div 
                                            className="absolute bottom-8 border-r-2 border-dashed border-emerald-500/50 h-24 z-10"
                                            style={{ left: `${60 + distancia * pxPerMeter + 48}px` }} // +48 para el frente de la vagoneta
                                        >
                                            <span className="absolute -top-4 -left-4 text-[10px] font-bold text-emerald-400 bg-slate-900 px-1 rounded">{distancia}m</span>
                                        </div>
                                    )}

                                    {/* La Vagoneta */}
                                    <div 
                                        className="absolute bottom-4 flex flex-col items-center z-20 transition-transform"
                                        style={{ transform: `translateX(${pos * pxPerMeter}px)`, left: '60px' }}
                                    >
                                        {/* Caja Vagoneta */}
                                        <div className="w-24 h-16 wood-plank rounded-sm flex items-center justify-center relative shadow-lg">
                                            {TrainIcon && <TrainIcon size={24} className="text-amber-700/50 absolute" />}
                                            
                                            {/* Vector Fuerza (Desde el centro) */}
                                            <div 
                                                className="absolute left-1/2 top-1/2 origin-left flex items-center pl-1 pointer-events-none z-30"
                                                style={{ 
                                                    width: Math.max(50, fuerza * 0.5), 
                                                    transform: `rotate(${-angulo}deg)` 
                                                }}
                                            >
                                                <div className="h-1.5 bg-sky-400 w-full relative shadow-[0_0_8px_rgba(56,189,248,0.8)]">
                                                    <div className="absolute right-0 -top-2">{ArrowRightIcon && <ArrowRightIcon size={20} className="text-sky-400" />}</div>
                                                </div>
                                                <span className="ml-1 text-[12px] font-black text-sky-300 bg-slate-900/80 px-1 rounded" style={{transform: `rotate(${angulo}deg)`}}>F={fuerza}N</span>
                                            </div>

                                            {/* Vector Desplazamiento (Verde punteado, debajo) */}
                                            {distancia > 0 && (
                                                <div className="absolute top-[120%] left-1/2 flex items-center pointer-events-none" style={{ width: 100 }}>
                                                    <div className="h-0.5 bg-emerald-400 w-full relative border-t-2 border-dashed border-emerald-500">
                                                        <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon size={12} className="text-emerald-500" />}</div>
                                                    </div>
                                                    <span className="ml-1 text-[10px] font-black text-emerald-400">Δx</span>
                                                </div>
                                            )}

                                            {/* Indicador de Ángulo */}
                                            {angulo > 0 && (
                                                <div className="absolute top-1/2 left-1/2 w-10 h-10 border-t-2 border-r-2 border-sky-400/30 rounded-tr-full pointer-events-none">
                                                    <span className="absolute -top-4 right-0 text-[10px] text-sky-200 bg-slate-900/80 px-1 rounded">{angulo}º</span>
                                                </div>
                                            )}
                                        </div>

                                        {/* Ruedas */}
                                        <div className="flex gap-10 -mt-2">
                                            <div className="w-6 h-6 bg-slate-800 rounded-full border-2 border-slate-400 flex items-center justify-center">
                                                <div className="w-2 h-2 bg-slate-950 rounded-full"></div>
                                            </div>
                                            <div className="w-6 h-6 bg-slate-800 rounded-full border-2 border-slate-400 flex items-center justify-center">
                                                <div className="w-2 h-2 bg-slate-950 rounded-full"></div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-sky-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Casos Prácticos
                                    </h3>
                                    
                                    <div className="grid grid-cols-1 gap-2 mb-6">
                                        {Object.values(casos).map(c => (
                                            <button 
                                                key={c.id}
                                                onClick={() => setActiveCase(c.id)}
                                                className={`text-left px-4 py-3 rounded-xl border transition-all ${activeCase === c.id ? 'bg-sky-900/40 border-sky-500 text-sky-200' : 'bg-slate-900/50 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                            >
                                                <span className="font-black mr-2">Caso {c.id}:</span> {c.desc}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="space-y-4 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-sky-400 font-bold uppercase">Fuerza (F)</span><span className="font-mono text-white">{fuerza} N</span></div>
                                                <input type="range" min="0" max="300" step="10" value={fuerza} onChange={e => {setFuerza(Number(e.target.value)); reset(); setActiveCase(null);}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                                            </div>
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-emerald-400 font-bold uppercase">Distancia (Δx)</span><span className="font-mono text-white">{distancia} m</span></div>
                                                <input type="range" min="0" max="30" step="1" value={distancia} onChange={e => {setDistancia(Number(e.target.value)); reset(); setActiveCase(null);}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
                                            </div>
                                        </div>
                                        
                                        <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                            <div className="flex justify-between text-[10px] mb-1"><span className="text-amber-400 font-bold uppercase">Ángulo (θ)</span><span className="font-mono text-white">{angulo}º</span></div>
                                            <input type="range" min="0" max="90" step="5" value={angulo} onChange={e => {setAngulo(Number(e.target.value)); reset(); setActiveCase(null);}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500" />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || (pos >= distancia && distancia > 0)}
                                            className="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} EMPUJAR VAGONETA
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-sky-950/20 p-6 rounded-3xl border border-sky-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-sky-500/30 pb-2">
                                        <h4 className="font-bold text-sky-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Fórmula General del Trabajo
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Vectores de Trabajo" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-sky-500 font-mono text-center text-sky-300 shadow-inner text-sm font-bold">
                                            W = F · Δx · cos(θ)
                                        </div>

                                        {activeCase === 'A' && (
                                            <div className="p-3 bg-red-900/20 border border-red-500/30 rounded-lg">
                                                <p className="font-bold text-red-400 mb-1">Análisis Caso A:</p>
                                                <p>La fuerza F es de 50 N, el ángulo es 0º, pero <strong>el desplazamiento Δx es 0 m</strong>. Si el punto de aplicación de la fuerza no se desplaza, no se transfiere energía al cuerpo.</p>
                                                <p className="font-mono text-red-200 mt-2">W = 50 · 0 · cos(0º) = <strong>0 J</strong></p>
                                            </div>
                                        )}

                                        {activeCase === 'B' && (
                                            <div className="p-3 bg-emerald-900/20 border border-emerald-500/30 rounded-lg">
                                                <p className="font-bold text-emerald-400 mb-1">Análisis Caso B:</p>
                                                <p>La fuerza y el desplazamiento tienen la misma dirección y sentido (θ = 0º, cos(0º) = 1). Toda la fuerza es útil para realizar el trabajo.</p>
                                                <p className="font-mono text-emerald-200 mt-2">W = 180 · 12 · 1 = <strong>2160 J</strong></p>
                                            </div>
                                        )}

                                        {activeCase === 'C' && (
                                            <div className="p-3 bg-amber-900/20 border border-amber-500/30 rounded-lg">
                                                <p className="font-bold text-amber-400 mb-1">Análisis Caso C:</p>
                                                <p>La fuerza tiene una inclinación de 30º. Solo la componente que coincide con la vía (F<sub>x</sub> = F · cos(30º)) realiza trabajo mecánico. La componente vertical (F<sub>y</sub>) solo intenta levantar la vagoneta sin éxito.</p>
                                                <p className="font-mono text-amber-200 mt-2">W = 200 · 25 · cos(30º) = 5000 · 0.866<br/><strong>W = 4330 J</strong> (aprox)</p>
                                            </div>
                                        )}

                                        {!activeCase && (
                                            <div className="p-3 bg-slate-900/50 rounded-lg border border-slate-700">
                                                <p className="font-mono text-sky-200">W = {fuerza} · {distancia} · cos({angulo}º)<br/><strong>W = {trabajoTotal.toFixed(1)} J</strong></p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Trabajo Mecánico y Transferencia de Energía
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 flex gap-2 bg-slate-900/80 backdrop-blur-md p-2 rounded-2xl border border-slate-700 shadow-2xl z-50">
    <button id="btn-prev" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold transition-all disabled:opacity-30 disabled:cursor-not-allowed">
        ← Ant.
    </button>
    <a href="index.html" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition-all flex items-center gap-2">
        <span>ÍNDICE</span>
    </a>
    <button id="btn-next" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold transition-all disabled:opacity-30 disabled:cursor-not-allowed">
        Sig. →
    </button>
</div>

<script>
    // Lógica de navegación automática
    const currentPath = window.location.pathname;
    const match = currentPath.match(/ejercicio-(\d+)\.html/);
    
    if (match) {
        const currentNum = parseInt(match[1]);
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const TOTAL_EJERCICIOS = 70; // Ajusta según el tema

        // Configurar Anterior
        if (currentNum > 1) {
            prevBtn.onclick = () => window.location.href = `ejercicio-${currentNum - 1}.html`;
        } else {
            prevBtn.disabled = true;
        }

        // Configurar Siguiente
        if (currentNum < TOTAL_EJERCICIOS) {
            nextBtn.onclick = () => window.location.href = `ejercicio-${currentNum + 1}.html`;
        } else {
            nextBtn.disabled = true;
        }
    }
</script>
</body>
</html>
