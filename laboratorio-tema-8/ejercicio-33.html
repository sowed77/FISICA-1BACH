<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: El Rizo de la Muerte</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #10b981; /* Emerald 500 */
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .bg-grid {
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect, useRef } = React;
            const icons = window.LucideReact || {};
            
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const SettingsIcon = getIcon('Settings');
            const AlertTriangleIcon = getIcon('AlertTriangle');
            const ImagePlusIcon = getIcon('ImagePlus');
            const CheckCircleIcon = getIcon('CheckCircle2');
            const ArrowRightIcon = getIcon('ArrowRight');

            const App = () => {
                const g = 9.8; 
                
                // Ancho de la rampa inicial para el enlace suave
                const W_ramp = 5.0; 

                // Estados de configuración interactiva
                const [h0, setH0] = useState(6.0); // m
                const [R, setR] = useState(1.5);   // m
                const [masa, setMasa] = useState(10); // kg

                // Estado de simulación (u = parámetro de trayectoria)
                const [sim, setSim] = useState({ 
                    u: 0, status: 'ready', 
                    x: 0, y: h0, 
                    v: 0, normal: 0,
                    fallX: 0, fallY: 0, fallVx: 0, fallVy: 0
                });

                const requestRef = useRef();
                const lastTimeRef = useRef();
                const physicsRef = useRef(null);

                // Cálculos teóricos estáticos para el HUD
                const vA = Math.sqrt(2 * g * h0);
                const hCritica = 2.5 * R;
                const vB = h0 >= hCritica ? Math.sqrt(2 * g * (h0 - 2 * R)) : 0;

                // --- MOTOR DE TRAYECTORIA CONTINUA ---
                // Esta función mapea el parámetro "u" a unas coordenadas (x,y) de forma 100% suave,
                // uniendo una curva descendente cosenoidal con un círculo perfecto.
                const getTrackPos = (u, h_start, radius) => {
                    if (u <= W_ramp) {
                        const x = u;
                        // Curva coseno para empezar plano arriba y acabar plano abajo
                        const y = h_start * (1 + Math.cos(Math.PI * u / W_ramp)) / 2;
                        const dx = 1;
                        const dy = -h_start * (Math.PI / (2 * W_ramp)) * Math.sin(Math.PI * u / W_ramp);
                        return { x, y, dx, dy, theta: null };
                    } else {
                        // Rizo
                        const theta = (u - W_ramp) / radius; // theta va de 0 a 2PI
                        const x = W_ramp + radius * Math.sin(theta);
                        const y = radius - radius * Math.cos(theta);
                        const dx = Math.cos(theta);
                        const dy = Math.sin(theta);
                        return { x, y, dx, dy, theta };
                    }
                };

                // --- INTEGRACIÓN FÍSICA ---
                useEffect(() => {
                    physicsRef.current = (time) => {
                        if (lastTimeRef.current !== undefined) {
                            const dt = Math.min((time - lastTimeRef.current) / 1000, 0.05); // Cap 50ms para evitar lags 
                            
                            setSim(prev => {
                                if (prev.status !== 'moving' && prev.status !== 'fallen') return prev;

                                if (prev.status === 'moving') {
                                    const {x, y, dx, dy, theta} = getTrackPos(prev.u, h0, R);
                                    
                                    // Velocidad exacta por conservación de energía
                                    let v2 = 2 * g * (h0 - y);
                                    
                                    // Si se queda sin energía subiendo el rizo
                                    if (v2 <= 0 && prev.u > 0) {
                                        return { ...prev, status: 'finished', x, y, v: 0 };
                                    }
                                    
                                    const v = Math.sqrt(Math.max(0, v2));
                                    
                                    // Cálculo de la fuerza normal para saber si se cae
                                    let N_m = 0;
                                    if (prev.u <= W_ramp) {
                                        // En la rampa (Aproximación simple de adherencia)
                                        N_m = g * Math.cos(Math.atan(Math.abs(dy/dx))); 
                                    } else {
                                        // En el rizo (Dinámica circular rigurosa)
                                        N_m = (v2 / R) + g * Math.cos(theta);
                                        
                                        // Si la pista deja de presionar al bloque, ¡se cae en tiro parabólico!
                                        if (N_m < -0.01) {
                                            return {
                                                ...prev,
                                                status: 'fallen',
                                                fallX: x, fallY: y,
                                                fallVx: v * dx, 
                                                fallVy: v * dy
                                            }
                                        }
                                    }
                                    
                                    // Avanzar en el parámetro de la curva (ds = sqrt(dx^2 + dy^2) du)
                                    const ds_du = Math.sqrt(dx*dx + dy*dy);
                                    const du_dt = v / ds_du;
                                    
                                    const timeScale = 0.8; // Factor visual de velocidad
                                    const nextU = prev.u + du_dt * dt * timeScale;
                                    
                                    // Finalización
                                    if (prev.u > W_ramp + 2 * Math.PI * R) {
                                        return { ...prev, status: 'finished', x, y, v };
                                    }
                                    
                                    return { ...prev, u: nextU, x, y, v, normal: N_m * masa };
                                }
                                
                                if (prev.status === 'fallen') {
                                    // Cinemática de caída libre
                                    const newVy = prev.fallVy - g * dt * 0.8; // Mismo timeScale
                                    const newY = prev.fallY + newVy * dt * 0.8;
                                    const newX = prev.fallX + prev.fallVx * dt * 0.8;
                                    
                                    if (newY <= 0) return { ...prev, status: 'crashed', x: newX, y: 0, v: 0 };
                                    return { ...prev, x: newX, y: newY, fallX: newX, fallY: newY, fallVy: newVy };
                                }
                                return prev;
                            });
                        }
                        lastTimeRef.current = time;
                        requestRef.current = requestAnimationFrame(physicsRef.current);
                    };
                });

                useEffect(() => {
                    if (sim.status === 'moving' || sim.status === 'fallen') {
                        lastTimeRef.current = performance.now();
                        requestRef.current = requestAnimationFrame(physicsRef.current);
                    }
                    return () => cancelAnimationFrame(requestRef.current);
                }, [sim.status]);

                const handlePlay = () => {
                    setSim({ 
                        u: 0.01, status: 'moving', x: 0, y: h0, v: 0, normal: masa * g,
                        fallX: 0, fallY: 0, fallVx: 0, fallVy: 0
                    });
                };

                const reset = () => {
                    setSim({ 
                        u: 0, status: 'ready', x: 0, y: h0, v: 0, normal: masa * g,
                        fallX: 0, fallY: 0, fallVx: 0, fallVy: 0
                    });
                };

                useEffect(() => { reset(); }, [h0, R]);

                // --- RENDERIZADO VISUAL SVG ---
                // Ajustamos las escalas para que cuadre exactamente con tu dibujo
                const scale = 45; // 45 píxeles por metro físico
                const marginX = 60;
                const groundY = 360;
                
                const mapX = (x) => marginX + x * scale;
                const mapY = (y) => groundY - y * scale;

                const getTrackPath = () => {
                    let d = `M ${mapX(0)} ${mapY(h0)}`;
                    const steps = 50;
                    for(let i=1; i<=steps; i++) {
                        const u = (i/steps) * W_ramp;
                        const {x, y} = getTrackPos(u, h0, R);
                        d += ` L ${mapX(x)} ${mapY(y)}`;
                    }
                    const loopSteps = 60;
                    for(let i=1; i<=loopSteps; i++) {
                        const u = W_ramp + (i/loopSteps) * 2 * Math.PI * R;
                        const {x, y} = getTrackPos(u, h0, R);
                        d += ` L ${mapX(x)} ${mapY(y)}`;
                    }
                    return d;
                };

                // Posición y rotación del bloque
                let carX = sim.x;
                let carY = sim.y;
                let carAngle = 0;
                
                if (sim.status === 'moving' || sim.status === 'ready' || sim.status === 'finished') {
                    const {dx, dy} = getTrackPos(sim.u, h0, R);
                    // atan2 ajustado para el sistema de coordenadas de la pantalla (Y hacia abajo)
                    carAngle = Math.atan2(-dy, dx) * (180 / Math.PI);
                } else if (sim.status === 'fallen' || sim.status === 'crashed') {
                    carX = sim.fallX || sim.x;
                    carY = sim.fallY || sim.y;
                    carAngle = Math.atan2(-sim.fallVy, sim.fallVx) * (180 / Math.PI);
                }

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-emerald-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Física Clásica</span>
                                <h1 className="text-3xl font-black text-emerald-400 uppercase tracking-tight">El Rizo de la Muerte</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Diseño Realista:</strong> Simulación interactiva con integración matemática continua de la trayectoria, adaptada exactamente a las proporciones del dibujo de referencia. Observa cómo el cuerpo desliza sin rozamiento.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual Dinámico */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end bg-grid">
                                
                                {/* HUD Superior */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black tracking-tighter">Velocidad (v)</p>
                                        <p className="text-xl font-mono font-black text-emerald-400">{sim.v.toFixed(1)} m/s</p>
                                    </div>
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 ${sim.status === 'fallen' || sim.status === 'crashed' ? 'border-b-red-500' : 'border-b-blue-500'}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black tracking-tighter">Fuerza Normal</p>
                                        <p className={`text-xl font-mono font-black ${sim.status === 'fallen' || sim.status === 'crashed' ? 'text-red-400' : 'text-blue-400'}`}>
                                            {sim.status === 'fallen' || sim.status === 'crashed' ? '0 N' : `${sim.normal.toFixed(0)} N`}
                                        </p>
                                    </div>
                                </div>

                                {/* Banners de Estado */}
                                {(sim.status === 'fallen' || sim.status === 'crashed') && (
                                    <div className="absolute top-24 left-1/2 -translate-x-1/2 z-40 bg-red-600/90 text-white px-6 py-3 rounded-xl border-2 border-red-400 shadow-[0_0_30px_rgba(220,38,38,0.8)] text-center animate-pulse flex items-center gap-3">
                                        <AlertTriangleIcon size={24} />
                                        <span className="font-black uppercase text-xs">Falta de Energía<br/>¡El cuerpo ha caído!</span>
                                    </div>
                                )}
                                {sim.status === 'finished' && (
                                    <div className="absolute top-24 left-1/2 -translate-x-1/2 z-40 bg-emerald-600/90 text-white px-6 py-3 rounded-xl border-2 border-emerald-400 shadow-[0_0_30px_rgba(16,185,129,0.8)] text-center flex items-center gap-3">
                                        <CheckCircleIcon size={24} />
                                        <span className="font-black uppercase text-xs">¡Rizo completado!</span>
                                    </div>
                                )}

                                {/* Escenario de Física SVG */}
                                <div className="relative w-full h-[450px] flex justify-center items-end pb-4">
                                    <svg viewBox="0 0 550 400" className="w-full h-full overflow-visible absolute z-10">
                                        <defs>
                                            <marker id="arrow-annotation" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
                                            </marker>
                                        </defs>

                                        {/* Trazado de la Pista */}
                                        <path 
                                            d={getTrackPath()} 
                                            fill="none" stroke="#ef4444" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round"
                                            className="drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)]"
                                        />

                                        {/* Suelo decorativo punteado */}
                                        <line x1="20" y1={groundY} x2="530" y2={groundY} stroke="#94a3b8" strokeWidth="2" strokeDasharray="6 6" />

                                        {/* Anotaciones y Cotas del Dibujo */}
                                        {/* Cota Altura C (6m) */}
                                        <line x1={mapX(0)} y1={mapY(h0)} x2={mapX(0)} y2={mapY(0)} stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4 4" markerEnd="url(#arrow-annotation)" markerStart="url(#arrow-annotation)" />
                                        <text x={mapX(0) - 15} y={mapY(h0/2)} fill="#f8fafc" fontSize="20" textAnchor="end" dominantBaseline="middle">{h0.toFixed(1).replace('.', ',')} m</text>
                                        <text x={mapX(0) - 10} y={mapY(h0) - 20} fill="#f8fafc" fontSize="24" fontWeight="bold" textAnchor="middle">C</text>

                                        {/* Cota Radio A (1.5m) */}
                                        <line x1={mapX(W_ramp)} y1={mapY(R)} x2={mapX(W_ramp)} y2={mapY(0)} stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4 4" markerEnd="url(#arrow-annotation)" markerStart="url(#arrow-annotation)" />
                                        <text x={mapX(W_ramp) - 10} y={mapY(R/2)} fill="#f8fafc" fontSize="20" textAnchor="end" dominantBaseline="middle">{R.toFixed(1).replace('.', ',')} m</text>
                                        
                                        {/* Puntos de Referencia A y B */}
                                        <circle cx={mapX(W_ramp)} cy={mapY(R)} r="8" fill="#0ea5e9" stroke="#0284c7" strokeWidth="2" />
                                        <line x1={mapX(W_ramp)} y1={mapY(R)} x2={mapX(W_ramp) + 40} y2={mapY(R)} stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4 4" />
                                        <text x={mapX(W_ramp) + 45} y={mapY(R)} fill="#f8fafc" fontSize="24" fontWeight="bold" textAnchor="start" dominantBaseline="middle">A</text>
                                        
                                        <circle cx={mapX(W_ramp)} cy={mapY(2*R)} r="8" fill="#0ea5e9" stroke="#0284c7" strokeWidth="2" />
                                        <text x={mapX(W_ramp)} y={mapY(2*R) - 15} fill="#f8fafc" fontSize="24" fontWeight="bold" textAnchor="middle">B</text>

                                    </svg>

                                    {/* El Bloque Deslizante */}
                                    <div 
                                        className="absolute z-20 flex flex-col items-center justify-center transition-transform"
                                        style={{ 
                                            left: `${mapX(carX)}px`, 
                                            top: `${mapY(carY)}px`,
                                            transform: `translate(-50%, -100%) rotate(${carAngle}deg)`,
                                            transformOrigin: 'bottom center'
                                        }}
                                    >
                                        <div className="w-10 h-10 bg-[#fde047] border-2 border-amber-800 shadow-md relative overflow-hidden rounded-sm">
                                            {/* Borde inferior naranja del dibujo */}
                                            <div className="absolute bottom-0 w-full h-2 bg-orange-500 border-t-2 border-amber-800"></div>
                                        </div>

                                        {/* Flecha azul de velocidad pintada "dentro" del mundo local del bloque */}
                                        {(sim.v > 0 || sim.status === 'ready') && (
                                            <div className="absolute top-1/2 left-full flex items-center pl-1 pointer-events-none origin-left" style={{ width: Math.max(40, sim.v * 4) }}>
                                                <div className="h-1 bg-sky-500 w-full relative">
                                                    <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon size={16} className="text-sky-500" />}</div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controles de Interacción */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-6 flex items-center gap-2 text-emerald-400">
                                        <SettingsIcon size={20} /> Configurar Parámetros
                                    </h3>
                                    
                                    <div className="space-y-6 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Altura Inicial (h₀)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{h0.toFixed(1)} m</span>
                                            </div>
                                            <input 
                                                type="range" min="2" max="10" step="0.5" value={h0} 
                                                onChange={e => setH0(Number(e.target.value))} 
                                                className={`w-full h-2 rounded-lg appearance-none cursor-pointer ${h0 >= hCritica ? 'bg-slate-700 accent-emerald-500' : 'bg-red-900/50 accent-red-500'}`} 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-blue-400 font-bold uppercase">Radio del Bucle (R)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-blue-300">{R.toFixed(1)} m</span>
                                            </div>
                                            <input 
                                                type="range" min="1" max="3" step="0.5" value={R} 
                                                onChange={e => setR(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" 
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={sim.status === 'moving' || sim.status === 'fallen'}
                                            className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} SOLTAR BLOQUE
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                {/* Explicación Teórica */}
                                <div className="bg-emerald-950/20 p-6 rounded-3xl border border-emerald-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-emerald-500/30 pb-2">
                                        <h4 className="font-bold text-emerald-300 flex items-center gap-2">
                                            <CalculatorIcon size={18} /> Resolución Analítica
                                        </h4>
                                    </div>

                                    <div className="text-[11px] text-slate-300 space-y-4 leading-relaxed">
                                        <p>Dado que no hay fricción, la Energía Mecánica Inicial (E_m0 = m · g · h₀) se conserva en todo momento.</p>
                                        
                                        <p><strong>a) Velocidad en la base (suelo):</strong><br/>
                                        Toda la energía potencial se ha transformado en energía cinética ($h = 0$).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200">
                                            m·g·h₀ = ½·m·v_A²  ⇒  v_A = √(2·g·h₀)<br/>
                                            v_A = √(2 · 9.8 · {h0.toFixed(1)}) = <strong>{vA.toFixed(2)} m/s</strong>
                                        </div>

                                        <p><strong>b) Velocidad en la cima (Punto B):</strong><br/>
                                        En la parte superior, la altura del objeto equivale al diámetro del rizo ($2R$).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200">
                                            m·g·h₀ = m·g·(2R) + ½·m·v_B²<br/>
                                            v_B = √(2·g·(h₀ - 2R)) = √(19.6 · ({h0.toFixed(1)} - {2*R}))<br/>
                                            <strong>v_B = {h0 >= 2*R ? vB.toFixed(2) + " m/s" : "Imposible (No llega)"}</strong>
                                        </div>

                                        <p><strong>c) Altura Crítica ($h_c$):</strong><br/>
                                        En el punto B, el peso y la Normal apuntan hacia abajo constituyendo la Fuerza Centrípeta. El límite justo antes de caer es cuando la pista deja de presionar al cuerpo: <strong>Normal = 0</strong>.</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-rose-500 font-mono text-rose-200 shadow-inner overflow-x-auto">
                                            F_c = P + N  ⇒  m·v_B²/R = m·g + 0  ⇒  v_B² = R·g<br/>
                                            <br/>
                                            Sustituyendo esta v_B² en la conservación de la energía:<br/>
                                            m·g·h_c = m·g·(2R) + ½·m·(R·g)<br/>
                                            g·h_c = 2·g·R + 0.5·g·R  ⇒  h_c = 2.5·R<br/>
                                            <strong>h_c = 2.5 · {R} = {hCritica.toFixed(1)} m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica Continua en Coordenadas Paramétricas
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
