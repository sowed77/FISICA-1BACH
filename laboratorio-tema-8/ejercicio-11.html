<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Trabajo a Velocidad Constante</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #0ea5e9; /* Sky 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }
        .floor-pattern {
            background-color: #1e293b;
            background-image: repeating-linear-gradient(45deg, #334155 0px, #334155 10px, transparent 10px, transparent 20px);
            border-top: 4px solid #475569;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var SettingsIcon = getIcon('Settings');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var ArrowUpIcon = getIcon('ArrowUp');
            var ArrowDownIcon = getIcon('ArrowDown');
            var BatteryChargingIcon = getIcon('BatteryCharging');
            var ImagePlusIcon = getIcon('ImagePlus');
            var TargetIcon = getIcon('Target');

            var App = () => {
                const g = 9.8; // m/s^2

                // Estados interactivos (Inicializados con el enunciado)
                const [masa, setMasa] = useState(25.0); // kg
                const [mu, setMu] = useState(0.20); // Coeficiente de rozamiento
                const [distancia, setDistancia] = useState(4.0); // m
                const vConstante = 8.0; // m/s (Dato trampa, no cambia los cálculos de fuerza, solo la velocidad visual)

                // Cálculos Físicos
                const peso = masa * g; // P = m * g
                const normal = peso; // N = P (en plano horizontal)
                const fRozamiento = mu * normal; // Fr = mu * N
                
                // Como v = constante => a = 0 => F_neta = 0 => F_aplicada = F_rozamiento
                const fAplicada = fRozamiento; 
                
                // Trabajo de la fuerza aplicada
                const trabajo = fAplicada * distancia;

                // Animación
                const [time, setTime] = useState(0);
                const [isMoving, setIsMoving] = useState(false);
                
                // Cinemática (MRU)
                const tMax = distancia / vConstante;
                const currentPos = Math.min(distancia, vConstante * time);
                const currentWork = fAplicada * currentPos;

                // Escala visual
                const pxPerMeter = 300 / 10; // Asumimos un máximo de 10m en pantalla para la escala
                const visualPosX = currentPos * pxPerMeter;

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tMax) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                // Para que no sea muy rápido o lento visualmente, normalizamos a unos 3 segundos
                                const factorEscalaTiempo = tMax / 3; 
                                const nextTime = prev + (0.05 * factorEscalaTiempo);
                                if (nextTime >= tMax) {
                                    setIsMoving(false);
                                    return tMax;
                                }
                                return nextTime;
                            });
                        }, 50);
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tMax]);

                const handlePlay = () => {
                    if (time < tMax) setIsMoving(true);
                };

                const reset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Si se cambian las variables, reiniciar
                useEffect(() => {
                    reset();
                }, [masa, mu, distancia]);

                // Generador de Diagrama de Cuerpo Libre
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de cuerpo libre. Un bloque deslizándose por una superficie horizontal a velocidad constante. Vector de Fuerza F hacia la derecha y vector de Fuerza de Rozamiento Fr hacia la izquierda (ambos de la misma longitud). Vector Normal N hacia arriba y Peso P hacia abajo (ambos de la misma longitud). Estilo educativo minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                // Escala para vectores
                const vScale = 1.0; 

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-sky-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Trabajo y Energía</span>
                                <h1 className="text-3xl font-black text-sky-400 uppercase tracking-tight tracking-widest">El Empuje Constante</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un bloque de 25 kg se desplaza horizontalmente con una velocidad constante de 8,0 m/s. El coeficiente de rozamiento es 0,20. ¿Qué trabajo hace la fuerza aplicada si recorre 4,0 m en su misma dirección?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* Marcadores Flotantes */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Dinámica (a = 0)</p>
                                        <div className="flex justify-between gap-4 mt-1">
                                            <div>
                                                <p className="text-[10px] text-emerald-500 font-bold">F. Aplicada</p>
                                                <p className="text-lg font-mono font-black text-emerald-400">{fAplicada.toFixed(1)} N</p>
                                            </div>
                                            <div>
                                                <p className="text-[10px] text-red-500 font-bold">F. Fricción</p>
                                                <p className="text-lg font-mono font-black text-red-400">{fRozamiento.toFixed(1)} N</p>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 border-b-sky-500 shadow-[0_0_15px_rgba(14,165,233,0.2)]`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black flex items-center justify-end gap-1">
                                            {BatteryChargingIcon && <BatteryChargingIcon size={12} className="text-sky-400" />} Trabajo (W)
                                        </p>
                                        <p className="text-3xl font-mono font-black text-sky-400">
                                            {currentWork.toFixed(0)} <span className="text-sm">J</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Escena del Desplazamiento */}
                                <div className="relative w-full h-72 flex justify-start items-end pb-8">
                                    
                                    {/* Suelo */}
                                    <div className="absolute bottom-0 w-full h-12 floor-pattern"></div>
                                    
                                    {/* Marcador de Meta */}
                                    <div 
                                        className="absolute bottom-12 border-l-4 border-dashed border-sky-500/50 h-24 z-10"
                                        style={{ left: `${60 + distancia * pxPerMeter + 40}px` }} // +40px para alinear con el frente de la caja
                                    >
                                        <span className="text-[10px] font-black text-sky-300 bg-slate-900/80 px-2 py-1 rounded absolute -top-6 -left-8 whitespace-nowrap border border-sky-500/30">{distancia.toFixed(1)} m</span>
                                    </div>

                                    {/* La Caja */}
                                    <div 
                                        className="absolute bottom-12 w-24 h-20 bg-slate-400 border-4 border-slate-300 rounded-lg flex items-center justify-center z-20 shadow-xl transition-transform"
                                        style={{ left: '60px', transform: `translateX(${visualPosX}px)` }}
                                    >
                                        <span className="font-black text-slate-800 text-sm">{masa} kg</span>
                                        
                                        {/* Cartel Velocidad Constante */}
                                        <div className="absolute -top-6 bg-yellow-500 text-slate-900 px-2 rounded-full text-[9px] font-black uppercase whitespace-nowrap shadow-lg">
                                            v = 8.0 m/s (Cte)
                                        </div>

                                        {/* Vector Fuerza Aplicada (Derecha) */}
                                        <div className="absolute top-1/2 left-full flex items-center pl-1 pointer-events-none" style={{ width: Math.min(100, fAplicada * vScale) }}>
                                            <div className="h-1.5 bg-emerald-400 w-full relative shadow-[0_0_8px_rgba(52,211,153,0.8)]">
                                                <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon className="text-emerald-400" size={16} />}</div>
                                            </div>
                                            <span className="ml-1 text-[10px] font-black text-emerald-300 bg-slate-900/80 px-1 rounded whitespace-nowrap">F_a</span>
                                        </div>

                                        {/* Vector Rozamiento (Izquierda) */}
                                        <div className="absolute top-1/2 right-full flex items-center pr-1 pointer-events-none" style={{ width: Math.min(100, fRozamiento * vScale) }}>
                                            <span className="mr-1 text-[10px] font-black text-red-400 bg-slate-900/80 px-1 rounded whitespace-nowrap">F_r</span>
                                            <div className="h-1.5 bg-red-500 w-full relative shadow-[0_0_8px_rgba(239,68,68,0.8)]">
                                                <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-red-500" size={16} />}</div>
                                            </div>
                                        </div>

                                        {/* Vector Normal (Arriba) */}
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 flex flex-col items-center pb-1 pointer-events-none opacity-50" style={{ height: 60 }}>
                                            <span className="mb-1 text-[10px] font-black text-indigo-300 bg-slate-900/80 px-1 rounded">N</span>
                                            <div className="w-1.5 bg-indigo-400 h-full relative">
                                                <div className="absolute top-0 -translate-x-1.5">{ArrowUpIcon && <ArrowUpIcon className="text-indigo-400" size={16} />}</div>
                                            </div>
                                        </div>

                                        {/* Vector Peso (Abajo) */}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 flex flex-col items-center pt-1 pointer-events-none opacity-50" style={{ height: 60 }}>
                                            <div className="w-1.5 bg-orange-400 h-full relative">
                                                <div className="absolute bottom-0 -translate-x-1.5">{ArrowDownIcon && <ArrowDownIcon className="text-orange-400" size={16} />}</div>
                                            </div>
                                            <span className="mt-1 text-[10px] font-black text-orange-300 bg-slate-900/80 px-1 rounded">P</span>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-sky-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Modificar Datos
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-slate-300 font-bold uppercase">Masa del Cuerpo (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{masa} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="5" max="100" step="5" value={masa} 
                                                onChange={e => {setMasa(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400" 
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 pt-2 border-t border-slate-700">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1">
                                                    <span className="text-red-400 font-bold uppercase">Rozamiento (μ)</span>
                                                </div>
                                                <input type="range" min="0" max="0.8" step="0.05" value={mu} onChange={e => {setMu(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500 mb-1" />
                                                <span className="font-mono text-red-200 text-xs">{mu.toFixed(2)}</span>
                                            </div>
                                            
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1">
                                                    <span className="text-sky-400 font-bold uppercase">Distancia (d)</span>
                                                </div>
                                                <input type="range" min="1" max="10" step="0.5" value={distancia} onChange={e => {setDistancia(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500 mb-1" />
                                                <span className="font-mono text-sky-200 text-xs">{distancia.toFixed(1)} m</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tMax}
                                            className="flex-1 bg-sky-600 hover:bg-sky-500 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} DESPLAZAR CUERPO
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-sky-950/20 p-6 rounded-3xl border border-sky-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-sky-500/30 pb-2">
                                        <h4 className="font-bold text-sky-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-yellow-500 text-yellow-200 font-bold mb-3 shadow-[inset_0_0_15px_rgba(234,179,8,0.15)]">
                                            ¡DATO TRAMPA! La velocidad de 8.0 m/s no se usa en la fórmula de la fuerza ni del trabajo. Lo que nos importa es que dice "Velocidad constante", por lo tanto la aceleración es 0.
                                        </div>

                                        <p><strong>1. Calcular el Rozamiento:</strong><br/>
                                        La Normal en horizontal es igual al peso.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-red-500 font-mono text-red-200">
                                            P = m · g = {masa} · 9.8 = <strong>{peso.toFixed(1)} N</strong><br/>
                                            N = P = {normal.toFixed(1)} N<br/>
                                            F_r = μ · N = {mu.toFixed(2)} · {normal.toFixed(1)} = <strong>{fRozamiento.toFixed(1)} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>2. Calcular la Fuerza Aplicada (F_a):</strong><br/>
                                        Por la 1ª Ley de Newton, si a=0, las fuerzas horizontales se anulan entre sí.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200">
                                            Σ F_x = 0  ⇒  F_a - F_r = 0<br/>
                                            F_a = F_r = <strong>{fAplicada.toFixed(1)} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Calcular el Trabajo (W):</strong><br/>
                                        Trabajo = Fuerza · Distancia (cos 0º = 1 porque empuja en la misma dirección).</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-sky-500 font-mono text-sky-200 shadow-inner text-sm">
                                            W = F_a · d · cos(0º)<br/>
                                            W = {fAplicada.toFixed(1)} · {distancia.toFixed(1)} · 1<br/>
                                            <strong>W = {trabajo.toFixed(0)} J</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Trabajo: La Primera Ley de Newton (Inercia)
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
