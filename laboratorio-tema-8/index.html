<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratori Virtual - Tema 8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f1eb; }
        .hover-scale { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-scale:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white py-10 px-6 shadow-md">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div>
                <a href="../index.html" class="inline-flex items-center text-slate-400 hover:text-white mb-4 transition-colors text-sm font-semibold">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Tornar a l'Índex Principal
                </a>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Laboratori Virtual: Tema 7</h1>
                <p class="text-emerald-400 mt-2 font-medium">Animacions i simulacions interactives</p>
            </div>
            <div class="hidden sm:block p-4 bg-emerald-600/20 rounded-full">
                <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div id="grid-animaciones" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            </div>
    </main>

    <script>
        // CONFIGURACIÓN DE LA GALERÍA
        const TEMA_NUM = 8;
        const TOTAL_ANIMACIONES = 44; // Cambiar a 44 para el Tema 8
        const contenedor = document.getElementById('grid-animaciones');

        // Bucle para generar las tarjetas apuntando a ejercicio-X.html
        for (let i = 1; i <= TOTAL_ANIMACIONES; i++) {
            const html = `
                <a href="ejercicio-${i}.html" class="bg-white rounded-xl p-4 border border-slate-200 hover-scale flex flex-col items-center justify-center text-center gap-2 group cursor-pointer">
                    <div class="w-12 h-12 bg-slate-50 group-hover:bg-emerald-50 rounded-full flex items-center justify-center text-slate-400 group-hover:text-emerald-500 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 font-medium">Animació</span>
                        <h3 class="text-lg font-bold text-slate-800">#${i}</h3>
                    </div>
                </a>
            `;
            contenedor.insertAdjacentHTML('beforeend', html);
        }
    </script>
</body>
</html>
