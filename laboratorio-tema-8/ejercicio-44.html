<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Caída, Muelle y Pérdidas</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #d946ef; /* Fuchsia 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.5);
        }
        .sky-bg {
            background-color: #0ea5e9;
            background-image: linear-gradient(to bottom, #0284c7, #38bdf8);
        }
        /* Resorte SVG estilizacion */
        .spring-path {
            transition: d 0.05s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const SettingsIcon = getIcon('Settings');
            const InfoIcon = getIcon('Info');
            const ArrowUpIcon = getIcon('ArrowUp');
            const ArrowDownIcon = getIcon('ArrowDown');
            const FlameIcon = getIcon('Flame');
            const BatteryIcon = getIcon('BatteryCharging');
            const ImagePlusIcon = getIcon('ImagePlus');

            const App = () => {
                const g = 9.8; // m/s²

                // --- ESTADOS INTERACTIVOS (Del enunciado) ---
                const [masa, setMasa] = useState(10.0); // kg
                const [hInicial, setHInicial] = useState(8.0); // m
                const [xCompCm, setXCompCm] = useState(8.0); // cm
                const [perdidaComp, setPerdidaComp] = useState(10); // %
                const [perdidaExp, setPerdidaExp] = useState(10); // %

                // --- CÁLCULOS FÍSICOS TEÓRICOS ---
                const xM = xCompCm / 100; // m
                
                // 1. Energía Inicial (respecto al punto de máxima compresión)
                const hTotalCaida = hInicial + xM; // m
                const ePotInicial = masa * g * hTotalCaida; // Julios
                
                // 2. Energía elástica tras comprimir (pierde el X%)
                const energiaElastica = ePotInicial * (1 - perdidaComp / 100); // Julios
                const calor1 = ePotInicial * (perdidaComp / 100);
                
                // Constante K: E_pe = 1/2 * k * x^2 => k = 2 * E_pe / x^2
                const k = (2 * energiaElastica) / Math.pow(xM, 2); // N/m

                // 3. Energía al salir del muelle (pierde el X% de la elástica)
                const energiaVuelta = energiaElastica * (1 - perdidaExp / 100); // Julios
                const calor2 = energiaElastica * (perdidaExp / 100);
                const calorTotal = calor1 + calor2;
                
                // De esa energía, una parte es potencial gravitatoria al subir 'xM' hasta abandonar el muelle
                const epRecuperada = masa * g * xM;
                const ecSalida = energiaVuelta - epRecuperada; // J
                
                // Velocidad de salida
                const vSalida = ecSalida > 0 ? Math.sqrt((2 * ecSalida) / masa) : 0; // m/s
                
                // Altura final de rebote (respecto al punto donde abandona el muelle, x=0)
                const hFinal = ecSalida > 0 ? ecSalida / (masa * g) : 0; // m

                // --- ANIMACIÓN ---
                const [time, setTime] = useState(0);
                const [phase, setPhase] = useState('ready'); // ready, falling, compressing, expanding, rising, done

                // Tiempos de las fases cinemáticas
                const tFall = Math.sqrt((2 * hInicial) / g); // Caída libre hasta x=0
                const vImpacto = g * tFall;
                
                // Simplificación visual: asumiremos un M.A.S amortiguado para el impacto (0.1s aprox visual)
                const tComp = 0.15; 
                const tExp = 0.15;
                const tRise = vSalida / g;

                const tLimit1 = tFall;
                const tLimit2 = tFall + tComp;
                const tLimit3 = tFall + tComp + tExp;
                const tLimit4 = tFall + tComp + tExp + tRise;

                // Variables de estado instantáneo
                let currentY = hInicial; // Altura sobre el muelle (0 es tocando sin comprimir)
                let currentV = 0;
                let currentEc = 0;
                let currentEp = 0;
                let currentEpe = 0;
                let currentHeat = 0;

                if (phase === 'ready') {
                    currentY = hInicial;
                    currentEp = masa * g * (hInicial + xM);
                } else if (time <= tLimit1) {
                    // Caída libre
                    currentY = hInicial - 0.5 * g * Math.pow(time, 2);
                    currentV = -g * time;
                    currentEp = masa * g * (currentY + xM);
                    currentEc = 0.5 * masa * Math.pow(currentV, 2);
                } else if (time <= tLimit2) {
                    // Compresión
                    const tLocal = (time - tLimit1) / tComp; // 0 a 1
                    currentY = -xM * Math.sin(tLocal * Math.PI / 2); // 0 a -xM
                    
                    currentEpe = energiaElastica * Math.pow(tLocal, 2); // Simplificación visual
                    currentHeat = calor1 * tLocal;
                    currentEp = masa * g * (currentY + xM);
                    currentEc = ePotInicial - currentEp - currentEpe - currentHeat;
                } else if (time <= tLimit3) {
                    // Expansión
                    const tLocal = (time - tLimit2) / tExp; // 0 a 1
                    currentY = -xM + xM * (1 - Math.cos(tLocal * Math.PI / 2)); // -xM a 0
                    
                    currentEpe = energiaElastica * (1 - Math.pow(tLocal, 2));
                    currentHeat = calor1 + calor2 * tLocal;
                    currentEp = masa * g * (currentY + xM);
                    currentEc = energiaVuelta - currentEp - currentEpe;
                } else if (time <= tLimit4) {
                    // Subida libre
                    const tLocal = time - tLimit3;
                    currentY = (vSalida * tLocal) - (0.5 * g * Math.pow(tLocal, 2));
                    currentV = vSalida - g * tLocal;
                    
                    currentHeat = calorTotal;
                    currentEp = masa * g * (currentY + xM);
                    currentEc = 0.5 * masa * Math.pow(currentV, 2);
                } else {
                    // Terminado (Rebote máximo)
                    currentY = hFinal;
                    currentV = 0;
                    currentHeat = calorTotal;
                    currentEp = masa * g * (hFinal + xM);
                    currentEc = 0;
                }

                // Evitar negativos visuales
                currentEc = Math.max(0, currentEc);

                useEffect(() => {
                    let interval;
                    if (phase !== 'ready' && phase !== 'done' && time < tLimit4) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                const nextTime = prev + 0.05; // dt visual 
                                if (nextTime >= tLimit4) {
                                    setPhase('done');
                                    return tLimit4;
                                }
                                return nextTime;
                            });
                        }, 20); // 50fps
                    }
                    return () => clearInterval(interval);
                }, [phase, time, tLimit4]);

                const handlePlay = () => {
                    if (phase === 'ready' || phase === 'done') {
                        setTime(0);
                        setPhase('falling');
                    }
                };

                const reset = () => {
                    setTime(0);
                    setPhase('ready');
                };

                // Si cambiamos los inputs, reset
                useEffect(() => {
                    reset();
                }, [masa, hInicial, xCompCm, perdidaComp, perdidaExp]);

                // Generador de DCL IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = ""; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de la conservación de la energía. Un bloque comprimiendo un muelle vertical. Gráficos de barras laterales mostrando que la Energía Potencial Inicial Ep0 se transforma en Energía Elástica Epe y Calor Q por rozamiento. Estilo educativo, minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                // --- ESCALA VISUAL ---
                const maxVisualH = Math.max(hInicial, hFinal) + 1; 
                const pxPerMeter = 280 / maxVisualH;
                
                // Muelle visual (Exagerado para que se vea, el real son 8cm)
                const l0Visual = 60; // px
                const compVisual = currentY < 0 ? (currentY / -xM) * 30 : 0; // 30px max compresión
                const muelleLength = l0Visual - compVisual;

                const generateSpringPath = (h) => {
                    const coils = 8;
                    const width = 20;
                    const topPadding = 5;
                    let path = `M 0 0 L 0 ${topPadding} `;
                    const coilH = (h - topPadding*2) / coils;
                    for(let i=0; i<coils; i++) {
                        const x = i % 2 === 0 ? -width/2 : width/2;
                        const y = topPadding + coilH * (i + 0.5);
                        path += `L ${x} ${y} `;
                    }
                    path += `L 0 ${h - topPadding} L 0 ${h}`;
                    return path;
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-fuchsia-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Conservación de Energía</span>
                                <h1 className="text-3xl font-black text-fuchsia-400 uppercase tracking-tight tracking-widest">Choque con Pérdidas</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un objeto de 10 kg cae desde 8 m sobre un muelle y lo comprime 8 cm. En la compresión pierde 10% de energía por calor, y el mismo 10% en la expansión. Calcula: a) Constante del muelle. b) Velocidad con que sale hacia arriba. c) Altura de rebote.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-4">
                                
                                {/* HUD de Energías (Barras) */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-700 backdrop-blur-md flex flex-col gap-2 shadow-lg">
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest text-center border-b border-slate-700 pb-1 flex items-center justify-center gap-1">
                                            {BatteryIcon && <BatteryIcon size={12}/>} Balance Energético
                                        </p>
                                        
                                        {/* BARRAS ARREGLADAS AQUÍ */}
                                        <div className="flex gap-4 items-end h-24 mt-2">
                                            {/* Barra Ep */}
                                            <div className="flex flex-col items-center h-full">
                                                <span className="text-[8px] font-bold text-blue-400 mb-1">Ep</span>
                                                <div className="flex-1 w-3 bg-slate-800 rounded-sm overflow-hidden flex flex-col justify-end">
                                                    <div className="w-full bg-blue-500 transition-all duration-75 ease-linear" style={{ height: `${(currentEp / ePotInicial) * 100}%` }}></div>
                                                </div>
                                            </div>
                                            {/* Barra Ec */}
                                            <div className="flex flex-col items-center h-full">
                                                <span className="text-[8px] font-bold text-emerald-400 mb-1">Ec</span>
                                                <div className="flex-1 w-3 bg-slate-800 rounded-sm overflow-hidden flex flex-col justify-end">
                                                    <div className="w-full bg-emerald-500 transition-all duration-75 ease-linear" style={{ height: `${(currentEc / ePotInicial) * 100}%` }}></div>
                                                </div>
                                            </div>
                                            {/* Barra Epe */}
                                            <div className="flex flex-col items-center h-full">
                                                <span className="text-[8px] font-bold text-fuchsia-400 mb-1">Epe</span>
                                                <div className="flex-1 w-3 bg-slate-800 rounded-sm overflow-hidden flex flex-col justify-end">
                                                    <div className="w-full bg-fuchsia-500 transition-all duration-75 ease-linear" style={{ height: `${(currentEpe / ePotInicial) * 100}%` }}></div>
                                                </div>
                                            </div>
                                            {/* Barra Calor */}
                                            <div className="flex flex-col items-center h-full">
                                                <span className="text-[8px] font-bold text-orange-400 mb-1">Q</span>
                                                <div className="flex-1 w-3 bg-slate-800 rounded-sm overflow-hidden flex flex-col justify-end">
                                                    <div className="w-full bg-orange-500 transition-all duration-75 ease-linear" style={{ height: `${(currentHeat / ePotInicial) * 100}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <p className="text-[10px] text-center text-slate-500 mt-1 font-mono">E_tot = {ePotInicial.toFixed(0)} J</p>
                                    </div>
                                    
                                    <div className="flex flex-col gap-2">
                                        <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 ${time === tLimit4 ? 'border-b-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)]' : 'border-b-fuchsia-500'}`}>
                                            <p className="text-[10px] text-slate-500 uppercase font-black">Altura Actual (h)</p>
                                            <p className="text-xl font-mono font-black text-fuchsia-400">{Math.max(0, currentY).toFixed(2)} m</p>
                                        </div>
                                        {currentHeat > 0 && (
                                            <div className="bg-red-900/80 border border-red-500 p-2 rounded-lg text-right flex items-center justify-end gap-1 animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.5)]">
                                                <FlameIcon size={14} className="text-orange-400" />
                                                <span className="text-xs font-black text-orange-300 font-mono">-{currentHeat.toFixed(0)} J</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Escena de la Caída */}
                                <div className="relative w-full h-80 sky-bg flex justify-center items-end border-b-8 border-slate-600">
                                    
                                    {/* Regla de Altura */}
                                    <div className="absolute left-6 h-full flex flex-col justify-between items-start py-8 border-l-2 border-dashed border-slate-700/50">
                                        <div className="relative w-4 border-b-2 border-slate-700/50">
                                            <span className="absolute left-6 -top-2 text-[10px] font-mono text-slate-600 font-bold">{hInicial}m</span>
                                        </div>
                                        <div className="relative w-4 border-b-2 border-slate-700/50">
                                            <span className="absolute left-6 -top-2 text-[10px] font-mono text-slate-600 font-bold">{hFinal.toFixed(1)}m</span>
                                        </div>
                                        <div className="relative w-4 border-b-2 border-slate-700/50 mt-auto">
                                            <span className="absolute left-6 -top-2 text-[10px] font-mono text-slate-600 font-bold">0m</span>
                                        </div>
                                    </div>

                                    {/* Muelle */}
                                    <div className="absolute bottom-0 flex flex-col items-center">
                                        <div className="relative z-10 transition-all" style={{ height: `${muelleLength}px` }}>
                                            <svg width="40" height={muelleLength} className="overflow-visible absolute bottom-0 left-1/2 -translate-x-1/2">
                                                <path d={generateSpringPath(muelleLength)} fill="none" stroke="#d946ef" strokeWidth="4" strokeLinecap="round" className="spring-path" />
                                            </svg>
                                        </div>
                                        <div className="w-16 h-2 bg-slate-500 rounded-t border-t-2 border-slate-400 relative z-20"></div>
                                    </div>

                                    {/* La Caja */}
                                    <div 
                                        className="absolute z-30 flex flex-col items-center transition-transform"
                                        style={{ bottom: `${muelleLength + Math.max(0, currentY) * pxPerMeter}px` }}
                                    >
                                        <div className="w-12 h-12 bg-blue-600 border-4 border-blue-400 rounded-lg shadow-xl flex items-center justify-center relative">
                                            <span className="font-black text-white text-[10px]">{masa} kg</span>
                                        </div>
                                    </div>

                                    {/* Suelo decorativo */}
                                    <div className="absolute -bottom-8 w-full h-8 bg-slate-700 border-t-2 border-slate-500"></div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-fuchsia-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Parámetros del Experimento
                                    </h3>
                                    
                                    <div className="space-y-4 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <div className="flex justify-between text-xs mb-1"><span className="text-slate-300 font-bold uppercase">Masa (m)</span><span className="font-mono text-white">{masa} kg</span></div>
                                                <input type="range" min="1" max="50" step="1" value={masa} onChange={e => {setMasa(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs mb-1"><span className="text-blue-400 font-bold uppercase">Altura (h₀)</span><span className="font-mono text-white">{hInicial} m</span></div>
                                                <input type="range" min="2" max="15" step="0.5" value={hInicial} onChange={e => {setHInicial(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 mb-1" />
                                            </div>
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1"><span className="text-fuchsia-400 font-bold uppercase">Compresión (x)</span><span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{xCompCm} cm</span></div>
                                            <input type="range" min="1" max="20" step="0.5" value={xCompCm} onChange={e => {setXCompCm(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-fuchsia-500" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 pt-3 border-t border-slate-700">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-orange-400 font-bold uppercase">Pérdida Compresión</span><span className="font-mono text-orange-200">{perdidaComp}%</span></div>
                                                <input type="range" min="0" max="50" step="5" value={perdidaComp} onChange={e => {setPerdidaComp(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500 mb-1" />
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-orange-400 font-bold uppercase">Pérdida Expansión</span><span className="font-mono text-orange-200">{perdidaExp}%</span></div>
                                                <input type="range" min="0" max="50" step="5" value={perdidaExp} onChange={e => {setPerdidaExp(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500 mb-1" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={phase !== 'ready' && phase !== 'done'}
                                            className="flex-1 bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} SOLTAR BLOQUE
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-fuchsia-950/20 p-6 rounded-3xl border border-fuchsia-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-fuchsia-500/30 pb-2">
                                        <h4 className="font-bold text-fuchsia-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Ver Gráfico</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Energía" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>a) Constante del Muelle (k):</strong><br/>
                                        Calculamos la energía total que cae sobre el muelle. ¡Ojo! Cae los {hInicial}m MÁS los {xM.toFixed(3)}m que aplasta el muelle.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200 overflow-x-auto">
                                            Ep₀ = m·g·(h+x) = {masa} · 9.8 · ({hInicial} + {xM}) = <strong>{ePotInicial.toFixed(2)} J</strong>
                                        </div>
                                        <p>El muelle absorbe esto, pero pierde un {perdidaComp}%. Igualamos la energía restante a la fórmula elástica (½·k·x²):</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-fuchsia-500 font-mono text-fuchsia-200">
                                            E_pe = {ePotInicial.toFixed(2)} · (1 - {perdidaComp/100}) = {energiaElastica.toFixed(2)} J<br/>
                                            {energiaElastica.toFixed(2)} = 0.5 · k · {xM}²  ⇒  k = (2 · {energiaElastica.toFixed(2)}) / {xM}²<br/>
                                            <strong>k = {k.toLocaleString(undefined, {maximumFractionDigits: 0})} N/m</strong>
                                        </div>

                                        <p className="mt-3"><strong>b) Velocidad de Salida (v):</strong><br/>
                                        El muelle se estira devolviendo la energía, pero pierde otro {perdidaExp}%.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            E_vuelta = {energiaElastica.toFixed(2)} · (1 - {perdidaExp/100}) = {energiaVuelta.toFixed(2)} J
                                        </div>
                                        <p>En el momento de abandonar el muelle (x=0), el bloque ya ha recuperado los {xM}m de altura. Esa parte se queda como potencial, el resto es cinética.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200 overflow-x-auto">
                                            Ec = {energiaVuelta.toFixed(2)} - (m·g·x) = {energiaVuelta.toFixed(2)} - ({masa}·9.8·{xM}) = <strong>{ecSalida.toFixed(2)} J</strong><br/>
                                            v = √(2 · {ecSalida.toFixed(2)} / {masa}) = <strong>{vSalida.toFixed(2)} m/s</strong>
                                        </div>

                                        <p className="mt-3"><strong>c) Altura de Rebote (h_f):</strong><br/>
                                        Desde que abandona el muelle, toda su Ec se transforma en Ep.</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-sky-500 font-mono text-sky-200 shadow-inner">
                                            h_f = Ec / (m·g) = {ecSalida.toFixed(2)} / ({masa} · 9.8)<br/>
                                            <strong>h_f = {hFinal.toFixed(2)} m</strong> (sobre el muelle)
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Trabajo de Fuerzas no Conservativas y Energía
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
    <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
