<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Potencia, Coche y Muelle</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #14b8a6; /* Teal 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
        }
        .floor-pattern {
            background-color: #1e293b;
            background-image: repeating-linear-gradient(45deg, #334155 0px, #334155 10px, transparent 10px, transparent 20px);
            border-top: 4px solid #475569;
        }
        .spring-path {
            transition: d 0.05s linear;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const SettingsIcon = getIcon('Settings');
            const ZapIcon = getIcon('Zap');
            const BatteryIcon = getIcon('BatteryCharging');
            const CarIcon = getIcon('Car');
            const ArrowRightIcon = getIcon('ArrowRight');
            const TimerIcon = getIcon('Timer');
            const ImagePlusIcon = getIcon('ImagePlus');

            const App = () => {
                // Estados interactivos inicializados con los datos del enunciado
                const [potencia, setPotencia] = useState(40.0); // W
                const [tiempoEmpuje, setTiempoEmpuje] = useState(10.0); // s
                const [masa, setMasa] = useState(40.0); // kg
                const [kMuelle, setKMuelle] = useState(3200); // N/m

                // Cálculos Teóricos Físicos
                // 1. Energía (Trabajo del motor)
                const energiaTotal = potencia * tiempoEmpuje; // J
                
                // 2. Velocidad final al impactar (Ec = Trabajo)
                // E_c = 1/2 * m * v^2 => v = sqrt(2 * E_c / m)
                const vImpacto = Math.sqrt((2 * energiaTotal) / masa); // m/s
                
                // Posición exacta al impactar (Si Potencia = Cte, F no es constante, x(t) = 2/3 * sqrt(2P/m) * t^(3/2))
                const dImpacto = (2/3) * Math.sqrt((2 * potencia) / masa) * Math.pow(tiempoEmpuje, 1.5); // m

                // 3. Compresión del muelle (Epe = Ec)
                // 1/2 * k * x^2 = E_c => x = sqrt(2 * E_c / k)
                const compresionMax = Math.sqrt((2 * energiaTotal) / kMuelle); // m
                const dTotal = dImpacto + compresionMax; // m

                // Frecuencia angular del muelle para calcular tiempo de compresión (M.A.S)
                const omega = Math.sqrt(kMuelle / masa);
                const tCompresion = (Math.PI / 2) / omega; // Tiempo hasta velocidad 0 (un cuarto de ciclo)
                const tMaxSimulacion = tiempoEmpuje + tCompresion;

                // Animación
                const [time, setTime] = useState(0); 
                const [isMoving, setIsMoving] = useState(false);

                // Variables cinemáticas instantáneas
                let currentPos = 0;
                let currentV = 0;
                let currentEc = 0;
                let currentEpe = 0;
                let currentPhase = "Reposo";

                if (time === 0) {
                    currentPos = 0;
                    currentV = 0;
                    currentEc = 0;
                    currentEpe = 0;
                    currentPhase = "Reposo";
                } else if (time <= tiempoEmpuje) {
                    // Fase 1: Aceleración por Potencia Constante
                    currentV = Math.sqrt((2 * potencia * time) / masa);
                    currentPos = (2/3) * Math.sqrt((2 * potencia) / masa) * Math.pow(time, 1.5);
                    currentEc = potencia * time;
                    currentEpe = 0;
                    currentPhase = "Motor Empujando";
                } else if (time <= tMaxSimulacion) {
                    // Fase 2: Compresión del muelle
                    const tPost = time - tiempoEmpuje;
                    const x_comp = compresionMax * Math.sin(omega * tPost);
                    
                    currentPos = dImpacto + x_comp;
                    currentV = vImpacto * Math.cos(omega * tPost);
                    
                    currentEpe = 0.5 * kMuelle * Math.pow(x_comp, 2);
                    currentEc = energiaTotal - currentEpe;
                    currentPhase = "Comprimiendo Muelle";
                } else {
                    // Fin (Muelle totalmente comprimido)
                    currentPos = dTotal;
                    currentV = 0;
                    currentEc = 0;
                    currentEpe = energiaTotal;
                    currentPhase = "Detenido al Máximo";
                }

                // Asegurar topes visuales y lógicos
                currentV = Math.max(0, currentV);
                currentEc = Math.max(0, currentEc);

                // Escala visual interactiva
                const availablePx = 350; // Ancho máximo visual para la pista
                const pxPerMeter = availablePx / Math.max(10, dTotal + 1);
                
                // Muelle visual
                const l0 = 100; // Longitud del muelle sin estirar (px)
                const visualPos = currentPos * pxPerMeter;
                const muelleBaseX = (dImpacto * pxPerMeter) + l0 + 30; // 30px es medio coche
                const muelleActualWidth = muelleBaseX - visualPos - 30; // Coche comprime muelle

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tMaxSimulacion) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                // Aceleramos el tiempo visual (3x) para no esperar 10 segundos enteros de la fase 1
                                const nextTime = prev + (0.02 * 4); 
                                if (nextTime >= tMaxSimulacion) {
                                    setIsMoving(false);
                                    return tMaxSimulacion;
                                }
                                return nextTime;
                            });
                        }, 20); // 50 fps
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tMaxSimulacion]);

                const handlePlay = () => {
                    if (time < tMaxSimulacion) setIsMoving(true);
                };

                const reset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Si cambiamos los datos, reiniciamos la animación
                useEffect(() => {
                    reset();
                }, [potencia, tiempoEmpuje, masa, kMuelle]);

                // Generador de SVG para el muelle dinámico
                const generateSpringPath = (w) => {
                    const coils = 12;
                    const h = 24;
                    const safeW = Math.max(10, w);
                    let path = `M ${safeW} 0 L ${safeW - 10} 0 `;
                    const coilWidth = (safeW - 20) / coils;
                    for(let i=0; i<coils; i++) {
                        const y = i % 2 === 0 ? -h/2 : h/2;
                        const x = safeW - 10 - (coilWidth * (i + 0.5));
                        path += `L ${x} ${y} `;
                    }
                    path += `L 10 0 L 0 0`;
                    return path;
                };

                // Generador de DCL IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = ""; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de conservación de la energía. Un coche teledirigido acercándose y comprimiendo un muelle fijado a una pared. Dos grandes barras de energía comparativas: Energía Cinética convirtiéndose completamente en Energía Potencial Elástica. Estilo minimalista educativo, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-teal-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Trabajo y Energía</span>
                                <h1 className="text-3xl font-black text-teal-400 uppercase tracking-tight tracking-widest">Coche RC y el Muelle</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un motor de 40 W impulsa durante 10 s un coche teledirigido de 40 kg por una carretera horizontal sin rozamientos. ¿Qué velocidad adquiere? Si al final choca y se queda enganchado a un muelle de k = 3200 N/m, ¿cuánto se contrae el muelle?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-8">
                                
                                {/* HUD Superior Energías */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-700 backdrop-blur-md flex flex-col gap-2 w-64 shadow-lg">
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest text-center border-b border-slate-700 pb-1 flex items-center justify-center gap-1">
                                            {BatteryIcon && <BatteryIcon size={12}/>} Distribución de Energía
                                        </p>
                                        
                                        {/* Barra Motor (Trabajo Aportado) */}
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className="text-[9px] font-bold text-amber-400 w-6">Motor</span>
                                            <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                                <div className="h-full bg-amber-500 transition-all duration-75" style={{ width: `${(Math.min(energiaTotal, potencia * time) / energiaTotal) * 100}%` }}></div>
                                            </div>
                                            <span className="text-[9px] font-mono text-amber-300 w-10 text-right">{Math.min(energiaTotal, potencia * time).toFixed(0)}J</span>
                                        </div>

                                        {/* Barra Ec */}
                                        <div className="flex items-center gap-2">
                                            <span className="text-[9px] font-bold text-blue-400 w-6">Ec</span>
                                            <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                                <div className="h-full bg-blue-500 transition-all duration-75" style={{ width: `${(currentEc / energiaTotal) * 100}%` }}></div>
                                            </div>
                                            <span className="text-[9px] font-mono text-blue-300 w-10 text-right">{currentEc.toFixed(0)}J</span>
                                        </div>

                                        {/* Barra Epe */}
                                        <div className="flex items-center gap-2">
                                            <span className="text-[9px] font-bold text-pink-400 w-6">Epe</span>
                                            <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                                <div className="h-full bg-pink-500 transition-all duration-75" style={{ width: `${(currentEpe / energiaTotal) * 100}%` }}></div>
                                            </div>
                                            <span className="text-[9px] font-mono text-pink-300 w-10 text-right">{currentEpe.toFixed(0)}J</span>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right border-b-4 border-b-teal-500 h-20">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Velocidad | Posición</p>
                                        <p className="text-xl font-mono font-black text-teal-400">{currentV.toFixed(2)} m/s</p>
                                        <p className="text-xs font-mono font-bold text-slate-400">{currentPos.toFixed(1)} m</p>
                                    </div>
                                </div>

                                {/* Cronómetro central */}
                                <div className="absolute top-36 left-1/2 -translate-x-1/2 z-30">
                                    <div className="bg-slate-900/90 p-2 px-4 rounded-full border border-slate-700 backdrop-blur-md flex items-center gap-2">
                                        <TimerIcon size={16} className={time > 0 && time <= tiempoEmpuje ? "text-amber-400" : time > tiempoEmpuje && time < tMaxSimulacion ? "text-pink-400" : "text-slate-400"} />
                                        <span className="font-mono font-black text-lg text-white">t = {Math.min(tMaxSimulacion, time).toFixed(2)} s</span>
                                    </div>
                                    <div className={`mt-2 text-center text-[10px] font-black uppercase px-2 py-1 rounded-full ${time > 0 && time <= tiempoEmpuje ? 'bg-amber-500 text-slate-900' : time > tiempoEmpuje && time < tMaxSimulacion ? 'bg-pink-500 text-slate-900' : 'bg-slate-800 text-slate-400'}`}>
                                        {currentPhase}
                                    </div>
                                </div>

                                {/* Escena Física */}
                                <div className="relative w-full h-64 flex items-end">
                                    {/* Suelo */}
                                    <div className="absolute bottom-0 w-full h-12 floor-pattern"></div>
                                    
                                    {/* Pared Derecha */}
                                    <div className="absolute right-0 bottom-12 w-8 h-32 bg-slate-600 border-l-4 border-slate-500 shadow-xl z-20"></div>

                                    <div className="absolute bottom-12 w-full flex items-center justify-start pl-10 h-32 pointer-events-none">
                                        
                                        {/* Marca de Impacto (Punto donde toca el muelle) */}
                                        <div className="absolute border-l-2 border-dashed border-blue-500/50 h-32 z-10" style={{ left: `${10 + dImpacto * pxPerMeter + 30}px`, bottom: 0 }}>
                                            <span className="text-[8px] text-blue-300 absolute -top-4 -left-8 font-black bg-slate-900/80 px-1 rounded">Muelle L₀</span>
                                        </div>

                                        {/* El Muelle SVG */}
                                        <div className="absolute z-10" style={{ left: `${10 + dImpacto * pxPerMeter + 30}px`, bottom: '20px' }}>
                                            <svg width={Math.max(10, muelleActualWidth)} height="30" className="overflow-visible">
                                                <path 
                                                    d={generateSpringPath(muelleActualWidth)} 
                                                    fill="none" stroke="#ec4899" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"
                                                    className="spring-path"
                                                />
                                            </svg>
                                        </div>

                                        {/* Coche Teledirigido */}
                                        <div 
                                            className="absolute w-[60px] h-12 bg-blue-600 border-2 border-blue-400 rounded-lg shadow-lg flex items-center justify-center z-30 transition-transform rounded-tr-3xl"
                                            style={{ bottom: '10px', transform: `translateX(${10 + visualPos}px)` }}
                                        >
                                            <span className="font-black text-blue-200 text-[10px]">{masa} kg</span>
                                            
                                            {/* Ruedas */}
                                            <div className="absolute -bottom-2 flex w-full justify-around px-2">
                                                <div className="w-4 h-4 bg-slate-900 rounded-full border border-slate-500"></div>
                                                <div className="w-4 h-4 bg-slate-900 rounded-full border border-slate-500"></div>
                                            </div>

                                            {/* Vectores */}
                                            {time > 0 && time <= tiempoEmpuje && (
                                                <div className="absolute bottom-full flex flex-col items-center pb-2">
                                                    <span className="text-[10px] font-black text-amber-400 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap mb-1">Motor P={potencia}W</span>
                                                </div>
                                            )}
                                            
                                            {currentV > 0.1 && (
                                                <div className="absolute left-full top-1/2 -translate-y-1/2 flex items-center pl-2" style={{ width: Math.max(30, currentV * 10) }}>
                                                    <div className="h-1 bg-emerald-400 w-full relative shadow-[0_0_8px_rgba(52,211,153,0.8)]">
                                                        <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon size={16} className="text-emerald-400" />}</div>
                                                    </div>
                                                    <span className="ml-1 text-[10px] font-bold text-emerald-300 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">v={currentV.toFixed(1)}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-teal-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Configurar Variables
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-amber-900/20 p-3 rounded-xl border border-amber-500/20">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-amber-400 font-bold uppercase"><ZapIcon size={12} className="inline mr-1"/> Potencia (P)</span></div>
                                                <input type="range" min="10" max="100" step="5" value={potencia} onChange={e => {setPotencia(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{potencia} W</span>
                                            </div>
                                            <div className="bg-amber-900/20 p-3 rounded-xl border border-amber-500/20">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-amber-400 font-bold uppercase"><TimerIcon size={12} className="inline mr-1"/> Tiempo Motor</span></div>
                                                <input type="range" min="1" max="20" step="1" value={tiempoEmpuje} onChange={e => {setTiempoEmpuje(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{tiempoEmpuje} s</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 pt-2 border-t border-slate-700">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-blue-400 font-bold uppercase"><CarIcon size={12} className="inline mr-1"/> Masa Coche</span></div>
                                                <input type="range" min="10" max="100" step="5" value={masa} onChange={e => {setMasa(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{masa} kg</span>
                                            </div>
                                            <div className="bg-pink-900/20 p-3 rounded-xl border border-pink-500/20 -mt-2">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-pink-400 font-bold uppercase">Muelle (k)</span></div>
                                                <input type="range" min="1000" max="8000" step="100" value={kMuelle} onChange={e => {setKMuelle(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-pink-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{kMuelle} N/m</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tMaxSimulacion}
                                            className={`flex-1 font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 ${time >= tMaxSimulacion ? 'bg-slate-600 text-slate-400' : 'bg-teal-600 hover:bg-teal-500 text-white'}`}
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} ARRANCAR MOTOR
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-teal-950/20 p-6 rounded-3xl border border-teal-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-teal-500/30 pb-2">
                                        <h4 className="font-bold text-teal-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Conservación" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-amber-500 font-mono text-amber-200">
                                            <strong>1. Trabajo del Motor (W):</strong><br/>
                                            Potencia es Trabajo entre Tiempo ($P = W/t$).<br/>
                                            W = P · t = {potencia} · {tiempoEmpuje} = <strong>{energiaTotal.toFixed(0)} J</strong>
                                        </div>
                                        
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200">
                                            <strong>2. Velocidad alcanzada (Cinética):</strong><br/>
                                            Al no haber rozamiento, el Trabajo se convierte íntegramente en Energía Cinética (Teorema de las fuerzas vivas).<br/>
                                            E_c = W = {energiaTotal.toFixed(0)} J<br/>
                                            E_c = ½ · m · v²  ⇒  v = √(2 · E_c / m)<br/>
                                            v = √(2 · {energiaTotal.toFixed(0)} / {masa}) = <strong>{vImpacto.toFixed(2)} m/s</strong>
                                        </div>

                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-pink-500 font-mono text-pink-200 shadow-[inset_0_0_15px_rgba(236,72,153,0.15)]">
                                            <strong>3. Compresión del muelle (x):</strong><br/>
                                            Al chocar, la Energía Cinética se transforma íntegramente en Energía Potencial Elástica (Conservación).<br/>
                                            E_pe = E_c = {energiaTotal.toFixed(0)} J<br/>
                                            E_pe = ½ · k · x²  ⇒  x = √(2 · E_pe / k)<br/>
                                            x = √(2 · {energiaTotal.toFixed(0)} / {kMuelle}) = <strong>{compresionMax.toFixed(2)} m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        </footer>
                    </div>
                );

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
