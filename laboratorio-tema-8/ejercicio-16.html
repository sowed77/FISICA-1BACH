<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Energías Mecánicas</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: 2px solid #ffffff;
        }
        .road-pattern {
            background-image: repeating-linear-gradient(90deg, #334155 0px, #334155 30px, transparent 30px, transparent 60px);
            background-size: 60px 2px;
            background-position: center;
        }
        .sky-gradient {
            background: linear-gradient(to bottom, #1e293b, #334155);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const ZapIcon = getIcon('Zap');
            const MountainIcon = getIcon('Mountain');
            const CarIcon = getIcon('Car');
            const CalculatorIcon = getIcon('Calculator');
            const InfoIcon = getIcon('Info');
            const ArrowRightIcon = getIcon('ArrowRight');
            const ArrowUpIcon = getIcon('ArrowUp');
            const RotateCcwIcon = getIcon('RotateCcw');
            const ImagePlusIcon = getIcon('ImagePlus');

            const App = () => {
                const g = 9.8;

                // Estados para Energía Cinética (Coche)
                const [mCar, setMCar] = useState(800);
                const [vCar, setVCar] = useState(35);
                
                // Estados para Energía Potencial (Cuerpo elevado)
                const [mObj, setMObj] = useState(24);
                const [hObj, setHObj] = useState(15);

                // Cálculos
                const ec = 0.5 * mCar * Math.pow(vCar, 2);
                const ep = mObj * g * hObj;

                // DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async (tipo) => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    const prompt = tipo === 'ec' 
                        ? "Diagrama de física: Un coche moviéndose rápido con un vector de velocidad v. Fórmulas de energía cinética al lado. Estilo minimalista azul."
                        : "Diagrama de física: Un bloque a una altura h sobre el suelo. Vector peso P hacia abajo. Cota de altura. Estilo minimalista verde.";
                    
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (e) {
                        console.error(e);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen text-slate-100 p-4 md:p-8">
                        <header className="max-w-6xl mx-auto mb-10 text-center">
                            <h1 className="text-4xl font-black text-white uppercase tracking-tighter mb-2">Energía Mecánica</h1>
                            <p className="text-slate-400">Cinética y Potencial Gravitatoria</p>
                        </header>

                        <div className="max-w-6xl mx-auto grid lg:grid-cols-2 gap-8">
                            
                            {/* BLOQUE ENERGÍA CINÉTICA */}
                            <section className="space-y-6">
                                <div className="bg-slate-800 rounded-3xl border border-blue-500/30 overflow-hidden shadow-2xl">
                                    <div className="p-6 border-b border-slate-700 bg-blue-900/20 flex justify-between items-center">
                                        <h2 className="text-xl font-bold flex items-center gap-2 text-blue-400">
                                            <ZapIcon size={24} /> Energía Cinética (Ec)
                                        </h2>
                                        <span className="text-[10px] font-black bg-blue-500 text-white px-2 py-1 rounded">MOVIMIENTO</span>
                                    </div>

                                    {/* Simulación Visual Coche */}
                                    <div className="h-48 bg-slate-900 relative flex items-end justify-center pb-10">
                                        <div className="absolute bottom-6 w-full h-1 bg-slate-700 road-pattern"></div>
                                        <div className="relative group transition-transform duration-500" style={{ transform: `scale(${1 + vCar/100})` }}>
                                            <div className="bg-blue-600 p-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.4)]">
                                                <CarIcon size={48} className="text-white" />
                                            </div>
                                            <div className="absolute left-full top-1/2 -translate-y-1/2 flex items-center pl-2" style={{ width: vCar * 3 }}>
                                                <div className="h-1 bg-blue-400 w-full relative">
                                                    <div className="absolute right-0 -top-1.5"><ArrowRightIcon size={16} className="text-blue-400" /></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-6 space-y-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Masa (m)</p>
                                                <input type="range" min="500" max="2000" step="50" value={mCar} onChange={e => setMCar(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                                <p className="mt-1 font-mono text-sm">{mCar} kg</p>
                                            </div>
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Velocidad (v)</p>
                                                <input type="range" min="0" max="100" step="1" value={vCar} onChange={e => setVCar(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                                <p className="mt-1 font-mono text-sm">{vCar} m/s</p>
                                            </div>
                                        </div>

                                        <div className="bg-blue-950/30 p-4 rounded-2xl border border-blue-500/20">
                                            <h3 className="text-sm font-black text-blue-400 mb-3 flex items-center gap-2"><CalculatorIcon size={16} /> Resolución</h3>
                                            <div className="font-mono text-xs space-y-2 text-blue-100">
                                                <p>Ec = ½ · m · v²</p>
                                                <p>Ec = 0.5 · {mCar} · {vCar}²</p>
                                                <p>Ec = 0.5 · {mCar} · {Math.pow(vCar, 2)}</p>
                                                <p className="text-lg font-black text-blue-400 mt-2">Ec = {ec.toLocaleString('es-ES')} J</p>
                                                <p className="text-slate-500 italic">({(ec/1000).toFixed(1)} kJ)</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* BLOQUE ENERGÍA POTENCIAL */}
                            <section className="space-y-6">
                                <div className="bg-slate-800 rounded-3xl border border-emerald-500/30 overflow-hidden shadow-2xl">
                                    <div className="p-6 border-b border-slate-700 bg-emerald-900/20 flex justify-between items-center">
                                        <h2 className="text-xl font-bold flex items-center gap-2 text-emerald-400">
                                            <MountainIcon size={24} /> Energía Potencial (Ep)
                                        </h2>
                                        <span className="text-[10px] font-black bg-emerald-500 text-white px-2 py-1 rounded">POSICIÓN</span>
                                    </div>

                                    {/* Simulación Visual Altura */}
                                    <div className="h-48 sky-gradient relative flex items-center justify-center">
                                        <div className="absolute bottom-0 w-full h-4 bg-emerald-900"></div>
                                        <div className="absolute bottom-4 w-12 bg-slate-100 rounded-lg border-2 border-slate-300 shadow-xl flex items-center justify-center transition-all duration-300" style={{ height: '30px', bottom: `${hObj * 6 + 16}px` }}>
                                            <span className="text-[8px] font-black text-slate-800">{mObj}kg</span>
                                        </div>
                                        <div className="absolute left-[calc(50%+40px)] flex flex-col justify-end border-l border-dashed border-white/30" style={{ height: `${hObj * 6}px`, bottom: '16px' }}>
                                            <div className="h-full w-4 border-y border-white/50 flex items-center justify-center">
                                                <span className="text-[10px] font-mono text-white/50 -rotate-90">h={hObj}m</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-6 space-y-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Masa (m)</p>
                                                <input type="range" min="1" max="100" step="1" value={mObj} onChange={e => setMObj(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
                                                <p className="mt-1 font-mono text-sm">{mObj} kg</p>
                                            </div>
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Altura (h)</p>
                                                <input type="range" min="0" max="30" step="1" value={hObj} onChange={e => setHObj(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
                                                <p className="mt-1 font-mono text-sm">{hObj} m</p>
                                            </div>
                                        </div>

                                        <div className="bg-emerald-950/30 p-4 rounded-2xl border border-emerald-500/20">
                                            <h3 className="text-sm font-black text-emerald-400 mb-3 flex items-center gap-2"><CalculatorIcon size={16} /> Resolución</h3>
                                            <div className="font-mono text-xs space-y-2 text-emerald-100">
                                                <p>Ep = m · g · h</p>
                                                <p>Ep = {mObj} · 9.8 · {hObj}</p>
                                                <p className="text-lg font-black text-emerald-400 mt-2">Ep = {ep.toLocaleString('es-ES')} J</p>
                                                <p className="text-slate-500 italic">({(ep/1000).toFixed(2)} kJ)</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>

                        {/* Botones de acción extra */}
                        <div className="max-w-6xl mx-auto mt-8 flex justify-center gap-4">
                            <button onClick={() => generarDiagrama('ec')} className="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                                <ImagePlusIcon size={14} /> DCL Cinética
                            </button>
                            <button onClick={() => generarDiagrama('ep')} className="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                                <ImagePlusIcon size={14} /> DCL Potencial
                            </button>
                        </div>

                        {imgUrl && (
                            <div className="max-w-md mx-auto mt-6 bg-white p-2 rounded-2xl shadow-2xl">
                                <img src={imgUrl} className="w-full rounded-xl" alt="Diagrama técnico" />
                                <p className="text-[10px] text-slate-400 text-center mt-2 italic font-bold">Diagrama técnico generado por IA</p>
                            </div>
                        )}

                        <footer className="max-w-6xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Energía | Bachillerato
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
