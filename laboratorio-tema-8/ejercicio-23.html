<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Conservación de la Energía Mecánica</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #a855f7; /* Purple 500 */
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .sky-gradient {
            background: linear-gradient(to bottom, #1e293b, #334155);
        }
        .wood-texture {
            background-image: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const SettingsIcon = getIcon('Settings');
            const ZapIcon = getIcon('Zap');
            const BatteryIcon = getIcon('BatteryCharging');
            const ArrowRightIcon = getIcon('ArrowRight');
            const ImagePlusIcon = getIcon('ImagePlus');
            const AlertTriangleIcon = getIcon('AlertTriangle');
            const TrainIcon = getIcon('Train');

            const App = () => {
                // Parámetros fijos
                const g = 9.8; // m/s^2

                // Estados interactivos (Inicializados con el enunciado)
                const [masa, setMasa] = useState(1000); // kg
                const [h1, setH1] = useState(40.0); // m
                const [v1, setV1] = useState(5.0); // m/s
                const [h2, setH2] = useState(20.0); // m

                // Animación: tParam va de 0 a 1 (recorrido de la pista)
                const [tParam, setTParam] = useState(0); 
                const [isMoving, setIsMoving] = useState(false);

                // --- CÁLCULOS FÍSICOS TEÓRICOS ---
                const ec1 = 0.5 * masa * Math.pow(v1, 2);
                const ep1 = masa * g * h1;
                const em1 = ec1 + ep1;

                const ep2_req = masa * g * h2;
                
                // Si la energía mecánica total es menor que la energía potencial requerida en h2, no llega
                const canReach = em1 >= ep2_req;

                const ec2 = canReach ? em1 - ep2_req : 0;
                const v2 = canReach ? Math.sqrt((2 * ec2) / masa) : 0;

                // --- GEOMETRÍA DE LA PISTA ---
                // Generamos una altura en función de tParam (0 a 1)
                // Usamos cosenos para que baje a 0 y luego suba a h2 suavemente.
                const getH = (t) => {
                    if (t <= 0.5) {
                        const u = t * 2; // 0 a 1
                        return h1 * (1 + Math.cos(u * Math.PI)) / 2;
                    } else {
                        const u = (t - 0.5) * 2; // 0 a 1
                        return h2 * (1 - Math.cos(u * Math.PI)) / 2;
                    }
                };

                // --- CÁLCULOS INSTANTÁNEOS (TIEMPO REAL) ---
                const currentH = getH(tParam);
                const currentEp = masa * g * currentH;
                const currentEc = em1 - currentEp;
                const currentV = currentEc > 0 ? Math.sqrt((2 * currentEc) / masa) : 0;

                // Loop de animación
                useEffect(() => {
                    let interval;
                    if (isMoving && tParam < 1) {
                        interval = setInterval(() => {
                            setTParam(prev => {
                                const h_actual = getH(prev);
                                const ec_actual = em1 - (masa * g * h_actual);
                                
                                // Si se queda sin energía cinética antes de llegar al final
                                if (ec_actual <= 0 && prev > 0 && prev < 1) {
                                    setIsMoving(false);
                                    return prev;
                                }

                                const v_actual = Math.sqrt(Math.max(0, (2 * ec_actual) / masa));
                                
                                // Velocidad de avance paramétrico. 
                                // Ajuste visual: a mayor velocidad, avanza más rápido por el parámetro t.
                                const step = 0.001 + (v_actual * 0.00015);
                                
                                const nextT = prev + step;
                                if (nextT >= 1) {
                                    setIsMoving(false);
                                    return 1;
                                }
                                return nextT;
                            });
                        }, 20); // 50 FPS
                    }
                    return () => clearInterval(interval);
                }, [isMoving, tParam, em1, masa]);

                const handlePlay = () => {
                    if (tParam < 1) setIsMoving(true);
                };

                const reset = () => {
                    setTParam(0);
                    setIsMoving(false);
                };

                // Forzar reset si se cambian los parámetros
                useEffect(() => {
                    reset();
                }, [masa, h1, v1, h2]);

                // --- DIBUJADO SVG ---
                const svgWidth = 600; // Píxeles visuales base
                const svgHeight = 250;
                const maxVisualH = Math.max(h1, h2, 50); // Escala máxima en Y (metros)
                
                const mapX = (t) => t * svgWidth;
                const mapY = (h) => svgHeight - ((h / maxVisualH) * (svgHeight - 40)); // 40px padding bottom

                const generateTrackPath = () => {
                    let d = `M 0 ${svgHeight} L 0 ${mapY(h1)}`;
                    for (let i = 0; i <= 100; i++) {
                        const t = i / 100;
                        d += ` L ${mapX(t)} ${mapY(getH(t))}`;
                    }
                    d += ` L ${svgWidth} ${svgHeight} Z`;
                    return d;
                };

                // Calcular inclinación visual del vagón
                const getVisualAngle = (t) => {
                    if (t >= 1) return 0;
                    const delta = 0.01;
                    const t2 = Math.min(1, t + delta);
                    const y1 = mapY(getH(t));
                    const y2 = mapY(getH(t2));
                    const x1 = mapX(t);
                    const x2 = mapX(t2);
                    return Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);
                };

                const carAngle = getVisualAngle(tParam);

                // DCL Generador con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de la conservación de la energía mecánica. Un vagón de montaña rusa en un pico. Barras de energía mostrando la suma de Energía Cinética y Potencial. Ecuación E_m1 = E_m2. Fondo blanco, minimalista, educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-purple-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Trabajo y Energía</span>
                                <h1 className="text-3xl font-black text-purple-400 uppercase tracking-tight tracking-widest">Montaña Rusa</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> En la cima de una montaña rusa, un vagón de 1000 kg está a 40 m de altura y lleva 5,0 m/s. Sin rozamientos, ¿cuál será su velocidad en el segundo pico, a 20 m de altura?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col justify-end pt-12 sky-gradient">
                                
                                {/* Marcadores Flotantes (HUD Energías) */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">E. Mecánica (Total)</p>
                                        <p className="text-xl font-mono font-black text-purple-400">{(em1 / 1000).toFixed(1)} kJ</p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right border-b-4 border-b-emerald-500">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Velocidad Actual (v)</p>
                                        <p className="text-2xl font-mono font-black text-emerald-400">{currentV.toFixed(2)} <span className="text-sm">m/s</span></p>
                                    </div>
                                </div>

                                {/* Pilares de Energía Dinámicos */}
                                <div className="absolute top-24 left-6 flex gap-3 z-30 pointer-events-none">
                                    <div className="flex flex-col items-center">
                                        <span className="text-[9px] font-black text-emerald-400 mb-1">Ec</span>
                                        <div className="h-32 w-4 bg-slate-900 border border-slate-700 rounded-full overflow-hidden flex flex-col justify-end">
                                            <div className="w-full bg-emerald-500 transition-all duration-100" style={{ height: `${(currentEc / em1) * 100}%` }}></div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-center">
                                        <span className="text-[9px] font-black text-orange-400 mb-1">Ep</span>
                                        <div className="h-32 w-4 bg-slate-900 border border-slate-700 rounded-full overflow-hidden flex flex-col justify-end">
                                            <div className="w-full bg-orange-500 transition-all duration-100" style={{ height: `${(currentEp / em1) * 100}%` }}></div>
                                        </div>
                                    </div>
                                </div>

                                {!canReach && (
                                    <div className="absolute top-24 left-1/2 -translate-x-1/2 z-40 bg-red-600/90 text-white px-6 py-3 rounded-xl border border-red-400 shadow-xl flex items-center gap-3 text-xs font-bold uppercase animate-pulse">
                                        <AlertTriangleIcon size={20} /> Sin energía para llegar al final
                                    </div>
                                )}

                                {/* Escena (Pista y Vagón) */}
                                <div className="relative w-full h-[300px] flex items-end">
                                    <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} preserveAspectRatio="none" className="absolute bottom-0 w-full h-full">
                                        {/* Relleno de la estructura */}
                                        <path 
                                            d={generateTrackPath()} 
                                            fill="#1e293b" 
                                            className="wood-texture"
                                        />
                                        {/* Línea del raíl */}
                                        <path 
                                            d={generateTrackPath().replace('L 0 250', '').replace(`L ${svgWidth} ${svgHeight} Z`, '')} 
                                            fill="none" 
                                            stroke="#cbd5e1" 
                                            strokeWidth="4" 
                                        />

                                        {/* Cota h1 */}
                                        <line x1="20" y1={mapY(h1)} x2="20" y2={svgHeight} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" />
                                        <text x="25" y={mapY(h1/2)} fill="#94a3b8" fontSize="14" fontWeight="bold">h₁={h1}m</text>

                                        {/* Cota h2 */}
                                        <line x1={svgWidth - 40} y1={mapY(h2)} x2={svgWidth - 40} y2={svgHeight} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" />
                                        <text x={svgWidth - 35} y={mapY(h2/2)} fill="#94a3b8" fontSize="14" fontWeight="bold">h₂={h2}m</text>
                                    </svg>

                                    {/* El Vagón */}
                                    <div 
                                        className="absolute z-20 flex flex-col items-center justify-center transition-transform"
                                        style={{ 
                                            left: `${tParam * 100}%`, 
                                            bottom: `${((currentH / maxVisualH) * (100 - (40/svgHeight)*100))}%`, // Ajustado a la escala SVG
                                            transform: `translate(-50%, -10px) rotate(${carAngle}deg)`
                                        }}
                                    >
                                        <div className="w-14 h-8 bg-purple-600 border-2 border-purple-400 rounded-t-lg rounded-b-sm shadow-xl flex items-center justify-center">
                                            {TrainIcon && <TrainIcon size={16} className="text-white opacity-80" />}
                                        </div>
                                        <div className="flex gap-4 -mt-1 z-30">
                                            <div className="w-3 h-3 bg-slate-900 rounded-full border border-slate-500"></div>
                                            <div className="w-3 h-3 bg-slate-900 rounded-full border border-slate-500"></div>
                                        </div>

                                        {/* Vector Velocidad (Sólo si se mueve) */}
                                        {currentV > 0 && (
                                            <div className="absolute top-1/2 left-full pl-1 flex items-center pointer-events-none origin-left" style={{ width: currentV * 4 }}>
                                                <div className="h-1 bg-emerald-400 w-full relative">
                                                    <div className="absolute right-0 -top-1">{ArrowRightIcon && <ArrowRightIcon size={14} className="text-emerald-400" />}</div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-purple-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Diseñar Recorrido
                                    </h3>
                                    
                                    <div className="space-y-4 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-300 font-bold uppercase">Masa (m)</span></div>
                                                <input type="range" min="100" max="2500" step="100" value={masa} onChange={e => {setMasa(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                                <span className="font-mono text-white text-xs">{masa} kg</span>
                                            </div>
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-emerald-400 font-bold uppercase">Vel. Inicial (v₁)</span></div>
                                                <input type="range" min="0" max="30" step="1" value={v1} onChange={e => {setV1(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{v1.toFixed(1)} m/s</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 pt-2 border-t border-slate-700">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-orange-400 font-bold uppercase">Altura Pico 1 (h₁)</span></div>
                                                <input type="range" min="10" max="50" step="1" value={h1} onChange={e => {setH1(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{h1} m</span>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-orange-400 font-bold uppercase">Altura Pico 2 (h₂)</span></div>
                                                <input type="range" min="0" max="50" step="1" value={h2} onChange={e => {setH2(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{h2} m</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || tParam >= 1}
                                            className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} SIMULAR TRAYECTO
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-purple-950/20 p-6 rounded-3xl border border-purple-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-purple-500/30 pb-2">
                                        <h4 className="font-bold text-purple-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Energía" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700 text-center font-bold text-white mb-2 font-mono">
                                            Principio de Conservación: E_m1 = E_m2
                                        </div>

                                        <p><strong>1. Energía Mecánica en el Punto 1 (E_m1):</strong><br/>
                                        Sumamos su energía por movimiento (Cinética) y por altura (Potencial).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200 overflow-x-auto">
                                            Ec₁ = ½·m·v₁² = 0.5 · {masa} · {v1.toFixed(1)}² = {ec1.toLocaleString()} J<br/>
                                            Ep₁ = m·g·h₁ = {masa} · 9.8 · {h1} = {ep1.toLocaleString()} J<br/>
                                            Em₁ = Ec₁ + Ep₁ = <strong>{em1.toLocaleString()} J</strong>
                                        </div>

                                        <p className="mt-3"><strong>2. Energía Mecánica en el Punto 2 (E_m2):</strong><br/>
                                        En el segundo pico, sabemos su altura, por lo que podemos calcular su Energía Potencial. El resto de la energía total, obligatoriamente, debe ser su nueva Energía Cinética.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200 overflow-x-auto">
                                            Ep₂ = m·g·h₂ = {masa} · 9.8 · {h2} = {ep2_req.toLocaleString()} J<br/>
                                            Ec₂ = Em₁ - Ep₂ = {em1.toLocaleString()} - {ep2_req.toLocaleString()} = <strong>{ec2.toLocaleString()} J</strong>
                                        </div>
                                        
                                        {!canReach && (
                                            <p className="text-red-400 font-bold bg-red-900/30 p-2 rounded border border-red-500/50 mt-1">
                                                Como la Energía Cinética da un valor negativo ({ec2.toLocaleString()} J), significa que es físicamente imposible que llegue al segundo pico.
                                            </p>
                                        )}

                                        {canReach && (
                                            <>
                                                <p className="mt-3"><strong>3. Velocidad Final (v₂):</strong><br/>
                                                Despejamos la velocidad de la fórmula de la Energía Cinética.</p>
                                                <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-purple-500 font-mono text-purple-200 shadow-inner">
                                                    Ec₂ = ½·m·v₂²<br/>
                                                    {ec2.toLocaleString()} = 0.5 · {masa} · v₂²<br/>
                                                    v₂ = √({(ec2*2).toLocaleString()} / {masa}) = <strong>{v2.toFixed(2)} m/s</strong>
                                                </div>
                                                <p className="text-[10px] text-slate-400 italic text-center mt-2">
                                                    ¡Magia! Si cambias la masa a cualquier valor y le das a "Simular", verás que la velocidad final <strong>{v2.toFixed(2)} m/s</strong> nunca cambia. La masa se cancela en la ecuación completa.
                                                </p>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Teorema de Conservación de la Energía Mecánica
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
