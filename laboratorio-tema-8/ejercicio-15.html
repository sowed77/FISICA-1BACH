<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Energía Potencial Elástica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range] { -webkit-appearance: none; background: #334155; height: 8px; border-radius: 5px; outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
            background: #ec4899; cursor: pointer; border: 3px solid #ffffff;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componentes de iconos manuales para evitar errores de Lucide
        const ZapIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>;
        const RotateIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>;
        const CalcIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg>;

        const App = () => {
            const [k, setK] = useState(625);
            const [xCm, setXCm] = useState(45);

            const xMetros = xCm / 100;
            const energiaJ = 0.5 * k * Math.pow(xMetros, 2);

            // Parámetros visuales
            const l0 = 260; // Longitud en reposo
            const pxPerCm = 2.5; 
            const currentLength = l0 - (xCm * pxPerCm);

            const generateSpringPath = (width) => {
                const coils = 16;
                const h = 25;
                let path = `M 0 0 L 20 0 `;
                const coilWidth = (width - 40) / coils;
                for (let i = 0; i < coils; i++) {
                    const x = 20 + coilWidth * (i + 0.5);
                    const y = i % 2 === 0 ? -h : h;
                    path += `L ${x} ${y} `;
                }
                return path + ` L ${width} 0`;
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                        <div className="flex items-center gap-3 mb-2">
                            <span className="bg-pink-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Física 1º Bach</span>
                            <h1 className="text-3xl font-black text-pink-400 uppercase tracking-tight">Energía Elástica</h1>
                        </div>
                        <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4 text-slate-300">
                            <strong>Problema:</strong> Calcula la energía almacenada en un muelle con 
                            <span className="text-pink-400"> k = {k} N/m</span> al comprimirlo 
                            <span className="text-pink-400"> {xCm} cm</span>.
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                        {/* Visualización del muelle */}
                        <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[400px] relative flex flex-col justify-end pb-16 shadow-2xl overflow-hidden">
                            
                            {/* HUD Superior */}
                            <div className="absolute top-6 inset-x-6 flex justify-between">
                                <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-700">
                                    <p className="text-[10px] text-slate-500 uppercase font-black">Deformación (x)</p>
                                    <p className="text-2xl font-mono text-white">{xCm} <small className="text-xs text-slate-500">cm</small></p>
                                </div>
                                <div className="bg-slate-900/90 p-4 rounded-xl border-b-4 border-pink-500 shadow-lg">
                                    <p className="text-[10px] text-pink-500 uppercase font-black flex items-center gap-2">
                                        <ZapIcon /> Energía (Epe)
                                    </p>
                                    <p className="text-3xl font-mono text-white">{energiaJ.toFixed(2)} <small className="text-xs text-slate-500">J</small></p>
                                </div>
                            </div>

                            {/* Escena Física */}
                            <div className="relative w-full h-32 flex items-center px-10">
                                <div className="w-4 h-32 bg-slate-600 rounded-l-md border-r-4 border-slate-500"></div>
                                <svg width={currentLength} height="60" className="overflow-visible">
                                    <path d={generateSpringPath(currentLength)} fill="none" stroke="#94a3b8" strokeWidth="4" />
                                </svg>
                                <div className="w-16 h-20 bg-blue-600 border-4 border-blue-400 rounded-lg shadow-xl flex items-center justify-center relative">
                                    <div className="absolute -right-12 top-1/2 -translate-y-1/2 text-white/30">
                                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
                                    </div>
                                </div>
                            </div>
                            <div className="mx-10 border-t-2 border-slate-700 mt-2 h-4 relative">
                                <span className="absolute right-0 text-[10px] text-slate-500 font-mono">X = 0</span>
                            </div>
                        </div>

                        {/* Controles y Cálculos */}
                        <div className="space-y-6">
                            <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-xl">
                                <h3 className="text-xl font-bold mb-6 text-pink-400 flex items-center gap-2 uppercase tracking-tighter">
                                    <RotateIcon /> Ajustes de Laboratorio
                                </h3>
                                <div className="space-y-8">
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="text-xs font-black text-slate-400 uppercase">Constante k ({k} N/m)</label>
                                        </div>
                                        <input type="range" min="100" max="1500" step="25" value={k} onChange={e => setK(parseInt(e.target.value))} className="w-full" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="text-xs font-black text-slate-400 uppercase">Compresión x ({xCm} cm)</label>
                                        </div>
                                        <input type="range" min="5" max="80" step="1" value={xCm} onChange={e => setXCm(parseInt(e.target.value))} className="w-full" />
                                    </div>
                                </div>
                            </div>

                            <div className="bg-pink-950/20 p-8 rounded-3xl border border-pink-500/20">
                                <h4 className="font-bold text-pink-300 flex items-center gap-2 mb-4 border-b border-pink-500/20 pb-2">
                                    <CalcIcon /> Resolución Paso a Paso
                                </h4>
                                <div className="space-y-4 font-mono text-xs text-pink-100/80">
                                    <p>1. Conversión: x = {xCm} / 100 = <b className="text-white">{xMetros} m</b></p>
                                    <p>2. Cuadrado: x² = ({xMetros})² = <b className="text-white">{(xMetros**2).toFixed(4)} m²</b></p>
                                    <div className="bg-slate-900/80 p-4 rounded-xl border border-pink-500/30 text-sm">
                                        <p className="text-pink-400 mb-1">Epe = ½ · k · x²</p>
                                        <p>Epe = 0.5 · {k} · {(xMetros**2).toFixed(4)}</p>
                                        <p className="text-lg text-white mt-2">Epe = {energiaJ.toFixed(3)} J</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
