<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Balística y Rampa</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ef4444; /* Red 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .ramp-pattern {
            background-color: #334155;
            background-image: repeating-linear-gradient(45deg, #1e293b 0, #1e293b 4px, transparent 4px, transparent 12px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const InfoIcon = getIcon('Info');
            const CalculatorIcon = getIcon('Calculator');
            const TargetIcon = getIcon('Target');
            const ArrowRightIcon = getIcon('ArrowRight');
            const ArrowLeftIcon = getIcon('ArrowLeft');
            const ArrowDownIcon = getIcon('ArrowDown');
            const ImagePlusIcon = getIcon('ImagePlus');
            const ShieldAlertIcon = getIcon('ShieldAlert');

            const App = () => {
                // Parámetros fijos
                const g = 9.8; // m/s^2

                // Estados interactivos (Inicializados con el enunciado)
                const [masaBloque, setMasaBloque] = useState(2.0); // kg
                const [masaProyectilGramos, setMasaProyectilGramos] = useState(100); // g
                const [vProyectil, setVProyectil] = useState(100); // m/s
                const [angulo, setAngulo] = useState(30); // grados
                const [mu, setMu] = useState(0.10); // coeficiente de rozamiento

                // CÁLCULOS FÍSICOS
                // FASE 1: Colisión Inelástica
                const masaProyectilKg = masaProyectilGramos / 1000;
                const masaTotal = masaBloque + masaProyectilKg;
                
                // Conservación del momento: m_p * v_p = M_tot * v_0
                const v0 = (masaProyectilKg * vProyectil) / masaTotal;

                // FASE 2: Ascenso por el plano inclinado
                const anguloRad = angulo * (Math.PI / 180);
                const senA = Math.sin(anguloRad);
                const cosA = Math.cos(anguloRad);

                // Fuerzas (Componentes)
                const pesoTotal = masaTotal * g;
                const px = pesoTotal * senA; // Hacia abajo del plano
                const py = pesoTotal * cosA;
                const normal = py;
                const fr = mu * normal; // Hacia abajo del plano

                // Aceleración de frenado
                // F_neta = -Px - Fr = M * a  =>  a = -(Px + Fr) / M
                const fNeta = px + fr; // Magnitud de la fuerza que se opone
                const aMag = fNeta / masaTotal; // Magnitud de la deceleración
                
                // Distancia y tiempo de frenado
                // vf^2 = v0^2 - 2*a*d => 0 = v0^2 - 2*a*d => d = v0^2 / (2*a)
                const dMax = (v0 * v0) / (2 * aMag);
                const tStop = v0 / aMag;

                // Animación
                const [phase, setPhase] = useState('ready'); // ready, shooting, sliding, done
                const [time, setTime] = useState(0);

                // Variables cinemáticas visuales
                let posProyectilX = 0; // Antes del impacto
                let posBloqueD = 0; // Distancia a lo largo de la rampa
                let currentV = 0;

                // Escala visual
                const dMaxLimitado = Math.max(1, dMax);
                const pxPerMeter = 280 / dMaxLimitado; // Ajustar a la pantalla

                // Tiempos de animación
                const tShoot = 0.5; // El proyectil tarda 0.5s visuales en llegar

                if (phase === 'ready') {
                    posProyectilX = -200;
                    posBloqueD = 0;
                } else if (phase === 'shooting') {
                    // El proyectil se mueve hacia el bloque
                    const progress = time / tShoot;
                    posProyectilX = -200 + (200 * progress);
                    posBloqueD = 0;
                } else if (phase === 'sliding') {
                    posProyectilX = 0; // Ya está incrustado
                    const slideTime = time - tShoot;
                    posBloqueD = (v0 * slideTime) - (0.5 * aMag * Math.pow(slideTime, 2));
                    currentV = Math.max(0, v0 - aMag * slideTime);
                } else if (phase === 'done') {
                    posProyectilX = 0;
                    posBloqueD = dMax;
                    currentV = 0;
                }

                // Evitar bugs visuales
                posBloqueD = Math.max(0, Math.min(dMax, posBloqueD));

                useEffect(() => {
                    let interval;
                    if (phase === 'shooting' || phase === 'sliding') {
                        interval = setInterval(() => {
                            setTime(prev => {
                                // dt variable: rápido el disparo, normalizado el ascenso
                                let dt = 0.02;
                                if (phase === 'sliding') {
                                    // Aceleramos la subida visualmente si tarda mucho, o la frenamos si es muy corta
                                    dt = 0.05 * (tStop / 2); // Que tarde unos 2 segundos visuales
                                }
                                
                                const nextTime = prev + dt;
                                
                                if (phase === 'shooting' && nextTime >= tShoot) {
                                    setPhase('sliding');
                                    return tShoot; // Justo en el impacto
                                }
                                
                                if (phase === 'sliding' && nextTime >= (tShoot + tStop)) {
                                    setPhase('done');
                                    return tShoot + tStop;
                                }
                                
                                return nextTime;
                            });
                        }, 20); // 50 fps
                    }
                    return () => clearInterval(interval);
                }, [phase, tStop]);

                const handlePlay = () => {
                    if (phase === 'ready' || phase === 'done') {
                        setTime(0);
                        setPhase('shooting');
                    }
                };

                const reset = () => {
                    setTime(0);
                    setPhase('ready');
                };

                // Si se cambian las variables, reiniciamos la animación
                useEffect(() => {
                    reset();
                }, [masaBloque, masaProyectilGramos, vProyectil, angulo, mu]);

                // Generador de DCL IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física combinando choque y plano inclinado. A la izquierda: un choque inelástico entre una bala (velocidad p) y un bloque. A la derecha: el bloque subiendo una rampa con un vector velocidad inicial v0 hacia arriba de la rampa, y vectores Fr (fricción) y Px (peso) apuntando hacia abajo frenando el bloque. Estilo educativo, minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error de red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Colisiones y Dinámica</span>
                                <h1 className="text-3xl font-black text-red-400 uppercase tracking-tight tracking-widest">Impacto y Ascenso</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Sobre un bloque de madera de 2,0 kg al comienzo de un plano inclinado 30° se dispara un proyectil de 100 g a 100 m/s, que se incrusta en él. Si el coeficiente de rozamiento entre el bloque y el plano es 0,10, calcula la distancia que recorre el bloque sobre el plano.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* HUD de Estados */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black mb-1">Velocidad Conjunta (v₀)</p>
                                        <p className="text-xl font-mono font-black text-blue-400">{v0.toFixed(2)} m/s</p>
                                        {phase === 'sliding' && <p className="text-[10px] font-mono text-emerald-400 mt-1 animate-pulse">v_actual: {currentV.toFixed(2)}</p>}
                                    </div>
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 ${phase === 'done' ? 'border-b-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)]' : 'border-b-slate-700'}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black mb-1">Distancia Recorrida (d)</p>
                                        <p className={`text-3xl font-mono font-black ${phase === 'done' ? 'text-emerald-400' : 'text-slate-300'}`}>
                                            {posBloqueD.toFixed(2)} <span className="text-sm">m</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Escena Combinada */}
                                <div className="relative w-full h-80 flex items-center justify-center">
                                    
                                    <div className="absolute bottom-10 left-32 w-[400px] h-full pointer-events-none">
                                        
                                        {/* Suelo horizontal previo a la rampa */}
                                        <div className="absolute bottom-0 left-[-200px] w-[200px] border-b-4 border-slate-500"></div>

                                        {/* Rampa Rotada (Origen bottom-left para que suba hacia la derecha) */}
                                        <div 
                                            className="absolute bottom-0 left-0 w-full h-full origin-bottom-left transition-transform duration-300 z-20"
                                            style={{ transform: `rotate(${-angulo}deg)` }}
                                        >
                                            {/* La Rampa */}
                                            <div className="absolute bottom-0 left-0 w-full h-4 ramp-pattern shadow-xl rounded-r-full"></div>

                                            {/* Marca de Meta (Distancia Máxima) */}
                                            <div className="absolute bottom-4 border-l-2 border-dashed border-emerald-500 h-24 z-10" style={{ left: `${40 + (dMax * pxPerMeter)}px` }}>
                                                <span className="text-[10px] text-emerald-300 absolute -top-4 -left-12 font-black bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">Meta: {dMax.toFixed(2)}m</span>
                                            </div>

                                            {/* El Bloque */}
                                            <div 
                                                className="absolute bottom-4 w-20 h-16 bg-blue-600 border-4 border-blue-400 rounded-lg flex items-center justify-center shadow-lg transition-transform z-30"
                                                style={{ transform: `translateX(${posBloqueD * pxPerMeter}px)` }}
                                            >
                                                <span className="font-black text-blue-100 text-xs">M</span>

                                                {/* Proyectil (Antes del impacto o incrustado) */}
                                                <div 
                                                    className="absolute w-6 h-3 bg-slate-200 rounded-r-full shadow-[0_0_8px_white] transition-transform"
                                                    style={{ 
                                                        left: phase === 'ready' || phase === 'shooting' ? `${posProyectilX}px` : '4px',
                                                        opacity: phase === 'ready' ? 0 : 1
                                                    }}
                                                >
                                                    {/* Estela del proyectil */}
                                                    {(phase === 'shooting') && (
                                                        <div className="absolute right-full w-24 h-full bg-gradient-to-r from-transparent to-red-400 opacity-50 mr-1"></div>
                                                    )}
                                                </div>

                                                {/* Vectores (Sólo visibles cuando desliza) */}
                                                {(phase === 'sliding' || phase === 'done') && (
                                                    <>
                                                        {/* Vector Px (Rojo, frena hacia atrás) */}
                                                        <div className="absolute top-1/4 right-full flex items-center pr-1" style={{ width: Math.max(30, px * 2) }}>
                                                            <span className="mr-1 text-[8px] font-black text-red-300 bg-slate-900/80 px-1 rounded">P_x</span>
                                                            <div className="h-1 bg-red-400 w-full relative">
                                                                <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon size={14} className="text-red-400" />}</div>
                                                            </div>
                                                        </div>

                                                        {/* Vector Fr (Naranja, frena hacia atrás) */}
                                                        <div className="absolute bottom-1/4 right-full flex items-center pr-1" style={{ width: Math.max(20, fr * 2) }}>
                                                            <span className="mr-1 text-[8px] font-black text-orange-300 bg-slate-900/80 px-1 rounded">F_r</span>
                                                            <div className="h-1 bg-orange-400 w-full relative">
                                                                <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon size={14} className="text-orange-400" />}</div>
                                                            </div>
                                                        </div>
                                                    </>
                                                )}

                                            </div>
                                        </div>

                                        {/* Arco del Ángulo */}
                                        <div className="absolute bottom-0 left-0 w-full border-b-2 border-slate-600 border-dashed"></div>
                                        {angulo > 0 && (
                                            <div className="absolute bottom-0 left-0 w-24 h-24 border-r-2 border-t-2 border-red-500/50 rounded-tr-full flex items-end justify-end pb-2 pr-2">
                                                <span className="text-red-300 font-mono text-sm font-bold">{angulo}º</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-red-400">
                                        <TargetIcon size={20} /> Fase 1: El Impacto
                                    </h3>
                                    
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                            <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-300 font-bold uppercase">Masa Proyectil</span></div>
                                            <input type="range" min="10" max="200" step="10" value={masaProyectilGramos} onChange={e => {setMasaProyectilGramos(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500 mb-1" />
                                            <span className="font-mono text-white text-xs">{masaProyectilGramos} g</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                            <div className="flex justify-between text-[10px] mb-1"><span className="text-red-400 font-bold uppercase">Velocidad Proyectil</span></div>
                                            <input type="range" min="50" max="500" step="10" value={vProyectil} onChange={e => {setVProyectil(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500 mb-1" />
                                            <span className="font-mono text-white text-xs">{vProyectil} m/s</span>
                                        </div>
                                    </div>

                                    <h3 className="text-xl font-bold mb-4 mt-6 flex items-center gap-2 text-blue-400 border-t border-slate-700 pt-6">
                                        <ArrowRightIcon size={20} className="-rotate-45" /> Fase 2: La Rampa
                                    </h3>

                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                            <div className="flex justify-between text-[10px] mb-1"><span className="text-blue-300 font-bold uppercase">Masa Bloque</span></div>
                                            <input type="range" min="0.5" max="10" step="0.5" value={masaBloque} onChange={e => {setMasaBloque(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 mb-1" />
                                            <span className="font-mono text-white text-xs">{masaBloque.toFixed(1)} kg</span>
                                        </div>
                                        <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                            <div className="flex justify-between text-[10px] mb-1"><span className="text-orange-400 font-bold uppercase">Fricción (μ)</span></div>
                                            <input type="range" min="0" max="0.5" step="0.05" value={mu} onChange={e => {setMu(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500 mb-1" />
                                            <span className="font-mono text-white text-xs">{mu.toFixed(2)}</span>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={phase !== 'ready' && phase !== 'done'}
                                            className="flex-1 bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            <PlayIcon size={18} /> INICIAR EXPERIMENTO
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            <RotateCcwIcon size={18} />
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                                        <h4 className="font-bold text-slate-300 flex items-center gap-2">
                                            <CalculatorIcon size={18} className="text-emerald-400" /> Resolución Matemática
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600 transition-colors">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <><ImagePlusIcon size={14}/> DCL I.A.</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Física" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>Fase 1: Choque Inelástico</strong><br/>
                                        Conservación de la cantidad de movimiento ({"$P_{antes} = P_{despues}$"}). Pasamos la bala a kg ({masaProyectilKg} kg). Masa total = {masaTotal.toFixed(3)} kg.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-red-500 font-mono text-red-200">
                                            m_p · v_p = M_tot · v₀<br/>
                                            {masaProyectilKg} · {vProyectil} = {masaTotal.toFixed(3)} · v₀<br/>
                                            v₀ = {(masaProyectilKg * vProyectil).toFixed(1)} / {masaTotal.toFixed(3)} = <strong>{v0.toFixed(3)} m/s</strong>
                                        </div>

                                        <p className="mt-3"><strong>Fase 2: Ascenso por la Rampa</strong><br/>
                                        El bloque+bala sube frenado por la gravedad ($P_x$) y el rozamiento ($F_r$).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            Σ F_x = - P_x - F_r = M_tot · a<br/>
                                            - M_tot·g·sin(30º) - μ·M_tot·g·cos(30º) = M_tot · a
                                        </div>
                                        <p className="text-[10px] text-slate-400 italic">¡La masa total ({"$M_{tot}$"}) se cancela en todos los términos!</p>
                                        
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            a = - g·sin(30º) - μ·g·cos(30º)<br/>
                                            a = - 9.8·0.5 - {mu}·9.8·0.866 = <strong>-{aMag.toFixed(3)} m/s²</strong>
                                        </div>

                                        <p className="mt-3"><strong>Distancia Recorrida (Cinemática):</strong><br/>
                                        El bloque se detiene ($v_f = 0$) tras recorrer la distancia $d$.</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200 shadow-inner">
                                            v_f² = v₀² + 2·a·d<br/>
                                            0 = {v0.toFixed(3)}² + 2·(-{aMag.toFixed(3)})·d<br/>
                                            d = {(v0*v0).toFixed(2)} / {(2*aMag).toFixed(3)} = <strong>{dMax.toFixed(2)} m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Colisiones: Dos Problemas en Uno
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
