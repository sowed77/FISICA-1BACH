<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Conservación de la Energía</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; overflow-x: hidden; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range] { -webkit-appearance: none; background: #334155; height: 6px; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #06b6d4; cursor: pointer; border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Helper para iconos (Lucide en navegador usa lucide.createIcons)
        const Icon = ({ name, size = 20, className = "" }) => {
            const elRef = useRef(null);
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons({
                        attrs: { class: className, 'stroke-width': 2, width: size, height: size },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, className, size]);
            return <i data-lucide={name} ref={elRef} className={className}></i>;
        };

        const App = () => {
            const [masa, setMasa] = useState(2.0);
            const [v0, setV0] = useState(5.0);
            const [k, setK] = useState(500);
            const [pos, setPos] = useState(-2.5); 
            const [isSimulating, setIsSimulating] = useState(false);
            const [simTime, setSimTime] = useState(0);

            // Cálculos Físicos
            const omega = Math.sqrt(k / masa);
            const amplitudMax = v0 / omega;
            const energiaCinInicial = 0.5 * masa * v0 * v0;

            // Variables de renderizado instantáneo
            let velInst = v0;
            let compInst = 0;
            if (pos >= 0) {
                compInst = amplitudMax * Math.sin(omega * simTime);
                velInst = v0 * Math.cos(omega * simTime);
                if (velInst < 0) { velInst = 0; compInst = amplitudMax; }
            }
            const energiaCinInst = 0.5 * masa * velInst * velInst;
            const energiaPotInst = 0.5 * k * compInst * compInst;

            useEffect(() => {
                let interval;
                if (isSimulating) {
                    interval = setInterval(() => {
                        setPos(p => {
                            if (p < 0) {
                                const nextP = p + (v0 * 0.016);
                                return nextP >= 0 ? 0 : nextP;
                            }
                            return 0;
                        });

                        setSimTime(t => {
                            if (pos >= 0) {
                                const nextT = t + 0.016;
                                if (v0 * Math.cos(omega * nextT) <= 0) {
                                    setIsSimulating(false);
                                    return t;
                                }
                                return nextT;
                            }
                            return 0;
                        });
                    }, 16);
                }
                return () => clearInterval(interval);
            }, [isSimulating, v0, omega, pos]);

            const reset = () => { setPos(-2.5); setSimTime(0); setIsSimulating(false); };

            // Dibujo del muelle
            const generateSpringPath = (w) => {
                const safeW = Math.max(10, w);
                const coils = 12;
                const h = 15;
                let path = `M ${safeW} 0 L ${safeW - 10} 0 `;
                const coilWidth = (safeW - 20) / coils;
                for (let i = 0; i < coils; i++) {
                    const x = safeW - 10 - (coilWidth * (i + 0.5));
                    const y = i % 2 === 0 ? -h : h;
                    path += `L ${x} ${y} `;
                }
                return path + `L 10 0 L 0 0`;
            };

            const pxM = 100;
            const wallX = 350;
            const springL = 150;
            const blockW = 50;
            const currentSpringW = springL - (compInst * pxM);
            const blockX = wallX - currentSpringW - blockW + (pos < 0 ? pos * pxM : 0);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-5xl mx-auto">
                        <header className="mb-8 border-b border-slate-700 pb-6">
                            <span className="bg-cyan-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase">Energía Mecánica</span>
                            <h1 className="text-3xl font-black text-cyan-400 mt-2 uppercase">Conservación en Muelles</h1>
                        </header>

                        <div className="grid md:grid-cols-2 gap-8">
                            <div className="bg-slate-800 rounded-3xl p-6 border border-slate-700 h-[450px] relative flex flex-col justify-end overflow-hidden shadow-2xl">
                                <div className="absolute top-4 inset-x-4 flex gap-4">
                                    <div className="flex-1 bg-slate-900/80 p-3 rounded-xl border border-slate-700">
                                        <p className="text-[10px] text-blue-400 font-bold uppercase mb-2">Energía Cinética</p>
                                        <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                                            <div className="h-full bg-blue-500 transition-all" style={{width: `${(energiaCinInst/energiaCinInicial)*100}%`}}></div>
                                        </div>
                                        <p className="text-xs font-mono mt-2 text-white">{energiaCinInst.toFixed(1)} J</p>
                                    </div>
                                    <div className="flex-1 bg-slate-900/80 p-3 rounded-xl border border-slate-700">
                                        <p className="text-[10px] text-pink-400 font-bold uppercase mb-2">Energía Elástica</p>
                                        <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
                                            <div className="h-full bg-pink-500 transition-all" style={{width: `${(energiaPotInst/energiaCinInicial)*100}%`}}></div>
                                        </div>
                                        <p className="text-xs font-mono mt-2 text-white">{energiaPotInst.toFixed(1)} J</p>
                                    </div>
                                </div>

                                <div className="relative w-full h-32 mb-12">
                                    <div className="absolute bottom-0 w-full h-2 bg-slate-600"></div>
                                    <div className="absolute right-0 bottom-0 w-4 h-32 bg-slate-500"></div>
                                    <svg className="absolute bottom-10 right-4 overflow-visible">
                                        <path d={generateSpringPath(currentSpringW)} fill="none" stroke="#f472b6" strokeWidth="3" />
                                    </svg>
                                    <div className="absolute bottom-2 h-16 bg-blue-600 border-2 border-blue-400 rounded-lg flex items-center justify-center font-black text-white text-xs shadow-lg"
                                         style={{ left: `${blockX}px`, width: `${blockW}px` }}>
                                        {masa}kg
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-6 text-cyan-400 flex items-center gap-2">
                                        <Icon name="settings" /> Configuración
                                    </h3>
                                    <div className="space-y-6">
                                        <div>
                                            <div className="flex justify-between text-xs text-slate-400 mb-2 uppercase font-bold">
                                                <span>Masa</span><span>{masa} kg</span>
                                            </div>
                                            <input type="range" min="0.5" max="5" step="0.1" value={masa} onChange={e => {setMasa(Number(e.target.value)); reset();}} className="w-full" />
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-xs text-slate-400 mb-2 uppercase font-bold">
                                                <span>Velocidad</span><span>{v0} m/s</span>
                                            </div>
                                            <input type="range" min="1" max="10" step="0.5" value={v0} onChange={e => {setV0(Number(e.target.value)); reset();}} className="w-full" />
                                        </div>
                                        <div className="flex gap-3 mt-8">
                                            <button onClick={() => setIsSimulating(true)} disabled={isSimulating} className="flex-1 bg-cyan-600 hover:bg-cyan-500 py-4 rounded-xl font-black text-white transition-all active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2">
                                                <Icon name="play" size={18} /> LANZAR
                                            </button>
                                            <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 px-6 rounded-xl text-white transition-all">
                                                <Icon name="rotate-ccw" size={18} />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-cyan-950/20 p-6 rounded-3xl border border-cyan-500/20 font-mono text-[11px] text-cyan-200">
                                    <p className="mb-2"># Balance Energético</p>
                                    <p>Ec_ini = 0.5 · {masa} · {v0}² = {energiaCinInicial.toFixed(1)} J</p>
                                    <p>x_max = √({(energiaCinInicial*2).toFixed(1)} / {k}) = {amplitudMax.toFixed(3)} m</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
