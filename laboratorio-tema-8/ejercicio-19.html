<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Conservación de Energía (Tiro Vertical)</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #8b5cf6; /* Violet 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        .sky-bg {
            background-color: #0ea5e9;
            background-image: linear-gradient(to bottom, #0284c7, #7dd3fc);
        }
        .wall-ruler {
            background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.2) 0, rgba(255,255,255,0.2) 2px, transparent 2px, transparent 20px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};
            
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const SettingsIcon = getIcon('Settings');
            const InfoIcon = getIcon('Info');
            const ArrowUpIcon = getIcon('ArrowUp');
            const ArrowDownIcon = getIcon('ArrowDown');
            const ImagePlusIcon = getIcon('ImagePlus');
            const TimerIcon = getIcon('Timer');

            const App = () => {
                const g = 9.8; // m/s^2

                // Estados interactivos
                const [v0, setV0] = useState(12.0); // m/s
                const [masa, setMasa] = useState(1.0); // kg

                // Cálculos Físicos Teóricos
                const hMax = (v0 * v0) / (2 * g);
                const tSubida = v0 / g;
                const tTotal = 2 * tSubida; // Subida y bajada
                const energiaMecanica = 0.5 * masa * v0 * v0;

                // Animación
                const [time, setTime] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // Cinemática instantánea
                const currentV = v0 - g * time;
                const currentY = (v0 * time) - (0.5 * g * time * time);
                const posVisualY = Math.max(0, currentY); // Prevenir hundimientos por redondeo
                
                // Energías instantáneas
                const currentEc = 0.5 * masa * currentV * currentV;
                const currentEp = masa * g * posVisualY;

                // Estado semántico
                const isAtTop = Math.abs(time - tSubida) < 0.05 && time > 0;
                const phaseStr = 
                    time === 0 ? "EN REPOSO" : 
                    isAtTop ? "PUNTO MÁS ALTO (v=0)" : 
                    time < tSubida ? "SUBIENDO (Frenando)" : 
                    time >= tTotal ? "IMPACTO / FIN" : "CAYENDO (Acelerando)";

                // Escala visual
                const maxDisplayH = Math.max(15, hMax + 2); // Dejar margen arriba
                const pxPerMeter = 300 / maxDisplayH; 

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tTotal) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                // Reducimos la velocidad visual para apreciarlo bien
                                const timeScale = 0.5; 
                                const nextTime = prev + 0.02 * timeScale;
                                if (nextTime >= tTotal) {
                                    setIsMoving(false);
                                    return tTotal;
                                }
                                return nextTime;
                            });
                        }, 20); // 50fps
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tTotal]);

                const handlePlay = () => {
                    if (time < tTotal) setIsMoving(true);
                };

                const reset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Forzar reset si se cambian variables
                useEffect(() => {
                    reset();
                }, [v0, masa]);

                // Generador de Diagrama de Cuerpo Libre
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un gráfico de conservación de la energía mecánica. Dos barras de energía: E_c (Kinética) y E_p (Potencial gravitatoria). Una pelota subiendo verticalmente con su vector velocidad hacia arriba. Fondo blanco, minimalista, estilo educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-violet-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Conservación de Energía</span>
                                <h1 className="text-3xl font-black text-violet-400 uppercase tracking-tight tracking-widest">El Lanzamiento Vertical</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> ¿A qué altura máxima puede llegar una pelota de masa <i>m</i> lanzada verticalmente hacia arriba desde el suelo con una velocidad de 12 m/s?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col items-center">
                                
                                {/* HUD de Energía y Estado */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md ${isAtTop ? 'border-amber-500' : 'border-slate-700'}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Estado del Vuelo</p>
                                        <p className={`text-sm font-black uppercase ${isAtTop ? 'text-amber-400' : time > 0 ? 'text-violet-400' : 'text-slate-400'}`}>
                                            {phaseStr}
                                        </p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Velocidad Actual (v)</p>
                                        <p className={`text-xl font-mono font-black ${Math.abs(currentV) < 0.1 ? 'text-amber-400' : currentV > 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                            {Math.abs(currentV).toFixed(2)} m/s
                                        </p>
                                    </div>
                                </div>

                                {/* Pilares de Energía (Termómetros) */}
                                <div className="absolute top-24 left-6 flex gap-4 z-30 pointer-events-none">
                                    <div className="flex flex-col items-center">
                                        <p className="text-[9px] text-emerald-400 font-bold mb-1">Ec (Kinética)</p>
                                        <div className="w-4 h-32 bg-slate-900 border border-slate-700 rounded-full overflow-hidden flex flex-col justify-end">
                                            <div className="w-full bg-emerald-500 transition-all duration-100" style={{ height: `${(currentEc / energiaMecanica) * 100}%` }}></div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-center">
                                        <p className="text-[9px] text-blue-400 font-bold mb-1">Ep (Potencial)</p>
                                        <div className="w-4 h-32 bg-slate-900 border border-slate-700 rounded-full overflow-hidden flex flex-col justify-end">
                                            <div className="w-full bg-blue-500 transition-all duration-100" style={{ height: `${(currentEp / energiaMecanica) * 100}%` }}></div>
                                        </div>
                                    </div>
                                </div>

                                {/* Escena Principal */}
                                <div className="relative w-full h-[400px] mt-auto sky-bg flex justify-center items-end border-b-8 border-slate-600">
                                    
                                    {/* Regla Vertical */}
                                    <div className="absolute left-1/2 -translate-x-32 h-[300px] w-8 border-r-2 border-slate-700/30 flex flex-col justify-between items-end pr-2 wall-ruler z-10" style={{ bottom: '0px' }}></div>
                                    
                                    {/* Marca de Altura Máxima */}
                                    <div 
                                        className="absolute left-1/2 -translate-x-32 w-64 border-t-2 border-dashed border-amber-400/50 z-10"
                                        style={{ bottom: `${hMax * pxPerMeter}px` }}
                                    >
                                        <span className="text-[10px] font-bold text-amber-300 absolute -top-4 right-0 bg-slate-900/80 px-1 rounded shadow">h_max = {hMax.toFixed(2)} m</span>
                                    </div>

                                    {/* La Pelota */}
                                    <div 
                                        className="absolute w-8 h-8 bg-violet-600 rounded-full border-2 border-violet-300 shadow-[0_0_15px_rgba(139,92,246,0.6)] flex items-center justify-center z-20"
                                        style={{ bottom: `${posVisualY * pxPerMeter}px` }}
                                    >
                                        <div className="w-full h-full rounded-full bg-gradient-to-tr from-black/40 to-transparent"></div>
                                        
                                        {/* Vector Velocidad */}
                                        {Math.abs(currentV) > 0.2 && (
                                            <div 
                                                className={`absolute left-1/2 -translate-x-1/2 flex flex-col items-center opacity-80 ${currentV > 0 ? 'bottom-full flex-col-reverse mb-1' : 'top-full mt-1'}`} 
                                                style={{ height: Math.min(80, Math.abs(currentV) * 5) }}
                                            >
                                                <div className={`w-1 h-full relative ${currentV > 0 ? 'bg-emerald-400' : 'bg-red-400'}`}>
                                                    <div className={`absolute left-1/2 -translate-x-1/2 ${currentV > 0 ? 'top-0' : 'bottom-0'}`}>
                                                        {currentV > 0 ? <ArrowUpIcon size={12} className="text-emerald-400"/> : <ArrowDownIcon size={12} className="text-red-400"/>}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    
                                    {/* Base Terrestre (Tierra) */}
                                    <div className="absolute bottom-0 w-full h-4 bg-emerald-800/40 border-t border-emerald-600/50"></div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-violet-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Configurar Lanzamiento
                                    </h3>
                                    
                                    <div className="space-y-6 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-emerald-400 font-bold uppercase">Velocidad Inicial (v₀)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-emerald-300">{v0.toFixed(1)} m/s</span>
                                            </div>
                                            <input 
                                                type="range" min="1" max="25" step="0.5" value={v0} 
                                                onChange={e => {setV0(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Masa de la Pelota (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{masa.toFixed(1)} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="0.1" max="10" step="0.1" value={masa} 
                                                onChange={e => {setMasa(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400" 
                                            />
                                            <p className="text-[10px] text-slate-500 mt-2 italic text-center border-t border-slate-700 pt-2">
                                                * ¡Fíjate que cambiar la masa NO altera la altura máxima a la que llega!
                                            </p>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tTotal}
                                            className="flex-1 bg-violet-600 hover:bg-violet-500 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} LANZAR PELOTA
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-violet-950/20 p-6 rounded-3xl border border-violet-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-violet-500/30 pb-2">
                                        <h4 className="font-bold text-violet-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Teórica
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Ver Gráfico</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Energía" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700 text-center font-bold text-white mb-2 font-mono">
                                            E_mecánica inicial = E_mecánica final
                                        </div>

                                        <p><strong>1. Instante Inicial (En el suelo):</strong><br/>
                                        No hay altura, por lo que toda la energía es cinética (debida a la velocidad de {v0.toFixed(1)} m/s).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200">
                                            E_m_inicial = E_c_inicial = ½ · m · v₀²
                                        </div>

                                        <p className="mt-3"><strong>2. Instante Final (Altura máxima):</strong><br/>
                                        Al llegar al punto más alto, se detiene una fracción de segundo (v_f = 0). Toda su energía cinética se ha transformado en energía potencial.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200">
                                            E_m_final = E_p_final = m · g · h_max
                                        </div>

                                        <p className="mt-3"><strong>3. Igualación y Despeje:</strong><br/>
                                        Igualamos ambas energías. ¡Ojo! Como la masa (<span className="font-mono">m</span>) multiplica a ambos lados de la ecuación, <strong>podemos tacharla</strong>.</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-violet-500 font-mono text-violet-200 shadow-[inset_0_0_15px_rgba(139,92,246,0.1)]">
                                            <span className="line-through opacity-50">m</span> · g · h_max = ½ · <span className="line-through opacity-50">m</span> · v₀²<br/>
                                            g · h_max = v₀² / 2<br/>
                                            h_max = v₀² / (2 · g)<br/>
                                            h_max = {v0.toFixed(1)}² / (2 · 9.8)<br/>
                                            h_max = {(v0*v0).toFixed(2)} / 19.6 = <strong>{hMax.toFixed(4)} m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Conservación de la Energía Mecánica
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
