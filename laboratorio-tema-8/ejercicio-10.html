<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Trabajo del Motor</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #eab308; /* Yellow 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        .road-pattern {
            background-color: #334155;
            background-image: repeating-linear-gradient(90deg, #475569 0, #475569 20px, transparent 20px, transparent 40px);
            background-position: bottom;
            background-size: 40px 4px;
            background-repeat: repeat-x;
        }
        /* Humo del escape */
        .exhaust {
            animation: drift 1s infinite linear;
            opacity: 0;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            100% { transform: translate(-20px, -10px) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var CalculatorIcon = getIcon('Calculator');
            var SettingsIcon = getIcon('Settings');
            var InfoIcon = getIcon('Info');
            var TruckIcon = getIcon('Truck');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var BatteryChargingIcon = getIcon('BatteryCharging');
            var ImagePlusIcon = getIcon('ImagePlus');
            var TargetIcon = getIcon('Target');

            var App = () => {
                // Parámetros interactivos inicializados con los datos del enunciado
                const [masaTon, setMasaTon] = useState(30.0); // t
                const [aceleracion, setAceleracion] = useState(1.2); // m/s²
                const [fRozamientoKN, setFRozamientoKN] = useState(9.0); // kN (9.0 x 10^3 N)
                const [distanciaObj, setDistanciaObj] = useState(100); // m

                // Cálculos Físicos
                const masaKg = masaTon * 1000;
                const fRozamiento = fRozamientoKN * 1000; // N
                
                // Segunda Ley de Newton: F_neta = m * a
                // F_motor - F_rozamiento = m * a  =>  F_motor = (m * a) + F_rozamiento
                const fInercia = masaKg * aceleracion; // Fuerza necesaria solo para acelerar
                const fMotor = fInercia + fRozamiento; // Fuerza total que debe hacer el motor
                
                // Trabajo = Fuerza * distancia * cos(0º)
                const trabajoMotor = fMotor * distanciaObj; // Julios
                
                // Conversión a unidades más legibles para la UI
                const fMotorKN = fMotor / 1000;
                const trabajoMotorMJ = trabajoMotor / 1000000; // Megajulios

                // Estados de animación
                const [time, setTime] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // Cinemática (MRUA)
                // d = 0.5 * a * t^2  =>  t = sqrt(2*d / a)
                const tMax = Math.sqrt((2 * distanciaObj) / aceleracion);
                
                const currentPos = 0.5 * aceleracion * Math.pow(time, 2);
                const currentVel = aceleracion * time;
                const currentWork = fMotor * currentPos;

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tMax) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                // Para evitar esperar muchos segundos, aceleramos el tiempo visual
                                // Haremos que complete el recorrido en unos 3-4 segundos aprox
                                const visualSpeedMultiplier = tMax / 4; 
                                const nextTime = prev + (0.05 * visualSpeedMultiplier);
                                if (nextTime >= tMax) {
                                    setIsMoving(false);
                                    return tMax;
                                }
                                return nextTime;
                            });
                        }, 50); // 20 FPS
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tMax]);

                const handlePlay = () => {
                    if (time < tMax) setIsMoving(true);
                };

                const reset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Si se cambian las variables, reiniciamos la animación
                useEffect(() => {
                    reset();
                }, [masaTon, aceleracion, fRozamientoKN, distanciaObj]);

                // Escala visual
                const pxPerMeter = 280 / distanciaObj; 
                const visualPosX = currentPos * pxPerMeter;

                // Generador de DCL IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por entorno; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de un camión en movimiento. Vector Fuerza del Motor F_m muy grande hacia la derecha. Vector Fuerza de Rozamiento F_r más pequeño hacia la izquierda. Vector Velocidad v y aceleración a hacia la derecha. Estilo educativo minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-yellow-600 text-slate-900 px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Dinámica y Trabajo</span>
                                <h1 className="text-3xl font-black text-yellow-400 uppercase tracking-tight tracking-widest">La Fuerza del Motor</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un camión de 30 t se mueve con una aceleración constante de 1,2 m/s² sobre una superficie horizontal en la que la fuerza de rozamiento tiene un valor constante de 9,0 × 10³ N. ¿Qué trabajo hace el motor del camión cuando recorre 100 m?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual de la Carretera */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-8">
                                
                                {/* HUD Superior */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black mb-1">Distancia Recorrida</p>
                                        <p className="text-xl font-mono font-black text-white">{currentPos.toFixed(1)} <span className="text-sm">m</span></p>
                                        <p className="text-[10px] font-mono text-emerald-400 mt-1">v = {currentVel.toFixed(1)} m/s</p>
                                    </div>
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 ${time === tMax ? 'border-b-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.3)]' : 'border-b-slate-700'}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black flex items-center justify-end gap-1">
                                            {BatteryChargingIcon && <BatteryChargingIcon size={14} className={currentWork > 0 ? "text-yellow-400" : "text-slate-500"} />} Trabajo del Motor
                                        </p>
                                        <p className={`text-2xl font-mono font-black ${currentWork > 0 ? 'text-yellow-400' : 'text-slate-400'}`}>
                                            {(currentWork / 1000000).toFixed(2)} <span className="text-sm">MJ</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Escena del Camión */}
                                <div className="relative w-full h-64 mt-10">
                                    
                                    {/* Suelo y Carretera */}
                                    <div className="absolute bottom-6 w-full h-10 border-t-2 border-slate-600 road-pattern"></div>
                                    
                                    {/* Bandera de Meta */}
                                    <div 
                                        className="absolute bottom-6 border-l-4 border-dashed border-emerald-500/50 h-32 z-10"
                                        style={{ left: `${60 + distanciaObj * pxPerMeter + 100}px` }} // +100 del ancho del camión
                                    >
                                        <div className="absolute -top-4 -left-6 bg-slate-900/80 text-emerald-400 px-2 py-1 rounded text-[10px] font-black uppercase whitespace-nowrap">
                                            Meta: {distanciaObj}m
                                        </div>
                                    </div>

                                    {/* El Camión */}
                                    <div 
                                        className="absolute bottom-6 flex items-end transition-all z-20"
                                        style={{ transform: `translateX(${40 + visualPosX}px)` }}
                                    >
                                        {/* Efecto del humo de escape si se mueve */}
                                        {isMoving && (
                                            <div className="absolute bottom-4 left-[-10px]">
                                                <div className="w-4 h-4 bg-slate-400 rounded-full exhaust" style={{animationDelay: '0s'}}></div>
                                                <div className="w-5 h-5 bg-slate-500 rounded-full exhaust" style={{animationDelay: '0.2s'}}></div>
                                                <div className="w-6 h-6 bg-slate-600 rounded-full exhaust" style={{animationDelay: '0.4s'}}></div>
                                            </div>
                                        )}

                                        {/* Chasis Camión */}
                                        <div className="relative flex flex-col items-center">
                                            <div className="w-32 h-16 bg-slate-600 rounded-lg shadow-xl flex items-center justify-center border border-slate-500 relative">
                                                <div className="absolute right-[-16px] bottom-0 w-4 h-12 bg-sky-600 rounded-r border border-sky-400"></div>
                                                <div className="absolute right-[-8px] top-2 w-8 h-4 bg-slate-300 rounded-sm"></div>
                                                <span className="font-black text-slate-800 text-xs">{masaTon} t</span>
                                            </div>
                                            {/* Ruedas */}
                                            <div className="flex gap-16 -mt-3">
                                                <div className="w-8 h-8 bg-slate-900 rounded-full border-2 border-slate-500"></div>
                                                <div className="w-8 h-8 bg-slate-900 rounded-full border-2 border-slate-500"></div>
                                            </div>
                                        </div>

                                        {/* VECTORES DE FUERZA */}
                                        <div className="absolute left-[80%] top-1/2 -translate-y-1/2 pointer-events-none">
                                            {/* Vector Motor (F_m) -> Derecha */}
                                            <div className="absolute left-0 top-0 flex items-center" style={{ width: Math.min(180, (fMotorKN/fMotorKN)*100) }}>
                                                <div className="h-2 bg-yellow-400 w-full relative shadow-[0_0_10px_rgba(250,204,21,0.8)]">
                                                    <div className="absolute right-0 -top-2">{ArrowRightIcon && <ArrowRightIcon size={24} className="text-yellow-400" />}</div>
                                                </div>
                                                <span className="ml-1 text-[10px] font-black text-yellow-300 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">F_motor = {fMotorKN.toFixed(1)}kN</span>
                                            </div>

                                            {/* Vector Fricción (F_r) -> Izquierda */}
                                            <div className="absolute right-0 bottom-4 flex items-center pr-1 flex-row-reverse" style={{ width: Math.min(100, (fRozamientoKN/fMotorKN)*100) }}>
                                                <div className="h-1 bg-red-500 w-full relative shadow-[0_0_8px_rgba(239,68,68,0.8)]">
                                                    <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon size={16} className="text-red-500" />}</div>
                                                </div>
                                                <span className="mr-1 text-[10px] font-black text-red-400 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">F_r = {fRozamientoKN}kN</span>
                                            </div>
                                            
                                            {/* Vector Inercia/Fuerza Neta (F_neta) -> Derecha, más pequeño */}
                                            <div className="absolute left-0 bottom-8 flex items-center" style={{ width: Math.min(120, (fInercia/1000/fMotorKN)*100) }}>
                                                <div className="h-1 bg-emerald-400 w-full relative border-t-2 border-dashed border-emerald-500">
                                                    <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon size={16} className="text-emerald-500" />}</div>
                                                </div>
                                                <span className="ml-1 text-[9px] font-bold text-emerald-400 bg-slate-900/80 px-1 rounded shadow whitespace-nowrap">F_neta (m·a)</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-yellow-500">
                                        {SettingsIcon && <SettingsIcon size={20} />} Datos del Trayecto
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-300 font-bold uppercase">Masa del Camión (m)</span></div>
                                                <input type="range" min="10" max="60" step="1" value={masaTon} onChange={e => {setMasaTon(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer mb-1" />
                                                <span className="font-mono text-white text-xs">{masaTon} t</span>
                                            </div>
                                            
                                            <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-emerald-400 font-bold uppercase">Aceleración (a)</span></div>
                                                <input type="range" min="0.2" max="3.0" step="0.2" value={aceleracion} onChange={e => {setAceleracion(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{aceleracion.toFixed(1)} m/s²</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-red-900/20 p-3 rounded-xl border border-red-500/20">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-red-400 font-bold uppercase">Rozamiento (F_r)</span></div>
                                                <input type="range" min="1" max="20" step="1" value={fRozamientoKN} onChange={e => {setFRozamientoKN(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500 mb-1" />
                                                <span className="font-mono text-red-200 text-xs">{fRozamientoKN.toFixed(1)} kN</span>
                                            </div>
                                            
                                            <div className="bg-yellow-900/20 p-3 rounded-xl border border-yellow-500/20">
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-yellow-400 font-bold uppercase">Distancia a recorrer (d)</span></div>
                                                <input type="range" min="20" max="300" step="10" value={distanciaObj} onChange={e => {setDistanciaObj(Number(e.target.value)); reset();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-yellow-500 mb-1" />
                                                <span className="font-mono text-yellow-200 text-xs">{distanciaObj} m</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tMax}
                                            className="flex-1 bg-yellow-600 hover:bg-yellow-500 text-slate-900 font-black py-4 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)] flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} ARRANCAR CAMIÓN
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-yellow-950/20 p-6 rounded-3xl border border-yellow-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-yellow-500/30 pb-2">
                                        <h4 className="font-bold text-yellow-400 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. Unidades al S.I.:</strong><br/>
                                        La masa debe estar en kg y el rozamiento en Newtons.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-slate-500 font-mono text-slate-300">
                                            m = {masaTon} t = <strong>{masaKg.toLocaleString()} kg</strong><br/>
                                            F_r = {fRozamientoKN} × 10³ N = <strong>{fRozamiento.toLocaleString()} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>2. Calcular la Fuerza del Motor (Dinámica):</strong><br/>
                                        Por la 2ª Ley de Newton, la fuerza neta es la del motor menos la fricción. La fuerza neta es la que provoca la aceleración (m·a).</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200 shadow-inner overflow-x-auto">
                                            Σ F_x = m · a<br/>
                                            F_motor - F_r = m · a<br/>
                                            F_motor = (m · a) + F_r<br/>
                                            F_motor = ({masaKg} · {aceleracion.toFixed(1)}) + {fRozamiento}<br/>
                                            F_motor = {fInercia} + {fRozamiento} = <strong>{fMotor.toLocaleString()} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Calcular el Trabajo (Energía):</strong><br/>
                                        El trabajo es el producto de la fuerza por el desplazamiento en la misma dirección (cos 0º = 1).</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-yellow-500 font-mono text-yellow-200 shadow-[inset_0_0_15px_rgba(234,179,8,0.15)] overflow-x-auto">
                                            W = F_motor · d · cos(0º)<br/>
                                            W = {fMotor.toLocaleString()} · {distanciaObj} · 1<br/>
                                            <strong>W = {trabajoMotor.toLocaleString()} Julios (J)</strong>
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-2 italic text-center">
                                            En notación científica o múltiplos: <strong>{trabajoMotorMJ.toFixed(2)} MJ</strong> (Megajulios) o {trabajoMotor.toExponential(2)} J.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Trabajo Mecánico (Suma de Fuerzas No Conservativas)
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
