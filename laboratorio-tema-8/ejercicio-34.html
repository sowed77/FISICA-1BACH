<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Choque, Muelle y Fricción</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ef4444; /* Red 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .floor-pattern {
            background-color: #1e293b;
            background-image: repeating-linear-gradient(45deg, #334155 0, #334155 2px, transparent 2px, transparent 10px);
            border-top: 4px solid #475569;
        }
        .spring-path {
            transition: d 0.05s linear;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect, useRef } = React;
            const icons = window.LucideReact || {};
            
            const getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const InfoIcon = getIcon('Info');
            const FlameIcon = getIcon('Flame');
            const ArrowLeftIcon = getIcon('ArrowLeft');
            const ArrowRightIcon = getIcon('ArrowRight');
            const ImagePlusIcon = getIcon('ImagePlus');
            const ZapIcon = getIcon('Zap');
            const SettingsIcon = getIcon('Settings');

            const App = () => {
                const cteGravedad = 9.8;

                // Estados interactivos
                const [masaCuerpo, setMasaCuerpo] = useState(5.0); 
                const [velInicial, setVelInicial] = useState(10.0); 
                const [kMuelle, setKMuelle] = useState(25); 
                const [coefRozamiento, setCoefRozamiento] = useState(0.20); 

                // Cálculos Físicos Reales (Conservación de la Energía)
                // Ec0 = Epe_final + W_rozamiento
                // 0.5 * m * v0^2 = 0.5 * k * x^2 + (mu * m * g) * x
                const energiaCinInicial = 0.5 * masaCuerpo * Math.pow(velInicial, 2);
                const fuerzaFriccion = coefRozamiento * masaCuerpo * cteGravedad;

                // Ecuación: 0.5*k*x^2 + Fr*x - Ec0 = 0
                const aCoef = 0.5 * kMuelle;
                const bCoef = fuerzaFriccion;
                const cCoef = -energiaCinInicial;
                const discriminante = Math.pow(bCoef, 2) - 4 * aCoef * cCoef;
                const xMaximoMetros = (-bCoef + Math.sqrt(discriminante)) / (2 * aCoef);

                // Estados de Animación
                const [posRelativa, setPosRelativa] = useState(-4.0); // m antes del impacto
                const [tiempoCompresion, setTiempoCompresion] = useState(0); 
                const [estaSimulando, setEstaSimulando] = useState(false);

                // Geometría visual fija
                const xPared = 380;
                const anchoBloquePx = 60;
                const muelleNaturalPx = 180;
                const puntoImpactoX = xPared - muelleNaturalPx; 
                const escalaPxM = 40; // 1 metro = 40 píxeles

                // Variables de estado instantáneo para renderizado
                let vActual = velInicial;
                let compresionM = 0;
                let ecActual = energiaCinInicial;
                let epeActual = 0;
                let calorDisipado = 0;
                let blockLeft = 0;

                if (posRelativa < 0) {
                    // FASE APROXIMACIÓN: El bloque se acerca
                    vActual = velInicial;
                    compresionM = 0;
                    ecActual = energiaCinInicial;
                    epeActual = 0;
                    calorDisipado = 0;
                    blockLeft = puntoImpactoX + (posRelativa * escalaPxM) - anchoBloquePx;
                } else {
                    // FASE COMPRESIÓN: Bloque y muelle se deforman juntos
                    const t = tiempoCompresion;
                    // Interpolación visual para la compresión (sinusoide para frenado suave)
                    const duracionAnim = 1.5; // segundos de animación
                    const progreso = Math.min(1, t / duracionAnim);
                    
                    compresionM = xMaximoMetros * Math.sin(progreso * (Math.PI / 2));
                    vActual = velInicial * Math.cos(progreso * (Math.PI / 2));
                    
                    if (vActual < 0.01) vActual = 0;

                    ecActual = 0.5 * masaCuerpo * vActual * vActual;
                    epeActual = 0.5 * kMuelle * compresionM * compresionM;
                    calorDisipado = fuerzaFriccion * compresionM;
                    
                    blockLeft = puntoImpactoX + (compresionM * escalaPxM) - anchoBloquePx;
                }

                useEffect(() => {
                    let interval;
                    if (estaSimulando) {
                        interval = setInterval(() => {
                            setPosRelativa(prev => {
                                if (prev < 0) {
                                    // Se acerca a velocidad constante
                                    const nextPos = prev + (velInicial * 0.02); 
                                    return nextPos >= 0 ? 0 : nextPos;
                                } else {
                                    // Ya estamos comprimiendo
                                    setTiempoCompresion(t => {
                                        const nextT = t + 0.04;
                                        if (nextT >= 1.5) setEstaSimulando(false);
                                        return nextT;
                                    });
                                    return 0;
                                }
                            });
                        }, 20);
                    }
                    return () => clearInterval(interval);
                }, [estaSimulando, velInicial]);

                const handleStart = () => {
                    setPosRelativa(-4.0);
                    setTiempoCompresion(0);
                    setEstaSimulando(true);
                };

                const resetSim = () => {
                    setPosRelativa(-4.0);
                    setTiempoCompresion(0);
                    setEstaSimulando(false);
                };

                // Generador de DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = ""; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un bloque comprimiendo un muelle horizontal sobre una superficie con fricción. Vectores: Fuerza elástica Fe hacia la izquierda, Fuerza de fricción Fr hacia la izquierda, Velocidad v hacia la derecha. Etiquetas de energía Ec, Epe y W_fr. Estilo minimalista, fondo blanco." }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error de red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                const generateSpringPath = (w) => {
                    const coils = 15;
                    const h = 20;
                    const safeW = Math.max(10, w);
                    let path = `M ${safeW} 0 L ${safeW - 10} 0 `;
                    const coilW = (safeW - 20) / coils;
                    for(let i=0; i<coils; i++) {
                        const y = i % 2 === 0 ? -h : h;
                        const x = safeW - 10 - (coilW * (i + 0.5));
                        path += `L ${x} ${y} `;
                    }
                    path += `L 10 0 L 0 0`;
                    return path;
                };

                const visualSpringW = muelleNaturalPx - (compresionM * escalaPxM);

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8 font-sans">
                        <header className="max-w-6xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Trabajo y Energía</span>
                                <h1 className="text-3xl font-black text-red-400 uppercase tracking-tight tracking-widest">Choque con Rozamiento</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4 font-medium">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un bloque de {masaCuerpo} kg choca con una velocidad de {velInicial} m/s contra un muelle de constante elástica k = {kMuelle} N/m. El coeficiente de rozamiento entre el bloque y la superficie horizontal es {coefRozamiento}. Calcula la longitud que se comprime el muelle.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-6xl mx-auto grid lg:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-12">
                                
                                {/* HUD de Energías */}
                                <div className="absolute top-4 w-full px-6 flex flex-col gap-4 z-30 pointer-events-none">
                                    <div className="bg-slate-950/90 p-4 rounded-xl border border-slate-700 backdrop-blur-md flex justify-around items-end h-40">
                                        <div className="flex flex-col items-center">
                                            <span className="text-[9px] font-black text-blue-400 mb-1">E. Cinética</span>
                                            <div className="w-10 h-24 bg-slate-900 border border-slate-800 rounded overflow-hidden flex flex-col justify-end">
                                                <div className="w-full bg-blue-500 transition-all duration-100" style={{ height: `${(ecActual / energiaCinInicial) * 100}%` }}></div>
                                            </div>
                                            <span className="text-[10px] font-mono mt-1 text-blue-300">{ecActual.toFixed(1)} J</span>
                                        </div>
                                        <div className="flex flex-col items-center">
                                            <span className="text-[9px] font-black text-pink-400 mb-1">E. Elástica</span>
                                            <div className="w-10 h-24 bg-slate-900 border border-slate-800 rounded overflow-hidden flex flex-col justify-end">
                                                <div className="w-full bg-pink-500 transition-all duration-100" style={{ height: `${(epeActual / energiaCinInicial) * 100}%` }}></div>
                                            </div>
                                            <span className="text-[10px] font-mono mt-1 text-pink-300">{epeActual.toFixed(1)} J</span>
                                        </div>
                                        <div className="flex flex-col items-center">
                                            <span className="text-[9px] font-black text-orange-400 mb-1">Calor (Fr)</span>
                                            <div className="w-10 h-24 bg-slate-900 border border-slate-800 rounded overflow-hidden flex flex-col justify-end">
                                                <div className="w-full bg-orange-500 transition-all duration-100" style={{ height: `${(calorDisipado / energiaCinInicial) * 100}%` }}></div>
                                            </div>
                                            <span className="text-[10px] font-mono mt-1 text-orange-300">{calorDisipado.toFixed(1)} J</span>
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center bg-slate-900/80 p-2 rounded-lg border border-slate-700">
                                        <span className="text-xs font-bold text-slate-400">Compresión actual:</span>
                                        <span className="text-lg font-mono font-black text-pink-400">{compresionM.toFixed(3)} m</span>
                                    </div>
                                </div>

                                {/* Escena Física */}
                                <div className="relative w-full h-48 flex items-end">
                                    <div className="absolute bottom-0 w-full h-12 floor-pattern"></div>
                                    <div className="absolute right-0 bottom-12 w-8 h-32 bg-slate-600 border-l-4 border-slate-500" style={{ left: `${xPared}px` }}></div>
                                    
                                    {/* Muelle */}
                                    <div className="absolute bottom-24 z-10" style={{ left: `${xPared - visualSpringW}px` }}>
                                        <svg width={visualSpringW} height="20" className="overflow-visible">
                                            <path d={generateSpringPath(visualSpringW)} fill="none" stroke="#f472b6" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" className="spring-path" />
                                        </svg>
                                    </div>

                                    {/* El Bloque */}
                                    <div 
                                        className="absolute bottom-12 h-16 bg-blue-600 border-4 border-blue-400 rounded-lg flex items-center justify-center shadow-xl z-20 transition-all duration-75"
                                        style={{ left: `${blockLeft}px`, width: `${anchoBloquePx}px` }}
                                    >
                                        <span className="font-black text-white text-xs">{masaCuerpo}kg</span>
                                        
                                        {/* Efecto Fricción */}
                                        {vActual > 0.5 && (
                                            <div className="absolute -bottom-4 left-1/2 -translate-x-1/2 text-orange-500 animate-pulse">
                                                <FlameIcon size={20} />
                                            </div>
                                        )}

                                        {/* Vectores en el impacto */}
                                        {posRelativa >= 0 && vActual > 0 && (
                                            <>
                                                {/* Fe */}
                                                <div className="absolute top-1/4 right-full flex items-center pr-1" style={{ width: Math.min(60, epeActual) }}>
                                                    <span className="mr-1 text-[8px] font-black text-pink-400 bg-slate-900/80 px-1 rounded shadow">Fe</span>
                                                    <div className="h-1 bg-pink-500 w-full relative">
                                                        <div className="absolute left-0 -top-1.5"><ArrowLeftIcon size={14} className="text-pink-500" /></div>
                                                    </div>
                                                </div>
                                                {/* Fr */}
                                                <div className="absolute bottom-1/4 right-full flex items-center pr-1" style={{ width: 40 }}>
                                                    <span className="mr-1 text-[8px] font-black text-orange-400 bg-slate-900/80 px-1 rounded shadow">Fr</span>
                                                    <div className="h-1 bg-orange-500 w-full relative">
                                                        <div className="absolute left-0 -top-1.5"><ArrowLeftIcon size={14} className="text-orange-500" /></div>
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-red-400">
                                        <SettingsIcon size={20} /> Variables del Ensayo
                                    </h3>
                                    
                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <div>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Masa (kg)</p>
                                            <input type="range" min="1" max="15" step="0.5" value={masaCuerpo} onChange={e => {setMasaCuerpo(Number(e.target.value)); resetSim();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                            <p className="mt-1 font-mono text-xs">{masaCuerpo.toFixed(1)} kg</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Velocidad (m/s)</p>
                                            <input type="range" min="2" max="20" step="1" value={velInicial} onChange={e => {setVelInicial(Number(e.target.value)); resetSim();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                            <p className="mt-1 font-mono text-xs">{velInicial.toFixed(1)} m/s</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Cte Muelle (k)</p>
                                            <input type="range" min="10" max="200" step="5" value={kMuelle} onChange={e => {setKMuelle(Number(e.target.value)); resetSim();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                            <p className="mt-1 font-mono text-xs">{kMuelle} N/m</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase mb-1">Fricción (μ)</p>
                                            <input type="range" min="0" max="0.8" step="0.05" value={coefRozamiento} onChange={e => {setCoefRozamiento(Number(e.target.value)); resetSim();}} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                            <p className="mt-1 font-mono text-xs">{coefRozamiento.toFixed(2)}</p>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={handleStart} disabled={estaSimulando} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95 disabled:opacity-50">
                                            <PlayIcon size={20} /> INICIAR IMPACTO
                                        </button>
                                        <button onClick={resetSim} className="bg-slate-700 hover:bg-slate-600 text-white px-5 rounded-xl transition-all shadow-md">
                                            <RotateCcwIcon size={20} />
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-red-950/20 p-6 rounded-3xl border border-red-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-red-500/30 pb-2">
                                        <h4 className="font-bold text-red-300 flex items-center gap-2">
                                            <CalculatorIcon size={18} /> Desarrollo Matemático
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <><ImagePlusIcon size={14}/> Ver DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center"><img src={imgUrl} alt="DCL" className="mx-auto max-h-40 rounded-lg" /></div>}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. Energías iniciales:</strong></p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200">
                                            Ec₀ = ½ · m · v₀² = ½ · {masaCuerpo} · {velInicial}² = <strong>{energiaCinInicial.toFixed(1)} J</strong><br/>
                                            Fr = μ · m · g = {coefRozamiento.toFixed(2)} · {masaCuerpo} · 9.8 = <strong>{fuerzaFriccion.toFixed(2)} N</strong>
                                        </div>

                                        <p><strong>2. Teorema de Conservación Generalizado:</strong><br/>
                                        La energía cinética que trae el bloque se invierte en comprimir el muelle (Epe) y en luchar contra la fricción (Calor).</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200 shadow-inner">
                                            Ec₀ = Epe_final + |W_fr|<br/>
                                            Ec₀ = ½ · k · x² + Fr · x<br/>
                                            {energiaCinInicial.toFixed(1)} = ½ · {kMuelle} · x² + {fuerzaFriccion.toFixed(2)} · x
                                        </div>

                                        <p><strong>3. Resolución de la ecuación de 2º grado:</strong><br/>
                                        Agrupamos todos los términos a un lado para resolver ax² + bx + c = 0.</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-red-500 font-mono text-red-200 shadow-inner overflow-x-auto">
                                            {0.5 * kMuelle}x² + {fuerzaFriccion.toFixed(2)}x - {energiaCinInicial.toFixed(1)} = 0<br/>
                                            <br/>
                                            <span className="text-white font-bold bg-red-900/50 px-2 py-1 rounded">Solución final: x = {xMaximoMetros.toFixed(4)} m</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-6xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Conservación de la Energía
                        </footer>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
