<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio: Choque, Muelle y Fricción</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ef4444;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .floor-pattern {
            background-color: #1e293b;
            background-image: repeating-linear-gradient(45deg, #334155 0, #334155 2px, transparent 2px, transparent 10px);
            border-top: 4px solid #475569;
        }

        .spring-path {
            transition: d 0.05s linear;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            const { useState, useEffect } = React;
            const icons = window.LucideReact || {};

            const getIcon = (name) => icons[name] || (({ className }) => <span className={className || ''}></span>);
            const PlayIcon = getIcon('Play');
            const RotateCcwIcon = getIcon('RotateCcw');
            const CalculatorIcon = getIcon('Calculator');
            const FlameIcon = getIcon('Flame');
            const ArrowLeftIcon = getIcon('ArrowLeft');
            const ImagePlusIcon = getIcon('ImagePlus');
            const SettingsIcon = getIcon('Settings');

            const App = () => {
                const cteGravedad = 9.8;

                const [masaCuerpo, setMasaCuerpo] = useState(5.0);
                const [velInicial, setVelInicial] = useState(10.0);
                const [kMuelle, setKMuelle] = useState(25);
                const [coefRozamiento, setCoefRozamiento] = useState(0.20);

                const energiaCinInicial = 0.5 * masaCuerpo * Math.pow(velInicial, 2);
                const fuerzaFriccion = coefRozamiento * masaCuerpo * cteGravedad;

                const aCoef = 0.5 * kMuelle;
                const bCoef = fuerzaFriccion;
                const cCoef = -energiaCinInicial;
                const discriminante = Math.max(0, Math.pow(bCoef, 2) - 4 * aCoef * cCoef);
                const xMaximoMetros = (-bCoef + Math.sqrt(discriminante)) / (2 * aCoef);

                const [posRelativa, setPosRelativa] = useState(-4.0);
                const [tiempoCompresion, setTiempoCompresion] = useState(0);
                const [estaSimulando, setEstaSimulando] = useState(false);

                const paredLeft = 520;
                const anchoParedPx = 8;
                const anchoBloquePx = 60;
                const altoBloquePx = 64;
                const muelleNaturalPx = 180;

                const escalaAproximacionPxM = 40;
                const compresionVisualMaxPx = 140;
                const escalaCompresionPxM = compresionVisualMaxPx / Math.max(xMaximoMetros, 0.001);

                let vActual = velInicial;
                let compresionM = 0;
                let ecActual = energiaCinInicial;
                let epeActual = 0;
                let calorDisipado = 0;
                let blockLeft = 0;

                const duracionAnim = 1.5;
                const progreso = Math.min(1, tiempoCompresion / duracionAnim);

                if (posRelativa < 0) {
                    vActual = velInicial;
                    compresionM = 0;
                    ecActual = energiaCinInicial;
                    epeActual = 0;
                    calorDisipado = 0;

                    const springLeftNatural = paredLeft - muelleNaturalPx;
                    blockLeft = springLeftNatural - anchoBloquePx + (posRelativa * escalaAproximacionPxM);
                } else {
                    compresionM = xMaximoMetros * Math.sin(progreso * (Math.PI / 2));
                    vActual = velInicial * Math.cos(progreso * (Math.PI / 2));
                    if (vActual < 0.01) vActual = 0;

                    ecActual = 0.5 * masaCuerpo * vActual * vActual;
                    epeActual = 0.5 * kMuelle * compresionM * compresionM;
                    calorDisipado = fuerzaFriccion * compresionM;

                    const compresionPx = compresionM * escalaCompresionPxM;
                    const visualSpringW = Math.max(30, muelleNaturalPx - compresionPx);
                    const springLeft = paredLeft - visualSpringW;
                    blockLeft = springLeft - anchoBloquePx;
                }

                useEffect(() => {
                    let interval;
                    if (estaSimulando) {
                        interval = setInterval(() => {
                            setPosRelativa(prev => {
                                if (prev < 0) {
                                    const nextPos = prev + (velInicial * 0.02);
                                    return nextPos >= 0 ? 0 : nextPos;
                                } else {
                                    setTiempoCompresion(t => {
                                        const nextT = t + 0.04;
                                        if (nextT >= duracionAnim) setEstaSimulando(false);
                                        return nextT;
                                    });
                                    return 0;
                                }
                            });
                        }, 20);
                    }
                    return () => clearInterval(interval);
                }, [estaSimulando, velInicial]);

                useEffect(() => {
                    setPosRelativa(-4.0);
                    setTiempoCompresion(0);
                    setEstaSimulando(false);
                }, [masaCuerpo, velInicial, kMuelle, coefRozamiento]);

                const handleStart = () => {
                    setPosRelativa(-4.0);
                    setTiempoCompresion(0);
                    setEstaSimulando(true);
                };

                const resetSim = () => {
                    setPosRelativa(-4.0);
                    setTiempoCompresion(0);
                    setEstaSimulando(false);
                };

                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "";
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{
                                        prompt: "Diagrama físico de un bloque comprimiendo un resorte en una superficie horizontal. Vector fuerza elástica y vector fricción hacia la izquierda. Vector velocidad hacia la derecha. Estilo educativo minimalista."
                                    }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("API Error");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                const generateSpringPath = (w) => {
                    const coils = 15;
                    const h = 20;
                    const safeW = Math.max(10, w);
                    let path = `M ${safeW} 0 L ${safeW - 10} 0 `;
                    const coilW = (safeW - 20) / coils;

                    for (let i = 0; i < coils; i++) {
                        const y = i % 2 === 0 ? -h : h;
                        const x = safeW - 10 - (coilW * (i + 0.5));
                        path += `L ${x} ${y} `;
                    }
                    path += `L 10 0 L 0 0`;
                    return path;
                };

                const compresionPx = compresionM * escalaCompresionPxM;
                const visualSpringW = Math.max(30, muelleNaturalPx - compresionPx);
                const springLeft = paredLeft - visualSpringW;

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-6xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">
                                    Trabajo y Energía
                                </span>
                                <h1 className="text-3xl font-black text-red-400 uppercase tracking-tight">
                                    Choque con Rozamiento
                                </h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                
                            </div>
                        </header>

                        <main className="max-w-6xl mx-auto grid lg:grid-cols-2 gap-8">
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-12">

                                <div className="absolute top-4 w-full px-6 flex flex-col gap-4 z-30 pointer-events-none">
                                    <div className="bg-slate-950/90 p-4 rounded-xl border border-slate-700 backdrop-blur-md flex justify-around items-end h-40 shadow-inner">
                                        <div className="flex flex-col items-center">
                                            <span className="text-[9px] font-black text-blue-400 mb-1">E. Cinética</span>
                                            <div className="w-10 h-24 bg-slate-900 border border-slate-800 rounded overflow-hidden flex flex-col justify-end">
                                                <div
                                                    className="w-full bg-blue-500 transition-all duration-100"
                                                    style={{ height: `${Math.max(0, Math.min(100, (ecActual / energiaCinInicial) * 100))}%` }}
                                                ></div>
                                            </div>
                                            <span className="text-[10px] font-mono mt-1">{ecActual.toFixed(1)} J</span>
                                        </div>

                                        <div className="flex flex-col items-center">
                                            <span className="text-[9px] font-black text-pink-400 mb-1">E. Elástica</span>
                                            <div className="w-10 h-24 bg-slate-900 border border-slate-800 rounded overflow-hidden flex flex-col justify-end">
                                                <div
                                                    className="w-full bg-pink-500 transition-all duration-100"
                                                    style={{ height: `${Math.max(0, Math.min(100, (epeActual / energiaCinInicial) * 100))}%` }}
                                                ></div>
                                            </div>
                                            <span className="text-[10px] font-mono mt-1">{epeActual.toFixed(1)} J</span>
                                        </div>

                                        <div className="flex flex-col items-center">
                                            <span className="text-[9px] font-black text-orange-400 mb-1">Calor (Roz.)</span>
                                            <div className="w-10 h-24 bg-slate-900 border border-slate-800 rounded overflow-hidden flex flex-col justify-end">
                                                <div
                                                    className="w-full bg-orange-500 transition-all duration-100"
                                                    style={{ height: `${Math.max(0, Math.min(100, (calorDisipado / energiaCinInicial) * 100))}%` }}
                                                ></div>
                                            </div>
                                            <span className="text-[10px] font-mono mt-1">{calorDisipado.toFixed(1)} J</span>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center bg-slate-900/80 p-2 rounded-lg border border-slate-700">
                                        <span className="text-xs font-bold text-slate-400">Compresión x:</span>
                                        <span className="text-lg font-mono font-black text-pink-400">{compresionM.toFixed(3)} m</span>
                                    </div>
                                </div>

                                <div className="relative w-full h-48 flex items-end">
                                    <div className="absolute bottom-0 w-full h-12 floor-pattern"></div>

                                    <div
                                        className="absolute bottom-12 h-32 bg-slate-600 border-l-4 border-slate-500"
                                        style={{ left: `${paredLeft}px`, width: `${anchoParedPx}px` }}
                                    ></div>

                                    <div
                                        className="absolute bottom-24"
                                        style={{ left: `${springLeft}px` }}
                                    >
                                        <svg width={visualSpringW} height="20" className="overflow-visible">
                                            <path
                                                d={generateSpringPath(visualSpringW)}
                                                fill="none"
                                                stroke="#f472b6"
                                                strokeWidth="4"
                                                strokeLinecap="round"
                                                className="spring-path"
                                            />
                                        </svg>
                                    </div>

                                    <div
                                        className="absolute bottom-12 w-[60px] h-16 bg-blue-600 border-4 border-blue-400 rounded-lg flex flex-col items-center justify-center shadow-xl z-20 transition-all duration-75"
                                        style={{ left: `${blockLeft}px` }}
                                    >
                                        <span className="font-black text-white text-xs">{masaCuerpo.toFixed(1)}kg</span>
                                        {vActual > 0.5 && (
                                            <div className="absolute -bottom-4 text-orange-500 animate-pulse">
                                                <FlameIcon size={20} />
                                            </div>
                                        )}
                                    </div>

                                    {compresionM > 0.01 && (
                                        <div
                                            className="absolute bottom-32 flex items-center"
                                            style={{ left: `${blockLeft - 90}px`, width: '80px' }}
                                        >
                                            <ArrowLeftIcon size={18} className="text-orange-400" />
                                            <div className="h-1 bg-orange-400 flex-1 mx-1 rounded"></div>
                                            <span className="text-[10px] font-black text-orange-300 bg-slate-900/80 px-1 rounded whitespace-nowrap">
                                                Fr
                                            </span>
                                        </div>
                                    )}

                                   
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-red-400">
                                        <SettingsIcon size={20} /> Variables
                                    </h3>

                                    <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
                                        <div>
                                            <p className="text-slate-500 uppercase font-black text-[10px] mb-1">Masa (kg)</p>
                                            <input
                                                type="range"
                                                min="1"
                                                max="15"
                                                step="0.5"
                                                value={masaCuerpo}
                                                onChange={e => setMasaCuerpo(Number(e.target.value))}
                                                className="w-full accent-red-500"
                                            />
                                            <p className="font-mono mt-1">{masaCuerpo.toFixed(1)} kg</p>
                                        </div>

                                        <div>
                                            <p className="text-slate-500 uppercase font-black text-[10px] mb-1">Velocidad (m/s)</p>
                                            <input
                                                type="range"
                                                min="2"
                                                max="20"
                                                step="1"
                                                value={velInicial}
                                                onChange={e => setVelInicial(Number(e.target.value))}
                                                className="w-full accent-red-500"
                                            />
                                            <p className="font-mono mt-1">{velInicial.toFixed(1)} m/s</p>
                                        </div>

                                        <div>
                                            <p className="text-slate-500 uppercase font-black text-[10px] mb-1">Cte. Muelle k (N/m)</p>
                                            <input
                                                type="range"
                                                min="10"
                                                max="200"
                                                step="5"
                                                value={kMuelle}
                                                onChange={e => setKMuelle(Number(e.target.value))}
                                                className="w-full accent-red-500"
                                            />
                                            <p className="font-mono mt-1">{kMuelle} N/m</p>
                                        </div>

                                        <div>
                                            <p className="text-slate-500 uppercase font-black text-[10px] mb-1">Fricción (μ)</p>
                                            <input
                                                type="range"
                                                min="0"
                                                max="0.8"
                                                step="0.05"
                                                value={coefRozamiento}
                                                onChange={e => setCoefRozamiento(Number(e.target.value))}
                                                className="w-full accent-red-500"
                                            />
                                            <p className="font-mono mt-1">{coefRozamiento.toFixed(2)}</p>
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button
                                            onClick={handleStart}
                                            disabled={estaSimulando}
                                            className="flex-1 bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50"
                                        >
                                            <PlayIcon size={20} /> INICIAR
                                        </button>
                                        <button
                                            onClick={resetSim}
                                            className="bg-slate-700 hover:bg-slate-600 text-white px-5 rounded-xl"
                                        >
                                            <RotateCcwIcon size={20} />
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-red-950/20 p-6 rounded-3xl border border-red-500/20 text-xs">
                                    <div className="flex justify-between border-b border-red-500/30 pb-2 mb-4">
                                        <h4 className="font-bold text-red-300 flex items-center gap-2">
                                            <CalculatorIcon size={18} /> Resolución
                                        </h4>
                                        <button
                                            onClick={generarDiagrama}
                                            className="uppercase font-bold text-slate-400 text-[10px] hover:text-white"
                                        >
                                            <ImagePlusIcon size={14} className="inline mr-1" />
                                            {imgLoading ? 'Cargando...' : 'Ver DCL'}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 text-center">
                                            <img src={imgUrl} className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="space-y-3 font-mono">
                                        <p>Ec₀ = ½·m·v₀² = <strong>{energiaCinInicial.toFixed(1)} J</strong></p>
                                        <p>Fr = μ·m·g = <strong>{fuerzaFriccion.toFixed(2)} N</strong></p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-red-500">
                                            {(0.5 * kMuelle).toFixed(2)}x² + {fuerzaFriccion.toFixed(2)}x - {energiaCinInicial.toFixed(1)} = 0
                                            <br /><br />
                                            Solución: x = <strong>{xMaximoMetros.toFixed(4)} m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-6xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase">
                            Profe Física | Dinámica y Conservación de la Energía
                        </footer>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        })();
    </script>
</body>
</html>
