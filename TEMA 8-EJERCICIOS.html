<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier interactivo · Tema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        :root {
            --text-xs: clamp(0.75rem, 0.72rem + 0.2vw, 0.875rem);
            --text-sm: clamp(0.875rem, 0.84rem + 0.2vw, 1rem);
            --text-base: clamp(1rem, 0.97rem + 0.2vw, 1.125rem);
            --text-lg: clamp(1.125rem, 1rem + 0.6vw, 1.35rem);
            --text-xl: clamp(1.45rem, 1.2rem + 1vw, 2rem);
            --text-2xl: clamp(2rem, 1.4rem + 2vw, 3.2rem);
            --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
            --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
            --space-12: 3rem; --space-16: 4rem;
            --radius-sm: .4rem; --radius-md: .8rem; --radius-lg: 1.1rem; --radius-xl: 1.6rem;
            --shadow-sm: 0 8px 24px rgba(15,23,42,0.06);
            --shadow-md: 0 20px 48px rgba(15,23,42,0.12);
            --font-display: 'Literata', Georgia, serif;
            --font-body: 'Inter', sans-serif;
        }
        :root,[data-theme="light"] {
            --color-bg: #f4f1eb; --color-surface: #fbfaf7; --color-surface-2: #f1ede6;
            --color-surface-3: #e7e0d6; --color-text: #201c17; --color-muted: #6f6a61;
            --color-faint: #9b958c; --color-border: rgba(32,28,23,0.12);
            --color-divider: rgba(32,28,23,0.08); --color-primary: #0d6b6f;
            --color-primary-soft: rgba(13,107,111,0.1); --color-primary-strong: #08484b;
            --color-accent: #c76a2a; --color-success: #3f7b3a; --color-warning: #a46a00;
            --color-danger: #9c3943; --color-hero: linear-gradient(135deg,#fbfaf7 0%,#eee5d8 100%);
        }
        [data-theme="dark"] {
            --color-bg: #171513; --color-surface: #201d1a; --color-surface-2: #292521;
            --color-surface-3: #332e29; --color-text: #ece5da; --color-muted: #b4ada2;
            --color-faint: #8f877d; --color-border: rgba(236,229,218,0.14);
            --color-divider: rgba(236,229,218,0.09); --color-primary: #67b1b1;
            --color-primary-soft: rgba(103,177,177,0.12); --color-primary-strong: #9ed0d0;
            --color-accent: #f0aa6d; --color-success: #87be78; --color-warning: #e0b24c;
            --color-danger: #e08894; --color-hero: linear-gradient(135deg,#201d1a 0%,#29231e 100%);
            --shadow-sm: 0 8px 24px rgba(0,0,0,0.25); --shadow-md: 0 20px 48px rgba(0,0,0,0.35);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0; font-family: var(--font-body); font-size: var(--text-base);
            background: var(--color-bg); color: var(--color-text); line-height: 1.6;
        }
        button,input { font: inherit; }
        button { cursor: pointer; border: 0; background: none; color: inherit; }
        .app { min-height: 100dvh; display: grid; grid-template-columns: 360px 1fr; }
        .sidebar {
            border-right: 1px solid var(--color-border); background: var(--color-surface);
            padding: var(--space-6); position: sticky; top: 0; height: 100dvh; overflow: auto;
        }
        .logo { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
        .logo svg { width: 40px; height: 40px; color: var(--color-primary); }
        .logo-title { font-size: var(--text-lg); font-weight: 800; letter-spacing: -0.03em; }
        .logo-sub { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.12em; color: var(--color-muted); }
        .sidebar h2 { margin: var(--space-8) 0 var(--space-3); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.16em; color: var(--color-faint); }
        .exercise-list { display: grid; gap: var(--space-2); }
        .nav-group { margin-bottom: var(--space-2); }
        .nav-group summary {
            padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
            background: var(--color-surface-2); color: var(--color-text); font-size: var(--text-sm);
            font-weight: 700; cursor: pointer; list-style: none; display: flex;
            justify-content: space-between; align-items: center; transition: background 0.15s ease;
        }
        .nav-group summary::-webkit-details-marker { display: none; }
        .nav-group summary:hover { background: var(--color-surface-3); }
        .nav-group .badge {
            background: var(--color-primary-soft); color: var(--color-primary);
            padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.70rem; font-weight: 800;
        }
        .group-items {
            display: flex; flex-direction: column; gap: 2px; padding: var(--space-2) 0 var(--space-2) var(--space-3);
            border-left: 2px solid var(--color-surface-2); margin-left: var(--space-3); margin-top: var(--space-1);
        }
        .exercise-btn {
            width: 100%; text-align: left; padding: var(--space-3); border-radius: var(--radius-sm);
            border: 1px solid transparent; background: transparent; transition: .18s ease; overflow: hidden;
        }
        .exercise-btn:hover,.exercise-btn.active { background: var(--color-primary-soft); border-color: var(--color-border); }
        .exercise-btn strong { display: block; font-size: var(--text-sm); }
        .exercise-btn span { display: block; color: var(--color-muted); font-size: var(--text-xs); margin-top: .2rem; }
        .content { padding: var(--space-6); }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
        .chip-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
        .chip {
            display: inline-flex; align-items: center; padding: .45rem .75rem; border-radius: 999px;
            background: var(--color-surface); border: 1px solid var(--color-border); font-size: var(--text-xs); color: var(--color-muted);
        }
        .theme-toggle {
            min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 999px;
            background: var(--color-surface); border: 1px solid var(--color-border);
        }
        .btn { min-height: 44px; padding: .8rem 1rem; border-radius: 999px; border: 1px solid var(--color-border); font-weight: 700; }
        .btn-primary { background: var(--color-primary); color: white; border-color: transparent; }
        .layout { margin-top: var(--space-4); display: block; }
        .card {
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: var(--space-6);
        }
        .eyebrow { font-size: var(--text-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--color-primary); font-weight: 800; margin-bottom: var(--space-3); }
        h1,h2,h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; }
        h2 { font-size: var(--text-xl); margin-bottom: var(--space-4); }
        h3 { font-size: var(--text-lg); margin-bottom: var(--space-3); }
        .meta-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: var(--space-3); margin-top: var(--space-5); }
        .meta-item {
            background: var(--color-surface-2); border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); padding: var(--space-4);
        }
        .meta-item small { display: block; color: var(--color-faint); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .25rem; }
        .mode-switch {
            display: inline-flex; padding: .3rem; border-radius: 999px; background: var(--color-surface-2);
            border: 1px solid var(--color-border); gap: .25rem; margin-bottom: var(--space-5);
        }
        .mode-switch button { padding: .6rem .9rem; border-radius: 999px; font-weight: 700; color: var(--color-muted); }
        .mode-switch button.active { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); }
        .section-block { border-top: 1px solid var(--color-divider); padding-top: var(--space-5); margin-top: var(--space-5); }
        .highlight {
            background: var(--color-primary-soft); border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); padding: var(--space-4); color: var(--color-text);
        }
        .steps { display: grid; gap: var(--space-3); margin-top: var(--space-4); }
        details {
            background: var(--color-surface-2); border: 1px solid var(--color-border);
            border-radius: var(--radius-lg); padding: var(--space-4);
        }
        details+details { margin-top: var(--space-3); }
        summary { cursor: pointer; font-weight: 700; color: var(--color-text); }
        .question { display: grid; gap: var(--space-3); margin-top: var(--space-4); }
        .options { display: grid; gap: var(--space-2); }
        .option {
            padding: .85rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border);
            background: var(--color-surface-2); text-align: left;
        }
        .option.correct { border-color: rgba(63,123,58,.5); background: rgba(63,123,58,.12); }
        .option.wrong { border-color: rgba(156,57,67,.5); background: rgba(156,57,67,.1); }
        .feedback {
            padding: .9rem 1rem; border-radius: var(--radius-md); background: var(--color-surface-2);
            border: 1px solid var(--color-border); color: var(--color-text); min-height: 54px;
        }
        .formula-box {
            padding: var(--space-4); background: var(--color-surface-2); border-radius: var(--radius-lg);
            border: 1px solid var(--color-border); overflow: auto;
        }
        .figure-wrap {
            padding: var(--space-4); border-radius: var(--radius-xl);
            background: radial-gradient(circle at top, rgba(13,107,111,.1), transparent 35%), #111827;
            min-height: auto; border: 1px solid rgba(255,255,255,.08);
        }
        .figure-wrap svg { max-width: 60%; height: auto; margin: var(--space-4) auto; display: block; }
        .figure-tools { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-4); }
        .toggle {
            padding: .55rem .85rem; border-radius: 999px; background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12); color: #dbe4ee; font-size: var(--text-xs);
        }
        .toggle.on { background: rgba(255,255,255,.18); color: #fff; }
        .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: var(--space-4); color: #dbe4ee; font-size: var(--text-sm); }
        .legend span::before {
            content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-right: .5rem; vertical-align: middle;
        }
        .legend .peso::before { background: #f59e0b; } .legend .normal::before { background: #10b981; }
        .legend .friccion::before { background: #ef4444; } .legend .paralela::before { background: #60a5fa; }
        .legend .perp::before { background: #a78bfa; } .legend .tension::before { background: #8b5cf6; }
        .legend .aplicada::before { background: #3b82f6; } .legend .momento::before { background: #ec4899; }
        .legend .default::before { background: #94a3b8; }
        @media (max-width: 1100px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { position: relative; height: auto; }
        }
        @media (max-width: 720px) {
            .content,.sidebar { padding: var(--space-4); }
            .meta-grid { grid-template-columns: 1fr 1fr; }
            .topbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="3"/><path d="M12 30c5-10 19-13 24-3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="17" cy="29" r="3" fill="currentColor"/><circle cx="31" cy="21" r="3" fill="currentColor"/></svg>
    <div><div class="logo-title">Tema</div><div class="logo-sub">Dossier Interactivo</div></div>
  </div>
  <h2>Acceso rápido</h2>
  <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-4);">
    <input type="number" id="quickSearch" placeholder="Ej. 27" style="width:100%;padding:var(--space-2);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-surface-2);color:var(--color-text);">
    <button class="btn btn-primary" onclick="goToExercise()">Ir</button>
  </div>
  <small id="searchFeedback" style="color:var(--color-danger);display:none;">No encontrado</small>
  <h2>Ejercicios</h2>
  <div class="exercise-list" id="exerciseList"></div>
</aside>
<main class="content">
  <div class="topbar">
    <div class="chip-row"><span class="chip">1º Bach</span><span class="chip">Física</span></div>
    <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="display:flex;align-items:center;gap:0.3rem;">← Inicio</button>
    <button class="theme-toggle" id="themeToggle">◐</button>
</div>
  <section class="layout" id="exerciseArea">
    <article class="card" id="exerciseCard"></article>
  </section>
</main>
</div>
<script>
    // ── Estado ──
    let exercises = [];
    let current = 0;
    let mode = 'study';
    const visibility = { peso: true, normal: true, friccion: true, paralela: true, perpendicular: false, tension: true, aplicada: true, momento: true };
    const listEl = document.getElementById('exerciseList');
    const cardEl = document.getElementById('exerciseCard');

    function goToExercise() {
        const id = parseInt(document.getElementById('quickSearch').value);
        const idx = exercises.findIndex(ex => ex.id === id);
        if (idx >= 0) { current = idx; renderList(); renderExercise(); document.getElementById('quickSearch').value = ''; }
        else { document.getElementById('searchFeedback').style.display='block'; setTimeout(()=>document.getElementById('searchFeedback').style.display='none',2000); }
    }
    document.addEventListener('keypress', e => { if (e.key==='Enter' && document.activeElement.id==='quickSearch') goToExercise(); });

    async function init() {
        initTheme();
        try {
            const res = await fetch('TEMA 8.json?t='+Date.now());
            const data = await res.json();
            if (data && Array.isArray(data) && data.length) { exercises = data; renderList(); renderExercise(); }
            else throw new Error('JSON vacío');
        } catch(e) { cardEl.innerHTML = `<div class="meta-item" style="border-color:var(--color-danger)"><h3>Error</h3><p>${e.message}</p></div>`; }
    }

    function renderList() {
        listEl.innerHTML = '';
        const grouped = exercises.reduce((acc, ex, i) => {
            const tag = ex.tag||'Otros';
            if (!acc[tag]) acc[tag] = [];
            acc[tag].push({ data:ex, idx:i });
            return acc;
        },{});
        for (const [tag, items] of Object.entries(grouped)) {
            const det = document.createElement('details'); det.className='nav-group';
            if (items.some(it=>it.idx===current)) det.open = true;
            det.innerHTML = `<summary><span>${tag}</span><span class="badge">${items.length}</span></summary>`;
            const div = document.createElement('div'); div.className='group-items';
            items.forEach(it => {
                const btn = document.createElement('button');
                btn.className = 'exercise-btn'+(it.idx===current?' active':'');
                btn.innerHTML = `<strong>Ej. ${it.data.id}</strong><span>${it.data.title}</span>`;
                btn.onclick = () => { current = it.idx; renderList(); renderExercise(); };
                div.appendChild(btn);
            });
            det.appendChild(div);
            listEl.appendChild(det);
        }
    }

    function renderExercise() {
        const ex = exercises[current];
        let html = `<div class="eyebrow">${ex.tag}</div><h2>${ex.title}</h2><p>${ex.statement}</p>
        <div class="meta-grid">
            <div class="meta-item"><small>Fuente</small>${ex.source}</div>
            <div class="meta-item"><small>Objetivo</small>${ex.objective}</div>
            <div class="meta-item"><small>Formato</small>Estudio guiado</div>
            <div class="meta-item"><small>Competencia</small>DCL</div>
        </div>
        <div class="section-block">
            <div class="mode-switch">
                <button class="${mode==='study'?'active':''}" onclick="setMode('study')">Estudio</button>
                <button class="${mode==='solution'?'active':''}" onclick="setMode('solution')">Solución</button>
            </div>
            <h3>Datos</h3><div class="highlight"><ul>${ex.givens.map(g=>`<li>${g}</li>`).join('')}</ul></div>
        </div>`;
        if (mode==='study') html += renderStudy(ex);
        else {
            const sol = renderSolution(ex);
            const marker = '</div>\n\n        <div class="section-block">\n          <h3>Fórmulas usadas</h3>';
            const parts = sol.split(marker);
            if (parts.length>1) {
                html += parts[0]; cardEl.innerHTML = html; MathJax.typesetPromise(); renderFigure(ex);
                cardEl.innerHTML += marker + parts[1]; MathJax.typesetPromise();
            } else {
                html += sol; cardEl.innerHTML = html; MathJax.typesetPromise(); renderFigure(ex);
            }
            return;
        }
        cardEl.innerHTML = html; MathJax.typesetPromise(); renderFigure(ex);
    }

    function renderStudy(ex) {
        if (!ex.checklist) ex.checklist = [];
        if (!ex.hints) ex.hints = [];
        if (!ex.quiz) ex.quiz = { question: "N/A", options: [], correct: 0, feedback: "" };
        return `<div class="section-block"><h3>Antes de resolver</h3><div class="highlight"><ul>${ex.checklist.map(c=>`<li>${c}</li>`).join('')}</ul></div></div>
        <div class="section-block"><h3>Pistas</h3>${ex.hints.map(h=>`<details><summary>${h.title}</summary><p>${h.body}</p></details>`).join('')}</div>
        <div class="section-block"><h3>Mini test</h3><div class="question"><p><strong>${ex.quiz.question}</strong></p><div class="options">${ex.quiz.options.map((o,i)=>`<button class="option" onclick="checkAnswer(${i})">${o}</button>`).join('')}</div><div class="feedback" id="feedback">Elige una respuesta</div></div></div>`;
    }

    function renderSolution(ex) {
        if (!ex.strategy) ex.strategy = "";
        if (!ex.formulas) ex.formulas = [];
        if (!ex.steps) ex.steps = [];
        if (!ex.solution) ex.solution = [];
        if (!ex.mistakes) ex.mistakes = [];
        return `<div class="section-block"><h3>Estrategia</h3><p>${ex.strategy}</p></div>
        <div class="section-block"><h3>Fórmulas usadas</h3><div class="formula-box">${ex.formulas.map(f=>`<p>${f}</p>`).join('')}</div></div>
        <div class="section-block"><h3>Cálculo paso a paso</h3><ol class="steps">${ex.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
        <div class="section-block"><h3>Resultado</h3><div class="highlight"><ul>${ex.solution.map(s=>`<li>${s}</li>`).join('')}</ul></div></div>
        <div class="section-block"><h3>Errores típicos</h3><ul>${ex.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul></div>`;
    }

    // ── Funciones de diagrama ──
    function getForceStyle(label) {
        const t = label.toLowerCase();
        if (t.includes('n') && (t.includes('normal') || t==='n')) return {color:'#10b981',marker:'arrowGreen',class:'normal'};
        if (t.includes('p') && (t.includes('peso')||t.includes('p∥')||t.includes('p⊥')||t==='p')) return {color:'#f59e0b',marker:'arrowYellow',class:'peso'};
        if (t.includes('fr')||t.includes('fric')||t.includes('rozamiento')) return {color:'#ef4444',marker:'arrowRed',class:'friccion'};
        if (t.includes('t')&&(t.includes('tens')||t==='t')) return {color:'#8b5cf6',marker:'arrowPurple',class:'tension'};
        if (t.includes('f')&&(t.includes('aplic')||t.includes('externa')||t.match(/^f\d*$/i))) return {color:'#3b82f6',marker:'arrowBlue',class:'aplicada'};
        if (t.includes('p')&&(t.includes('momento')||t.match(/^p\d*$/i))) return {color:'#ec4899',marker:'arrowPink',class:'momento'};
        return {color:'#94a3b8',marker:'arrowGray',class:'default'};
    }
    function standardDefs() {
        return `<defs>
            <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker>
            <marker id="arrowYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker>
            <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b82f6"/></marker>
            <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
            <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker>
            <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
            <marker id="arrowGreen2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker>
            <marker id="arrowYellow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
            <marker id="arrowRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker>
            <marker id="arrowBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b82f6"/></marker>
            <marker id="arrowPurple2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker>
        </defs>`;
    }
    function drawArrow(x1,y1,x2,y2,label,dir) {
        const s = getForceStyle(label);
        let anchor = 'start', tx, ty;
        if (dir==='left') anchor='end';
        if (dir==='right') { tx=x2+10; ty=y2-10; }
        else if (dir==='left') { tx=x2-10; ty=y2-10; }
        else if (dir==='up') { tx=x2+10; ty=y2-5; }
        else if (dir==='down') { tx=x2+10; ty=y2+15; }
        else { tx=x2+10; ty=y2-10; }
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s.color}" stroke-width="5" marker-end="url(#${s.marker})"/><text x="${tx}" y="${ty}" fill="${s.color}" font-size="14" font-weight="700" text-anchor="${anchor}">${label}</text>`;
    }

    function horizontalFigure(dcl) {
        const lbl = dcl.labels || {};
        let a = '';
        if (lbl.up && visibility.normal) a += drawArrow(210,150,210,70,lbl.up,'up');
        if (lbl.down && visibility.peso) a += drawArrow(210,220,210,255,lbl.down,'down');
        if (lbl.left && visibility.friccion) a += drawArrow(150,185,80,185,lbl.left,'left');
        if (lbl.right && visibility.friccion) a += drawArrow(270,185,350,185,lbl.right,'right');
        return `<svg viewBox="0 0 420 280">${standardDefs()}<rect x="40" y="220" width="340" height="8" rx="4" fill="#64748b"/><rect x="150" y="150" width="120" height="70" rx="12" fill="#60a5fa" opacity="0.9"/>${a}</svg>`;
    }

    function horizontalTwoBlocksFigure(dcl) {
        const lb = (dcl.labels||{}).leftBlock||{}, rb = (dcl.labels||{}).rightBlock||{};
        let a = '';
        if (lb.up&&visibility.normal) a+=drawArrow(145,160,145,90,lb.up,'up');
        if (lb.down&&visibility.peso) a+=drawArrow(145,230,145,260,lb.down,'down');
        if (lb.left&&visibility.friccion) a+=drawArrow(100,195,50,195,lb.left,'left');
        if (lb.right&&visibility.friccion) a+=drawArrow(190,195,240,195,lb.right,'right');
        if (rb.up&&visibility.normal) a+=drawArrow(355,160,355,90,rb.up,'up');
        if (rb.down&&visibility.peso) a+=drawArrow(355,230,355,260,rb.down,'down');
        if (rb.left&&visibility.friccion) a+=drawArrow(310,195,260,195,rb.left,'left');
        if (rb.right&&visibility.friccion) a+=drawArrow(400,195,450,195,rb.right,'right');
        return `<svg viewBox="0 0 500 280">${standardDefs()}<rect x="40" y="230" width="420" height="8" rx="4" fill="#64748b"/><rect x="100" y="160" width="90" height="70" rx="10" fill="#60a5fa" opacity="0.9"/><rect x="310" y="160" width="90" height="70" rx="10" fill="#34d399" opacity="0.9"/>${a}</svg>`;
    }

    function inclinedFigure(dcl) {
        const lbl = dcl.labels || {};
        const rot = parseFloat(dcl.angle)||30;
        let a = `<g transform="translate(220,180) rotate(-${rot})"><rect x="-35" y="-22" width="70" height="44" rx="10" fill="#34d399" opacity="0.9"/>`;
        if (lbl.perp_up&&visibility.normal) a += drawArrow(0,-22,0,-80,lbl.perp_up,'up');
        if (lbl.parallel_up&&visibility.friccion) a += drawArrow(35,0,100,0,lbl.parallel_up,'right');
        if (lbl.parallel_down&&visibility.paralela) a += drawArrow(-35,0,-100,0,lbl.parallel_down,'left');
        if (lbl.perp_down&&visibility.perpendicular) a += drawArrow(0,22,0,85,lbl.perp_down,'down');
        a += `</g>`;
        if (lbl.down&&visibility.peso) a += `<g transform="translate(220,180)">${drawArrow(0,0,0,90,lbl.down,'down')}</g>`;
        return `<svg viewBox="0 0 460 340">${standardDefs()}<path d="M60 270 L380 270 L380 90 Z" fill="#334155"/>${a}<path d="M120 270 A50 50 0 0 0 110 240" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/><text x="130" y="255" fill="#fff" font-size="16" font-weight="700">${dcl.angle||'30°'}</text></svg>`;
    }

    function inclinedExternalFigure(dcl) {
        const lbl = dcl.labels||{};
        const ang = parseFloat(dcl.angle)||30, extAng = dcl.externalAngle||0, extLabel = lbl.external||'F';
        let a = `<g transform="translate(220,180) rotate(-${ang})"><rect x="-35" y="-22" width="70" height="44" rx="10" fill="#34d399" opacity="0.9"/>`;
        if (lbl.perp_up&&visibility.normal) a+=drawArrow(0,-22,0,-80,lbl.perp_up,'up');
        if (lbl.parallel_up&&visibility.friccion) a+=drawArrow(35,0,100,0,lbl.parallel_up,'right');
        if (lbl.parallel_down&&visibility.paralela) a+=drawArrow(-35,0,-100,0,lbl.parallel_down,'left');
        if (extLabel&&visibility.aplicada) {
            const fx=70*Math.cos(extAng*Math.PI/180), fy=-70*Math.sin(extAng*Math.PI/180);
            a+=`<line x1="35" y1="0" x2="${35+fx}" y2="${fy}" stroke="#3b82f6" stroke-width="5" marker-end="url(#arrowBlue)"/><text x="${35+fx+10}" y="${fy-5}" fill="#3b82f6" font-size="14" font-weight="700">${extLabel}</text>`;
        }
        a+=`</g>`;
        if (lbl.down&&visibility.peso) a+=`<g transform="translate(220,180)">${drawArrow(0,0,0,90,lbl.down,'down')}</g>`;
        return `<svg viewBox="0 0 460 340">${standardDefs()}<path d="M60 270 L380 270 L380 90 Z" fill="#334155"/>${a}<path d="M120 270 A50 50 0 0 0 110 240" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/><text x="130" y="255" fill="#fff" font-size="16">${ang}°</text></svg>`;
    }

    function pulleyFigure(dcl) {
        const lbl = dcl.labels||{};
        let a='';
        if (lbl.up&&visibility.tension) a+=drawArrow(180,200,180,140,'T','up');
        if (lbl.down&&visibility.peso) a+=drawArrow(180,250,180,300,lbl.down,'down');
        if (lbl.up_right&&visibility.tension) a+=drawArrow(240,150,240,90,'T','up');
        if (lbl.down_right&&visibility.peso) a+=drawArrow(240,210,240,260,lbl.down_right,'down');
        return `<svg viewBox="0 0 420 320">${standardDefs()}<rect x="160" y="20" width="100" height="10" fill="#64748b" rx="4"/><line x1="210" y1="30" x2="210" y2="80" stroke="#94a3b8" stroke-width="4"/><circle cx="210" cy="100" r="30" fill="#334155" stroke="#cbd5e1" stroke-width="3"/><line x1="180" y1="100" x2="180" y2="200" stroke="#d1d5db" stroke-width="3"/><line x1="240" y1="100" x2="240" y2="150" stroke="#d1d5db" stroke-width="3"/><rect x="155" y="200" width="50" height="50" fill="#60a5fa" rx="6"/><rect x="215" y="150" width="50" height="60" fill="#34d399" rx="6"/>${a}</svg>`;
    }

    function inclinedPulleyFigure(dcl) {
        const lbl = dcl.labels||{}, rot = parseFloat(dcl.angle)||30;
        let a='';
        if (lbl.down_right&&visibility.peso) a+=drawArrow(365,220,365,280,lbl.down_right,'down');
        if (lbl.up_right&&visibility.tension) a+=drawArrow(365,180,365,130,lbl.up_right,'up');
        a+=`<g transform="translate(180,190) rotate(-${rot})"><line x1="35" y1="0" x2="200" y2="0" stroke="#d1d5db" stroke-width="3"/><rect x="-35" y="-22" width="70" height="44" rx="10" fill="#34d399" opacity="0.9"/>`;
        if (lbl.perp_up&&visibility.normal) a+=drawArrow(0,-22,0,-80,lbl.perp_up,'up');
        if (lbl.tension&&visibility.tension) a+=drawArrow(35,-10,90,-10,lbl.tension,'right');
        if (lbl.parallel_up&&visibility.friccion) a+=drawArrow(35,10,90,10,lbl.parallel_up,'right');
        if (lbl.parallel_down&&visibility.paralela) a+=drawArrow(-35,0,-90,0,lbl.parallel_down,'left');
        a+=`</g>`;
        if (lbl.down&&visibility.peso) a+=`<g transform="translate(180,190)">${drawArrow(0,0,0,70,lbl.down,'down')}</g>`;
        return `<svg viewBox="0 0 420 320">${standardDefs()}<path d="M60 260 L350 260 L350 90 Z" fill="#334155"/><circle cx="350" cy="90" r="15" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/><line x1="365" y1="90" x2="365" y2="180" stroke="#d1d5db" stroke-width="3"/><rect x="345" y="180" width="40" height="40" rx="4" fill="#60a5fa"/>${a}<path d="M110 260 A50 50 0 0 0 100 230" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/><text x="120" y="245" fill="#fff" font-size="14" font-weight="700">${dcl.angle||'30°'}</text></svg>`;
    }

    function mcuFigure(dcl) {
        const lbl = dcl.labels||{};
        let a='';
        if (lbl.left && visibility.friccion) a += drawArrow(280,140,160,140,lbl.left,'left');
        if (lbl.up && visibility.paralela) a += drawArrow(280,140,280,60,lbl.up,'up');
        return `<svg viewBox="0 0 420 280">${standardDefs()}
            <path d="M60 200 Q200 100 360 140" stroke="#64748b" stroke-width="20" fill="none" stroke-linecap="round"/>
            <path d="M60 210 Q200 110 360 150" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="8,4"/>
            <g transform="translate(280,135) rotate(-20)"><rect x="-22" y="-12" width="44" height="24" rx="4" fill="#eab308"/><text x="0" y="4" fill="#000" font-size="10" text-anchor="middle" font-weight="700">COCHE</text></g>
            ${a}</svg>`;
    }

    function orbitFigure(dcl) {
        const lbl = dcl.labels||{};
        let a='';
        if (lbl.left&&visibility.peso) a+=drawArrow(345,160,265,160,lbl.left,'left');
        if (lbl.up&&visibility.paralela) a+=drawArrow(360,145,360,65,lbl.up,'up');
        return `<svg viewBox="0 0 420 320">${standardDefs()}<circle cx="210" cy="160" r="45" fill="#eab308" opacity="0.9"/><ellipse cx="210" cy="160" rx="150" ry="60" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8,4"/><circle cx="360" cy="160" r="15" fill="#94a3b8"/>${a}</svg>`;
    }

    function collisionFigure(dcl) {
        const lbl = dcl.labels||{};
        let a='';
        if (lbl.right&&visibility.friccion) a+=drawArrow(160,185,240,185,lbl.right,'right');
        if (lbl.left&&visibility.friccion) a+=drawArrow(260,200,180,200,lbl.left,'left');
        return `<svg viewBox="0 0 420 280">${standardDefs()}<rect x="40" y="220" width="340" height="8" rx="4" fill="#64748b"/><rect x="80" y="150" width="80" height="70" rx="8" fill="#60a5fa" opacity="0.9"/><rect x="260" y="150" width="80" height="70" rx="8" fill="#f87171" opacity="0.9"/>${a}</svg>`;
    }

    function collisionMomentumFigure(dcl) {
        const lbl = dcl.labels||{};
        let a='';
        if (lbl.beforeLeft&&visibility.momento) a+=drawArrow(100,185,50,185,lbl.beforeLeft,'left');
        if (lbl.beforeRight&&visibility.momento) a+=drawArrow(320,185,370,185,lbl.beforeRight,'right');
        if (lbl.afterLeft&&visibility.momento) a+=drawArrow(100,210,50,210,lbl.afterLeft,'left');
        if (lbl.afterRight&&visibility.momento) a+=drawArrow(320,210,370,210,lbl.afterRight,'right');
        return `<svg viewBox="0 0 420 280">${standardDefs()}<rect x="40" y="220" width="340" height="8" rx="4" fill="#64748b"/><rect x="80" y="150" width="80" height="70" rx="8" fill="#60a5fa" opacity="0.9"/><rect x="260" y="150" width="80" height="70" rx="8" fill="#f87171" opacity="0.9"/><text x="120" y="135" fill="#fff" font-size="12" text-anchor="middle">Antes</text><text x="300" y="135" fill="#fff" font-size="12" text-anchor="middle">Después</text>${a}</svg>`;
    }
// ── Nuevo tipo: VERTICAL (ascensor, martillo, grúa...) ──
function verticalFigure(dcl) {
    const lbl = dcl.labels || {};
    let a = '';
    if (lbl.up && visibility.normal) a += drawArrow(210, 110, 210, 40, lbl.up, 'up');
    if (lbl.down && visibility.peso) a += drawArrow(210, 190, 210, 260, lbl.down, 'down');
    // Fuerzas laterales (rozamiento, etc.)
    if (lbl.left && visibility.friccion) a += drawArrow(150, 150, 80, 150, lbl.left, 'left');
    if (lbl.right && visibility.friccion) a += drawArrow(270, 150, 340, 150, lbl.right, 'right');
    return `<svg viewBox="0 0 420 280">${standardDefs()}
        <rect x="40" y="220" width="340" height="10" rx="4" fill="#64748b"/>
        <rect x="160" y="150" width="100" height="70" rx="10" fill="#fbbf24" opacity="0.9"/>
        ${a}</svg>`;
}

// ── Nuevo tipo: TENSION CABLES (ej. 23) ──
function tensionCablesFigure(dcl) {
    const lbl = dcl.labels || {};
    const ang = dcl.angle || 60; // semiángulo con la vertical
    const rad = ang * Math.PI/180;
    const L = 100; // longitud visual de los cables
    const cx = 210, cy = 80; // punto de anclaje al techo (centro)
    // Puntos de anclaje superiores
    const leftX = cx - L * Math.sin(rad);
    const leftY = cy - L * Math.cos(rad);
    const rightX = cx + L * Math.sin(rad);
    const rightY = cy - L * Math.cos(rad);
    let a = '';
    // Cuerdas
    a += `<line x1="${cx}" y1="${cy}" x2="${leftX}" y2="${leftY}" stroke="#94a3b8" stroke-width="3"/>`;
    a += `<line x1="${cx}" y1="${cy}" x2="${rightX}" y2="${rightY}" stroke="#94a3b8" stroke-width="3"/>`;
    // Tensiones (flechas a lo largo de las cuerdas)
    const midLeftX = (cx + leftX)/2, midLeftY = (cy + leftY)/2;
    const midRightX = (cx + rightX)/2, midRightY = (cy + rightY)/2;
    if (lbl.leftT && visibility.tension) {
        const angLeft = Math.atan2(cy - leftY, cx - leftX);
        const tx = midLeftX - 15 * Math.cos(angLeft);
        const ty = midLeftY - 15 * Math.sin(angLeft);
        a += `<line x1="${midLeftX}" y1="${midLeftY}" x2="${tx}" y2="${ty}" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrowPurple)"/>`;
        a += `<text x="${tx-15}" y="${ty-5}" fill="#8b5cf6" font-size="13" font-weight="700">${lbl.leftT}</text>`;
    }
    if (lbl.rightT && visibility.tension) {
        const angRight = Math.atan2(cy - rightY, cx - rightX);
        const tx = midRightX + 15 * Math.cos(angRight);
        const ty = midRightY + 15 * Math.sin(angRight);
        a += `<line x1="${midRightX}" y1="${midRightY}" x2="${tx}" y2="${ty}" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrowPurple)"/>`;
        a += `<text x="${tx+5}" y="${ty-5}" fill="#8b5cf6" font-size="13" font-weight="700">${lbl.rightT}</text>`;
    }
    // Bloque colgante
    a += `<rect x="${cx-18}" y="${cy}" width="36" height="40" rx="6" fill="#f59e0b" opacity="0.9"/>`;
    a += `<text x="${cx}" y="${cy+25}" fill="#000" font-size="12" text-anchor="middle" font-weight="700">${dcl.mass || 'm'}</text>`;
    // Peso
    if (lbl.down && visibility.peso) {
        a += drawArrow(cx, cy+40, cx, cy+100, lbl.down, 'down');
    }
    return `<svg viewBox="0 0 420 280">${standardDefs()}
        <rect x="40" y="10" width="340" height="8" rx="4" fill="#64748b"/>
        ${a}</svg>`;
}

// ── Nuevo tipo: REBOUND (frontón, ej. 30) ──
function reboundFigure(dcl) {
    const lbl = dcl.labels || {};
    let a = '';
    // Pared (izquierda)
    a += `<rect x="60" y="60" width="12" height="160" rx="3" fill="#94a3b8"/>`;
    // Pelota inicial (acercándose)
    a += `<circle cx="260" cy="140" r="14" fill="#60a5fa" opacity="0.8"/>`;
    if (lbl.vin && visibility.paralela) a += drawArrow(274, 140, 340, 140, lbl.vin, 'right');
    // Pelota final (rebotando)
    a += `<circle cx="140" cy="100" r="14" fill="#f87171" opacity="0.8"/>`;
    if (lbl.vout && visibility.paralela) a += drawArrow(126, 100, 60, 100, lbl.vout, 'left');
    // Fuerza de la pared (en el punto de impacto)
    if (lbl.Fwall && visibility.friccion) a += drawArrow(130, 140, 70, 140, lbl.Fwall, 'left');
    return `<svg viewBox="0 0 420 220">${standardDefs()}${a}</svg>`;
}
    function renderFigure(ex) {
        if (!ex.dcl) return;
        let figHtml = '';
        switch (ex.dcl.type) {
            case 'horizontal': figHtml = horizontalFigure(ex.dcl); break;
            case 'horizontalTwoBlocks': figHtml = horizontalTwoBlocksFigure(ex.dcl); break;
            case 'inclined': figHtml = inclinedFigure(ex.dcl); break;
            case 'inclined_external': figHtml = inclinedExternalFigure(ex.dcl); break;
            case 'pulley': figHtml = pulleyFigure(ex.dcl); break;
            case 'inclined_pulley': figHtml = inclinedPulleyFigure(ex.dcl); break;
            case 'mcu': figHtml = mcuFigure(ex.dcl); break;
            case 'orbit': figHtml = orbitFigure(ex.dcl); break;
            case 'collision': figHtml = collisionFigure(ex.dcl); break;
            case 'collisionMomentum': figHtml = collisionMomentumFigure(ex.dcl); break;
            case 'vertical': figHtml = verticalFigure(ex.dcl); break;
            case 'tension_cables': figHtml = tensionCablesFigure(ex.dcl); break;
            case 'rebound': figHtml = reboundFigure(ex.dcl); break;
            default: figHtml = horizontalFigure(ex.dcl);
        }
        // Leyenda dinámica
        const allLabels = new Set();
        function collect(obj) {
            if (!obj) return;
            if (typeof obj === 'string') allLabels.add(obj);
            else if (typeof obj === 'object') Object.values(obj).forEach(v => collect(v));
        }
        collect(ex.dcl.labels);
        const usedClasses = new Set();
        let legend = '';
        for (const label of allLabels) {
            const style = getForceStyle(label);
            if (!usedClasses.has(style.class)) {
                usedClasses.add(style.class);
                legend += `<span class="${style.class}">${labelForce(style.class)}</span>`;
            }
        }
        if (!legend) legend = '<span class="default">Sin fuerzas</span>';
        const block = `<div class="section-block"><h3>Diagrama de sistema</h3><div class="figure-wrap"><div class="figure-tools">${Object.keys(visibility).map(k=>`<button class="toggle ${visibility[k]?'on':''}" onclick="toggleForce('${k}')">${labelForce(k)}</button>`).join('')}</div>${figHtml}<div class="legend">${legend}</div></div></div>`;
        const old = cardEl.querySelector('.figure-host');
        if (old) old.remove();
        const host = document.createElement('div'); host.className = 'figure-host'; host.innerHTML = block;
        cardEl.appendChild(host);
    }

    function labelForce(key) {
        const map = { peso:'Peso', normal:'Normal', friccion:'Rozamiento / F. contacto', paralela:'P∥', perpendicular:'P⊥', tension:'Tensión', aplicada:'F. aplicada', momento:'Momento lineal', default:'Otras' };
        return map[key]||key;
    }
    function toggleForce(key) { visibility[key] = !visibility[key]; renderExercise(); }
    function setMode(m) { mode = m; renderExercise(); }
    function checkAnswer(idx) {
        const ex = exercises[current];
        document.querySelectorAll('.option').forEach((b,i) => {
            b.classList.remove('correct','wrong');
            if (i===ex.quiz.correct) b.classList.add('correct');
            if (i===idx && i!==ex.quiz.correct) b.classList.add('wrong');
        });
        document.getElementById('feedback').textContent = ex.quiz.feedback;
    }
    function initTheme() {
        const root = document.documentElement;
        let cur = window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
        root.setAttribute('data-theme',cur);
        document.getElementById('themeToggle').onclick = () => {
            cur = cur==='dark'?'light':'dark';
            root.setAttribute('data-theme',cur);
        };
    }
    init();
</script>
