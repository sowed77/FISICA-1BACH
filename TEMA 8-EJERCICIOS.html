<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier interactivo · Trabajo y Energía Tema 8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        :root {
            --text-xs: clamp(0.75rem, 0.72rem + 0.2vw, 0.875rem);
            --text-sm: clamp(0.875rem, 0.84rem + 0.2vw, 1rem);
            --text-base: clamp(1rem, 0.97rem + 0.2vw, 1.125rem);
            --text-lg: clamp(1.125rem, 1rem + 0.6vw, 1.35rem);
            --text-xl: clamp(1.45rem, 1.2rem + 1vw, 2rem);
            --text-2xl: clamp(2rem, 1.4rem + 2vw, 3.2rem);
            --space-1: .25rem;
            --space-2: .5rem;
            --space-3: .75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-16: 4rem;
            --radius-sm: .4rem;
            --radius-md: .8rem;
            --radius-lg: 1.1rem;
            --radius-xl: 1.6rem;
            --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 20px 48px rgba(15, 23, 42, 0.12);
            --font-display: 'Literata', Georgia, serif;
            --font-body: 'Inter', sans-serif;
        }

        :root,
        [data-theme="light"] {
            --color-bg: #f4f1eb;
            --color-surface: #fbfaf7;
            --color-surface-2: #f1ede6;
            --color-surface-3: #e7e0d6;
            --color-text: #201c17;
            --color-muted: #6f6a61;
            --color-faint: #9b958c;
            --color-border: rgba(32, 28, 23, 0.12);
            --color-divider: rgba(32, 28, 23, 0.08);
            --color-primary: #0d6b6f;
            --color-primary-soft: rgba(13, 107, 111, 0.1);
            --color-primary-strong: #08484b;
            --color-accent: #c76a2a;
            --color-success: #3f7b3a;
            --color-warning: #a46a00;
            --color-danger: #9c3943;
            --color-hero: linear-gradient(135deg, #fbfaf7 0%, #eee5d8 100%);
        }

        [data-theme="dark"] {
            --color-bg: #171513;
            --color-surface: #201d1a;
            --color-surface-2: #292521;
            --color-surface-3: #332e29;
            --color-text: #ece5da;
            --color-muted: #b4ada2;
            --color-faint: #8f877d;
            --color-border: rgba(236, 229, 218, 0.14);
            --color-divider: rgba(236, 229, 218, 0.09);
            --color-primary: #67b1b1;
            --color-primary-soft: rgba(103, 177, 177, 0.12);
            --color-primary-strong: #9ed0d0;
            --color-accent: #f0aa6d;
            --color-success: #87be78;
            --color-warning: #e0b24c;
            --color-danger: #e08894;
            --color-hero: linear-gradient(135deg, #201d1a 0%, #29231e 100%);
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 20px 48px rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: var(--font-body);
            font-size: var(--text-base);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }
        img, svg { display: block; max-width: 100%; }
        button, input, select { font: inherit; }
        button {
            cursor: pointer;
            border: 0;
            background: none;
            color: inherit;
        }
        .app {
            min-height: 100dvh;
            display: grid;
            grid-template-columns: 320px 1fr;
        }
        .sidebar {
            border-right: 1px solid var(--color-border);
            background: var(--color-surface);
            padding: var(--space-6);
            position: sticky;
            top: 0;
            height: 100dvh;
            overflow: auto;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }
        .logo svg { width: 40px; height: 40px; color: var(--color-primary); }
        .logo-title {
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .logo-sub {
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-muted);
        }
        .sidebar h2 {
            margin: var(--space-8) 0 var(--space-3);
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--color-faint);
        }
        .exercise-list {
            display: grid;
            gap: var(--space-2);
        }
        .nav-group {
            margin-bottom: var(--space-2);
        }
        .nav-group summary {
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            background: var(--color-surface-2);
            color: var(--color-text);
            font-size: var(--text-sm);
            font-weight: 700;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease;
            user-select: none;
        }
        .nav-group summary::-webkit-details-marker { display: none; }
        .nav-group summary:hover { background: var(--color-surface-3); }
        .nav-group .badge {
            background: var(--color-primary-soft);
            color: var(--color-primary);
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
            font-size: 0.70rem;
            font-weight: 800;
        }
        .group-items {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: var(--space-2) 0 var(--space-2) var(--space-3);
            border-left: 2px solid var(--color-surface-2);
            margin-left: var(--space-3);
            margin-top: var(--space-1);
        }
        .exercise-btn {
            width: 100%;
            text-align: left;
            padding: var(--space-3);
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: transparent;
            transition: .18s ease;
            overflow: hidden;
        }
        .exercise-btn:hover,
        .exercise-btn.active {
            background: var(--color-primary-soft);
            border-color: var(--color-border);
        }
        .exercise-btn strong { display: block; font-size: var(--text-sm); }
        .exercise-btn span {
            display: block;
            color: var(--color-muted);
            font-size: var(--text-xs);
            margin-top: .2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .content { padding: var(--space-6); }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }
        .chip-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
        .chip {
            display: inline-flex;
            align-items: center;
            padding: .45rem .75rem;
            border-radius: 999px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            font-size: var(--text-xs);
            color: var(--color-muted);
        }
        .theme-toggle {
            min-width: 44px;
            min-height: 44px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
        }
        .hero {
            background: var(--color-hero);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: clamp(1.5rem, 3vw, 3rem);
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: var(--space-8);
            box-shadow: var(--shadow-sm);
        }
        .eyebrow {
            font-size: var(--text-xs);
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--color-primary);
            font-weight: 800;
            margin-bottom: var(--space-3);
        }
        h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; }
        h1 { font-size: var(--text-2xl); margin-bottom: var(--space-4); }
        h2 { font-size: var(--text-xl); margin-bottom: var(--space-4); }
        h3 { font-size: var(--text-lg); margin-bottom: var(--space-3); }
        .hero p, .card p, .panel p, li { color: var(--color-muted); }
        .hero-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-5); }
        .btn { min-height: 44px; padding: .8rem 1rem; border-radius: 999px; border: 1px solid var(--color-border); font-weight: 700; }
        .btn-primary { background: var(--color-primary); color: white; border-color: transparent; }
        .btn-secondary { background: var(--color-surface); }
        .layout { margin-top: var(--space-4); display: block; }
        .card, .panel {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
        }
        .card { padding: var(--space-6); }
        .panel { padding: var(--space-5); position: sticky; top: var(--space-6); }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--space-3);
            margin-top: var(--space-5);
        }
        .meta-item {
            background: var(--color-surface-2);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
        }
        .meta-item small {
            display: block;
            color: var(--color-faint);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: .25rem;
        }
        .mode-switch {
            display: inline-flex;
            padding: .3rem;
            border-radius: 999px;
            background: var(--color-surface-2);
            border: 1px solid var(--color-border);
            gap: .25rem;
            margin-bottom: var(--space-5);
        }
        .mode-switch button {
            padding: .6rem .9rem;
            border-radius: 999px;
            font-weight: 700;
            color: var(--color-muted);
        }
        .mode-switch button.active {
            background: var(--color-surface);
            color: var(--color-text);
            box-shadow: var(--shadow-sm);
        }
        .section-block {
            border-top: 1px solid var(--color-divider);
            padding-top: var(--space-5);
            margin-top: var(--space-5);
        }
        .highlight {
            background: var(--color-primary-soft);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            color: var(--color-text);
        }
        .steps { display: grid; gap: var(--space-3); margin-top: var(--space-4); }
        details {
            background: var(--color-surface-2);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
        }
        details + details { margin-top: var(--space-3); }
        summary { cursor: pointer; font-weight: 700; color: var(--color-text); }
        .question { display: grid; gap: var(--space-3); margin-top: var(--space-4); }
        .options { display: grid; gap: var(--space-2); }
        .option {
            padding: .85rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            background: var(--color-surface-2);
            text-align: left;
        }
        .option.correct { border-color: rgba(63,123,58,.5); background: rgba(63,123,58,.12); }
        .option.wrong { border-color: rgba(156,57,67,.5); background: rgba(156,57,67,.1); }
        .feedback {
            padding: .9rem 1rem;
            border-radius: var(--radius-md);
            background: var(--color-surface-2);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            min-height: 54px;
        }
        .formula-box {
            padding: var(--space-4);
            background: var(--color-surface-2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            overflow: auto;
        }
        .figure-wrap {
            padding: var(--space-4);
            border-radius: var(--radius-xl);
            background: radial-gradient(circle at top, rgba(13,107,111,.1), transparent 35%), #111827;
            min-height: auto;
            border: 1px solid rgba(255,255,255,.08);
        }
        .figure-wrap svg { max-width: 50%; height: auto; margin: var(--space-4) auto; display: block; }
        .figure-tools { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-4); }
        .toggle {
            padding: .55rem .85rem;
            border-radius: 999px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            color: #dbe4ee;
            font-size: var(--text-xs);
        }
        .toggle.on { background: rgba(255,255,255,.18); color: #fff; }
        .legend { display: grid; gap: var(--space-2); margin-top: var(--space-4); color: #dbe4ee; font-size: var(--text-sm); }
        .legend span::before {
            content: '';
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: .5rem;
            vertical-align: middle;
        }
        .legend .peso::before { background: #f59e0b; }
        .legend .normal::before { background: #10b981; }
        .legend .friccion::before { background: #ef4444; }
        .legend .paralela::before { background: #60a5fa; }
        .legend .perp::before { background: #a78bfa; }
        .legend .tension::before { background: #8b5cf6; }
        .legend .aplicada::before { background: #3b82f6; }
        .legend .momento::before { background: #ec4899; }
        .footer-note { margin-top: var(--space-6); font-size: var(--text-sm); color: var(--color-muted); }
        @media (max-width: 1100px) {
            .app, .hero, .layout { grid-template-columns: 1fr; }
            .sidebar { position: relative; height: auto; }
            .panel { position: relative; top: auto; }
        }
        @media (max-width: 720px) {
            .content, .sidebar { padding: var(--space-4); }
            .meta-grid { grid-template-columns: 1fr 1fr; }
            .topbar { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none" aria-label="Logo">
          <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="3"></circle>
          <path d="M12 30c5-10 19-13 24-3" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
          <circle cx="17" cy="29" r="3" fill="currentColor"></circle>
          <circle cx="31" cy="21" r="3" fill="currentColor"></circle>
        </svg>
        <div>
          <div class="logo-title">Trabajo y Energía · Tema 8</div>
          <div class="logo-sub">Dossier Interactivo</div>
        </div>
      </div>

      <h2>Objetivo</h2>
      <p>Material de estudio con pistas, autocorrección y diagramas.</p>

      <div class="section-block" style="margin-bottom: var(--space-4); border-top: none; padding-top: 0;">
        <h3 style="font-size: var(--text-sm); margin-bottom: var(--space-2);">Acceso rápido</h3>
        <div style="display: flex; gap: var(--space-2);">
          <input type="number" id="quickSearch" placeholder="Ej. 27" 
                 style="width: 100%; padding: var(--space-2); border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface-2); color: var(--color-text); outline: none;">
          <button class="btn btn-primary" onclick="goToExercise()" style="min-height: auto; padding: 0.5rem 1rem; cursor: pointer;">Ir</button>
        </div>
        <small id="searchFeedback" style="color: var(--color-danger); display: none; margin-top: 0.25rem; font-size: 0.7rem;">Ejercicio no encontrado</small>
      </div>
      
      <h2>Ejercicios</h2>
      <div class="exercise-list" id="exerciseList"></div>
    </aside>

    <main class="content">
      <div class="topbar">
        <div class="chip-row">
          <span class="chip">1º Bachillerato</span>
          <span class="chip">Física</span>
          <span class="chip">Valencia · Tema 8</span>
          <span class="chip">Trabajo y energía</span>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">◐</button>
      </div>

      <section class="layout" id="exerciseArea">
        <article class="card" id="exerciseCard">
          <!-- El script de JS inyectará aquí el contenido -->
        </article>
      </section>
    </main>
  </div>

<script>
    // Variables de Estado
    let exercises = [];
    let current = 0;
    let mode = 'study';
    const visibility = { peso: true, normal: true, friccion: true, paralela: true, perpendicular: false, tension: true, aplicada: true, momento: true };

    const listEl = document.getElementById('exerciseList');
    const cardEl = document.getElementById('exerciseCard');

    function goToExercise() {
        const input = document.getElementById('quickSearch');
        const feedback = document.getElementById('searchFeedback');
        const targetId = parseInt(input.value.replace(/\D/g, ''));
        const exerciseIndex = exercises.findIndex(ex => ex.id === targetId);
        if (exerciseIndex !== -1) {
            feedback.style.display = 'none';
            current = exerciseIndex;
            renderList(); 
            renderExercise();
            input.value = '';
            document.getElementById('exerciseArea').scrollIntoView({ behavior: 'smooth' });
        } else {
            feedback.style.display = 'block';
            setTimeout(() => feedback.style.display = 'none', 3000);
        }
    }

    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && document.activeElement.id === 'quickSearch') goToExercise();
    });       

    async function init() {
        initTheme();
        try {
            const response = await fetch('TEMA 8.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error(`Fallo HTTP: ${response.status}`);
            const data = await response.json();
            if (data && Array.isArray(data) && data.length > 0) {
                exercises = data;
                console.log("Dataset cargado. Total ejercicios:", exercises.length);
                listEl.innerHTML = '';
                cardEl.innerHTML = '';
                renderList();
                renderExercise();
            } else throw new Error("El JSON se cargó pero está vacío o no es un array.");
        } catch (error) {
            console.error("Error de inicialización:", error);
            if (cardEl) cardEl.innerHTML = `<div class="mini-card" style="border-color:var(--color-danger)"><h3 style="color:var(--color-danger)">Sistema Offline</h3><p>Error: ${error.message}</p></div>`;
        }
    }

    function renderList() {
      listEl.innerHTML = '';
      const grouped = exercises.reduce((acc, ex, index) => {
        const tag = ex.tag || 'Otros';
        if (!acc[tag]) acc[tag] = [];
        acc[tag].push({ data: ex, absoluteIndex: index });
        return acc;
      }, {});
      for (const [tag, items] of Object.entries(grouped)) {
        const groupEl = document.createElement('details');
        groupEl.className = 'nav-group';
        if (items.some(item => item.absoluteIndex === current)) groupEl.open = true;
        const summaryEl = document.createElement('summary');
        summaryEl.innerHTML = `<span>${tag}</span> <span class="badge">${items.length}</span>`;
        groupEl.appendChild(summaryEl);
        const groupList = document.createElement('div');
        groupList.className = 'group-items';
        items.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'exercise-btn' + (item.absoluteIndex === current ? ' active' : '');
          btn.innerHTML = `<strong>Ej. ${item.data.id}</strong> <span>${item.data.title}</span>`;
          btn.addEventListener('click', () => { current = item.absoluteIndex; renderList(); renderExercise(); });
          groupList.appendChild(btn);
        });
        groupEl.appendChild(groupList);
        listEl.appendChild(groupEl);
      }
    }

    function renderExercise() {
        const ex = exercises[current];
        let html = `
            <div class="eyebrow">${ex.tag}</div>
            <h2 id="exerciseTop">${ex.title}</h2>
            <p>${ex.statement}</p>
            <div class="meta-grid">
            <div class="meta-item"><small>Fuente</small>${ex.source}</div>
            <div class="meta-item"><small>Objetivo</small>${ex.objective}</div>
            <div class="meta-item"><small>Formato</small>Estudio guiado + solución</div>
            <div class="meta-item"><small>Competencia</small>DCL y ecuaciones</div>
            </div>
            <div class="section-block">
            <div class="mode-switch">
                <button class="${mode === 'study' ? 'active' : ''}" onclick="setMode('study')">Modo estudio</button>
                <button class="${mode === 'solution' ? 'active' : ''}" onclick="setMode('solution')">Modo solución</button>
            </div>
            <h3>Datos del problema</h3>
            <div class="highlight"><ul>${ex.givens.map(item => `<li>${item}</li>`).join('')}</ul></div>
            </div>`;
        if (mode === 'study') {
            html += renderStudy(ex);
            cardEl.innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
            renderFigure(ex);
        } else {
            const solutionHtml = renderSolution(ex);
            const marker = '</div>\n\n        <div class="section-block">\n          <h3>Fórmulas usadas</h3>';
            const parts = solutionHtml.split(marker);
            if(parts.length > 1) {
                html += parts[0];
                cardEl.innerHTML = html;
                if (window.MathJax) MathJax.typesetPromise();
                renderFigure(ex);
                cardEl.innerHTML += marker + parts[1];
                if (window.MathJax) MathJax.typesetPromise();
            } else {
                html += solutionHtml;
                cardEl.innerHTML = html;
                if (window.MathJax) MathJax.typesetPromise();
                renderFigure(ex);
            }
        }
    }

    function renderStudy(ex) {
      if(!ex.checklist) ex.checklist = [];
      if(!ex.hints) ex.hints = [];
      if(!ex.quiz) ex.quiz = {question: "N/A", options: [], correct: 0, feedback: ""};
      return `
        <div class="section-block"><h3>Antes de resolver</h3><div class="highlight"><ul>${ex.checklist.map(item => `<li>${item}</li>`).join('')}</ul></div></div>
        <div class="section-block"><h3>Pistas progresivas</h3>${ex.hints.map(h => `<details><summary>${h.title}</summary><p>${h.body}</p></details>`).join('')}</div>
        <div class="section-block"><h3>Mini test</h3><div class="question"><p><strong>${ex.quiz.question}</strong></p><div class="options">${ex.quiz.options.map((opt, i) => `<button class="option" onclick="checkAnswer(${i})">${opt}</button>`).join('')}</div><div class="feedback" id="feedback">Selecciona una respuesta.</div></div></div>`;
    }

    function renderSolution(ex) {
        if(!ex.strategy) ex.strategy = "";
        if(!ex.formulas) ex.formulas = [];
        if(!ex.steps) ex.steps = [];
        if(!ex.solution) ex.solution = [];
        if(!ex.mistakes) ex.mistakes = [];
        return `
            <div class="section-block"><h3>Estrategia</h3><p>${ex.strategy}</p></div>
            <div class="section-block"><h3>Fórmulas usadas</h3><div class="formula-box">${ex.formulas.map(f => `<p>${f}</p>`).join('')}</div></div>
            <div class="section-block"><h3>Cálculo paso a paso</h3><ol class="steps">${ex.steps ? ex.steps.map(s => `<li>${s}</li>`).join('') : ''}</ol></div>
            <div class="section-block"><h3>Resultado</h3><div class="highlight"><ul>${ex.solution.map(item => `<li>${item}</li>`).join('')}</ul></div></div>
            <div class="section-block"><h3>Errores típicos</h3><ul>${ex.mistakes.map(item => `<li>${item}</li>`).join('')}</ul></div>`;
    }

    function getForceStyle(labelText) {
        const text = labelText.toLowerCase();
        if (text.includes('n') && (text.includes('normal') || text === 'n')) return { color: '#10b981', marker: 'arrowGreen', class: 'normal' };
        if (text.includes('p') && (text.includes('peso') || text.includes('p∥') || text.includes('p⊥') || text === 'p')) return { color: '#f59e0b', marker: 'arrowYellow', class: 'peso' };
        if (text.includes('fr') || text.includes('fric') || text.includes('rozamiento')) return { color: '#ef4444', marker: 'arrowRed', class: 'friccion' };
        if (text.includes('t') && (text.includes('tens') || text === 't')) return { color: '#8b5cf6', marker: 'arrowPurple', class: 'tension' };
        if (text.includes('f') && (text.includes('aplic') || text.includes('externa') || text.match(/^f\d*$/i))) return { color: '#3b82f6', marker: 'arrowBlue', class: 'aplicada' };
        if (text.includes('p') && (text.includes('momento') || text.match(/^p\d*$/i))) return { color: '#ec4899', marker: 'arrowPink', class: 'momento' };
        return { color: '#94a3b8', marker: 'arrowGray', class: 'default' };
    }

    function standardDefs() {
        return `<defs>
            <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker>
            <marker id="arrowYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
            <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
            <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/></marker>
            <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899"/></marker>
            <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
            <marker id="arrowGreen2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/></marker>
            <marker id="arrowYellow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
            <marker id="arrowRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
            <marker id="arrowBlue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
            <marker id="arrowPurple2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/></marker>
        </defs>`;
    }

    function drawArrow(x1, y1, x2, y2, label, dir) {
        const style = getForceStyle(label);
        let anchor = 'start';
        if (dir === 'left') anchor = 'end';
        let tx, ty;
        if (dir === 'right') { tx = x2 + 10; ty = y2 - 10; }
        else if (dir === 'left') { tx = x2 - 10; ty = y2 - 10; }
        else if (dir === 'up') { tx = x2 + 10; ty = y2 - 5; }
        else if (dir === 'down') { tx = x2 + 10; ty = y2 + 15; }
        else { tx = x2 + 10; ty = y2 - 10; }
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${style.color}" stroke-width="5" marker-end="url(#${style.marker})"/><text x="${tx}" y="${ty}" fill="${style.color}" font-size="14" font-weight="700" text-anchor="${anchor}">${label}</text>`;
    }

    function horizontalFigure(dcl) {
        const lbl = dcl.labels || {};
        let arrows = '';
        if (lbl.up && visibility.normal) arrows += drawArrow(210, 150, 210, 70, lbl.up, 'up');
        if (lbl.down && visibility.peso) arrows += drawArrow(210, 220, 210, 255, lbl.down, 'down');
        if (lbl.left && visibility.friccion) arrows += drawArrow(150, 185, 80, 185, lbl.left, 'left');
        if (lbl.right && visibility.friccion) arrows += drawArrow(270, 185, 350, 185, lbl.right, 'right');
        return `<svg viewBox="0 0 420 280" aria-label="Bloque horizontal" role="img">${standardDefs()}<rect x="40" y="220" width="340" height="8" rx="4" fill="#64748b"/><rect x="150" y="150" width="120" height="70" rx="12" fill="#60a5fa" opacity="0.9"/>${arrows}</svg>`;
    }

    function horizontalTwoBlocksFigure(dcl) {
        const lbl = dcl.labels || {};
        const lb = lbl.leftBlock || {}, rb = lbl.rightBlock || {};
        let arrows = '';
        if (lb.up && visibility.normal) arrows += drawArrow(145, 160, 145, 90, lb.up, 'up');
        if (lb.down && visibility.peso) arrows += drawArrow(145, 230, 145, 260, lb.down, 'down');
        if (lb.left && visibility.friccion) arrows += drawArrow(100, 195, 50, 195, lb.left, 'left');
        if (lb.right && visibility.friccion) arrows += drawArrow(190, 195, 240, 195, lb.right, 'right');
        if (rb.up && visibility.normal) arrows += drawArrow(355, 160, 355, 90, rb.up, 'up');
        if (rb.down && visibility.peso) arrows += drawArrow(355, 230, 355, 260, rb.down, 'down');
        if (rb.left && visibility.friccion) arrows += drawArrow(310, 195, 260, 195, rb.left, 'left');
        if (rb.right && visibility.friccion) arrows += drawArrow(400, 195, 450, 195, rb.right, 'right');
        return `<svg viewBox="0 0 500 280" aria-label="Dos bloques" role="img">${standardDefs()}<rect x="40" y="230" width="420" height="8" rx="4" fill="#64748b"/><rect x="100" y="160" width="90" height="70" rx="10" fill="#60a5fa" opacity="0.9"/><rect x="310" y="160" width="90" height="70" rx="10" fill="#34d399" opacity="0.9"/>${arrows}</svg>`;
    }

    function inclinedFigure(dcl) {
        const lbl = dcl.labels || {};
        const rot = parseFloat(dcl.angle) || 30;
        let arrows = '';
        arrows += `<g transform="translate(205, 175) rotate(-${rot})"><rect x="-35" y="-22" width="70" height="44" rx="10" fill="#34d399" opacity="0.9"/>`;
        if (lbl.perp_up && visibility.normal) arrows += drawArrow(0, -22, 0, -80, lbl.perp_up, 'up');
        if (lbl.parallel_up && visibility.friccion) arrows += drawArrow(35, 0, 100, 0, lbl.parallel_up, 'right');
        if (lbl.parallel_down && visibility.paralela) arrows += drawArrow(-35, 0, -100, 0, lbl.parallel_down, 'left');
        if (lbl.perp_down && visibility.perpendicular) arrows += drawArrow(0, 22, 0, 85, lbl.perp_down, 'down');
        arrows += `</g>`;
        if (lbl.down && visibility.peso) arrows += `<g transform="translate(205, 175)">${drawArrow(0, 0, 0, 90, lbl.down, 'down')}</g>`;
        return `<svg viewBox="0 0 420 320" aria-label="Plano inclinado" role="img">${standardDefs()}<path d="M60 260 L350 260 L350 90 Z" fill="#334155"/>${arrows}<path d="M110 260 A 50 50 0 0 0 100 230" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/><text x="120" y="245" fill="#fff" font-size="16" font-weight="700">${dcl.angle||'30°'}</text></svg>`;
    }

    function inclinedExternalFigure(dcl) {
        const lbl = dcl.labels || {};
        const ang = parseFloat(dcl.angle) || 30;
        const extAngle = dcl.externalAngle || 0;
        const extLabel = lbl.external || 'F';
        let arrows = '';
        arrows += `<g transform="translate(205, 175) rotate(-${ang})"><rect x="-35" y="-22" width="70" height="44" rx="10" fill="#34d399" opacity="0.9"/>`;
        if (lbl.perp_up && visibility.normal) arrows += drawArrow(0, -22, 0, -80, lbl.perp_up, 'up');
        if (lbl.parallel_up && visibility.friccion) arrows += drawArrow(35, 0, 100, 0, lbl.parallel_up, 'right');
        if (lbl.parallel_down && visibility.paralela) arrows += drawArrow(-35, 0, -100, 0, lbl.parallel_down, 'left');
        if (extLabel && visibility.aplicada) {
            const fx = 70 * Math.cos(extAngle * Math.PI / 180);
            const fy = -70 * Math.sin(extAngle * Math.PI / 180);
            arrows += `<line x1="35" y1="0" x2="${35 + fx}" y2="${fy}" stroke="#3b82f6" stroke-width="5" marker-end="url(#arrowBlue)"/><text x="${35 + fx + 10}" y="${fy - 5}" fill="#3b82f6" font-size="14" font-weight="700">${extLabel}</text>`;
        }
        arrows += `</g>`;
        if (lbl.down && visibility.peso) arrows += `<g transform="translate(205, 175)">${drawArrow(0, 0, 0, 90, lbl.down, 'down')}</g>`;
        return `<svg viewBox="0 0 420 320" aria-label="Plano inclinado con fuerza externa" role="img">${standardDefs()}<path d="M60 260 L350 260 L350 90 Z" fill="#334155"/>${arrows}<path d="M110 260 A 50 50 0 0 0 100 230" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/><text x="120" y="245" fill="#fff" font-size="16" font-weight="700">${ang}°</text></svg>`;
    }

    function pulleyFigure(dcl) {
        const lbl = dcl.labels || {};
        let arrows = '';
        if (lbl.up && visibility.tension) arrows += drawArrow(180, 200, 180, 140, 'T', 'up');
        if (lbl.down && visibility.peso) arrows += drawArrow(180, 250, 180, 300, lbl.down, 'down');
        if (lbl.up_right && visibility.tension) arrows += drawArrow(240, 150, 240, 90, 'T', 'up');
        if (lbl.down_right && visibility.peso) arrows += drawArrow(240, 210, 240, 260, lbl.down_right, 'down');
        return `<svg viewBox="0 0 420 320" aria-label="Polea" role="img">${standardDefs()}<rect x="160" y="20" width="100" height="10" fill="#64748b" rx="4"/><line x1="210" y1="30" x2="210" y2="80" stroke="#94a3b8" stroke-width="4"/><circle cx="210" cy="100" r="30" fill="#334155" stroke="#cbd5e1" stroke-width="3"/><line x1="180" y1="100" x2="180" y2="200" stroke="#d1d5db" stroke-width="3"/><line x1="240" y1="100" x2="240" y2="150" stroke="#d1d5db" stroke-width="3"/><rect x="155" y="200" width="50" height="50" fill="#60a5fa" rx="6"/><rect x="215" y="150" width="50" height="60" fill="#34d399" rx="6"/>${arrows}</svg>`;
    }

    function inclinedPulleyFigure(dcl) {
        const lbl = dcl.labels || {};
        const rot = parseFloat(dcl.angle) || 30;
        let arrows = '';
        if (lbl.down_right && visibility.peso) arrows += drawArrow(365, 220, 365, 280, lbl.down_right, 'down');
        if (lbl.up_right && visibility.tension) arrows += drawArrow(365, 180, 365, 130, lbl.up_right, 'up');
        arrows += `<g transform="translate(180, 190) rotate(-${rot})"><line x1="35" y1="0" x2="200" y2="0" stroke="#d1d5db" stroke-width="3"/><rect x="-35" y="-22" width="70" height="44" rx="10" fill="#34d399" opacity="0.9"/>`;
        if (lbl.perp_up && visibility.normal) arrows += drawArrow(0, -22, 0, -80, lbl.perp_up, 'up');
        if (lbl.tension && visibility.tension) arrows += drawArrow(35, -10, 90, -10, lbl.tension, 'right');
        if (lbl.parallel_up && visibility.friccion) arrows += drawArrow(35, 10, 90, 10, lbl.parallel_up, 'right');
        if (lbl.parallel_down && visibility.paralela) arrows += drawArrow(-35, 0, -90, 0, lbl.parallel_down, 'left');
        arrows += `</g>`;
        if (lbl.down && visibility.peso) arrows += `<g transform="translate(180, 190)">${drawArrow(0, 0, 0, 70, lbl.down, 'down')}</g>`;
        return `<svg viewBox="0 0 420 320" aria-label="Plano inclinado con polea" role="img">${standardDefs()}<path d="M60 260 L350 260 L350 90 Z" fill="#334155"/><circle cx="350" cy="90" r="15" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/><line x1="365" y1="90" x2="365" y2="180" stroke="#d1d5db" stroke-width="3"/><rect x="345" y="180" width="40" height="40" rx="4" fill="#60a5fa"/>${arrows}<path d="M110 260 A 50 50 0 0 0 100 230" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/><text x="120" y="245" fill="#fff" font-size="14" font-weight="700">${dcl.angle||'30°'}</text></svg>`;
    }

    function orbitFigure(dcl) {
        const lbl = dcl.labels || {};
        let arrows = '';
        if (lbl.left && visibility.peso) arrows += drawArrow(345, 160, 265, 160, lbl.left, 'left');
        if (lbl.up && visibility.paralela) arrows += drawArrow(360, 145, 360, 65, lbl.up, 'up');
        return `<svg viewBox="0 0 420 320" aria-label="Órbita" role="img">${standardDefs()}<circle cx="210" cy="160" r="45" fill="#eab308" opacity="0.9"/><ellipse cx="210" cy="160" rx="150" ry="60" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8,4"/><circle cx="360" cy="160" r="15" fill="#94a3b8"/>${arrows}</svg>`;
    }

    function collisionFigure(dcl) {
        const lbl = dcl.labels || {};
        let arrows = '';
        if (lbl.right && visibility.friccion) arrows += drawArrow(160, 185, 240, 185, lbl.right, 'right');
        if (lbl.left && visibility.friccion) arrows += drawArrow(260, 200, 180, 200, lbl.left, 'left');
        return `<svg viewBox="0 0 420 280" aria-label="Colisión" role="img">${standardDefs()}<rect x="40" y="220" width="340" height="8" rx="4" fill="#64748b"/><rect x="80" y="150" width="80" height="70" rx="8" fill="#60a5fa" opacity="0.9"/><rect x="260" y="150" width="80" height="70" rx="8" fill="#f87171" opacity="0.9"/>${arrows}</svg>`;
    }

    function collisionMomentumFigure(dcl) {
        const lbl = dcl.labels || {};
        let arrows = '';
        if (lbl.beforeLeft && visibility.momento) arrows += drawArrow(100, 185, 50, 185, lbl.beforeLeft, 'left');
        if (lbl.beforeRight && visibility.momento) arrows += drawArrow(320, 185, 370, 185, lbl.beforeRight, 'right');
        if (lbl.afterLeft && visibility.momento) arrows += drawArrow(100, 210, 50, 210, lbl.afterLeft, 'left');
        if (lbl.afterRight && visibility.momento) arrows += drawArrow(320, 210, 370, 210, lbl.afterRight, 'right');
        return `<svg viewBox="0 0 420 280" aria-label="Momento en colisión" role="img">${standardDefs()}<rect x="40" y="220" width="340" height="8" rx="4" fill="#64748b"/><rect x="80" y="150" width="80" height="70" rx="8" fill="#60a5fa" opacity="0.9"/><rect x="260" y="150" width="80" height="70" rx="8" fill="#f87171" opacity="0.9"/><text x="120" y="135" fill="#fff" font-size="12" text-anchor="middle">Antes</text><text x="300" y="135" fill="#fff" font-size="12" text-anchor="middle">Después</text>${arrows}</svg>`;
    }

    function renderFigure(ex) {
        if (!ex.dcl) return '';
        let figureHtml = '', legendHtml = '';
        switch (ex.dcl.type) {
            case 'horizontal': figureHtml = horizontalFigure(ex.dcl); legendHtml = '<span class="peso">Peso</span><span class="normal">Normal</span><span class="friccion">Fuerzas X</span>'; break;
            case 'horizontalTwoBlocks': figureHtml = horizontalTwoBlocksFigure(ex.dcl); legendHtml = '<span class="peso">Peso</span><span class="normal">Normal</span><span class="friccion">Fuerzas contacto / Tensión</span>'; break;
            case 'inclined': figureHtml = inclinedFigure(ex.dcl); legendHtml = '<span class="peso">Peso</span><span class="normal">Normal</span><span class="friccion">F. Externa / Fr</span><span class="paralela">P∥</span><span class="perp">P⊥</span>'; break;
            case 'inclined_external': figureHtml = inclinedExternalFigure(ex.dcl); legendHtml = '<span class="peso">Peso</span><span class="normal">Normal</span><span class="friccion">Fricción</span><span class="aplicada">Fuerza aplicada</span><span class="paralela">P∥</span>'; break;
            case 'pulley': figureHtml = pulleyFigure(ex.dcl); legendHtml = '<span class="peso">Pesos</span><span class="tension">Tensión</span>'; break;
            case 'inclined_pulley': figureHtml = inclinedPulleyFigure(ex.dcl); legendHtml = '<span class="peso">Pesos</span><span class="normal">Normal</span><span class="tension">Tensión</span><span class="friccion">Fricción</span><span class="paralela">P∥</span>'; break;
            case 'orbit': figureHtml = orbitFigure(ex.dcl); legendHtml = '<span class="peso">F. Centrípeta / Gravitatoria</span><span class="paralela">Velocidad Tangencial</span>'; break;
            case 'collision': figureHtml = collisionFigure(ex.dcl); legendHtml = '<span class="friccion">Vectores de Momento (p) / Impulso</span>'; break;
            case 'collisionMomentum': figureHtml = collisionMomentumFigure(ex.dcl); legendHtml = '<span class="momento">Momento antes</span><span class="momento">Momento después</span>'; break;
            default: figureHtml = horizontalFigure(ex.dcl); legendHtml = '<span class="peso">Peso</span><span class="normal">Normal</span>';
        }
        const figureBlock = `<div class="section-block"><h3>Diagrama de sistema</h3><div class="figure-wrap"><div class="figure-tools">${Object.keys(visibility).map(key => `<button class="toggle ${visibility[key] ? 'on' : ''}" onclick="toggleForce('${key}')">${labelForce(key)}</button>`).join('')}</div>${figureHtml}<div class="legend">${legendHtml}</div></div></div>`;
        const existing = cardEl.querySelector('.figure-host');
        if (existing) existing.remove();
        const holder = document.createElement('div');
        holder.className = 'figure-host';
        holder.innerHTML = figureBlock;
        cardEl.appendChild(holder);
    }

    function labelForce(key) {
        const labels = { peso: 'Peso', normal: 'Normal', friccion: 'Rozamiento / F. contacto', paralela: 'P∥', perpendicular: 'P⊥', tension: 'Tensión', aplicada: 'F. aplicada', momento: 'Momento lineal' };
        return labels[key] || key;
    }

    function toggleForce(key) { visibility[key] = !visibility[key]; renderExercise(); }
    function setMode(newMode) { mode = newMode; renderExercise(); }
    function checkAnswer(index) {
        const ex = exercises[current];
        const buttons = [...document.querySelectorAll('.option')];
        buttons.forEach((btn, i) => {
            btn.classList.remove('correct', 'wrong');
            if (i === ex.quiz.correct) btn.classList.add('correct');
            if (i === index && i !== ex.quiz.correct) btn.classList.add('wrong');
        });
        document.getElementById('feedback').textContent = ex.quiz.feedback;
    }
    function initTheme() {
        const root = document.documentElement;
        let currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', currentTheme);
        document.getElementById('themeToggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', currentTheme);
        });
    }
    init();
</script>
</body>
</html>
