<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratori: Sistemes Lligats (La Politja)</title>
    <!-- Biblioteques -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        /* Dibuix de la corda */
        .rope-horizontal { border-bottom: 2px dashed #94a3b8; }
        .rope-vertical { border-right: 2px dashed #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            var { Play, RotateCcw, Info, Settings, ArrowRight, ArrowDown, ArrowUp, ArrowLeft, GripHorizontal } = icons;

            var App = () => {
                // Paràmetres del sistema
                const [m1, setM1] = useState(5); // Massa a la taula (kg)
                const [m2, setM2] = useState(3); // Massa penjant (kg)
                const [mu, setMu] = useState(0.2); // Coeficient de fregament
                const g = 9.8; // Gravetat (m/s^2)

                // Estats de l'animació
                const [pos, setPos] = useState(0); // Posició compartida pels dos blocs
                const [vel, setVel] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // Càlculs físics
                const p2 = m2 * g;
                const normal = m1 * g;
                const fr_max = mu * normal;

                // Es mou el sistema? Només si el pes 2 supera el fregament màxim de 1
                const canMove = p2 > fr_max;
                
                // Acceleració
                const a = canMove ? (p2 - fr_max) / (m1 + m2) : 0;
                
                // Tensió: T = m2 * (g - a)
                const tensio = m2 * (g - a);
                
                // Fregament real (si no es mou, el fregament és exactament igual al pes que estira)
                const fr_real = canMove ? fr_max : p2;

                const maxPos = 180; // Límit abans que el bloc 1 caiga per la vora

                useEffect(() => {
                    let interval;
                    if (isMoving && pos < maxPos) {
                        interval = setInterval(() => {
                            setVel(v => v + a * 0.05);
                            setPos(p => {
                                const newP = p + vel;
                                if (newP >= maxPos) {
                                    setIsMoving(false); // Atura a la vora de la taula
                                    return maxPos;
                                }
                                return newP;
                            });
                        }, 20);
                    }
                    return () => clearInterval(interval);
                }, [isMoving, pos, vel, a]);

                const handlePlay = () => {
                    if (canMove && pos < maxPos) setIsMoving(true);
                };

                const reset = () => {
                    setPos(0);
                    setVel(0);
                    setIsMoving(false);
                };

                // Comprovem si ha xocat
                const isCrashed = pos >= maxPos;

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Sistemes Lligats</span>
                                <h1 className="text-3xl font-black text-blue-400 uppercase tracking-tight tracking-widest">La Corriola Simple</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciat típic:</strong> Dos blocs de masses m<sub>1</sub> (a la taula) i m<sub>2</sub> (penjant) estan units per un fil sense massa que passa per una politja. Calcula l'acceleració del sistema i la tensió de la corda si el coeficient de fregament és μ.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Visualització Gràfica */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col pt-10">
                                
                                {/* Dades flotants */}
                                <div className="absolute top-4 left-4 grid grid-cols-2 gap-2 z-30">
                                    <div className="bg-slate-900/90 p-2 rounded-lg border border-slate-700">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Acceleració</p>
                                        <p className="text-sm font-mono font-black text-blue-400">{a.toFixed(2)} m/s²</p>
                                    </div>
                                    <div className="bg-slate-900/90 p-2 rounded-lg border border-slate-700">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Tensió (T)</p>
                                        <p className="text-sm font-mono font-black text-indigo-400">{tensio.toFixed(1)} N</p>
                                    </div>
                                </div>

                                {/* Escenari de la Taula */}
                                <div className="relative w-full h-full mt-10">
                                    {/* La Taula */}
                                    <div className="absolute top-20 left-0 w-[70%] h-64 bg-slate-700 border-r-8 border-t-8 border-slate-600 rounded-tr-lg"></div>
                                    
                                    {/* La Politja */}
                                    <div className="absolute top-16 right-[28%] w-10 h-10 bg-slate-500 border-4 border-slate-400 rounded-full z-20 flex items-center justify-center shadow-lg">
                                        <div className="w-2 h-2 bg-slate-900 rounded-full"></div>
                                    </div>

                                    {/* Corda Horitzontal */}
                                    <div 
                                        className="absolute top-20 rope-horizontal h-0.5 z-10 transition-all"
                                        style={{ left: `${pos + 60}px`, width: `calc(70% - ${pos + 80}px)` }}
                                    ></div>

                                    {/* Corda Vertical */}
                                    <div 
                                        className="absolute right-[28%] top-24 rope-vertical w-0.5 z-10 transition-all"
                                        style={{ height: `${pos + 40}px`, right: `calc(28% + 18px)` }}
                                    ></div>

                                    {/* Bloc 1 (Massa 1 a la taula) */}
                                    <div 
                                        className="absolute top-8 h-12 bg-emerald-500 border-2 border-emerald-300 rounded-lg flex items-center justify-center z-20 shadow-md transition-all"
                                        style={{ left: `${pos + 20}px`, width: `${m1 * 5 + 30}px` }}
                                    >
                                        <span className="font-black text-emerald-950 text-xs">m<sub>1</sub></span>
                                        
                                        {/* Vector Tensió (Dreta) */}
                                        <div className="absolute left-full top-1/2 -translate-y-1/2 flex items-center pl-1" style={{ width: tensio }}>
                                            <div className="h-0.5 bg-blue-400 w-full relative">
                                                <div className="absolute right-0 -top-1.5">{ArrowRight && <ArrowRight size={14} className="text-blue-400" />}</div>
                                            </div>
                                            <span className="ml-1 text-[8px] font-bold text-blue-300">T</span>
                                        </div>
                                        
                                        {/* Vector Fregament (Esquerra) */}
                                        <div className="absolute right-full top-1/2 -translate-y-1/2 flex items-center pr-1" style={{ width: fr_real }}>
                                            <span className="mr-1 text-[8px] font-bold text-red-400">Fr</span>
                                            <div className="h-0.5 bg-red-400 w-full relative">
                                                <div className="absolute left-0 -top-1.5">{ArrowLeft && <ArrowLeft size={14} className="text-red-400" />}</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Bloc 2 (Massa 2 Penjant) */}
                                    <div 
                                        className="absolute bg-orange-500 border-2 border-orange-300 rounded-lg flex items-center justify-center z-20 shadow-xl transition-all"
                                        style={{ top: `${pos + 60}px`, right: `calc(28% + 6px)`, width: '24px', height: `${m2 * 5 + 30}px` }}
                                    >
                                        <span className="font-black text-orange-950 text-[10px] rotate-90">m<sub>2</sub></span>
                                        
                                        {/* Vector Pes 2 (Avall) */}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 flex flex-col items-center pt-1" style={{ height: p2 }}>
                                            <div className="w-0.5 bg-orange-400 h-full relative">
                                                <div className="absolute bottom-0 -translate-x-1.5">{ArrowDown && <ArrowDown size={14} className="text-orange-400" />}</div>
                                            </div>
                                            <span className="mt-1 text-[8px] font-bold text-orange-300">P<sub>2</sub></span>
                                        </div>

                                        {/* Vector Tensió (Amunt) */}
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 flex flex-col items-center pb-1" style={{ height: tensio }}>
                                            <span className="mb-1 text-[8px] font-bold text-blue-300">T</span>
                                            <div className="w-0.5 bg-blue-400 h-full relative">
                                                <div className="absolute top-0 -translate-x-1.5">{ArrowUp && <ArrowUp size={14} className="text-blue-400" />}</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Missatge de Xoc */}
                                    {isCrashed && (
                                        <div className="absolute bottom-10 w-full flex justify-center z-30 animate-pulse">
                                            <div className="bg-red-600 text-white px-4 py-2 rounded-lg font-black uppercase shadow-lg border-2 border-red-400">
                                                Final del Recorregut!
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Tauler de Control */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-xl font-bold flex items-center gap-2">
                                            {Settings && <Settings className="text-blue-400" />} Variables
                                        </h3>
                                        <button onClick={reset} className="p-2 bg-slate-700 rounded-lg hover:bg-slate-600 shadow-md">
                                            {RotateCcw && <RotateCcw size={18} />}
                                        </button>
                                    </div>

                                    <div className="space-y-4 mb-6">
                                        {/* Control m1 */}
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-emerald-400 font-bold">m<sub>1</sub> (Taula)</span>
                                                <span className="font-mono">{m1} kg</span>
                                            </div>
                                            <input type="range" min="1" max="15" step="1" value={m1} onChange={e => {setM1(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                                        </div>
                                        
                                        {/* Control m2 */}
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-orange-400 font-bold">m<sub>2</sub> (Penjant)</span>
                                                <span className="font-mono">{m2} kg</span>
                                            </div>
                                            <input type="range" min="1" max="15" step="1" value={m2} onChange={e => {setM2(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                                        </div>

                                        {/* Control Fregament */}
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-red-400 font-bold flex items-center gap-1">{GripHorizontal && <GripHorizontal size={12}/>} Fregament (μ)</span>
                                                <span className="font-mono">{mu.toFixed(2)}</span>
                                            </div>
                                            <input type="range" min="0" max="0.8" step="0.05" value={mu} onChange={e => {setMu(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" />
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handlePlay} 
                                        disabled={isMoving || isCrashed || !canMove} 
                                        className={`w-full py-3 rounded-xl font-black flex items-center justify-center gap-2 transition-all shadow-lg ${!canMove ? 'bg-slate-600 text-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white active:scale-95'}`}
                                    >
                                        {Play && <Play size={18}/>} {!canMove ? 'ES QUEDA EN REPÒS' : 'ALLIBERAR EL SISTEMA'}
                                    </button>
                                </div>

                                <div className="bg-blue-950/20 p-6 rounded-3xl border border-blue-500/20">
                                    <h4 className="font-bold text-blue-300 mb-3 flex items-center gap-2">
                                        {Info && <Info size={18} />} Resolució Dinàmica
                                    </h4>
                                    <div className="text-[11px] text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. Qui estira el sistema?</strong> El pes del bloc 2 (P<sub>2</sub> = m<sub>2</sub>·g = {p2.toFixed(1)} N).</p>
                                        <p><strong>2. Qui frena el sistema?</strong> El fregament del bloc 1 a la taula (Fr = μ·N = μ·m<sub>1</sub>·g = {fr_max.toFixed(1)} N).</p>
                                        
                                        <div className={`p-2 rounded font-mono border ${canMove ? 'bg-green-900/30 border-green-500/30 text-green-300' : 'bg-red-900/30 border-red-500/30 text-red-300'}`}>
                                            {canMove ? 'P2 > Fr ➔ Hi ha Moviment!' : 'P2 ≤ Fr ➔ El sistema està en Equilibri Estàtic'}
                                        </div>

                                        {canMove && (
                                            <>
                                                <p><strong>3. Acceleració:</strong> a = (P<sub>2</sub> - Fr) / (m<sub>1</sub> + m<sub>2</sub>) = {a.toFixed(2)} m/s²</p>
                                                <p><strong>4. Tensió de la corda:</strong> T = m<sub>2</sub>·(g - a) = {tensio.toFixed(1)} N.<br/> 
                                                <em>Nota que la Tensió NO és igual al pes 2 quan s'està movent, és menor perquè accelera cap avall!</em></p>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinàmica: Cossos Enllaçats i Politges
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
