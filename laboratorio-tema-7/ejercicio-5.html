<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Fuerzas Horizontales</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6; /* Blue 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var ArrowUpIcon = getIcon('ArrowUp');
            var ArrowDownIcon = getIcon('ArrowDown');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ImagePlusIcon = getIcon('ImagePlus');
            var BoxIcon = getIcon('Box');

            var App = () => {
                const g = 9.8; // Gravedad (m/s^2)
                
                // Estados interactivos
                const [m, setM] = useState(5.0); // kg
                const [f1, setF1] = useState(40); // N (Derecha)
                const [f2, setF2] = useState(20); // N (Izquierda)

                // Estados de animación
                const [pos, setPos] = useState(0);
                const [vel, setVel] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // Cálculos Físicos
                const peso = m * g;
                const normal = peso;
                const fNeta = f1 - f2;
                const aceleracion = fNeta / m;

                useEffect(() => {
                    let interval;
                    if (isMoving && Math.abs(pos) < 200) {
                        interval = setInterval(() => {
                            setVel(v => v + aceleracion * 0.05);
                            setPos(p => {
                                const newP = p + vel;
                                // Detener en los bordes
                                if (newP > 200) {
                                    setIsMoving(false);
                                    return 200;
                                }
                                if (newP < -200) {
                                    setIsMoving(false);
                                    return -200;
                                }
                                return newP;
                            });
                        }, 20); // ~50fps
                    }
                    return () => clearInterval(interval);
                }, [isMoving, pos, vel, aceleracion]);

                const handlePlay = () => {
                    if (fNeta !== 0 && Math.abs(pos) < 200) setIsMoving(true);
                };

                const reset = () => {
                    setPos(0);
                    setVel(0);
                    setIsMoving(false);
                };

                // Diagrama de Cuerpo Libre por IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyANGbXktzJW-3eyczxinPzpE3rM0s2J9qk"; // API Key insertada por entornoAPI Key de entorno
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de cuerpo libre. Un bloque cuadrado en el centro. Vector Peso hacia abajo, vector Normal hacia arriba, vector de Fuerza F1 grande hacia la derecha, vector de Fuerza F2 pequeño hacia la izquierda. Estilo educativo minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error de red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Leyes de Newton</span>
                                <h1 className="text-3xl font-black text-blue-400 uppercase tracking-tight tracking-widest">Suma de Fuerzas</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Sobre un cuerpo de masa m = 5,0 kg actúan dos fuerzas horizontales: F<sub>1</sub> = 40 N hacia la derecha y F<sub>2</sub> = 20 N hacia la izquierda. Calcula: a) El peso. b) La normal. c) La aceleración.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[450px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* Marcadores superiores */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-2 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza Neta</p>
                                        <p className={`text-sm font-mono font-black ${fNeta > 0 ? 'text-green-400' : fNeta < 0 ? 'text-red-400' : 'text-slate-400'}`}>
                                            {Math.abs(fNeta).toFixed(1)} N {fNeta > 0 ? '(Der)' : fNeta < 0 ? '(Izq)' : ''}
                                        </p>
                                    </div>
                                    <div className="bg-slate-900/90 p-2 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Aceleración</p>
                                        <p className="text-sm font-mono font-black text-blue-400">{Math.abs(aceleracion).toFixed(2)} m/s²</p>
                                    </div>
                                </div>

                                {/* Escena del bloque */}
                                <div className="relative w-full h-64 flex justify-center items-end pb-8">
                                    {/* Suelo */}
                                    <div className="absolute bottom-8 w-full border-b-4 border-slate-600"></div>
                                    
                                    {/* El Bloque */}
                                    <div 
                                        className="relative w-24 h-24 bg-blue-600 border-4 border-blue-400 rounded-xl flex items-center justify-center shadow-lg transition-transform z-20"
                                        style={{ transform: `translateX(${pos}px)` }}
                                    >
                                        <span className="font-black text-blue-100">{m.toFixed(1)} kg</span>

                                        {/* Vector F1 (Derecha) */}
                                        <div className="absolute left-full top-1/2 -translate-y-1/2 flex items-center pl-1" style={{ width: f1 * 2.5 }}>
                                            <div className="h-1.5 bg-green-400 w-full relative">
                                                <div className="absolute right-0 -top-2">{ArrowRightIcon && <ArrowRightIcon className="text-green-400" size={20} />}</div>
                                            </div>
                                            <span className="ml-1 text-[10px] font-black text-green-300">F₁</span>
                                        </div>

                                        {/* Vector F2 (Izquierda) */}
                                        <div className="absolute right-full top-1/2 -translate-y-1/2 flex items-center pr-1" style={{ width: f2 * 2.5 }}>
                                            <span className="mr-1 text-[10px] font-black text-red-300">F₂</span>
                                            <div className="h-1.5 bg-red-400 w-full relative">
                                                <div className="absolute left-0 -top-2">{ArrowLeftIcon && <ArrowLeftIcon className="text-red-400" size={20} />}</div>
                                            </div>
                                        </div>

                                        {/* Vector Normal (Arriba) */}
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 flex flex-col items-center pb-1" style={{ height: 60 }}>
                                            <span className="mb-1 text-[10px] font-black text-indigo-300">N</span>
                                            <div className="w-1.5 bg-indigo-400 h-full relative">
                                                <div className="absolute top-0 -translate-x-2">{ArrowUpIcon && <ArrowUpIcon className="text-indigo-400" size={20} />}</div>
                                            </div>
                                        </div>

                                        {/* Vector Peso (Abajo) */}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 flex flex-col items-center pt-1" style={{ height: 60 }}>
                                            <div className="w-1.5 bg-orange-400 h-full relative">
                                                <div className="absolute bottom-0 -translate-x-2">{ArrowDownIcon && <ArrowDownIcon className="text-orange-400" size={20} />}</div>
                                            </div>
                                            <span className="mt-1 text-[10px] font-black text-orange-300">P</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-blue-400">
                                        {CalculatorIcon && <CalculatorIcon size={20} />} Configurar Variables
                                    </h3>
                                    
                                    <div className="space-y-4 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-slate-300 font-bold uppercase">Masa del cuerpo (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded">{m.toFixed(1)} kg</span>
                                            </div>
                                            <input type="range" min="1" max="20" step="0.5" value={m} onChange={e => {setM(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                                        </div>
                                        
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-green-400 font-bold uppercase">Fuerza Derecha (F₁)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-green-300">{f1} N</span>
                                            </div>
                                            <input type="range" min="0" max="100" step="5" value={f1} onChange={e => {setF1(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-green-500" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-red-400 font-bold uppercase">Fuerza Izquierda (F₂)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-red-300">{f2} N</span>
                                            </div>
                                            <input type="range" min="0" max="100" step="5" value={f2} onChange={e => {setF2(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || fNeta === 0}
                                            className={`flex-1 font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 ${fNeta === 0 ? 'bg-slate-600 text-slate-400' : 'bg-blue-600 hover:bg-blue-500 text-white'}`}
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} {fNeta === 0 ? 'EN EQUILIBRIO' : 'INICIAR MOVIMIENTO'}
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-blue-950/20 p-6 rounded-3xl border border-blue-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-blue-500/30 pb-2">
                                        <h4 className="font-bold text-blue-300 flex items-center gap-2">
                                            {InfoIcon && <InfoIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>Eje Vertical (Y):</strong> No hay movimiento, así que las fuerzas se cancelan.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-indigo-500 font-mono">
                                            a) P = m · g = {m.toFixed(1)} · 9.8 = <strong>{peso.toFixed(1)} N</strong><br/>
                                            b) N = P = <strong>{normal.toFixed(1)} N</strong>
                                        </div>
                                        
                                        <p className="mt-3"><strong>Eje Horizontal (X):</strong> Aplicamos la 2ª Ley de Newton.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono">
                                            Σ F_x = m · a<br/>
                                            F₁ - F₂ = m · a<br/>
                                            {f1} - {f2} = {m.toFixed(1)} · a<br/>
                                            {f1 - f2} = {m.toFixed(1)} · a  ⇒  a = {f1 - f2} / {m.toFixed(1)} = <strong>{aceleracion.toFixed(2)} m/s²</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica: Descomposición de Fuerzas en Ejes
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
