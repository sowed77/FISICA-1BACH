<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Retroceso de Ametralladora</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #eab308; /* Yellow 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        .grass-pattern {
            background-color: #064e3b;
            background-image: repeating-linear-gradient(90deg, #065f46 0, #065f46 20px, transparent 20px, transparent 40px);
            background-position: bottom;
            background-size: 40px 10px;
            background-repeat: repeat-x;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect, useRef } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var SquareIcon = getIcon('Square');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var ImagePlusIcon = getIcon('ImagePlus');
            var ShieldAlertIcon = getIcon('ShieldAlert');
            var SettingsIcon = getIcon('Settings');

            var App = () => {
                // Parámetros fijos del enunciado
                const [masaBalaGramos, setMasaBalaGramos] = useState(100); // g
                const [vBala, setVBala] = useState(400); // m/s
                const [fMax, setFMax] = useState(200); // N

                // Estado interactivo (Cadencia de fuego)
                const [balasMinuto, setBalasMinuto] = useState(300); // Balas / min

                // Cálculos Físicos
                const masaBalaKg = masaBalaGramos / 1000;
                const pBala = masaBalaKg * vBala; // Momento de 1 bala (kg·m/s)
                
                const balasSegundo = balasMinuto / 60; // n
                
                // Fuerza de retroceso = Variación del momento por segundo (F = dp/dt)
                const fRetroceso = balasSegundo * pBala;

                const isOverpowered = fRetroceso > fMax;

                // Animación
                const [isFiring, setIsFiring] = useState(false);
                const [bullets, setBullets] = useState([]);
                
                // Referencia para mantener el control del spawn de balas sin dependencias estrictas en el loop
                const lastSpawnTime = useRef(0);

                useEffect(() => {
                    let animationFrameId;

                    const animate = (timestamp) => {
                        if (isFiring && !isOverpowered) {
                            // Actualizar posiciones de balas existentes
                            setBullets(prev => prev.map(b => ({ ...b, x: b.x + (vBala * 0.05) })).filter(b => b.x < 500));

                            // Comprobar si toca spawnear una nueva bala
                            const timeSinceLastSpawn = timestamp - lastSpawnTime.current;
                            const spawnInterval = 1000 / balasSegundo; // ms entre balas

                            if (timeSinceLastSpawn >= spawnInterval) {
                                setBullets(prev => [...prev, { id: timestamp, x: 0 }]);
                                lastSpawnTime.current = timestamp;
                            }
                        }
                        animationFrameId = requestAnimationFrame(animate);
                    };

                    animationFrameId = requestAnimationFrame(animate);
                    return () => cancelAnimationFrame(animationFrameId);
                }, [isFiring, balasSegundo, vBala, isOverpowered]);

                const toggleFiring = () => {
                    if (!isFiring) {
                        setBullets([]);
                        lastSpawnTime.current = document.timeline ? document.timeline.currentTime : performance.now();
                    }
                    setIsFiring(!isFiring);
                };

                const reset = () => {
                    setIsFiring(false);
                    setBullets([]);
                    setBalasMinuto(300);
                };

                // Generador de DCL IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un arma disparando. Un flujo continuo de pequeñas balas saliendo hacia la derecha con un gran vector de momento p. Un gran vector Fuerza F apuntando hacia la izquierda representando el retroceso. Estilo educativo, minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-yellow-600 text-slate-900 px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Flujo de Masa y Momento</span>
                                <h1 className="text-3xl font-black text-yellow-400 uppercase tracking-tight tracking-widest">Ráfagas Continuas</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un soldado dispara una ametralladora. Cada bala pesa 100 g y sale a 400 m/s. Si la fuerza máxima que el soldado puede soportar para mantener el arma controlada es de 200 N, ¿cuál es el número máximo de balas por minuto que puede disparar?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* Marcadores Flotantes */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza de Retroceso</p>
                                        <p className={`text-2xl font-mono font-black ${isOverpowered ? 'text-red-500' : 'text-orange-400'}`}>
                                            {fRetroceso.toFixed(1)} N
                                        </p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Cadencia (Disparos)</p>
                                        <p className="text-xl font-mono font-black text-emerald-400">{balasSegundo.toFixed(1)} balas/s</p>
                                    </div>
                                </div>

                                {/* Barra de Tolerancia de Fuerza */}
                                <div className="absolute top-24 w-full px-12 z-30 pointer-events-none">
                                    <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                                        <span>0 N</span>
                                        <span className="text-red-400">Límite: {fMax} N</span>
                                    </div>
                                    <div className="w-full h-3 bg-slate-700 rounded-full overflow-hidden border border-slate-600 relative">
                                        {/* Barra de progreso de fuerza */}
                                        <div 
                                            className={`h-full transition-all duration-300 ${isOverpowered ? 'bg-red-500' : 'bg-orange-500'}`}
                                            style={{ width: `${Math.min(100, (fRetroceso / fMax) * 100)}%` }}
                                        ></div>
                                        {/* Marca del límite */}
                                        <div className="absolute top-0 bottom-0 border-r-2 border-red-500" style={{ left: '100%' }}></div>
                                    </div>
                                    
                                    {isOverpowered && (
                                        <div className="mt-2 bg-red-600/90 text-white px-4 py-2 rounded-xl text-xs font-black uppercase text-center flex items-center justify-center gap-2 animate-pulse">
                                            <ShieldAlertIcon size={16} /> ¡Fuerza Superada! Pierde el control.
                                        </div>
                                    )}
                                </div>

                                {/* Escena del disparo */}
                                <div className="relative w-full h-48 mb-8 flex items-center">
                                    
                                    {/* El Soldado/Arma */}
                                    <div 
                                        className={`absolute left-10 z-20 transition-transform ${isFiring && !isOverpowered ? 'animate-bounce' : isOverpowered ? 'rotate-[-30deg] translate-x-[-20px] origin-bottom-left' : ''}`}
                                    >
                                        <div className="w-24 h-16 bg-slate-600 border-4 border-slate-500 rounded-lg rounded-r-3xl shadow-xl flex items-center justify-center relative">
                                            <span className="font-black text-slate-800 text-xs rotate-[-90deg] absolute left-2">ARMA</span>
                                            <div className="w-12 h-4 bg-slate-800 absolute right-[-10px] top-1/2 -translate-y-1/2 rounded-r"></div>
                                        </div>

                                        {/* Vector Retroceso (Izquierda) */}
                                        {(isFiring || fRetroceso > 0) && (
                                            <div className="absolute top-1/2 right-full flex items-center pr-2" style={{ width: Math.min(150, fRetroceso * 0.5) }}>
                                                <span className="mr-1 text-[10px] font-black text-orange-400 whitespace-nowrap bg-slate-900/80 px-1 rounded shadow">F = {fRetroceso.toFixed(0)}N</span>
                                                <div className="h-2 bg-orange-500 w-full relative shadow-[0_0_10px_rgba(249,115,22,0.8)]">
                                                    <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-orange-500" size={20} />}</div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Las Balas */}
                                    <div className="absolute left-[140px] right-0 h-full overflow-hidden">
                                        {bullets.map(b => (
                                            <div 
                                                key={b.id} 
                                                className="absolute top-1/2 -translate-y-1/2 w-6 h-2 bg-yellow-400 rounded-full shadow-[0_0_8px_rgba(250,204,21,0.8)]"
                                                style={{ left: `${b.x}px` }}
                                            ></div>
                                        ))}
                                    </div>
                                </div>
                                
                                {/* Suelo base */}
                                <div className="absolute bottom-0 w-full h-8 grass-pattern border-t-4 border-green-800"></div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-yellow-400">
                                        <SettingsIcon size={20} /> Ajustes del Arma
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-emerald-400 font-bold uppercase">Cadencia (Balas por minuto)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-emerald-300">{balasMinuto} rpm</span>
                                            </div>
                                            <input 
                                                type="range" min="60" max="600" step="10" value={balasMinuto} 
                                                onChange={e => setBalasMinuto(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 pt-3 border-t border-slate-700">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1">
                                                    <span className="text-slate-300 font-bold uppercase">Masa Bala</span>
                                                    <span className="font-mono">{masaBalaGramos} g</span>
                                                </div>
                                                <input type="range" min="10" max="200" step="10" value={masaBalaGramos} onChange={e => setMasaBalaGramos(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400" />
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1">
                                                    <span className="text-slate-300 font-bold uppercase">Vel. Bala</span>
                                                    <span className="font-mono">{vBala} m/s</span>
                                                </div>
                                                <input type="range" min="100" max="1000" step="50" value={vBala} onChange={e => setVBala(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400" />
                                            </div>
                                        </div>
                                        
                                        <div className="pt-3 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-red-400 font-bold uppercase">Límite del Tirador (F_max)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-red-300">{fMax} N</span>
                                            </div>
                                            <input type="range" min="50" max="500" step="10" value={fMax} onChange={e => setFMax(Number(e.target.value))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={toggleFiring} 
                                            className={`flex-1 font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 transition-all active:scale-95 ${isFiring ? 'bg-red-600 hover:bg-red-500 text-white' : 'bg-yellow-500 hover:bg-yellow-400 text-slate-900'}`}
                                        >
                                            {isFiring ? <><SquareIcon size={18} /> DETENER FUEGO</> : <><PlayIcon size={18} /> ABRIR FUEGO</>}
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-yellow-950/20 p-6 rounded-3xl border border-yellow-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-yellow-500/30 pb-2">
                                        <h4 className="font-bold text-yellow-400 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Fuerza y Momento" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. El Impulso de UNA bala:</strong><br/>
                                        Pasamos la masa al S.I. (m = 100 g = 0.1 kg). Cada bala que sale a 400 m/s se lleva consigo una cantidad de movimiento:</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-slate-500 font-mono text-slate-200">
                                            Δp_bala = m · v<br/>
                                            Δp_bala = 0.1 · 400 = <strong>40 kg·m/s</strong>
                                        </div>

                                        <p><strong>2. Fuerza como flujo de momento:</strong><br/>
                                        La fuerza es la cantidad de movimiento total transferida cada segundo (F = Δp_total / Δt). Llamemos <strong>n</strong> al número de balas por segundo.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            F = n · Δp_bala<br/>
                                            200 = n · 40  ⇒  n = 200 / 40 = <strong>5 balas/s</strong>
                                        </div>

                                        <p><strong>3. Convertir a balas por minuto:</strong><br/>
                                        Si dispara 5 balas cada segundo, en un minuto (60 segundos) disparará:</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-300 shadow-inner">
                                            N_minuto = n · 60<br/>
                                            N_minuto = 5 · 60 = <strong>300 balas/min</strong>
                                        </div>
                                        <p className="text-[10px] text-slate-400 italic text-center mt-2">
                                            Mueve el deslizador a 300 rpm. Si lo pones a 310 rpm, verás que la fuerza de retroceso requerida supera los 200 N y salta la alerta.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica de Fluidos y Flujos Continuos (Ametralladoras/Mangueras)
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
