<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Dinámica Orbital de Satélites</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; } /* Slate 950 */
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6; /* Blue 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        
        .space-bg {
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.6;
        }

        /* Animación orbital */
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
            to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
        }
        .animate-satellite {
            animation: orbit linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var CalculatorIcon = getIcon('Calculator');
            var SettingsIcon = getIcon('Settings');
            var InfoIcon = getIcon('Info');
            var Globe2Icon = getIcon('Globe2');
            var SatelliteIcon = getIcon('Satellite');
            var ImagePlusIcon = getIcon('ImagePlus');
            var CompassIcon = getIcon('Compass');
            var TimerIcon = getIcon('Timer');

            var App = () => {
                // Constantes Físicas Reales
                const G = 6.674e-11; // N·m²/kg²
                const Mt = 5.972e24; // Masa de la Tierra (kg)
                const Rt_km = 6371; // Radio de la Tierra (km)
                const Rt = Rt_km * 1000; // Radio en metros
                const GM = G * Mt; // ~3.986e14

                // Estados Interactivos (Datos del enunciado)
                const [hKm, setHKm] = useState(500); // Altura en km

                // Cálculos Físicos
                const h = hKm * 1000; // Altura en metros
                const r = Rt + h; // Distancia total al centro (Radio orbital)
                
                // 1. Velocidad Orbital (v = sqrt(G*Mt / r))
                const v_ms = Math.sqrt(GM / r);
                const v_kms = v_ms / 1000;
                
                // 2. Periodo Orbital (T = 2*PI*r / v)
                const T_s = (2 * Math.PI * r) / v_ms;
                const T_min = T_s / 60;
                const T_h = T_s / 3600;

                // Escala visual dinámica
                // Hacemos que la órbita crezca visualmente de forma no lineal para que se vean tanto 500km como 36000km
                const baseRadius = 40; // Tamaño de la Tierra visual
                const maxHKm = 40000;
                // Mapeo curvo para la órbita
                const visualOrbitRadius = baseRadius + Math.max(15, (Math.pow(hKm / maxHKm, 0.4) * 150)); 
                
                // La animación debe ser más rápida cuanto más cerca (Kepler)
                // Escala visual de tiempo: de 2s (rápido) a 20s (lento)
                const animDuration = Math.max(2, (T_h / 24) * 20); 

                // Generador de diagrama DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // API Key insertada por el entorno
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de astrofísica. El planeta Tierra en el centro. Un satélite orbitando. Un vector Fuerza Fg apuntando hacia el centro de la Tierra. Un vector Velocidad v tangencial a la órbita. Cotas de Radio R_T y altura h. Fondo blanco, minimalista, educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-800 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Astrofísica</span>
                                <h1 className="text-3xl font-black text-blue-400 uppercase tracking-tight tracking-widest">Velocidad y Periodo Orbital</h1>
                            </div>
                            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un satélite describe una órbita circular alrededor de la Tierra a 500 km sobre su superficie. Calcula: a) La velocidad del satélite, b) Su periodo de revolución.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual Espacial */}
                            <div className="bg-slate-900 rounded-3xl border border-slate-800 h-[500px] relative overflow-hidden shadow-2xl flex flex-col items-center justify-center">
                                
                                <div className="absolute inset-0 space-bg pointer-events-none"></div>

                                {/* HUD Flotante */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-slate-800 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black flex items-center gap-1"><CompassIcon size={12} className="text-emerald-400"/> Velocidad (v)</p>
                                        <p className="text-xl font-mono font-black text-emerald-400">{v_kms.toFixed(2)} <span className="text-xs">km/s</span></p>
                                        <p className="text-[10px] text-emerald-600 mt-1">~{(v_kms * 3600).toFixed(0)} km/h</p>
                                    </div>
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-slate-800 backdrop-blur-md text-right border-b-4 border-b-orange-500">
                                        <p className="text-[10px] text-slate-500 uppercase font-black flex items-center justify-end gap-1"><TimerIcon size={12} className="text-orange-400"/> Periodo (T)</p>
                                        <p className="text-xl font-mono font-black text-orange-400">{T_h.toFixed(2)} <span className="text-xs">h</span></p>
                                        <p className="text-[10px] text-orange-600 mt-1">{T_min.toFixed(0)} min</p>
                                    </div>
                                </div>

                                {/* Escena: La Tierra y el Satélite */}
                                <div className="relative w-full h-full flex flex-col justify-center items-center">
                                    
                                    {/* La Tierra */}
                                    <div className="absolute z-20 w-[80px] h-[80px] bg-blue-600 rounded-full border-2 border-blue-400 shadow-[inset_-10px_-10px_20px_rgba(0,0,0,0.5),0_0_30px_rgba(59,130,246,0.3)] flex flex-col items-center justify-center">
                                        <Globe2Icon size={24} className="text-blue-200 opacity-60" />
                                        <span className="text-[8px] font-black text-blue-900 mt-1">TIERRA</span>
                                    </div>

                                    {/* Línea de Órbita */}
                                    <div 
                                        className="absolute z-10 rounded-full border border-slate-600/50 border-dashed"
                                        style={{ width: `${visualOrbitRadius * 2}px`, height: `${visualOrbitRadius * 2}px` }}
                                    ></div>

                                    {/* El Satélite Animado */}
                                    <div className="absolute z-30 flex items-center justify-center w-0 h-0"
                                         style={{ '--orbit-radius': `${visualOrbitRadius}px` }}
                                    >
                                        <div 
                                            className="animate-satellite" 
                                            style={{ animationDuration: `${animDuration}s` }}
                                        >
                                            <div className="relative flex items-center justify-center w-8 h-8 bg-slate-800 border border-slate-500 rounded-lg shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                                                <SatelliteIcon size={16} className="text-slate-300" />
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                
                                {/* Leyenda inferior */}
                                <div className="absolute bottom-6 bg-slate-950/80 px-4 py-2 rounded-xl text-center border border-slate-800 z-30">
                                    <p className="text-[10px] text-slate-500 uppercase font-black">Distancia al centro de la Tierra (r)</p>
                                    <p className="text-sm font-mono font-bold text-white">
                                        {Rt_km} km + {hKm} km = {(Rt_km + hKm).toLocaleString()} km
                                    </p>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-blue-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Control de Órbita
                                    </h3>
                                    
                                    <div className="space-y-6 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Altura del satélite (h)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-blue-300">{hKm} km</span>
                                            </div>
                                            <input 
                                                type="range" min="100" max="40000" step="100" value={hKm} 
                                                onChange={e => setHKm(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" 
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                        <button onClick={() => setHKm(400)} className="bg-slate-800 hover:bg-slate-700 text-[10px] font-bold py-2 rounded-lg border border-slate-700 text-slate-300">
                                            ISS (400 km)
                                        </button>
                                        <button onClick={() => setHKm(500)} className="bg-blue-900/50 hover:bg-blue-800/50 text-[10px] font-bold py-2 rounded-lg border border-blue-500/50 text-blue-300">
                                            Problema (500 km)
                                        </button>
                                        <button onClick={() => setHKm(20200)} className="bg-slate-800 hover:bg-slate-700 text-[10px] font-bold py-2 rounded-lg border border-slate-700 text-slate-300">
                                            GPS (20k km)
                                        </button>
                                        <button onClick={() => setHKm(35786)} className="bg-slate-800 hover:bg-slate-700 text-[10px] font-bold py-2 rounded-lg border border-slate-700 text-slate-300">
                                            Meteosat (36k km)
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-blue-950/20 p-6 rounded-3xl border border-blue-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-blue-500/30 pb-2">
                                        <h4 className="font-bold text-blue-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-700">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                                            <img src={imgUrl} alt="Diagrama Orbital" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. El Radio Orbital (La trampa):</strong><br/>
                                        El satélite gira respecto al centro de la Tierra, no respecto al suelo.</p>
                                        
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-slate-600 font-mono text-slate-300">
                                            r = R_T + h = 6371 km + {hKm} km = {6371 + hKm} km<br/>
                                            r = <strong>{r.toExponential(3)} m</strong>
                                        </div>

                                        <p><strong>a) Velocidad Orbital (v):</strong><br/>
                                        La Gravedad es la Fuerza Centrípeta (F_g = F_c). Igualando ecuaciones: <br/>
                                        G · (M_T · m) / r² = m · v² / r (La masa del satélite se cancela).</p>
                                        
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-300 shadow-inner overflow-x-auto">
                                            v = √(G · M_T / r)<br/>
                                            v = √(6.674×10⁻¹¹ · 5.972×10²⁴ / {r.toExponential(3)})<br/>
                                            <strong>v = {v_ms.toFixed(0)} m/s = {v_kms.toFixed(2)} km/s</strong>
                                        </div>

                                        <p><strong>b) Periodo de Revolución (T):</strong><br/>
                                        El tiempo en dar una vuelta completa (Longitud de la circunferencia / velocidad).</p>
                                        
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-300">
                                            T = (2 · π · r) / v<br/>
                                            T = (2 · π · {r.toExponential(3)}) / {v_ms.toFixed(0)}<br/>
                                            <strong>T = {T_s.toFixed(0)} s</strong>
                                        </div>
                                        <p className="text-[10px] text-slate-400 italic text-center">
                                            Dividiendo entre 3600: <strong>{T_h.toFixed(2)} horas</strong> (aprox {T_min.toFixed(0)} minutos).
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Astrofísica Orbital
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
