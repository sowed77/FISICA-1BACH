<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Deslizamiento Libre</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ef4444; /* Red 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .floor-pattern {
            background-image: repeating-linear-gradient(90deg, #334155 0, #334155 20px, transparent 20px, transparent 40px);
            background-position: bottom;
            background-size: 40px 4px;
            background-repeat: repeat-x;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var ArrowUpIcon = getIcon('ArrowUp');
            var ArrowDownIcon = getIcon('ArrowDown');
            var MoveRightIcon = getIcon('MoveRight');
            var ImagePlusIcon = getIcon('ImagePlus');

            var App = () => {
                const g = 9.8; // m/s^2
                
                // Estados interactivos
                const [v0, setV0] = useState(10); // Velocidad inicial (m/s)
                const [mu, setMu] = useState(0.2); // Coeficiente de rozamiento
                const m = 5; // kg (Fijo para simplificar)

                // Estados de animación
                const [time, setTime] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // Cálculos Físicos
                const peso = m * g;
                const normal = peso;
                const fr = mu * normal;
                
                // La aceleración es negativa porque la fuerza se opone al movimiento
                const a = -(fr / m); // que es lo mismo que -mu * g
                
                // Tiempo hasta detenerse (v = v0 + at => 0 = v0 - mu*g*t => t = v0 / (mu*g))
                const tStop = mu > 0 ? v0 / (mu * g) : 999;
                const dStop = (v0 * v0) / (2 * mu * g);

                // Cinemática instantánea
                const currentV = Math.max(0, v0 + a * time);
                const currentPos = (v0 * time) + (0.5 * a * time * time);

                // Escala visual
                const pxPerMeter = 10;
                const visualPos = currentPos * pxPerMeter;

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tStop) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                const nextTime = prev + 0.05;
                                if (nextTime >= tStop) {
                                    setIsMoving(false);
                                    return tStop; // Detener exactamente en tStop
                                }
                                return nextTime;
                            });
                        }, 50); // Tiempo real aprox
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tStop]);

                const handlePlay = () => {
                    if (time < tStop) setIsMoving(true);
                };

                const reset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Generador de diagrama DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de cuerpo libre. Un bloque deslizándose hacia la derecha. Solo hay tres vectores: Peso P hacia abajo, Normal N hacia arriba (estos dos se anulan y son del mismo tamaño), y un vector de Fuerza de Fricción Fr hacia la izquierda. NO hay vector apuntando hacia la derecha. Estilo educativo minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en la API");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Pregunta Teórica</span>
                                <h1 className="text-3xl font-black text-red-400 uppercase tracking-tight tracking-widest">Fuerza Neta y Deslizamiento</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>El Enigma:</strong> "¿Puede haber fuerza de rozamiento sobre un objeto en el que la suma de todas las demás fuerzas sea nula?"<br/>
                                    <strong>Respuesta:</strong> ¡Sí! Observa este bloque que fue empujado y ahora se desliza libremente por el suelo.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* Marcadores flotantes */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Velocidad Actual (v)</p>
                                        <p className={`text-xl font-mono font-black ${currentV === 0 ? 'text-red-500' : 'text-emerald-400'}`}>
                                            {currentV.toFixed(2)} m/s
                                        </p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza Neta (ΣF)</p>
                                        <p className="text-xl font-mono font-black text-red-400">
                                            {fr.toFixed(1)} N (Izq)
                                        </p>
                                    </div>
                                </div>

                                {/* Pista */}
                                <div className="relative w-full h-64 mt-10">
                                    {/* Suelo */}
                                    <div className="absolute bottom-8 w-full border-b-4 border-slate-600 floor-pattern h-8"></div>
                                    
                                    {/* Caja */}
                                    <div 
                                        className="absolute bottom-16 w-20 h-20 bg-orange-600 border-4 border-orange-400 rounded-lg flex items-center justify-center shadow-lg transition-transform z-20"
                                        style={{ transform: `translateX(${40 + visualPos}px)` }}
                                    >
                                        <span className="font-black text-orange-200">{m}kg</span>

                                        {/* Vector Velocidad (Ficticio, no es una fuerza) */}
                                        {currentV > 0 && (
                                            <div className="absolute top-0 right-[-30px] flex flex-col items-center">
                                                <span className="text-[10px] font-black text-emerald-300">v</span>
                                                <MoveRightIcon className="text-emerald-400" size={24} />
                                            </div>
                                        )}

                                        {/* Vector Fricción (Izquierda) - LA ÚNICA FUERZA ACTIVA EN X */}
                                        {currentV > 0 && (
                                            <div className="absolute right-full top-1/2 -translate-y-1/2 flex items-center pr-1 pointer-events-none" style={{ width: fr * 3 }}>
                                                <span className="mr-1 text-[10px] font-black text-red-300 bg-slate-900/50 px-1 rounded shadow">Fr</span>
                                                <div className="h-1.5 bg-red-500 w-full relative shadow-[0_0_8px_rgba(239,68,68,0.8)]">
                                                    <div className="absolute left-0 -top-2">{ArrowLeftIcon && <ArrowLeftIcon className="text-red-500" size={20} />}</div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Vector Normal (Arriba) */}
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 flex flex-col items-center pb-1 pointer-events-none opacity-50" style={{ height: normal }}>
                                            <span className="mb-1 text-[10px] font-black text-indigo-300">N</span>
                                            <div className="w-1 bg-indigo-400 h-full relative">
                                                <div className="absolute top-0 -translate-x-1.5">{ArrowUpIcon && <ArrowUpIcon className="text-indigo-400" size={16} />}</div>
                                            </div>
                                        </div>

                                        {/* Vector Peso (Abajo) */}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 flex flex-col items-center pt-1 pointer-events-none opacity-50" style={{ height: peso }}>
                                            <div className="w-1 bg-orange-300 h-full relative">
                                                <div className="absolute bottom-0 -translate-x-1.5">{ArrowDownIcon && <ArrowDownIcon className="text-orange-300" size={16} />}</div>
                                            </div>
                                            <span className="mt-1 text-[10px] font-black text-orange-200">P</span>
                                        </div>
                                    </div>
                                    
                                    {/* Indicador de fin */}
                                    {time === tStop && tStop > 0 && (
                                        <div className="absolute bottom-20 z-10 flex flex-col items-center" style={{ left: `${40 + (dStop * pxPerMeter) + 40}px` }}>
                                            <div className="w-0.5 h-16 bg-red-500/50 border-r border-dashed border-red-500"></div>
                                            <span className="text-[10px] font-bold text-red-400 bg-slate-900 px-2 rounded">DETENIDO</span>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-red-400">
                                        {CalculatorIcon && <CalculatorIcon size={20} />} Parámetros
                                    </h3>
                                    
                                    <div className="space-y-6 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-emerald-400 font-bold uppercase">Velocidad Inicial (v₀)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded">{v0.toFixed(1)} m/s</span>
                                            </div>
                                            <input 
                                                type="range" min="2" max="25" step="1" value={v0} 
                                                onChange={e => {setV0(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-red-400 font-bold uppercase">Rozamiento (μ_k)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-red-300">{mu.toFixed(2)}</span>
                                            </div>
                                            <input 
                                                type="range" min="0.05" max="0.8" step="0.05" value={mu} 
                                                onChange={e => {setMu(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" 
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tStop}
                                            className={`flex-1 font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 ${time >= tStop ? 'bg-slate-600 text-slate-400' : 'bg-red-600 hover:bg-red-500 text-white'}`}
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} {time >= tStop ? 'BLOQUE DETENIDO' : 'DEJAR DESLIZAR'}
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-red-950/20 p-6 rounded-3xl border border-red-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-red-500/30 pb-2">
                                        <h4 className="font-bold text-red-300 flex items-center gap-2">
                                            {InfoIcon && <InfoIcon size={18} />} Análisis Físico
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. Las "demás" fuerzas (Eje Vertical):</strong><br/>
                                        El Peso (P) tira hacia abajo con {peso} N. La Normal (N) empuja hacia arriba con {normal} N. Su suma es cero. No hay más fuerzas en el eje Y.</p>
                                        
                                        <p><strong>2. Eje Horizontal (Sin Empuje):</strong><br/>
                                        Al cuerpo NO lo está empujando nadie hacia adelante. Su velocidad es fruto de la inercia (1ª Ley). Como se mueve, roza con el suelo.</p>
                                        
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-red-500 font-mono text-red-200">
                                            F_r = μ · N = {mu.toFixed(2)} · {normal} = <strong>{fr.toFixed(1)} N</strong>
                                        </div>
                                        
                                        <p><strong>Conclusión:</strong> La fuerza neta NO es neta. Es exactamente igual a la fuerza de rozamiento (<strong>ΣF = F_r</strong>). Esta fuerza constante produce una aceleración negativa, que frena el bloque hasta detenerlo.</p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Teoría
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
