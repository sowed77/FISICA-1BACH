<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Fuerza Centrípeta Terrestre</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; } /* Slate 950 */
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #eab308; /* Yellow 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        
        /* Animación orbital */
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes counter-orbit {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        .animate-orbit {
            animation: orbit linear infinite;
        }
        .animate-counter-orbit {
            animation: counter-orbit linear infinite;
        }
        
        /* Fondo estrellado profundo */
        .space-bg {
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px),
                radial-gradient(rgba(255,255,255,.4), rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px, 150px 150px;
            background-position: 0 0, 40px 60px, 130px 270px, 70px 100px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var CalculatorIcon = icons.Calculator || (({className}) => <span className={className}></span>);
            var SettingsIcon = icons.Settings || (({className}) => <span className={className}></span>);
            var InfoIcon = icons.Info || (({className}) => <span className={className}></span>);
            var SunIcon = icons.Sun || (({className}) => <span className={className}></span>);
            var GlobeIcon = icons.Globe2 || icons.Globe || (({className}) => <span className={className}></span>);
            var ImagePlusIcon = icons.ImagePlus || (({className}) => <span className={className}></span>);

            var App = () => {
                // CONSTANTES REALES
                const Mt = 5.97e24; // Masa de la Tierra (kg)
                const UA = 1.496e11; // 1 Unidad Astronómica en metros (Distancia Tierra-Sol)
                const dias_ano = 365.25;

                // Estados interactivos
                const [distanciaUA, setDistanciaUA] = useState(1.0); // En Unidades Astronómicas

                // Cálculos Físicos
                const radio = distanciaUA * UA; // m
                
                // Tercera Ley de Kepler: T^2 es proporcional a R^3
                // Como 1 UA corresponde a 1 Año, T_anos = sqrt(distanciaUA^3)
                const periodoAnos = Math.sqrt(Math.pow(distanciaUA, 3));
                const periodoDias = periodoAnos * dias_ano;
                const periodoSegundos = periodoDias * 24 * 3600;

                // Velocidad Angular (omega = 2*PI / T)
                const omega = (2 * Math.PI) / periodoSegundos;
                
                // Velocidad Lineal (v = omega * R)
                const vel_ms = omega * radio;
                const vel_kms = vel_ms / 1000;

                // Fuerza Centrípeta (Fc = m * omega^2 * R)
                const fc = Mt * Math.pow(omega, 2) * radio;

                // Conversión de Fc para formato legible (e.g. 3.54e22)
                const fc_exponent = Math.floor(Math.log10(fc));
                const fc_base = (fc / Math.pow(10, fc_exponent)).toFixed(2);

                // Escala Visual
                const visualRadius = 60 + (distanciaUA * 50); // px
                const animDuration = Math.max(3, periodoAnos * 10); // Segundos de animación visual

                // Generador de diagrama DCL técnico con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyANGbXktzJW-3eyczxinPzpE3rM0s2J9qk"; // API Key insertada por entorno
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de astrofísica. El Sol en el centro y la Tierra en órbita circular. Vector de Fuerza Centrípeta Fc apuntando desde la Tierra hacia el Sol. Vector de velocidad v tangencial a la órbita. Fondo oscuro estrellado, estilo educativo minimalista" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-800 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-yellow-500 text-slate-900 px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Astrofísica</span>
                                <h1 className="text-3xl font-black text-yellow-500 uppercase tracking-tight tracking-widest">Órbita Terrestre</h1>
                            </div>
                            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> La Tierra orbita el Sol en 1 año. Calcula la fuerza centrípeta.
                                    <br/><span className="text-[10px] text-slate-500 mt-1 block">Datos implícitos necesarios: R = 1.496×10¹¹ m, M_tierra = 5.97×10²⁴ kg</span>
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual (El Espacio) */}
                            <div className="bg-slate-900 rounded-3xl border border-slate-800 h-[500px] relative overflow-hidden shadow-2xl flex items-center justify-center">
                                
                                <div className="absolute inset-0 space-bg"></div>

                                {/* Marcadores Flotantes */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-950/80 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Velocidad Orbital</p>
                                        <p className="text-xl font-mono font-black text-emerald-400">{vel_kms.toFixed(1)} km/s</p>
                                    </div>
                                    <div className="bg-slate-950/80 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right border-b-4 border-b-yellow-500">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza Centrípeta</p>
                                        <p className="text-xl font-mono font-black text-yellow-500">
                                            {fc_base} × 10<sup className="text-xs">{fc_exponent}</sup> N
                                        </p>
                                    </div>
                                </div>

                                {/* Sistema Solar */}
                                <div className="relative flex items-center justify-center z-20">
                                    {/* El Sol */}
                                    <div className="absolute z-20 w-16 h-16 bg-yellow-500 rounded-full shadow-[0_0_50px_rgba(234,179,8,0.8)] flex items-center justify-center">
                                        {SunIcon && <SunIcon size={32} className="text-yellow-100" />}
                                    </div>

                                    {/* Órbita */}
                                    <div 
                                        className="absolute rounded-full border border-slate-600/50 border-dashed"
                                        style={{ width: `${visualRadius * 2}px`, height: `${visualRadius * 2}px` }}
                                    ></div>

                                    {/* La Tierra orbitando */}
                                    <div 
                                        className="absolute animate-orbit flex items-center justify-end z-30"
                                        style={{ 
                                            width: `${visualRadius * 2}px`, 
                                            height: `${visualRadius * 2}px`,
                                            animationDuration: `${animDuration}s` 
                                        }}
                                    >
                                        <div className="relative animate-counter-orbit" style={{ animationDuration: `${animDuration}s` }}>
                                            <div className="w-6 h-6 bg-blue-500 rounded-full shadow-[inset_-2px_-2px_6px_rgba(0,0,0,0.5),0_0_10px_rgba(59,130,246,0.5)] absolute -top-3 -right-3 flex items-center justify-center">
                                                {GlobeIcon && <GlobeIcon size={16} className="text-blue-200 opacity-80" />}
                                            </div>
                                            
                                            {/* Vector Fuerza Centrípeta (Amarillo, hacia el centro) */}
                                            <div className="absolute top-0 right-0 w-[40px] h-[2px] bg-yellow-500 origin-right -translate-x-3 pointer-events-none">
                                                <div className="absolute left-0 -top-[3px] w-0 h-0 border-t-[4px] border-t-transparent border-b-[4px] border-b-transparent border-r-[6px] border-r-yellow-500"></div>
                                                <span className="absolute -top-4 right-1 text-[8px] font-black text-yellow-400">F_c</span>
                                            </div>
                                            
                                            {/* Vector Velocidad (Verde, tangencial) */}
                                            <div className="absolute top-0 right-0 h-[30px] w-[2px] bg-emerald-400 origin-bottom -translate-y-3 pointer-events-none">
                                                <div className="absolute top-0 -left-[3px] w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-b-[6px] border-b-emerald-400"></div>
                                                <span className="absolute top-1 left-2 text-[8px] font-black text-emerald-300">v</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Marcador de Tiempo Inferior */}
                                <div className="absolute bottom-6 w-full flex justify-center z-30">
                                    <div className="bg-slate-900/90 px-6 py-2 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-md flex items-center gap-4">
                                        <p className="text-xs text-slate-400 uppercase font-black">1 Año en este planeta =</p>
                                        <p className="text-lg font-mono font-black text-white">{periodoDias.toFixed(0)} <span className="text-xs text-slate-400">días terrestres</span></p>
                                    </div>
                                </div>
                            </div>

                            {/* Panel de Control y Explicación */}
                            <div className="space-y-6">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-yellow-500">
                                        {SettingsIcon && <SettingsIcon size={20} />} Distancia al Sol
                                    </h3>
                                    
                                    <div className="space-y-4 mb-2">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Radio Orbital (R)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-white">{distanciaUA.toFixed(2)} UA</span>
                                            </div>
                                            <input 
                                                type="range" min="0.3" max="3.0" step="0.05" value={distanciaUA} 
                                                onChange={e => setDistanciaUA(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-yellow-500" 
                                            />
                                            <p className="text-[10px] text-slate-500 mt-2">
                                                1 UA = 1.496 × 10¹¹ metros (La distancia real de la Tierra). Prueba a alejar el planeta para ver cómo aumenta su "año" según la 3ª Ley de Kepler.
                                            </p>
                                        </div>

                                        <div className="flex gap-2 pt-4">
                                            <button onClick={() => setDistanciaUA(1.0)} className="flex-1 bg-yellow-600 hover:bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg transition-all text-xs">
                                                TIERRA (1 UA)
                                            </button>
                                            <button onClick={() => setDistanciaUA(0.39)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 px-4 rounded-lg transition-all text-xs border border-slate-700">
                                                MERCURIO
                                            </button>
                                            <button onClick={() => setDistanciaUA(1.52)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 px-4 rounded-lg transition-all text-xs border border-slate-700">
                                                MARTE
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-yellow-950/20 p-6 rounded-3xl border border-yellow-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-yellow-500/30 pb-2">
                                        <h4 className="font-bold text-yellow-400 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-700">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                                            <img src={imgUrl} alt="DCL Generado" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. Pasar el tiempo al S.I. (Segundos):</strong></p>
                                        <div className="bg-slate-950 p-2 rounded-lg border-l-4 border-slate-600 font-mono text-slate-300">
                                            T = {periodoDias.toFixed(2)} días × 24 h × 3600 s<br/>
                                            T = <strong>{periodoSegundos.toExponential(4)} s</strong>
                                        </div>
                                        
                                        <p className="mt-3"><strong>2. Velocidad Angular (ω):</strong><br/>
                                        Es el ángulo que recorre por segundo.</p>
                                        <div className="bg-slate-950 p-2 rounded-lg border-l-4 border-emerald-600 font-mono text-emerald-300">
                                            ω = 2π / T = 2π / {periodoSegundos.toExponential(2)}<br/>
                                            ω = <strong>{omega.toExponential(3)} rad/s</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Fuerza Centrípeta (F<sub>c</sub>):</strong><br/>
                                        Aplicamos la fórmula $F_c = m \cdot \omega^2 \cdot R$. Recordamos que la masa de la Tierra es $5.97 \times 10^{24}$ kg y el radio de órbita es ${(radio).toExponential(3)}$ m.</p>
                                        <div className="bg-slate-950 p-3 rounded-lg border-l-4 border-yellow-500 font-mono text-yellow-300 shadow-inner">
                                            F<sub>c</sub> = M<sub>T</sub> · ω² · R<br/>
                                            F<sub>c</sub> = 5.97e24 · ({omega.toExponential(2)})² · {(radio).toExponential(3)}<br/>
                                            <strong>F<sub>c</sub> = {fc.toExponential(2)} N</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica Celeste y Gravitación Universal
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
