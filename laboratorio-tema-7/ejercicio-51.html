<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Subida y Bajada en Rampa</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981; /* Emerald 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .ramp-pattern {
            background-color: #475569;
            background-image: linear-gradient(45deg, #334155 25%, transparent 25%, transparent 75%, #334155 75%, #334155), 
                              linear-gradient(45deg, #334155 25%, transparent 25%, transparent 75%, #334155 75%, #334155);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ImagePlusIcon = getIcon('ImagePlus');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var ArrowUpIcon = getIcon('ArrowUp');
            var MountainIcon = getIcon('Mountain');

            var App = () => {
                // Parámetros del problema
                const g = 9.8; // m/s^2
                
                // Estados interactivos (Valores iniciales del enunciado)
                const [masa, setMasa] = useState(5.0); // kg
                const [v0, setV0] = useState(9.8); // m/s
                const [dMax, setDMax] = useState(6.0); // m
                const [angulo, setAngulo] = useState(37); // grados

                // --- CÁLCULOS FÍSICOS ---
                const anguloRad = angulo * (Math.PI / 180);
                const px = masa * g * Math.sin(anguloRad);
                const py = masa * g * Math.cos(anguloRad);
                
                // FASE 1: SUBIDA
                // Sabemos que se detiene (vf=0) tras recorrer dMax.
                // vf^2 = v0^2 + 2*a*d => 0 = v0^2 + 2*a*dMax => a_subida = -v0^2 / (2*dMax)
                const aSubidaMag = (v0 * v0) / (2 * dMax); // Magnitud de la aceleración (positiva para el cálculo)
                const fNetaSubida = masa * aSubidaMag; // F_neta = Px + Fr (Ambas tiran hacia abajo)
                
                // Despejamos la Fuerza de Rozamiento
                const fr = fNetaSubida - px;
                const mu = fr / py; // Coeficiente de rozamiento (para información extra)

                // FASE 2: BAJADA
                // Al bajar, Px tira hacia abajo y Fr tira hacia arriba.
                // ¿Se queda atascado en la cima? Ocurre si la fricción es mayor que Px.
                const seQuedaAtascado = fr >= px;
                
                const fNetaBajada = seQuedaAtascado ? 0 : (px - fr);
                const aBajada = fNetaBajada / masa; // Magnitud de aceleración hacia abajo
                const vFinal = seQuedaAtascado ? 0 : Math.sqrt(2 * aBajada * dMax);

                // Tiempos
                const tSubida = v0 / aSubidaMag;
                const tBajada = seQuedaAtascado ? 0 : Math.sqrt((2 * dMax) / aBajada);
                const tTotal = tSubida + tBajada;

                // --- ANIMACIÓN ---
                // Fases: 'ready', 'up', 'stuck', 'down', 'done'
                const [phase, setPhase] = useState('ready');
                const [time, setTime] = useState(0);
                
                // Cinemática instantánea
                let pos = 0; // m
                let currentV = 0; // m/s
                
                if (phase === 'ready') {
                    pos = 0;
                    currentV = 0;
                } else if (phase === 'up') {
                    pos = (v0 * time) - (0.5 * aSubidaMag * time * time);
                    currentV = v0 - (aSubidaMag * time);
                } else if (phase === 'down') {
                    const tDescenso = time - tSubida;
                    pos = dMax - (0.5 * aBajada * tDescenso * tDescenso);
                    currentV = aBajada * tDescenso;
                } else if (phase === 'stuck') {
                    pos = dMax;
                    currentV = 0;
                } else if (phase === 'done') {
                    pos = 0;
                    currentV = 0; // Ya impactó la base
                }

                // Asegurar topes visuales de cálculo
                pos = Math.max(0, Math.min(dMax, pos));

                useEffect(() => {
                    let interval;
                    if (phase === 'up' || phase === 'down') {
                        interval = setInterval(() => {
                            setTime(prev => {
                                const newT = prev + 0.05; // 50ms real time (1:1 approx)
                                
                                if (phase === 'up' && newT >= tSubida) {
                                    if (seQuedaAtascado) {
                                        setPhase('stuck');
                                    } else {
                                        setPhase('down');
                                    }
                                    return tSubida; // Clavamos el tiempo de subida
                                }
                                
                                if (phase === 'down' && newT >= tTotal) {
                                    setPhase('done');
                                    return tTotal;
                                }
                                
                                return newT;
                            });
                        }, 50);
                    }
                    return () => clearInterval(interval);
                }, [phase, tSubida, tTotal, seQuedaAtascado]);

                const handlePlay = () => {
                    if (phase === 'ready' || phase === 'done' || phase === 'stuck') {
                        setTime(0);
                        setPhase('up');
                    }
                };

                const reset = () => {
                    setTime(0);
                    setPhase('ready');
                };

                // Si cambian los datos, reiniciar
                useEffect(() => {
                    reset();
                }, [masa, v0, dMax, angulo]);

                // Escala visual
                const rampLengthPx = 350; 
                const pxPerMeter = rampLengthPx / Math.max(6, dMax + 2); // Dejamos algo de margen
                const visualPos = pos * pxPerMeter;

                // Generador de Diagrama de Cuerpo Libre
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física mostrando dos bloques en un plano inclinado. El primero (subiendo) tiene vector Px hacia abajo y vector Friccion Fr hacia abajo. El segundo (bajando) tiene vector Px hacia abajo y vector Friccion Fr hacia arriba. Fondo blanco, estilo educativo minimalista" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-emerald-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Dinámica Avanzada</span>
                                <h1 className="text-3xl font-black text-emerald-400 uppercase tracking-tight tracking-widest">Subida y Bajada</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un bloque de 5,0 kg se lanza por una rampa de 37° hacia arriba a 9,8 m/s. Sube 6,0 m por el plano y luego vuelve a caer. Calcula: a) La fuerza de rozamiento, b) La velocidad al volver a la base.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* Marcadores Flotantes Superiores */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Estado</p>
                                        <p className={`text-sm font-black uppercase ${phase === 'up' ? 'text-blue-400' : phase === 'down' ? 'text-orange-400' : phase === 'stuck' ? 'text-red-500' : 'text-slate-400'}`}>
                                            {phase === 'ready' ? 'En la base' : 
                                             phase === 'up' ? 'Subiendo' : 
                                             phase === 'stuck' ? 'Atascado en la cima' :
                                             phase === 'down' ? 'Bajando' : 'Ha vuelto a la base'}
                                        </p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Velocidad | Distancia</p>
                                        <p className="text-sm font-mono font-black text-emerald-400">{currentV.toFixed(2)} m/s | {pos.toFixed(1)} m</p>
                                    </div>
                                </div>

                                {/* Escena del Plano Inclinado */}
                                <div className="relative w-full h-80">
                                    <div className="absolute bottom-10 left-10 w-[450px] h-full pointer-events-none">
                                        
                                        {/* Rampa Rotada. Origen abajo a la izquierda */}
                                        <div 
                                            className="absolute bottom-0 left-0 w-full h-full origin-bottom-left transition-transform duration-300 z-20"
                                            style={{ transform: `rotate(${-angulo}deg)` }}
                                        >
                                            {/* Suelo de la rampa */}
                                            <div className="absolute bottom-0 left-0 w-[450px] h-4 ramp-pattern shadow-xl rounded-r-full"></div>
                                            
                                            {/* Marca del punto más alto (dMax) */}
                                            <div className="absolute bottom-4 border-l-2 border-dashed border-red-500 h-16 z-10" style={{ left: `${dMax * pxPerMeter + 32}px` }}>
                                                <span className="text-[8px] text-red-300 absolute -top-4 -left-3 font-black bg-slate-900 px-1 rounded">{dMax}m</span>
                                            </div>

                                            {/* El Bloque */}
                                            <div 
                                                className="absolute bottom-4 w-16 h-16 bg-emerald-600 border-4 border-emerald-400 rounded-lg flex items-center justify-center shadow-lg transition-transform z-30"
                                                style={{ transform: `translateX(${pos * pxPerMeter}px)` }}
                                            >
                                                <span className="font-black text-emerald-100 text-xs">{masa.toFixed(1)}kg</span>

                                                {/* Vectores (Dinámicos según la fase) */}
                                                
                                                {/* Vector Px (Rojo, SIEMPRE hacia abajo de la rampa -> Izquierda local) */}
                                                {(phase === 'up' || phase === 'down' || phase === 'ready') && (
                                                    <div className="absolute top-1/3 right-full flex items-center pr-1" style={{ width: Math.max(30, px * 2) }}>
                                                        <span className="mr-1 text-[10px] font-black text-red-300 bg-slate-900/80 px-1 rounded shadow">P_x</span>
                                                        <div className="h-1 bg-red-400 w-full relative">
                                                            <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-red-400" size={16} />}</div>
                                                        </div>
                                                    </div>
                                                )}

                                                {/* Vector Fricción (Naranja). Cambia de dirección! */}
                                                {(phase === 'up') && (
                                                    <div className="absolute bottom-1/3 right-full flex items-center pr-1" style={{ width: Math.max(30, fr * 2) }}>
                                                        <span className="mr-1 text-[10px] font-black text-orange-300 bg-slate-900/80 px-1 rounded shadow">F_r</span>
                                                        <div className="h-1 bg-orange-400 w-full relative">
                                                            <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-orange-400" size={16} />}</div>
                                                        </div>
                                                    </div>
                                                )}
                                                {(phase === 'down') && (
                                                    <div className="absolute top-1/2 left-full flex items-center pl-1" style={{ width: Math.max(30, fr * 2) }}>
                                                        <div className="h-1 bg-orange-400 w-full relative">
                                                            <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon className="text-orange-400" size={16} />}</div>
                                                        </div>
                                                        <span className="ml-1 text-[10px] font-black text-orange-300 bg-slate-900/80 px-1 rounded shadow">F_r</span>
                                                    </div>
                                                )}

                                                {/* Vector Velocidad (Verde brillante) */}
                                                {phase === 'up' && (
                                                    <div className="absolute bottom-full left-1/2 flex items-center mb-1" style={{ width: currentV * 10 }}>
                                                        <div className="h-0.5 bg-green-300 w-full relative">
                                                            <div className="absolute right-0 -top-1">{ArrowRightIcon && <ArrowRightIcon className="text-green-300" size={12} />}</div>
                                                        </div>
                                                        <span className="ml-1 text-[8px] font-bold text-green-300">v</span>
                                                    </div>
                                                )}
                                                {phase === 'down' && (
                                                    <div className="absolute bottom-full right-1/2 flex items-center mb-1 flex-row-reverse" style={{ width: currentV * 10 }}>
                                                        <div className="h-0.5 bg-green-300 w-full relative">
                                                            <div className="absolute left-0 -top-1">{ArrowLeftIcon && <ArrowLeftIcon className="text-green-300" size={12} />}</div>
                                                        </div>
                                                        <span className="mr-1 text-[8px] font-bold text-green-300">v</span>
                                                    </div>
                                                )}

                                            </div>
                                        </div>

                                        {/* Suelo Base */}
                                        <div className="absolute bottom-0 left-0 w-full border-b-2 border-slate-600 border-dashed"></div>
                                        
                                        {/* Ángulo */}
                                        {angulo > 0 && (
                                            <div className="absolute bottom-0 left-0 w-24 h-24 border-r-2 border-t-2 border-slate-500/50 rounded-tr-full flex items-end justify-end pb-2 pr-2">
                                                <span className="text-slate-400 font-mono text-sm font-bold">{angulo}º</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-400">
                                        {MountainIcon && <MountainIcon size={20} />} Datos Iniciales
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-300 font-bold uppercase">Masa</span></div>
                                                <input type="range" min="1" max="20" step="1" value={masa} onChange={e => setMasa(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                                <span className="font-mono text-white text-xs">{masa.toFixed(1)} kg</span>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-300 font-bold uppercase">Ángulo (α)</span></div>
                                                <input type="range" min="10" max="60" step="1" value={angulo} onChange={e => setAngulo(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400 mb-1" />
                                                <span className="font-mono text-white text-xs">{angulo}º</span>
                                            </div>
                                        </div>

                                        <div className="pt-3 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-blue-400 font-bold uppercase">Velocidad Lanzamiento (v₀)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-blue-200">{v0.toFixed(1)} m/s</span>
                                            </div>
                                            <input type="range" min="1" max="20" step="0.2" value={v0} onChange={e => setV0(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-red-400 font-bold uppercase">Distancia hasta frenar (d)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-red-200">{dMax.toFixed(1)} m</span>
                                            </div>
                                            <input type="range" min="1" max="15" step="0.5" value={dMax} onChange={e => setDMax(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500" />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={phase === 'up' || phase === 'down'}
                                            className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} LANZAR BLOQUE
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-emerald-950/20 p-6 rounded-3xl border border-emerald-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-emerald-500/30 pb-2">
                                        <h4 className="font-bold text-emerald-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} DCL I.A.</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-[11px] text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. Aceleración de SUBIDA (Cinemática):</strong><br/>
                                        Sabemos que v₀ = {v0.toFixed(1)}, v_f = 0, y d = {dMax.toFixed(1)}.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200">
                                            v_f² = v₀² + 2·a·d  ⇒  0 = {v0.toFixed(1)}² + 2·a·{dMax.toFixed(1)}<br/>
                                            a<sub>sub</sub> = -{(v0*v0).toFixed(2)} / {(2*dMax).toFixed(1)} = <strong>-{aSubidaMag.toFixed(3)} m/s²</strong>
                                        </div>

                                        <p><strong>2. Hallar la Fricción (Dinámica Subida):</strong><br/>
                                        Al subir, tanto P_x como F_r apuntan hacia ABAJO (negativos).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            P_x = m·g·sin(α) = {masa} · 9.8 · sin({angulo}º) = {px.toFixed(2)} N<br/>
                                            ΣF = -P_x - F_r = m · a<sub>sub</sub><br/>
                                            -{px.toFixed(2)} - F_r = {masa} · (-{aSubidaMag.toFixed(3)})<br/>
                                            F_r = {fNetaSubida.toFixed(2)} - {px.toFixed(2)} = <strong>{fr.toFixed(2)} N</strong>
                                        </div>
                                        <p className="text-[10px] text-slate-400 italic text-center">El coeficiente sería μ = F_r / P_y = {fr.toFixed(2)} / {py.toFixed(2)} ≈ {mu.toFixed(3)}.</p>

                                        <p className="mt-2"><strong>3. Velocidad de BAJADA:</strong><br/>
                                        Al bajar, P_x tira hacia abajo (positivo) y F_r hacia arriba (negativo, se opone).</p>
                                        
                                        {seQuedaAtascado ? (
                                            <div className="bg-red-900/40 p-2 rounded border border-red-500/30 text-red-200 font-bold">
                                                Como F_r ({fr.toFixed(2)}N) ≥ P_x ({px.toFixed(2)}N), ¡el bloque se queda atascado en la cima y no cae! Velocidad final = 0.
                                            </div>
                                        ) : (
                                            <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200">
                                                ΣF = P_x - F_r = {px.toFixed(2)} - {fr.toFixed(2)} = {fNetaBajada.toFixed(2)} N<br/>
                                                a<sub>baj</sub> = ΣF / m = {fNetaBajada.toFixed(2)} / {masa} = <strong>{aBajada.toFixed(3)} m/s²</strong><br/>
                                                v_f = √(2 · a<sub>baj</sub> · d) = √(2 · {aBajada.toFixed(3)} · {dMax.toFixed(1)}) = <strong>{vFinal.toFixed(2)} m/s</strong>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Cinemática en Dos Fases
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
