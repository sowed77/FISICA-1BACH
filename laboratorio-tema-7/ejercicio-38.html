<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Gravedad con la Altura</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; } /* Slate 950 */
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6; /* Blue 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .space-bg {
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var CalculatorIcon = getIcon('Calculator');
            var SettingsIcon = getIcon('Settings');
            var InfoIcon = getIcon('Info');
            var Globe2Icon = getIcon('Globe2');
            var UserIcon = getIcon('User');
            var ArrowDownIcon = getIcon('ArrowDown');
            var ImagePlusIcon = getIcon('ImagePlus');
            var RocketIcon = getIcon('Rocket');

            var App = () => {
                // Constantes Físicas Reales
                const G = 6.674e-11; // N·m²/kg²
                const Mt = 5.972e24; // Masa de la Tierra (kg)
                const Rt_km = 6371; // Radio de la Tierra (km)
                const Rt = Rt_km * 1000; // Radio en metros
                
                // Gravedad teórica en superficie
                const g0 = (G * Mt) / (Rt * Rt); // ~9.81 m/s²

                // Estados Interactivos (Datos del enunciado)
                const [hKm, setHKm] = useState(20000); // Altura en km
                const [mAstro, setMAstro] = useState(120); // kg

                // Cálculos Físicos
                const h = hKm * 1000; // Altura en metros
                const r = Rt + h; // Distancia total al centro
                
                // Gravedad a esa altura (g')
                const g_h = (G * Mt) / (r * r); // m/s²
                
                // Fuerza de atracción
                const f_g = mAstro * g_h; // N

                // Escala visual
                // El espacio útil vertical es de unos 350px. 
                // Mapearemos 0 km a 40000 km en ese espacio.
                const maxH = 40000;
                const visualY = Math.max(20, 350 - (hKm / maxH) * 330);

                // Generador de diagrama DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // La API key se inyecta en el entorno
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física gravitacional. La Tierra en la parte inferior. Un astronauta en el espacio arriba. Cotas marcando el Radio de la Tierra R_T y la altura h. Un vector de Fuerza F_g apuntando desde el astronauta hacia el centro de la Tierra. Fondo blanco, minimalista, educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-800 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Gravitación</span>
                                <h1 className="text-3xl font-black text-blue-400 uppercase tracking-tight tracking-widest">Gravedad Orbital</h1>
                            </div>
                            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Calcula la fuerza de atracción que ejerce la Tierra sobre un astronauta de 120 kg situado a 20.000 km de la superficie terrestre. Determina también el valor de la gravedad (g) a esa altura.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual Espacial */}
                            <div className="bg-slate-900 rounded-3xl border border-slate-800 h-[550px] relative overflow-hidden shadow-2xl flex flex-col items-center">
                                
                                <div className="absolute inset-0 space-bg pointer-events-none"></div>

                                {/* HUD Flotante */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-slate-800 backdrop-blur-md text-center">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Gravedad (g')</p>
                                        <p className="text-xl font-mono font-black text-emerald-400">{g_h.toFixed(3)} <span className="text-xs">m/s²</span></p>
                                    </div>
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-slate-800 backdrop-blur-md text-center border-b-4 border-b-orange-500">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza de Atracción (F_g)</p>
                                        <p className="text-xl font-mono font-black text-orange-400">{f_g.toFixed(1)} <span className="text-xs">N</span></p>
                                    </div>
                                </div>

                                {/* Escena: La Tierra y el Astronauta */}
                                <div className="relative w-full h-full flex flex-col justify-end items-center">
                                    
                                    {/* El Astronauta */}
                                    <div 
                                        className="absolute z-20 flex flex-col items-center transition-all duration-300"
                                        style={{ top: `${visualY}px` }}
                                    >
                                        <div className="w-10 h-10 bg-white rounded-xl border-2 border-slate-300 shadow-[0_0_15px_rgba(255,255,255,0.3)] flex items-center justify-center relative">
                                            <div className="w-6 h-4 bg-blue-900 rounded-md mb-2"></div>
                                        </div>
                                        <span className="text-[9px] font-black text-slate-300 mt-1 bg-slate-950/80 px-1 rounded">{hKm} km</span>
                                        
                                        {/* Vector Fuerza Atracción (Abajo) */}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 flex flex-col items-center pt-2 pointer-events-none" style={{ height: `${Math.max(20, Math.min(100, f_g / 10))}px` }}>
                                            <div className="w-1.5 bg-orange-500 h-full relative shadow-[0_0_10px_rgba(249,115,22,0.8)]">
                                                <div className="absolute bottom-0 left-1/2 -translate-x-1/2">{ArrowDownIcon && <ArrowDownIcon size={20} className="text-orange-500" />}</div>
                                            </div>
                                            <span className="mt-1 text-[10px] font-black text-orange-400 bg-slate-950/80 px-1 rounded whitespace-nowrap">F_g</span>
                                        </div>
                                    </div>

                                    {/* Regla de Altura */}
                                    <div className="absolute right-8 top-16 bottom-16 w-8 border-l-2 border-dashed border-slate-600/50 flex flex-col justify-between items-start pl-2 z-10">
                                        <span className="text-[10px] text-slate-500 font-mono">40k km</span>
                                        <span className="text-[10px] text-slate-500 font-mono">20k km</span>
                                        <span className="text-[10px] text-slate-500 font-mono">0 km</span>
                                    </div>

                                    {/* La Tierra (Curva enorme en la base) */}
                                    <div className="relative z-10 w-[600px] h-[100px] bg-blue-900 rounded-t-[300px] border-t-4 border-blue-500 flex flex-col items-center justify-start pt-6 overflow-hidden shadow-[inset_0_20px_50px_rgba(0,0,0,0.5)]">
                                        <div className="w-48 h-16 bg-green-700/50 rounded-full blur-md absolute top-4 left-32"></div>
                                        <div className="mt-2 text-center opacity-70">
                                            <p className="text-xs font-black text-blue-200 uppercase tracking-widest">Planeta Tierra</p>
                                            <p className="text-[10px] font-mono text-blue-300 mt-1">R_T = 6371 km</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-blue-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Ajustar Altitud
                                    </h3>
                                    
                                    <div className="space-y-6 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Altura sobre superficie (h)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-blue-300">{hKm} km</span>
                                            </div>
                                            <input 
                                                type="range" min="0" max="40000" step="500" value={hKm} 
                                                onChange={e => setHKm(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Masa del Astronauta (m)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-slate-300">{mAstro} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="50" max="250" step="5" value={mAstro} 
                                                onChange={e => setMAstro(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-slate-500" 
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={() => setHKm(0)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold py-2 rounded-lg border border-slate-700 text-slate-300">
                                            Superficie (0 km)
                                        </button>
                                        <button onClick={() => setHKm(400)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold py-2 rounded-lg border border-slate-700 text-slate-300">
                                            Órbita ISS (400 km)
                                        </button>
                                        <button onClick={() => setHKm(20000)} className="flex-1 bg-blue-900/50 hover:bg-blue-800/50 text-xs font-bold py-2 rounded-lg border border-blue-500/50 text-blue-300">
                                            GPS (20k km)
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-blue-950/20 p-6 rounded-3xl border border-blue-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-blue-500/30 pb-2">
                                        <h4 className="font-bold text-blue-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-700">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                                            <img src={imgUrl} alt="Diagrama Gravitacional" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. La Trampa del Radio:</strong><br/>
                                        La gravedad no se mide desde el suelo, sino desde el <strong>centro de masas</strong> del planeta. Debemos sumar el radio terrestre (R_T = 6371 km) a la altura (h).</p>
                                        
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-slate-600 font-mono text-slate-300">
                                            r = R_T + h = 6371 + {hKm} = {6371 + hKm} km<br/>
                                            r = <strong>{(6371 + hKm) * 1000} m</strong>
                                        </div>

                                        <p><strong>2. Valor de la gravedad (g'):</strong><br/>
                                        La aceleración de la gravedad disminuye con el cuadrado de la distancia.</p>
                                        
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-300 shadow-inner overflow-x-auto">
                                            g' = G · M_T / r²<br/>
                                            g' = 6.674·10⁻¹¹ · 5.972·10²⁴ / ({(r).toExponential(3)})²<br/>
                                            <strong>g' = {g_h.toFixed(3)} m/s²</strong>
                                        </div>

                                        <p><strong>3. Fuerza de Atracción (F_g):</strong><br/>
                                        Es simplemente el peso del astronauta a esa nueva gravedad (2ª Ley de Newton).</p>
                                        
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-300">
                                            F_g = m · g'<br/>
                                            F_g = {mAstro} · {g_h.toFixed(3)}<br/>
                                            <strong>F_g = {f_g.toFixed(1)} N</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Gravitación Universal
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
