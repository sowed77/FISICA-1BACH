<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: El Ascensor en Tres Fases</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #6366f1; /* Indigo 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .elevator-shaft {
            background-image: 
                linear-gradient(90deg, #1e293b 10px, transparent 10px, transparent calc(100% - 10px), #1e293b calc(100% - 10px)),
                repeating-linear-gradient(0deg, transparent 0, transparent 40px, rgba(255,255,255,0.05) 40px, rgba(255,255,255,0.05) 42px);
        }
        .cable-texture {
            background-image: repeating-linear-gradient(45deg, #64748b 0, #64748b 2px, #94a3b8 2px, #94a3b8 4px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var ArrowUpIcon = getIcon('ArrowUp');
            var ArrowDownIcon = getIcon('ArrowDown');
            var CalculatorIcon = getIcon('Calculator');
            var InfoIcon = getIcon('Info');
            var ImagePlusIcon = getIcon('ImagePlus');
            var ChevronsUpIcon = getIcon('ChevronsUp');
            var BuildingIcon = getIcon('Building');

            var App = () => {
                // Parámetros fijos
                const g = 9.8; // m/s^2
                const distTotal = 25; // m

                // Estados Interactivos (Datos del enunciado)
                const [m, setM] = useState(729); // kg
                const [vMax, setVMax] = useState(1.0); // m/s
                const [tAcel, setTAcel] = useState(2.0); // s
                const [aFrenoMag, setAFrenoMag] = useState(0.20); // m/s^2 (Magnitud positiva)

                // Cálculos de las Fases
                // FASE 1: Arranque
                const a1 = vMax / tAcel; // a = v / t
                const d1 = 0.5 * a1 * Math.pow(tAcel, 2); // d = 0.5 * a * t^2
                
                // FASE 3: Frenado
                // v_f^2 = v_0^2 + 2*a*d -> 0 = v_max^2 - 2*a_freno*d_freno -> d_freno = v_max^2 / (2*a_freno)
                const d3 = (vMax * vMax) / (2 * aFrenoMag);
                const tFreno = vMax / aFrenoMag;
                
                // FASE 2: Viaje Constante
                const d2 = distTotal - d1 - d3;
                const tViaje = d2 / vMax;

                // Tiempos absolutos de cambio de fase
                const tEndPhase1 = tAcel;
                const tEndPhase2 = tAcel + tViaje;
                const tTotal = tAcel + tViaje + tFreno;

                // Fuerzas/Tensiones en cada fase: T - P = m*a -> T = m*(g+a)
                const peso = m * g;
                const T1 = m * (g + a1);
                const T2 = m * g; // a=0
                const T3 = m * (g - aFrenoMag);

                // Animación
                const [time, setTime] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // Escala visual (25m mapeados a 300px)
                const pxPerMeter = 300 / distTotal;

                // Cinemática en tiempo real
                let currentY = 0; // Posición en metros (0 es abajo)
                let currentV = 0;
                let currentA = 0;
                let currentT = peso;
                let currentPhaseStr = "REPOSO";

                if (time === 0) {
                    currentY = 0;
                    currentV = 0;
                    currentA = 0;
                    currentT = peso;
                    currentPhaseStr = "REPOSO";
                } else if (time <= tEndPhase1) {
                    currentA = a1;
                    currentV = currentA * time;
                    currentY = 0.5 * currentA * Math.pow(time, 2);
                    currentT = T1;
                    currentPhaseStr = "FASE 1: ARRANCANDO";
                } else if (time <= tEndPhase2) {
                    currentA = 0;
                    currentV = vMax;
                    const tEnFase2 = time - tEndPhase1;
                    currentY = d1 + (vMax * tEnFase2);
                    currentT = T2;
                    currentPhaseStr = "FASE 2: VEL. CONSTANTE";
                } else if (time <= tTotal) {
                    currentA = -aFrenoMag;
                    const tEnFase3 = time - tEndPhase2;
                    currentV = vMax + (currentA * tEnFase3);
                    currentY = d1 + d2 + (vMax * tEnFase3) + (0.5 * currentA * Math.pow(tEnFase3, 2));
                    currentT = T3;
                    currentPhaseStr = "FASE 3: FRENANDO";
                } else {
                    currentY = distTotal;
                    currentV = 0;
                    currentA = 0;
                    currentT = peso;
                    currentPhaseStr = "LLEGADA (REPOSO)";
                }

                // Asegurar topes visuales
                currentY = Math.max(0, Math.min(distTotal, currentY));

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tTotal) {
                        interval = setInterval(() => {
                            setTime(prev => {
                                const timeScale = 4; // Aceleramos x4 visualmente (si no tardaría 28s)
                                const nextTime = prev + 0.02 * timeScale; 
                                if (nextTime >= tTotal) {
                                    setIsMoving(false);
                                    return tTotal;
                                }
                                return nextTime;
                            });
                        }, 20); // 50fps
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tTotal]);

                const handlePlay = () => {
                    if (time < tTotal) setIsMoving(true);
                };

                const handleReset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Generador de Diagrama de Cuerpo Libre
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de cuerpo libre. Una caja cuadrada (ascensor). Vector de Tensión T apuntando hacia arriba. Vector Peso P apuntando hacia abajo. Los dos vectores son paralelos sobre el mismo eje vertical. Fondo blanco, estilo educativo minimalista" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en la API");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                // Altura visual del ascensor (invertida para CSS bottom)
                const visualBottom = currentY * pxPerMeter;

                // Color dinámico según la fase para los HUDs
                const phaseColor = 
                    currentA > 0 ? 'text-indigo-400' : 
                    currentA < 0 ? 'text-orange-400' : 
                    (currentV > 0 ? 'text-emerald-400' : 'text-slate-400');

                const phaseBorderColor = 
                    currentA > 0 ? 'border-b-indigo-500' : 
                    currentA < 0 ? 'border-b-orange-500' : 
                    (currentV > 0 ? 'border-b-emerald-500' : 'border-b-slate-500');

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Dinámica y Cinemática</span>
                                <h1 className="text-3xl font-black text-indigo-400 uppercase tracking-tight tracking-widest">El Ascensor Multipiso</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un ascensor de 729 kg sube 25 m. A los 2,0 s llega a 1,0 m/s. Faltando 2,5 m frena con a = 0,20 m/s². Calcula la Tensión del cable en: a) el primer segundo, b) el último metro.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col items-center">
                                
                                {/* Marcadores Flotantes (HUD) */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md border-b-4 ${phaseBorderColor}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black">{currentPhaseStr}</p>
                                        <p className={`text-2xl font-mono font-black ${phaseColor}`}>T = {currentT.toFixed(1)} N</p>
                                        <div className="flex gap-4 mt-1 text-[10px] font-mono text-slate-400">
                                            <span>v = {currentV.toFixed(2)} m/s</span>
                                            <span>a = {currentA.toFixed(2)} m/s²</span>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right flex flex-col justify-center">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Cronómetro / Distancia</p>
                                        <p className="text-xl font-mono font-black text-white">{time.toFixed(1)} s</p>
                                        <p className="text-xs font-mono font-bold text-slate-400">{currentY.toFixed(1)} m / 25 m</p>
                                    </div>
                                </div>

                                {/* Hueco del Ascensor */}
                                <div className="relative w-32 h-[400px] mt-24 elevator-shaft border-x-4 border-slate-700 flex justify-center">
                                    
                                    {/* Regla de medidas en la pared */}
                                    <div className="absolute -left-12 h-[300px] border-r-2 border-dashed border-slate-600 flex flex-col justify-between items-end pr-2" style={{ bottom: '20px' }}>
                                        <span className="text-[10px] text-slate-500 font-mono font-bold">25m</span>
                                        <span className="text-[10px] text-orange-500 font-mono font-bold" style={{ position: 'absolute', top: `${(d3 / distTotal) * 100}%` }}>Freno</span>
                                        <span className="text-[10px] text-indigo-500 font-mono font-bold" style={{ position: 'absolute', bottom: `${(d1 / distTotal) * 100}%` }}>MRU</span>
                                        <span className="text-[10px] text-slate-500 font-mono font-bold">0m</span>
                                    </div>

                                    {/* Cable (Sube y baja con el ascensor) */}
                                    <div 
                                        className="absolute top-0 w-2 cable-texture z-10"
                                        style={{ height: `calc(100% - ${visualBottom + 20}px - 60px)` }}
                                    ></div>

                                    {/* Cabina del Ascensor */}
                                    <div 
                                        className="absolute w-20 h-24 bg-slate-400 border-4 border-slate-300 rounded-lg shadow-xl flex flex-col items-center justify-center z-20"
                                        style={{ bottom: `${visualBottom + 20}px` }}
                                    >
                                        {/* Motor/Polea en el techo visual */}
                                        <div className="absolute -top-4 w-6 h-4 bg-slate-600 rounded-t-sm"></div>

                                        <span className="font-black text-slate-800 text-xs">{m} kg</span>
                                        <ChevronsUpIcon className={`mt-1 transition-opacity ${currentV > 0 ? 'opacity-100' : 'opacity-20'}`} size={16} color={currentV > 0 ? '#10b981' : '#475569'} />

                                        {/* Vectores (Desde el centro de la cabina) */}
                                        <div className="absolute top-1/2 left-full pl-2 flex flex-col items-center pointer-events-none z-30">
                                            {/* Tensión (Hacia arriba) */}
                                            <div className="flex flex-col items-center pb-1 transition-all" style={{ height: (currentT / peso) * 40 }}>
                                                <span className="mb-1 text-[10px] font-black text-indigo-300 bg-slate-900/80 px-1 rounded shadow">T</span>
                                                <div className="w-1.5 bg-indigo-400 h-full relative shadow-[0_0_5px_rgba(99,102,241,0.8)]">
                                                    <div className="absolute top-0 -translate-x-[6px]">{ArrowUpIcon && <ArrowUpIcon size={18} className="text-indigo-400" />}</div>
                                                </div>
                                            </div>
                                            
                                            {/* Peso (Hacia abajo) */}
                                            <div className="flex flex-col items-center pt-1 pointer-events-none" style={{ height: 40 }}>
                                                <div className="w-1.5 bg-orange-400 h-full relative shadow-[0_0_5px_rgba(249,115,22,0.8)]">
                                                    <div className="absolute bottom-0 -translate-x-[6px]">{ArrowDownIcon && <ArrowDownIcon size={18} className="text-orange-400" />}</div>
                                                </div>
                                                <span className="mt-1 text-[10px] font-black text-orange-300 bg-slate-900/80 px-1 rounded shadow">P</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Topes foso ascensor */}
                                    <div className="absolute bottom-0 w-full h-5 bg-slate-800 border-t-2 border-slate-600"></div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-400">
                                        {BuildingIcon && <BuildingIcon size={20} />} Panel de Control
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-slate-300 font-bold uppercase">Masa Total</span></div>
                                                <input type="number" value={m} onChange={e => {setM(Number(e.target.value)); handleReset();}} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white font-mono" />
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-indigo-300 font-bold uppercase">Velocidad Máx</span></div>
                                                <input type="number" value={vMax} step="0.5" onChange={e => {setVMax(Number(e.target.value)); handleReset();}} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-indigo-300 font-mono" />
                                            </div>
                                        </div>

                                        <div className="pt-2 border-t border-slate-700 grid grid-cols-2 gap-4">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-emerald-400 font-bold uppercase">T. Arranque (s)</span></div>
                                                <input type="number" value={tAcel} step="0.5" onChange={e => {setTAcel(Number(e.target.value)); handleReset();}} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-emerald-300 font-mono" />
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1"><span className="text-orange-400 font-bold uppercase">Acel. Frenado</span></div>
                                                <input type="number" value={aFrenoMag} step="0.1" onChange={e => {setAFrenoMag(Number(e.target.value)); handleReset();}} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-orange-300 font-mono" />
                                            </div>
                                        </div>
                                        <p className="text-[10px] text-slate-500 italic text-center">La simulación está acelerada (x4) visualmente para no demorar la experiencia.</p>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tTotal}
                                            className={`flex-1 font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 ${time >= tTotal ? 'bg-slate-600 text-slate-400' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} {time >= tTotal ? 'EN PLANTA' : 'LLAMAR ASCENSOR'}
                                        </button>
                                        <button onClick={handleReset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-indigo-950/20 p-6 rounded-3xl border border-indigo-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-indigo-500/30 pb-2">
                                        <h4 className="font-bold text-indigo-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Matemática
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-[11px] text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>Apartado A: Tensión en el primer segundo</strong><br/>
                                        El primer segundo pertenece a la <strong>Fase 1</strong> de aceleración (de 0 a {tAcel}s). Debemos hallar esa aceleración primero.</p>
                                        
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-indigo-500 font-mono text-indigo-200">
                                            a₁ = (v - v₀) / t = ({vMax} - 0) / {tAcel} = {a1.toFixed(2)} m/s²<br/>
                                            Σ F_y = m·a  ⇒  T₁ - P = m·a₁<br/>
                                            T₁ = m·(g + a₁) = {m} · (9.8 + {a1.toFixed(2)})<br/>
                                            <strong>T₁ = {T1.toFixed(1)} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>Apartado B: Tensión en el último metro</strong><br/>
                                        El último metro pertenece a la <strong>Fase 3</strong> de frenado. Comprobamos la distancia de frenado: d = v_max² / (2*a) = {vMax}² / (2*{aFrenoMag}) = {d3.toFixed(2)} m. Como 1m &lt; {d3.toFixed(2)}m, estamos en frenado.</p>
                                        
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            El ascensor sube, pero frena. La aceleración se opone a la velocidad, luego a₃ = -{aFrenoMag} m/s².<br/>
                                            Σ F_y = m·a  ⇒  T₃ - P = m·a₃<br/>
                                            T₃ = m·(g + a₃) = {m} · (9.8 - {aFrenoMag.toFixed(2)})<br/>
                                            <strong>T₃ = {T3.toFixed(1)} N</strong>
                                        </div>
                                        
                                        <p className="text-[10px] text-slate-400 italic text-center mt-2 border-t border-slate-700 pt-2">
                                            (Nota: En el medio hay un tramo MRU donde T = P = {peso.toFixed(1)} N).
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica Multifase: Ascensores
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
