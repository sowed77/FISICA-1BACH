<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Gravitación Universal vs Gravedad Terrestre</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6; /* Blue 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .asphalt-bg {
            background-color: #334155;
            background-image: repeating-linear-gradient(45deg, #1e293b 0, #1e293b 2px, transparent 2px, transparent 8px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var TruckIcon = getIcon('Truck');
            var ScaleIcon = getIcon('Scale');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ImagePlusIcon = getIcon('ImagePlus');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var ArrowDownIcon = getIcon('ArrowDown');
            var SettingsIcon = getIcon('Settings');

            var App = () => {
                // Constantes Físicas
                const G = 6.674e-11; // N·m²/kg²
                const g = 9.8; // m/s²

                // Estados Interactivos
                const [m1Ton, setM1Ton] = useState(30); // Toneladas
                const [m2Ton, setM2Ton] = useState(24); // Toneladas
                const [distancia, setDistancia] = useState(4.0); // Metros
                const [mFileteGramos, setMFileteGramos] = useState(120); // Gramos

                // Conversiones al S.I.
                const m1 = m1Ton * 1000; // kg
                const m2 = m2Ton * 1000; // kg
                const mFilete = mFileteGramos / 1000; // kg

                // Cálculos
                const fGravitatoria = G * ((m1 * m2) / Math.pow(distancia, 2)); // N
                const pesoFilete = mFilete * g; // N
                const ratio = pesoFilete / fGravitatoria;

                // Formateo de números para visualización
                const fg_exp = Math.floor(Math.log10(fGravitatoria));
                const fg_base = (fGravitatoria / Math.pow(10, fg_exp)).toFixed(2);

                // Generador de diagrama DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // Se inyecta en el entorno
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de cuerpo libre. A la izquierda, dos grandes cuadrados representando camiones con vectores muy pequeños de atracción Fg entre ellos. A la derecha, un filete de carne con un vector gigante de Peso P hacia abajo. Estilo educativo minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Gravitación Universal</span>
                                <h1 className="text-3xl font-black text-blue-400 uppercase tracking-tight tracking-widest">Camiones vs Filete</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Calcula la fuerza de atracción gravitatoria entre dos camiones de 30 t y 24 t aparcados a 4,0 m de distancia. ¿Es mayor que el peso de un filete de 0,12 kg?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col">
                                
                                {/* Zona Superior: Los Camiones */}
                                <div className="h-2/3 relative border-b-4 border-slate-900 asphalt-bg flex flex-col items-center justify-center p-4">
                                    
                                    <div className="absolute top-4 left-4 bg-slate-900/90 p-2 rounded-lg border border-slate-700 backdrop-blur-md z-20">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Atracción entre Camiones (F_g)</p>
                                        <p className="text-lg font-mono font-black text-blue-400">
                                            {fg_base} × 10<sup className="text-[10px]">{fg_exp}</sup> N
                                        </p>
                                        <p className="text-[10px] text-slate-500 mt-1">~ {fGravitatoria.toFixed(4)} N</p>
                                    </div>

                                    <div className="flex items-center justify-center gap-4 relative mt-10">
                                        {/* Camión 1 */}
                                        <div className="flex flex-col items-center relative z-10">
                                            <div className="w-24 h-20 bg-slate-600 rounded-lg flex flex-col items-center justify-center border-2 border-slate-400 shadow-xl">
                                                <TruckIcon size={32} className="text-slate-300" />
                                                <span className="font-black text-xs text-slate-900 mt-1 bg-slate-300/80 px-1 rounded">{m1Ton} t</span>
                                            </div>
                                            {/* Ruedas */}
                                            <div className="flex gap-10 -mt-2">
                                                <div className="w-6 h-6 bg-slate-900 rounded-full"></div>
                                                <div className="w-6 h-6 bg-slate-900 rounded-full"></div>
                                            </div>
                                            {/* Vector Atracción Camión 1 -> 2 */}
                                            <div className="absolute top-1/2 left-full flex items-center z-0 -translate-y-1/2" style={{ width: '40px' }}>
                                                <div className="h-0.5 bg-blue-400 w-full relative">
                                                    <div className="absolute right-0 -top-2">{ArrowRightIcon && <ArrowRightIcon className="text-blue-400" size={16} />}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Regla de Distancia */}
                                        <div className="w-32 flex flex-col items-center justify-end h-8 border-b-2 border-dashed border-slate-500 pb-1">
                                            <span className="text-[10px] font-mono font-bold text-slate-400">d = {distancia.toFixed(1)} m</span>
                                        </div>

                                        {/* Camión 2 */}
                                        <div className="flex flex-col items-center relative z-10">
                                            <div className="w-20 h-16 bg-slate-500 rounded-lg flex flex-col items-center justify-center border-2 border-slate-400 shadow-xl">
                                                <TruckIcon size={24} className="text-slate-300" />
                                                <span className="font-black text-xs text-slate-900 mt-1 bg-slate-300/80 px-1 rounded">{m2Ton} t</span>
                                            </div>
                                            {/* Ruedas */}
                                            <div className="flex gap-6 -mt-2">
                                                <div className="w-5 h-5 bg-slate-900 rounded-full"></div>
                                                <div className="w-5 h-5 bg-slate-900 rounded-full"></div>
                                            </div>
                                            {/* Vector Atracción Camión 2 -> 1 */}
                                            <div className="absolute top-1/2 right-full flex items-center z-0 -translate-y-1/2" style={{ width: '40px' }}>
                                                <div className="h-0.5 bg-blue-400 w-full relative">
                                                    <div className="absolute left-0 -top-2">{ArrowLeftIcon && <ArrowLeftIcon className="text-blue-400" size={16} />}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="absolute bottom-2 text-center w-full">
                                        <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest animate-pulse">Fuerza minúscula</p>
                                    </div>
                                </div>

                                {/* Zona Inferior: El Filete */}
                                <div className="h-1/3 bg-slate-800 relative flex items-center justify-center p-4">
                                    <div className="absolute top-4 left-4 bg-slate-900/90 p-2 rounded-lg border border-slate-700 backdrop-blur-md z-20">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Peso del Filete (P = m·g)</p>
                                        <p className="text-lg font-mono font-black text-orange-400">
                                            {pesoFilete.toFixed(3)} N
                                        </p>
                                    </div>

                                    <div className="flex flex-col items-center ml-32 relative">
                                        <div className="text-5xl drop-shadow-xl z-10">🥩</div>
                                        <div className="w-16 h-2 bg-slate-600 rounded-full shadow-lg"></div>
                                        
                                        {/* Vector Peso */}
                                        <div className="absolute top-1/2 flex flex-col items-center pointer-events-none" style={{ height: '80px', transform: 'translateY(-10px)' }}>
                                            <div className="w-2 bg-orange-500 h-full relative shadow-[0_0_15px_rgba(249,115,22,0.8)]">
                                                <div className="absolute bottom-0 left-1/2 -translate-x-1/2">{ArrowDownIcon && <ArrowDownIcon className="text-orange-500" size={24} />}</div>
                                            </div>
                                            <span className="mt-1 text-xs font-black text-orange-400 bg-slate-900/80 px-1 rounded shadow">P</span>
                                        </div>
                                    </div>
                                    
                                    <div className="absolute bottom-4 right-4 bg-slate-900/90 p-3 rounded-xl border border-emerald-500/30 text-center shadow-lg">
                                        <p className="text-[9px] text-slate-400 uppercase font-bold">Relación de Fuerzas</p>
                                        <p className="text-sm font-black text-emerald-400">El filete tira <br/><span className="text-xl">{ratio.toFixed(0)}x</span><br/>más fuerte</p>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-blue-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Modificar Datos
                                    </h3>
                                    
                                    <div className="space-y-5">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1">
                                                    <span className="text-slate-300 font-bold uppercase">Masa Camión 1</span>
                                                </div>
                                                <input type="range" min="10" max="60" step="1" value={m1Ton} onChange={e => setM1Ton(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{m1Ton} t</span>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] mb-1">
                                                    <span className="text-slate-300 font-bold uppercase">Masa Camión 2</span>
                                                </div>
                                                <input type="range" min="10" max="60" step="1" value={m2Ton} onChange={e => setM2Ton(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 mb-1" />
                                                <span className="font-mono text-white text-xs">{m2Ton} t</span>
                                            </div>
                                        </div>

                                        <div className="pt-3 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-emerald-400 font-bold uppercase">Distancia (d)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-emerald-200">{distancia.toFixed(1)} m</span>
                                            </div>
                                            <input type="range" min="1.0" max="20.0" step="0.5" value={distancia} onChange={e => setDistancia(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
                                        </div>

                                        <div className="pt-3 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-orange-400 font-bold uppercase">Masa del Filete</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-orange-200">{mFileteGramos} g ({mFilete.toFixed(2)} kg)</span>
                                            </div>
                                            <input type="range" min="50" max="500" step="10" value={mFileteGramos} onChange={e => setMFileteGramos(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-blue-950/20 p-6 rounded-3xl border border-blue-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-blue-500/30 pb-2">
                                        <h4 className="font-bold text-blue-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama Técnico" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. Pasar unidades al S.I.:</strong><br/>
                                        m₁ = {m1Ton} t = <strong>{m1} kg</strong><br/>
                                        m₂ = {m2Ton} t = <strong>{m2} kg</strong></p>

                                        <p className="mt-3"><strong>2. Fuerza de Atracción (Newton):</strong><br/>
                                        La fórmula de Gravitación Universal es F_g = G · (m₁ · m₂) / d²</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200 shadow-inner overflow-x-auto">
                                            F_g = 6.674·10⁻¹¹ · ({m1} · {m2}) / {distancia.toFixed(1)}²<br/>
                                            F_g = 6.674·10⁻¹¹ · {(m1*m2)} / {(distancia*distancia).toFixed(2)}<br/>
                                            <strong>F_g ≈ {fGravitatoria.toFixed(4)} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Peso del Filete:</strong><br/>
                                        La gravedad terrestre actuando sobre su masa ({mFilete.toFixed(2)} kg).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            P = m · g = {mFilete.toFixed(2)} · 9.8 = <strong>{pesoFilete.toFixed(3)} N</strong>
                                        </div>

                                        <p className="mt-3 bg-emerald-900/30 border border-emerald-500/30 p-2 rounded text-emerald-200 font-bold text-center">
                                            Conclusión: {pesoFilete.toFixed(3)} N &gt; {fGravitatoria.toFixed(4)} N.<br/>
                                            ¡El peso del filete es {ratio.toFixed(0)} veces MAYOR!
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Gravitación Universal y Dimensiones
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
