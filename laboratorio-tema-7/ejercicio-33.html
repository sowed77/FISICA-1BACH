<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Choque Frontal y Momento Lineal</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ef4444; /* Red 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .track-pattern {
            background-image: linear-gradient(90deg, #334155 1px, transparent 1px);
            background-size: 50px 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var CalculatorIcon = getIcon('Calculator');
            var SettingsIcon = getIcon('Settings');
            var InfoIcon = getIcon('Info');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var AlertCircleIcon = getIcon('AlertCircle');
            var ImagePlusIcon = getIcon('ImagePlus');

            var App = () => {
                // Parámetros fijos del enunciado (en kg)
                const m1 = 0.030; // 30 g
                const m2 = 0.075; // 75 g
                
                // La bola 1 "rebota" a 12,1 m/s. Si suponemos que iba hacia la derecha (+), 
                // el rebote será hacia la izquierda (-).
                const v1f = -12.1; 

                // Estados interactivos: Velocidades iniciales que faltan en el enunciado
                const [v1i, setV1i] = useState(20.0); // Asumimos una velocidad inicial de ejemplo
                const [v2i, setV2i] = useState(-5.0); // Asumimos que viene en sentido contrario

                // Cálculos Físicos
                // P_inicial = m1*v1i + m2*v2i
                const pInicial = m1 * v1i + m2 * v2i;
                
                // P_final = m1*v1f + m2*v2f
                // Como P_inicial = P_final => pInicial = m1*v1f + m2*v2f
                // Despejamos v2f:
                const v2f = (pInicial - (m1 * v1f)) / m2;

                const p1i = m1 * v1i;
                const p2i = m2 * v2i;
                const p1f = m1 * v1f;
                const p2f = m2 * v2f;

                // Generador de DCL IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de un choque frontal. Dos bolas chocando. Antes del choque: vectores de velocidad acercándose. Después del choque: vectores de velocidad alejándose. Estilo educativo, minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Colisiones 1D</span>
                                <h1 className="text-3xl font-black text-red-400 uppercase tracking-tight tracking-widest">El Choque Frontal</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4 flex items-start gap-4">
                                <AlertCircleIcon className="text-yellow-500 shrink-0 mt-1" size={24} />
                                <div className="text-slate-300 text-sm leading-relaxed">
                                    <p className="mb-2"><strong>¡Atención! Faltan datos en el enunciado:</strong> "Bolas de 30 y 75 g chocan frontalmente. Tras el choque, la de 30 g rebota a 12,1 m/s. Halla v2f."</p>
                                    <p>Para resolverlo, necesitas introducir las velocidades que tenían las bolas <strong>antes de chocar</strong>. Búscalas en tu libro y ajústalas en el panel de control de abajo para obtener el resultado correcto.</p>
                                </div>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual de la Colisión */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[450px] relative overflow-hidden shadow-2xl flex flex-col justify-between">
                                
                                {/* ANTES DEL CHOQUE */}
                                <div className="flex-1 relative border-b border-slate-700/50 track-pattern">
                                    <div className="absolute top-2 left-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Antes del choque</div>
                                    <div className="absolute w-full top-1/2 -translate-y-1/2 flex justify-center items-center gap-16">
                                        
                                        {/* Bola 1 Inicial */}
                                        <div className="relative flex flex-col items-center">
                                            <div className="w-10 h-10 bg-orange-500 rounded-full border-4 border-orange-300 shadow-[0_0_15px_rgba(249,115,22,0.5)] z-20 flex items-center justify-center">
                                                <span className="text-[10px] font-black text-orange-950">m1</span>
                                            </div>
                                            {/* Vector Velocidad m1 */}
                                            {v1i !== 0 && (
                                                <div className={`absolute top-1/2 -translate-y-1/2 flex items-center ${v1i > 0 ? 'left-full pl-1' : 'right-full pr-1 flex-row-reverse'}`} style={{ width: Math.max(30, Math.abs(v1i)*3) }}>
                                                    <div className="h-1 bg-orange-300 w-full relative">
                                                        {v1i > 0 ? (
                                                            <div className="absolute right-0 -top-1.5"><ArrowRightIcon size={16} className="text-orange-300"/></div>
                                                        ) : (
                                                            <div className="absolute left-0 -top-1.5"><ArrowLeftIcon size={16} className="text-orange-300"/></div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                            <span className="absolute -bottom-6 text-[10px] font-mono text-orange-400">{v1i} m/s</span>
                                        </div>

                                        {/* Bola 2 Inicial */}
                                        <div className="relative flex flex-col items-center">
                                            <div className="w-14 h-14 bg-blue-500 rounded-full border-4 border-blue-300 shadow-[0_0_15px_rgba(59,130,246,0.5)] z-20 flex items-center justify-center">
                                                <span className="text-[10px] font-black text-blue-950">m2</span>
                                            </div>
                                            {/* Vector Velocidad m2 */}
                                            {v2i !== 0 && (
                                                <div className={`absolute top-1/2 -translate-y-1/2 flex items-center ${v2i > 0 ? 'left-full pl-1' : 'right-full pr-1 flex-row-reverse'}`} style={{ width: Math.max(30, Math.abs(v2i)*3) }}>
                                                    <div className="h-1 bg-blue-300 w-full relative">
                                                        {v2i > 0 ? (
                                                            <div className="absolute right-0 -top-1.5"><ArrowRightIcon size={16} className="text-blue-300"/></div>
                                                        ) : (
                                                            <div className="absolute left-0 -top-1.5"><ArrowLeftIcon size={16} className="text-blue-300"/></div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                            <span className="absolute -bottom-6 text-[10px] font-mono text-blue-400">{v2i} m/s</span>
                                        </div>

                                    </div>
                                </div>

                                {/* DESPUÉS DEL CHOQUE */}
                                <div className="flex-1 relative track-pattern bg-slate-900/30">
                                    <div className="absolute top-2 left-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Después del choque</div>
                                    <div className="absolute w-full top-1/2 -translate-y-1/2 flex justify-center items-center gap-16">
                                        
                                        {/* Bola 1 Final (Rebota, va hacia la izquierda) */}
                                        <div className="relative flex flex-col items-center">
                                            <div className="w-10 h-10 bg-orange-500 rounded-full border-4 border-orange-300 shadow-[0_0_15px_rgba(249,115,22,0.5)] z-20 flex items-center justify-center">
                                                <span className="text-[10px] font-black text-orange-950">m1</span>
                                            </div>
                                            <div className="absolute top-1/2 right-full pr-1 flex items-center flex-row-reverse" style={{ width: Math.abs(v1f)*3 }}>
                                                <div className="h-1 bg-orange-300 w-full relative">
                                                    <div className="absolute left-0 -top-1.5"><ArrowLeftIcon size={16} className="text-orange-300"/></div>
                                                </div>
                                            </div>
                                            <span className="absolute -bottom-6 text-[10px] font-mono text-orange-400">{v1f} m/s</span>
                                        </div>

                                        {/* Bola 2 Final (Se calcula) */}
                                        <div className="relative flex flex-col items-center">
                                            <div className="w-14 h-14 bg-blue-500 rounded-full border-4 border-blue-300 shadow-[0_0_15px_rgba(59,130,246,0.5)] z-20 flex items-center justify-center">
                                                <span className="text-[10px] font-black text-blue-950">m2</span>
                                            </div>
                                            {/* Vector Velocidad m2 Final */}
                                            {v2f !== 0 && (
                                                <div className={`absolute top-1/2 -translate-y-1/2 flex items-center ${v2f > 0 ? 'left-full pl-1' : 'right-full pr-1 flex-row-reverse'}`} style={{ width: Math.max(30, Math.abs(v2f)*3) }}>
                                                    <div className="h-1 bg-blue-300 w-full relative">
                                                        {v2f > 0 ? (
                                                            <div className="absolute right-0 -top-1.5"><ArrowRightIcon size={16} className="text-blue-300"/></div>
                                                        ) : (
                                                            <div className="absolute left-0 -top-1.5"><ArrowLeftIcon size={16} className="text-blue-300"/></div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                            <span className="absolute -bottom-6 text-[10px] font-mono font-black text-emerald-400">{v2f.toFixed(2)} m/s</span>
                                        </div>

                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-red-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Introduce los datos que faltan
                                    </h3>
                                    
                                    <div className="space-y-4 mb-4">
                                        {/* m1 y m2 (Fijos pero visibles) */}
                                        <div className="flex gap-4">
                                            <div className="flex-1 bg-slate-900/50 p-2 rounded border border-slate-700">
                                                <span className="block text-[10px] text-slate-500 uppercase">m1 (Dato)</span>
                                                <span className="font-mono font-bold text-orange-400">30 g (0.030 kg)</span>
                                            </div>
                                            <div className="flex-1 bg-slate-900/50 p-2 rounded border border-slate-700">
                                                <span className="block text-[10px] text-slate-500 uppercase">m2 (Dato)</span>
                                                <span className="font-mono font-bold text-blue-400">75 g (0.075 kg)</span>
                                            </div>
                                        </div>

                                        {/* Inputs para v1i y v2i */}
                                        <div className="pt-4 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-orange-300 font-bold uppercase">Velocidad Inicial m1 (v1i)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-orange-200">{v1i} m/s</span>
                                            </div>
                                            <input 
                                                type="range" min="-30" max="30" step="1" value={v1i} 
                                                onChange={e => setV1i(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-blue-300 font-bold uppercase">Velocidad Inicial m2 (v2i)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-blue-200">{v2i} m/s</span>
                                            </div>
                                            <input 
                                                type="range" min="-30" max="30" step="1" value={v2i} 
                                                onChange={e => setV2i(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" 
                                            />
                                        </div>
                                    </div>
                                    <p className="text-[10px] text-slate-500 italic">Signo positivo (+) = hacia la derecha. Signo negativo (-) = hacia la izquierda.</p>
                                </div>

                                <div className="bg-red-950/20 p-6 rounded-3xl border border-red-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-red-500/30 pb-2">
                                        <h4 className="font-bold text-red-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} DCL I.A.</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="DCL Generado" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. Conversión de masas al S.I.:</strong><br/>
                                        m₁ = 30 g = <strong>0.030 kg</strong><br/>
                                        m₂ = 75 g = <strong>0.075 kg</strong></p>
                                        
                                        <p><strong>2. Conservación del Momento Lineal (p):</strong><br/>
                                        En una colisión ideal, la suma de la cantidad de movimiento antes y después del choque es exactamente la misma.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-slate-500 font-mono text-slate-200">
                                            P_inicial = P_final<br/>
                                            m₁·v₁_i + m₂·v₂_i = m₁·v₁_f + m₂·v₂_f
                                        </div>

                                        <p><strong>3. Sustituir datos y calcular:</strong><br/>
                                        Sustituyendo con los valores que hayas puesto en los controles:</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-red-500 font-mono text-red-200 shadow-inner">
                                            (0.030 · {v1i}) + (0.075 · {v2i}) = (0.030 · -12.1) + 0.075 · v₂_f<br/>
                                            {p1i.toFixed(3)} + ({p2i.toFixed(3)}) = -0.363 + 0.075 · v₂_f<br/>
                                            {pInicial.toFixed(3)} = -0.363 + 0.075 · v₂_f<br/>
                                            {pInicial.toFixed(3)} + 0.363 = 0.075 · v₂_f<br/>
                                            v₂_f = {(pInicial + 0.363).toFixed(3)} / 0.075<br/>
                                            <strong>v₂_f = {v2f.toFixed(2)} m/s</strong>
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-2 italic text-center">
                                            *Si la solución final te da un número negativo, significa que la bola 2 de 75 g rebotó y se dirige hacia la izquierda.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica: Conservación del Momento en Colisiones
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
