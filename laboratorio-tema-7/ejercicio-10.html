<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercici 10: Dinàmica amb Fregament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            // Utilizamos 'var' para evitar problemas de redeclaración en el navegador
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var ArrowRightIcon = icons.ArrowRight;
            var ArrowLeftIcon = icons.ArrowLeft;
            var InfoIcon = icons.Info;
            var ZapIcon = icons.Zap;
            var RefreshCwIcon = icons.RefreshCw;

            var App = () => {
                // Dades del Problema
                const m = 5; // kg
                const g = 9.8; // m/s^2
                const mu_s = 0.4; // Coeficient estàtic
                const mu_k = 0.3; // Coeficient cinètic

                // Estats
                const [fa, setFa] = useState(0); // Força aplicada
                const [posX, setPosX] = useState(0);
                const [isMoving, setIsMoving] = useState(false);
                const [velocity, setVelocity] = useState(0);

                // Càlculs Físics
                const pes = m * g;
                const normal = pes;
                const fs_max = mu_s * normal; // Força fregament màxima estàtica
                
                // Força de fregament real
                let ff = 0;
                let acceleracio = 0;

                if (!isMoving) {
                    if (fa <= fs_max) {
                        ff = fa; // El fregament compensa la força aplicada
                        acceleracio = 0;
                    } else {
                        // S'inicia el moviment
                        ff = mu_k * normal;
                        acceleracio = (fa - ff) / m;
                    }
                } else {
                    ff = mu_k * normal;
                    acceleracio = (fa - ff) / m;
                }

                // Animació
                useEffect(() => {
                    let interval;
                    if (fa > fs_max || isMoving) {
                        if (!isMoving) setIsMoving(true);
                        
                        interval = setInterval(() => {
                            setVelocity(v => {
                                const newV = v + acceleracio * 0.05;
                                return newV > 0 ? newV : 0;
                            });
                            setPosX(p => {
                                const newP = p + velocity;
                                return newP > 400 ? -100 : newP;
                            });
                        }, 20);
                    } else {
                        setVelocity(0);
                    }
                    return () => clearInterval(interval);
                }, [fa, fs_max, acceleracio, velocity, isMoving]);

                const reset = () => {
                    setFa(0);
                    setPosX(0);
                    setIsMoving(false);
                    setVelocity(0);
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-orange-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Exercici 10</span>
                                <h1 className="text-3xl font-black text-orange-400 uppercase tracking-tight tracking-widest">El Fregament Horitzontal</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciat:</strong> Un bloc de 5 kg de massa es troba en repòs sobre una superfície horitzontal. Els coeficients de fregament són μs = 0,4 i μk = 0,3. Calcula la força mínima per a moure'l i l'acceleració si apliquem 30 N.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Visualització de l'Escena */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[400px] relative overflow-hidden flex flex-col justify-end shadow-2xl">
                                {/* Superfície */}
                                <div className="absolute bottom-20 w-full h-1 bg-slate-500"></div>
                                
                                {/* El Bloc */}
                                <div 
                                    className="absolute bottom-20 w-24 h-24 bg-orange-600 border-4 border-orange-800 rounded-xl flex items-center justify-center z-20 shadow-lg transition-transform duration-75"
                                    style={{ transform: `translateX(${posX}px)` }}
                                >
                                    <span className="font-black text-orange-950">5 kg</span>
                                    
                                    {/* Vectors de Força */}
                                    {/* Força Aplicada (Dreta) */}
                                    <div className="absolute left-full flex items-center" style={{ width: fa * 3 }}>
                                        <div className="h-1 bg-green-400 w-full relative">
                                            <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon className="text-green-400" size={16} />}</div>
                                        </div>
                                        <span className="ml-2 text-[10px] font-black text-green-400 whitespace-nowrap">Fa = {fa}N</span>
                                    </div>

                                    {/* Força Fregament (Esquerra) */}
                                    <div className="absolute right-full flex items-center" style={{ width: ff * 3 }}>
                                        <span className="mr-2 text-[10px] font-black text-red-400 whitespace-nowrap">Ff = {ff.toFixed(1)}N</span>
                                        <div className="h-1 bg-red-400 w-full relative">
                                            <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-red-400" size={16} />}</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Marcadors de dades */}
                                <div className="absolute top-6 left-6 grid grid-cols-2 gap-4 z-30">
                                    <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Estat</p>
                                        <p className={`text-sm font-black uppercase ${isMoving ? 'text-green-400' : 'text-orange-400'}`}>
                                            {isMoving ? 'En moviment' : 'En repòs'}
                                        </p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Acceleració</p>
                                        <p className="text-sm font-mono font-black text-indigo-400">{acceleracio.toFixed(2)} m/s²</p>
                                    </div>
                                </div>

                                {/* Terra decoratiu */}
                                <div className="h-20 bg-slate-900 w-full border-t border-slate-700 flex items-center justify-center">
                                    <p className="text-[10px] text-slate-600 font-mono">Coeficients: μs=0.4 | μk=0.3</p>
                                </div>
                            </div>

                            {/* Controls i Resolució */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-xl font-bold flex items-center gap-2">
                                            {ZapIcon && <ZapIcon className="text-orange-400" />} Control de Força
                                        </h3>
                                        <button onClick={reset} className="p-2 bg-slate-700 rounded-lg hover:bg-slate-600">
                                            {RefreshCwIcon && <RefreshCwIcon size={18} />}
                                        </button>
                                    </div>

                                    <div className="mb-8">
                                        <div className="flex justify-between mb-4">
                                            <span className="text-sm text-slate-400 font-bold uppercase tracking-widest">Força Aplicada (Fa)</span>
                                            <span className="text-2xl font-black text-green-400 font-mono">{fa} N</span>
                                        </div>
                                        <input 
                                            type="range" min="0" max="50" step="1" value={fa}
                                            onChange={(e) => setFa(parseInt(e.target.value))}
                                            className="w-full h-3 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500 mb-2"
                                        />
                                        <div className="flex justify-between text-[10px] text-slate-500 font-black">
                                            <span>0 N</span>
                                            <span className="text-red-500">LÍMIT (19.6 N)</span>
                                            <span>50 N</span>
                                        </div>
                                    </div>

                                    <div className="space-y-3 pt-4 border-t border-slate-700">
                                        <div className="flex justify-between text-sm">
                                            <span className="text-slate-500">Pes (m·g)</span>
                                            <span className="font-mono">49.0 N</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-slate-500">Fregament Màxim (μs·N)</span>
                                            <span className="font-mono text-orange-400">19.6 N</span>
                                        </div>
                                        <div className="flex justify-between text-sm font-bold bg-indigo-900/20 p-3 rounded-lg border border-indigo-500/20">
                                            <span className="text-indigo-300">Fregament Actual (Ff)</span>
                                            <span className="font-mono text-white">{ff.toFixed(1)} N</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-indigo-950/40 p-6 rounded-3xl border border-indigo-500/20">
                                    <h4 className="font-bold text-indigo-300 mb-4 flex items-center gap-2">
                                        {InfoIcon && <InfoIcon size={18} />} Desglossament del Profe
                                    </h4>
                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. Dades:</strong> <i>m</i> = 5 kg, <i>g</i> = 9.8 m/s², μ<sub>s</sub> = 0.4, μ<sub>k</sub> = 0.3.</p>
                                        <p><strong>2. Esquema:</strong> En horitzontal, <i>N</i> = <i>P</i> = <i>m</i> · <i>g</i> = 49 N.</p>
                                        <p><strong>3. Fórmules:</strong> F<sub>f,max</sub> = μ<sub>s</sub> · <i>N</i>. Per a moure'l, F<sub>a</sub> &gt; F<sub>f,max</sub>.</p>
                                        <p><strong>4. Resolució:</strong> F<sub>f,max</sub> = 0.4 · 49 = 19.6 N.<br/> 
                                        Aquesta és la força mínima per a començar el moviment.</p>
                                        <p className="bg-slate-900 p-3 rounded-lg border-l-4 border-orange-500 font-mono text-indigo-300">
                                            Si F<sub>a</sub> = 30 N ⇒ a = (30 - 0.3 · 49) / 5 = (30 - 14.7) / 5 = 3.06 m/s².
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Exercici 10: Dinàmica de Fregament
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
