<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Suspensión de un Coche</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #3b82f6; /* Blue 500 */
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .chassis-texture {
            background-color: #1e293b;
            background-image: linear-gradient(90deg, transparent 50%, rgba(255,255,255,.05) 50%);
            background-size: 20px 20px;
        }
        .spring-path {
            transition: d 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var CalculatorIcon = icons.Calculator || (({className}) => <span className={className}></span>);
            var ShieldAlertIcon = icons.ShieldAlert || (({className}) => <span className={className}></span>);
            var InfoIcon = icons.Info || (({className}) => <span className={className}></span>);
            var CarIcon = icons.Car || (({className}) => <span className={className}></span>);
            var ArrowDownIcon = icons.ArrowDown || (({className}) => <span className={className}></span>);
            var ArrowUpIcon = icons.ArrowUp || (({className}) => <span className={className}></span>);
            var ImagePlusIcon = icons.ImagePlus || (({className}) => <span className={className}></span>);

            var App = () => {
                const g = 9.8; // m/s^2

                // Estados interactivos
                const [masaCoche, setMasaCoche] = useState(1.5); // Toneladas
                const [compresionMax, setCompresionMax] = useState(10); // cm
                const [margenSeguridad, setMargenSeguridad] = useState(20); // %

                // Cálculos Físicos
                const masaKg = masaCoche * 1000;
                const pesoTotal = masaKg * g; // N
                const pesoPorMuelle = pesoTotal / 4; // N (Son 4 muelles)
                
                // Aplicamos el margen de seguridad a la fuerza
                const fuerzaDiseno = pesoPorMuelle * (1 + (margenSeguridad / 100)); // N
                
                const compresionM = compresionMax / 100; // a metros
                
                // k = F / x
                const constanteK = fuerzaDiseno / compresionM;

                // Parámetros Visuales
                const pxPerCm = 6;
                const l0 = 120; // Longitud en reposo (px)
                const currentLength = l0 - (compresionMax * pxPerCm);

                // Función para dibujar un muelle SVG animado
                const generateSpringPath = () => {
                    const coils = 8;
                    const width = 12;
                    const topPadding = 10;
                    const bottomPadding = 10;
                    
                    let path = `M 25 0 L 25 ${topPadding} `;
                    const coilHeight = (currentLength - topPadding - bottomPadding) / coils;
                    
                    for(let i=0; i<coils; i++) {
                        const x = i % 2 === 0 ? 25 - width : 25 + width;
                        const y = topPadding + coilHeight * (i + 0.5);
                        path += `L ${x} ${y} `;
                    }
                    
                    path += `L 25 ${currentLength - bottomPadding} L 25 ${currentLength}`;
                    return path;
                };

                // Componente interno para un muelle individual
                const SpringUnit = ({ label }) => (
                    <div className="flex flex-col items-center">
                        {/* Muelle SVG */}
                        <div className="relative">
                            <svg width="50" height={l0 + 10} className="overflow-visible">
                                {/* Muelle "fantasma" en reposo (referencia) */}
                                <path 
                                    d={`M 25 0 L 25 10 ${Array.from({length: 8}).map((_, i) => `L ${i % 2 === 0 ? 13 : 37} ${10 + ((l0-20)/8)*(i+0.5)}`).join(' ')} L 25 ${l0-10} L 25 ${l0}`}
                                    fill="none" stroke="#475569" strokeWidth="2" strokeDasharray="4" opacity="0.3"
                                />
                                {/* Muelle comprimido real */}
                                <path 
                                    d={generateSpringPath()} 
                                    fill="none" stroke="#3b82f6" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"
                                    className="spring-path"
                                />
                            </svg>
                        </div>
                        {/* Base del muelle (eje de la rueda) */}
                        <div className="w-16 h-4 bg-slate-500 rounded-t border-t-2 border-slate-400 mt-[-2px]"></div>
                        <span className="text-[10px] font-bold text-slate-400 mt-2">{label}</span>
                    </div>
                );

                // Generador de Diagrama de Cuerpo Libre
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un solo muelle comprimido. Vector P/4 hacia abajo representando la cuarta parte del peso del coche. Vector Fuerza Elástica Fe hacia arriba, más grande que el peso para ilustrar el margen de seguridad del 20%. Fondo blanco, minimalista, estilo educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en la red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Ingeniería</span>
                                <h1 className="text-3xl font-black text-blue-400 uppercase tracking-tight tracking-widest">Diseño de Suspensión</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un coche de 1,5 toneladas tiene 4 muelles iguales. La deformación máxima prevista es de 10 cm y se aplica un margen de seguridad del 20%. ¿Cuál debe ser la constante elástica de cada muelle?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-8">
                                
                                {/* Marcadores Flotantes */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Carga por Muelle (Nominal)</p>
                                        <p className="text-xl font-mono font-black text-orange-400">{pesoPorMuelle.toFixed(0)} N</p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right border-b-4 border-b-blue-500">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Constante Requerida (k)</p>
                                        <p className="text-xl font-mono font-black text-blue-400">{(constanteK / 1000).toFixed(1)} kN/m</p>
                                    </div>
                                </div>

                                {/* Escena del Coche */}
                                <div className="relative w-full h-80 flex flex-col items-center justify-end">
                                    
                                    {/* Chasis del Coche */}
                                    <div 
                                        className="w-[85%] bg-slate-700 chassis-texture border-4 border-slate-500 rounded-t-xl rounded-b-md shadow-2xl relative flex flex-col items-center justify-center transition-all duration-300 z-20"
                                        style={{ height: '100px', marginBottom: '0px' }} // El margin bottom lo dará la compresión de los muelles
                                    >
                                        <CarIcon className="text-slate-400 absolute top-4 opacity-30" size={48} />
                                        <div className="bg-slate-900/80 px-3 py-1 rounded-full border border-slate-600 z-10 flex items-center gap-2">
                                            <span className="font-black text-white">{masaCoche.toFixed(1)} Ton</span>
                                        </div>

                                        {/* Regla de compresión central */}
                                        <div className="absolute -left-12 bottom-0 w-8 h-32 border-r-2 border-slate-600 flex flex-col justify-end">
                                            <div className="border-b-2 border-dashed border-slate-400 w-24 h-0 absolute -right-24" style={{ bottom: `${l0}px` }}></div>
                                            <span className="absolute text-[9px] text-slate-400" style={{ bottom: `${l0-4}px`, right: '10px' }}>0 cm</span>
                                            
                                            <div className="border-b-2 border-blue-500 w-24 h-0 absolute -right-24 transition-all duration-300" style={{ bottom: `${currentLength}px` }}></div>
                                            <div className="absolute bg-slate-900 px-1 rounded transition-all duration-300" style={{ bottom: `${currentLength-8}px`, right: '10px' }}>
                                                <span className="text-[10px] font-bold text-blue-400">{compresionMax} cm</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Fila de 4 Muelles */}
                                    <div className="w-[80%] flex justify-between px-4 z-10">
                                        <SpringUnit label="Del. Izq" />
                                        <SpringUnit label="Tras. Izq" />
                                        <SpringUnit label="Del. Der" />
                                        <SpringUnit label="Tras. Der" />
                                    </div>
                                    
                                    {/* Suelo */}
                                    <div className="w-full h-8 bg-slate-900 border-t border-slate-700 mt-2"></div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-blue-400">
                                        <ShieldAlertIcon size={20} /> Especificaciones de Diseño
                                    </h3>
                                    
                                    <div className="space-y-5 mb-2">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-slate-300 font-bold uppercase">Masa del Coche (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{masaCoche.toFixed(1)} t ({(masaCoche*1000).toFixed(0)} kg)</span>
                                            </div>
                                            <input 
                                                type="range" min="0.5" max="3.0" step="0.1" value={masaCoche} 
                                                onChange={e => setMasaCoche(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-emerald-400 font-bold uppercase">Compresión Máxima (x)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-emerald-300">{compresionMax} cm</span>
                                            </div>
                                            <input 
                                                type="range" min="5" max="15" step="1" value={compresionMax} 
                                                onChange={e => setCompresionMax(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>

                                        <div className="pt-4 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-orange-400 font-bold uppercase">Margen de Seguridad</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-orange-300">+{margenSeguridad}%</span>
                                            </div>
                                            <input 
                                                type="range" min="0" max="50" step="5" value={margenSeguridad} 
                                                onChange={e => setMargenSeguridad(Number(e.target.value))} 
                                                className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" 
                                            />
                                            <p className="text-[10px] text-slate-500 mt-2 leading-relaxed">
                                                Aumenta artificialmente la fuerza que debe soportar el muelle en los cálculos para garantizar que no haga tope ("bottom out") al pillar baches.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-blue-950/20 p-6 rounded-3xl border border-blue-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-blue-500/30 pb-2">
                                        <h4 className="font-bold text-blue-300 flex items-center gap-2">
                                            <CalculatorIcon size={18} /> Cálculos del Ingeniero
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <><ImagePlusIcon size={14}/> Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. Reparto del Peso:</strong><br/>
                                        El coche entero pesa P = m · g = {masaKg} · 9.8 = {pesoTotal.toFixed(0)} N.<br/>
                                        Como hay 4 ruedas idénticas, dividimos entre 4.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-slate-500 font-mono text-slate-200">
                                            P<sub>muelle</sub> = {pesoTotal.toFixed(0)} / 4 = <strong>{pesoPorMuelle.toFixed(0)} N</strong>
                                        </div>
                                        
                                        <p className="mt-3"><strong>2. Aplicar el Margen de Seguridad:</strong><br/>
                                        La fuerza de diseño exigida debe ser un {margenSeguridad}% mayor al peso estático para absorber impactos.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                            F<sub>diseño</sub> = {pesoPorMuelle.toFixed(0)} + ({margenSeguridad}% de {pesoPorMuelle.toFixed(0)})<br/>
                                            F<sub>diseño</sub> = {pesoPorMuelle.toFixed(0)} · {(1 + margenSeguridad/100).toFixed(2)} = <strong>{fuerzaDiseno.toFixed(0)} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Calcular la Constante 'k' (S.I.):</strong><br/>
                                        La compresión exigida es x = {compresionMax} cm = <strong>{compresionM.toFixed(2)} m</strong>. Aplicamos la Ley de Hooke.</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200 shadow-inner">
                                            F = k · x<br/>
                                            {fuerzaDiseno.toFixed(0)} = k · {compresionM.toFixed(2)}<br/>
                                            k = {fuerzaDiseno.toFixed(0)} / {compresionM.toFixed(2)} = <strong>{constanteK.toFixed(0)} N/m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica y Elasticidad Aplicada a la Ingeniería
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
