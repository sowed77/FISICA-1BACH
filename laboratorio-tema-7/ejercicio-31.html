<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Conservación del Momento en el Espacio</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; } /* Slate 950 */
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #8b5cf6; /* Violet 500 */
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        
        /* Fondo estrellado profundo */
        .space-bg {
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Asignación segura de iconos
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ImagePlusIcon = getIcon('ImagePlus');
            var RocketIcon = getIcon('Rocket');
            var UserIcon = getIcon('User');
            var WrenchIcon = getIcon('Wrench');
            var TimerIcon = getIcon('Timer');

            var App = () => {
                // Estados interactivos inicializados con los datos del enunciado
                const [mAstro, setMAstro] = useState(100); // kg
                const [mObj, setMObj] = useState(0.80); // kg
                const [vObj, setVObj] = useState(1.2); // m/s
                
                // Constantes de tiempo
                const tTarget = 3600; // 1 hora en segundos

                // Cálculos Físicos
                // Conservación del momento: m_astro * v_astro + m_obj * v_obj = 0
                // v_astro = - (m_obj * v_obj) / m_astro
                const vAstro = (mObj * vObj) / mAstro; // Valor absoluto de la velocidad de retroceso

                // Distancias a la hora
                const distAstro = vAstro * tTarget;
                const distObj = vObj * tTarget;

                // Estados de animación
                const [time, setTime] = useState(0); 
                const [isMoving, setIsMoving] = useState(false);

                // Escala visual
                // Queremos que 35 metros (distAstro) sean unos 120 pixeles
                const pxPerMeter = 120 / Math.max(10, distAstro);

                useEffect(() => {
                    let interval;
                    if (isMoving && time < tTarget) {
                        interval = setInterval(() => {
                            // Simulamos 3600 segundos en unos pocos segundos reales de animación
                            setTime(prev => {
                                const nextTime = prev + 30; // Saltos de 30 segundos
                                if (nextTime >= tTarget) {
                                    setIsMoving(false);
                                    return tTarget;
                                }
                                return nextTime;
                            });
                        }, 20); // 50 FPS
                    }
                    return () => clearInterval(interval);
                }, [isMoving, time, tTarget]);

                const handlePlay = () => {
                    setTime(0);
                    setIsMoving(true);
                };

                const reset = () => {
                    setTime(0);
                    setIsMoving(false);
                };

                // Generador de diagrama DCL con IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // La API key se inyecta en el entorno
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física en el espacio. Un astronauta empuja un objeto hacia la derecha. Vector de momento p_objeto hacia la derecha. Vector de momento p_astronauta hacia la izquierda. Ambos vectores tienen exactamente la misma longitud. Fondo espacial oscuro, estilo minimalista educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-800 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-violet-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Leyes de Conservación</span>
                                <h1 className="text-3xl font-black text-violet-400 uppercase tracking-tight tracking-widest">Astronauta a la Deriva</h1>
                            </div>
                            <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un astronauta de 100 kg (total, con traje) que se encuentra en reposo junto a su cápsula, lanza un objeto de 0,80 kg a una velocidad de 1,2 m/s. ¿A qué distancia de la cápsula estará el astronauta al cabo de una hora?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual Espacial */}
                            <div className="bg-slate-900 rounded-3xl border border-slate-800 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pt-12">
                                
                                <div className="absolute inset-0 space-bg"></div>

                                {/* Marcadores superiores en vivo */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-slate-800 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Distancia Astronauta</p>
                                        <p className="text-xl font-mono font-black text-violet-400">{(vAstro * time).toFixed(2)} m</p>
                                    </div>
                                    <div className="bg-slate-950/90 p-3 rounded-lg border border-slate-800 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Distancia Objeto</p>
                                        <p className="text-xl font-mono font-black text-emerald-400">{(vObj * time).toFixed(0)} m</p>
                                    </div>
                                </div>

                                {/* Cronómetro central */}
                                <div className="absolute top-4 left-1/2 -translate-x-1/2 z-30">
                                    <div className="bg-slate-950/90 p-2 px-4 rounded-full border border-slate-800 backdrop-blur-md flex items-center gap-2">
                                        <TimerIcon size={16} className={isMoving ? "text-violet-400 animate-pulse" : "text-slate-400"} />
                                        <span className="font-mono font-black text-lg text-white">{time.toFixed(0)} s</span>
                                    </div>
                                    <p className="text-[9px] text-center text-slate-500 mt-1 uppercase font-bold tracking-widest">
                                        {(time / 60).toFixed(0)} min / 60 min
                                    </p>
                                </div>

                                {/* Espacio exterior */}
                                <div className="relative w-full h-80 flex items-center justify-center">
                                    
                                    {/* La Cápsula (Punto de referencia estacionario en el centro) */}
                                    <div className="absolute z-20 opacity-60 flex flex-col items-center">
                                        <div className="w-20 h-20 bg-slate-800 border-2 border-slate-600 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.1)]">
                                            {RocketIcon && <RocketIcon size={32} className="text-slate-500" />}
                                        </div>
                                        <div className="w-[1px] h-full bg-slate-700/50 absolute -z-10"></div>
                                        <span className="text-[9px] font-black text-slate-500 uppercase mt-2 bg-slate-950/50 px-2 rounded">Cápsula (0 m)</span>
                                    </div>

                                    {/* El Astronauta (Se mueve a la izquierda visualmente) */}
                                    <div 
                                        className="absolute z-30 transition-transform duration-75 flex flex-col items-center"
                                        style={{ transform: `translateX(${-vAstro * time * pxPerMeter}px)` }}
                                    >
                                        <div className="w-12 h-16 bg-white border-2 border-slate-300 rounded-2xl flex items-center justify-center shadow-lg relative">
                                            <div className="absolute top-2 w-8 h-6 bg-slate-900 rounded-lg"></div>
                                            {/* Vector velocidad astronauta */}
                                            {time > 0 && (
                                                <div className="absolute right-full top-1/2 -translate-y-1/2 pr-2">
                                                    <span className="text-[8px] text-violet-300 font-bold block mb-1">v={vAstro.toFixed(3)}</span>
                                                    <div className="w-6 h-0.5 bg-violet-400 relative">
                                                        <div className="absolute left-0 -top-1 w-0 h-0 border-t-[3px] border-t-transparent border-b-[3px] border-b-transparent border-r-[4px] border-r-violet-400"></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        <span className="text-[9px] font-black text-white mt-1 bg-slate-900/80 px-1 rounded">{mAstro} kg</span>
                                    </div>

                                    {/* El Objeto (Se mueve a la derecha rápido, saldrá de la pantalla) */}
                                    <div 
                                        className="absolute z-30 transition-transform duration-75 flex flex-col items-center"
                                        style={{ transform: `translateX(${vObj * time * pxPerMeter}px)` }}
                                    >
                                        <div className="w-6 h-6 bg-emerald-500 border-2 border-emerald-300 rounded-md flex items-center justify-center shadow-lg relative">
                                            {WrenchIcon && <WrenchIcon size={12} className="text-emerald-950" />}
                                            {/* Vector velocidad objeto */}
                                            {time > 0 && (
                                                <div className="absolute left-full top-1/2 -translate-y-1/2 pl-2">
                                                    <span className="text-[8px] text-emerald-300 font-bold block mb-1">v={vObj}</span>
                                                    <div className="w-12 h-0.5 bg-emerald-400 relative">
                                                        <div className="absolute right-0 -top-1 w-0 h-0 border-t-[3px] border-t-transparent border-b-[3px] border-b-transparent border-l-[4px] border-l-emerald-400"></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        <span className="text-[9px] font-black text-emerald-300 mt-1 bg-slate-900/80 px-1 rounded">{mObj} kg</span>
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-violet-400">
                                        {CalculatorIcon && <CalculatorIcon size={20} />} Parámetros
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-slate-300 font-bold uppercase">Masa Astronauta (m_A)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-white">{mAstro} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="60" max="150" step="5" value={mAstro} 
                                                onChange={e => {setMAstro(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-violet-500" 
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-emerald-400 font-bold uppercase">Masa del Objeto (m_O)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-emerald-300">{mObj.toFixed(2)} kg</span>
                                            </div>
                                            <input 
                                                type="range" min="0.1" max="5.0" step="0.1" value={mObj} 
                                                onChange={e => {setMObj(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>

                                        <div className="pt-3 border-t border-slate-800">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-emerald-400 font-bold uppercase">Velocidad del Objeto (v_O)</span>
                                                <span className="font-mono bg-slate-950 px-2 py-0.5 rounded text-emerald-300">{vObj.toFixed(2)} m/s</span>
                                            </div>
                                            <input 
                                                type="range" min="0.5" max="10.0" step="0.5" value={vObj} 
                                                onChange={e => {setVObj(Number(e.target.value)); reset();}} 
                                                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500" 
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || time >= tTarget}
                                            className="flex-1 bg-violet-600 hover:bg-violet-500 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} LANZAR OBJETO
                                        </button>
                                        <button onClick={reset} className="bg-slate-800 hover:bg-slate-700 text-white font-bold px-5 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-violet-950/20 p-6 rounded-3xl border border-violet-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-violet-500/30 pb-2">
                                        <h4 className="font-bold text-violet-300 flex items-center gap-2">
                                            {InfoIcon && <InfoIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-700">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-800 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-4 leading-relaxed">
                                        <p><strong>1. Conservación de la Cantidad de Movimiento:</strong><br/>
                                        Al estar flotando en reposo, el momento inicial del sistema es 0. Al lanzar el objeto, el momento total debe seguir siendo 0.</p>
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-slate-600 font-mono text-slate-300">
                                            p_inicial = p_final = 0<br/>
                                            m_A · v_A + m_O · v_O = 0
                                        </div>

                                        <p><strong>2. Velocidad de retroceso del astronauta:</strong><br/>
                                        Despejamos la velocidad del astronauta ($v_A$). El signo negativo indicará que va en sentido contrario al objeto.</p>
                                        <div className="bg-slate-950/80 p-2 rounded-lg border-l-4 border-violet-500 font-mono text-violet-300">
                                            {mAstro} · v_A + {mObj} · {vObj} = 0<br/>
                                            {mAstro} · v_A = -{(mObj * vObj).toFixed(3)}<br/>
                                            v_A = -{(mObj * vObj).toFixed(3)} / {mAstro} = <strong>-{vAstro.toFixed(4)} m/s</strong>
                                        </div>
                                        
                                        <p><strong>3. Distancia tras 1 hora (MRU):</strong><br/>
                                        Como no hay fricción en el espacio, se moverá a esa velocidad eternamente. Pasamos la hora a segundos (t = 3600 s).</p>
                                        <div className="bg-slate-950/80 p-3 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200 shadow-inner">
                                            d = |v_A| · t<br/>
                                            d = {vAstro.toFixed(4)} · 3600 = <strong>{distAstro.toFixed(2)} m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica en el Vacío: Conservación del Momento Lineal
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
