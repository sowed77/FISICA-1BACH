<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratori: El Martell i el Clau</title>
    <!-- Biblioteques -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #f97316; /* Orange 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }
        .wood-pattern {
            background-color: #78350f;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                #92400e 10px,
                #92400e 20px
            );
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Assignació segura d'icones
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var HammerIcon = getIcon('Hammer');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ImagePlusIcon = getIcon('ImagePlus');
            var ArrowUpIcon = getIcon('ArrowUp');
            var ArrowDownIcon = getIcon('ArrowDown');

            var App = () => {
                // Dades interactives
                const [m, setM] = useState(3.0); // Massa (kg)
                const [v0, setV0] = useState(5.0); // Velocitat inicial (m/s)
                const [d_mm, setDMm] = useState(6.0); // Distància de penetració (mm)

                // Estats d'animació: 'ready', 'falling', 'driving', 'done'
                const [phase, setPhase] = useState('ready');
                const [hammerY, setHammerY] = useState(0); // Posició Y del martell
                const [nailY, setNailY] = useState(0); // Posició Y del clau

                // Càlculs Físics
                const d_m = d_mm / 1000; // Conversió a metres
                // v_f^2 = v_0^2 + 2*a*d => 0 = v_0^2 + 2*a*d => a = -v_0^2 / (2*d)
                const a = -(v0 * v0) / (2 * d_m);
                // F = m * a
                const fNeta = m * a;
                // Temps d'impacte: v_f = v_0 + a*t => t = -v_0 / a
                const t_impacte = -v0 / a; // en segons

                // Constants visuals
                const woodTop = 250;
                const hitY = woodTop - 40; // Punt de contacte (martell sobre clau)
                const scalePenetration = 5; // Píxels per mm

                useEffect(() => {
                    let animationFrame;
                    let startTime;

                    const animate = (timestamp) => {
                        if (!startTime) startTime = timestamp;
                        const elapsed = timestamp - startTime;

                        if (phase === 'falling') {
                            // Caiguda lliure visual (falsa cinemàtica només per a l'efecte)
                            const dropTime = 300; // ms
                            const progress = Math.min(elapsed / dropTime, 1);
                            setHammerY(hitY * progress);
                            
                            if (progress >= 1) {
                                setPhase('driving');
                                startTime = null; // Reset time per a la següent fase
                            }
                        } else if (phase === 'driving') {
                            // Fase de penetració (ralentida per a vore-la, temps real seria en mil·lisegons)
                            const animDriveTime = 500; // ms per a l'animació
                            const progress = Math.min(elapsed / animDriveTime, 1);
                            
                            const currentPenetration = d_mm * scalePenetration * progress;
                            setHammerY(hitY + currentPenetration);
                            setNailY(currentPenetration);

                            if (progress >= 1) {
                                setPhase('done');
                            }
                        }

                        if (phase === 'falling' || phase === 'driving') {
                            animationFrame = requestAnimationFrame(animate);
                        }
                    };

                    if (phase === 'falling' || phase === 'driving') {
                        animationFrame = requestAnimationFrame(animate);
                    }

                    return () => cancelAnimationFrame(animationFrame);
                }, [phase, d_mm, hitY]);

                const handlePlay = () => {
                    if (phase === 'ready' || phase === 'done') {
                        setHammerY(0);
                        setNailY(0);
                        setPhase('falling');
                    }
                };

                const handleReset = () => {
                    setPhase('ready');
                    setHammerY(0);
                    setNailY(0);
                };

                // Generador DCL amb I.A.
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyANGbXktzJW-3eyczxinPzpE3rM0s2J9qk"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un clavo entrando en la madera. Un vector fuerza gigante apuntando hacia arriba representando la fuerza de resistencia de la madera, y un vector de velocidad hacia abajo. Estilo educativo, minimalista, fondo blanco" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en l'API");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-orange-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Dinàmica d'Impacte</span>
                                <h1 className="text-3xl font-black text-orange-400 uppercase tracking-tight tracking-widest">La Força d'Oposició</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Context Real (Fusteria de Falla):</strong> Quan construïm l'estructura de fusta d'una Falla, els martells colpegen amb gran velocitat. La fusta actua com un fre brutal per al clau i el martell, aplicant una força cap amunt enorme per aturar-los en pocs mil·límetres.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panell Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* HUD de Dades */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Acceleració d'aturada</p>
                                        <p className="text-xl font-mono font-black text-yellow-400">{Math.abs(a).toFixed(0)} m/s²</p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Força de la Fusta (F)</p>
                                        <p className="text-xl font-mono font-black text-orange-400">{Math.abs(fNeta).toFixed(0)} N</p>
                                    </div>
                                </div>

                                {/* Temps d'impacte */}
                                {phase === 'done' && (
                                    <div className="absolute top-24 left-1/2 -translate-x-1/2 bg-emerald-900/80 text-emerald-300 px-4 py-2 rounded-full text-xs font-mono font-bold border border-emerald-500/50 z-30 animate-pulse">
                                        Duració de l'impacte: {(t_impacte * 1000).toFixed(2)} ms
                                    </div>
                                )}

                                {/* Escenari */}
                                <div className="relative w-full h-full">
                                    
                                    {/* El Martell */}
                                    <div 
                                        className="absolute left-1/2 -translate-x-1/2 z-20 flex flex-col items-center"
                                        style={{ top: `${20 + hammerY}px` }}
                                    >
                                        <div className="w-16 h-10 bg-slate-400 rounded-lg shadow-lg flex items-center justify-center border-2 border-slate-300">
                                            <span className="text-[10px] font-black text-slate-800">{m}kg</span>
                                        </div>
                                        <div className="w-4 h-32 bg-amber-700 rounded-b-md shadow-md border-x border-b border-amber-900"></div>

                                        {/* Vector Velocitat */}
                                        {phase === 'falling' && (
                                            <div className="absolute top-1/2 right-full flex items-center pr-2">
                                                <span className="mr-1 text-[10px] font-black text-emerald-400">v₀</span>
                                                <div className="w-1 bg-emerald-400 h-16 relative">
                                                    <div className="absolute bottom-0 -translate-x-[6px]">{ArrowDownIcon && <ArrowDownIcon size={16} className="text-emerald-400" />}</div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* El Clau */}
                                    <div 
                                        className="absolute left-1/2 -translate-x-1/2 z-10 flex flex-col items-center"
                                        style={{ top: `${woodTop - 40 + nailY}px` }}
                                    >
                                        <div className="w-8 h-2 bg-slate-300 rounded-sm"></div>
                                        <div className="w-2 h-16 bg-slate-400">
                                            {/* Punta del clau */}
                                            <div className="w-0 h-0 border-l-4 border-r-4 border-t-8 border-l-transparent border-r-transparent border-t-slate-400 absolute top-full -left-[3px]"></div>
                                        </div>
                                    </div>

                                    {/* Vector Força d'Oposició (Mostrat durant i després de l'impacte) */}
                                    {(phase === 'driving' || phase === 'done') && (
                                        <div className="absolute left-1/2 translate-x-6 z-30 flex flex-col items-center" style={{ bottom: `${500 - woodTop}px`, height: '100px' }}>
                                            <span className="mb-1 text-[10px] font-black text-orange-400 bg-slate-900/80 px-1 rounded">F = {Math.abs(fNeta).toFixed(0)} N</span>
                                            <div className="w-2 bg-orange-500 h-full relative shadow-[0_0_10px_rgba(249,115,22,0.8)]">
                                                <div className="absolute top-0 -translate-x-[9px]">{ArrowUpIcon && <ArrowUpIcon size={20} className="text-orange-500" />}</div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Bloc de Fusta */}
                                    <div 
                                        className="absolute w-full h-[500px] wood-pattern border-t-4 border-amber-900 z-0"
                                        style={{ top: `${woodTop}px` }}
                                    ></div>
                                </div>
                            </div>

                            {/* Panell de Control i Resolució */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-orange-400">
                                        {HammerIcon && <HammerIcon size={20} />} Ajust de l'Eina
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-slate-300 font-bold uppercase">Massa Martell (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded">{m.toFixed(1)} kg</span>
                                            </div>
                                            <input type="range" min="0.5" max="5.0" step="0.1" value={m} onChange={e => {setM(Number(e.target.value)); handleReset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
                                        </div>
                                        
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-emerald-400 font-bold uppercase">Velocitat d'impacte (v₀)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-emerald-300">{v0.toFixed(1)} m/s</span>
                                            </div>
                                            <input type="range" min="1" max="15" step="0.5" value={v0} onChange={e => {setV0(Number(e.target.value)); handleReset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-yellow-400 font-bold uppercase">Distància enfonsament (Δx)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-yellow-300">{d_mm.toFixed(1)} mm</span>
                                            </div>
                                            <input type="range" min="1" max="20" step="0.5" value={d_mm} onChange={e => {setDMm(Number(e.target.value)); handleReset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-yellow-500" />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={phase === 'falling' || phase === 'driving'}
                                            className="flex-1 font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 bg-orange-600 hover:bg-orange-500 text-white"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} COLPEJAR CLAU
                                        </button>
                                        <button onClick={handleReset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-orange-950/20 p-6 rounded-3xl border border-orange-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-orange-500/30 pb-2">
                                        <h4 className="font-bold text-orange-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolució Pas a Pas
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Carregant...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cos Lliure" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. Dades en el S.I. (Molt Important!):</strong><br/>
                                        v₀ = {v0} m/s, v<sub>f</sub> = 0 m/s<br/>
                                        Δx = {d_mm} mm = <strong>{(d_mm / 1000).toFixed(4)} m</strong></p>
                                        
                                        <p className="mt-3"><strong>2. Cinemàtica (MRUA):</strong> Calculem la desacceleració.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-yellow-500 font-mono">
                                            v<sub>f</sub>² = v₀² + 2 · a · Δx<br/>
                                            0 = {v0}² + 2 · a · {(d_mm / 1000).toFixed(4)}<br/>
                                            a = -{Math.pow(v0, 2)} / {(2 * d_mm / 1000).toFixed(4)} = <strong>{a.toFixed(2)} m/s²</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Dinàmica (2a Llei de Newton):</strong> Calculem la força d'oposició de la fusta.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono">
                                            F = m · a<br/>
                                            F = {m} · ({a.toFixed(2)})<br/>
                                            F = <strong>{fNeta.toFixed(0)} N</strong>
                                        </div>
                                        <p className="text-[10px] text-slate-400 italic">El signe negatiu de la força indica que s'oposa al moviment (va cap amunt). La magnitud (mòdul) és de {Math.abs(fNeta).toFixed(0)} N.</p>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinàmica i Cinemàtica d'Impacte
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
