<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratori: El Balancí i els Moments de Força</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981; /* Emerald 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var RotateCcwIcon = getIcon('RotateCcw');
            var ArrowDownIcon = getIcon('ArrowDown');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ImagePlusIcon = getIcon('ImagePlus');
            var ScaleIcon = getIcon('Scale');
            var UserIcon = getIcon('User');
            var UsersIcon = getIcon('Users');

            var App = () => {
                const [activeTab, setActiveTab] = useState('casA'); // 'casA' o 'casB'
                const g = 9.8; // m/s^2
                
                // Dades del xiquet (Esquerra) i la germana (Dreta)
                const m1 = 20; // kg
                const m2 = 30; // kg
                
                // Estats interactius
                const [r1, setR1] = useState(1.20); // Posició xiquet
                const [r2, setR2] = useState(0.80); // Posició germana
                
                // Estats de la mare (Cas B)
                const [fMare, setFMare] = useState(196); // Força de la mare en N
                const [rMare, setRMare] = useState(1.20); // On s'aplica
                const [mareActive, setMareActive] = useState(false);

                // Càlcul de Moments (Torques)
                // Convenció: Esquerra = Positiu (Antihorari), Dreta = Negatiu (Horari)
                const torque1 = m1 * g * r1;
                const torque2 = m2 * g * r2;
                
                // Si la mare està activa (Cas B), espenta cap avall en el costat esquerre
                const torqueMare = mareActive ? fMare * rMare : 0;
                
                // Moment Net
                const netTorque = (torque1 + torqueMare) - torque2;
                
                // Angle del balancí (límit visual de +- 20 graus)
                const angle = Math.max(-20, Math.min(20, netTorque * -0.1)); 
                const isBalanced = Math.abs(netTorque) < 1; // Marge d'error per a l'equilibri

                useEffect(() => {
                    if (activeTab === 'casA') {
                        setR1(1.20);
                        setMareActive(false);
                    } else {
                        // Al cas B s'intercanvien els llocs inicials
                        setR1(0.80);
                        setR2(1.20);
                        setMareActive(true);
                    }
                }, [activeTab]);

                // Generador de diagrama DCL tècnic amb IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; // Clau API
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física de un balancín en equilibrio. Vectores de peso hacia abajo en los extremos y vector de fuerza normal hacia arriba en el fulcro central, fondo blanco, minimalista" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en xarxa");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-emerald-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Dinàmica de Rotació</span>
                                <h1 className="text-3xl font-black text-emerald-400 uppercase tracking-tight tracking-widest">L'Equilibri al Balancí</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciat:</strong> En un balancí, un xiquet de 20 kg està a 1,20 m de l'eix. <br/>
                                    a) On ha d'asseure's la seua germana de 30 kg per a equilibrar-lo?<br/>
                                    b) Si es canvien de seient, quina força ha de fer la mare i on per a reequilibrar-lo?
                                </p>
                            </div>
                        </header>

                        <nav className="max-w-xl mx-auto flex gap-2 mb-8 bg-slate-800 p-1 rounded-xl shadow-inner">
                            <button onClick={() => setActiveTab('casA')} className={`flex-1 px-4 py-2 rounded-lg transition-all font-bold ${activeTab === 'casA' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>Cas A: Germana</button>
                            <button onClick={() => setActiveTab('casB')} className={`flex-1 px-4 py-2 rounded-lg transition-all font-bold ${activeTab === 'casB' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>Cas B: La Mare</button>
                        </nav>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panell Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-12">
                                
                                {/* Retol d'Equilibri */}
                                <div className="absolute top-6 left-1/2 -translate-x-1/2 z-30">
                                    <div className={`px-6 py-2 rounded-full font-black uppercase tracking-widest transition-all ${isBalanced ? 'bg-emerald-500 text-slate-900 shadow-[0_0_20px_rgba(16,185,129,0.5)]' : 'bg-red-500/20 text-red-400 border border-red-500/50'}`}>
                                        {isBalanced ? 'EQUILIBRI PERFECTE' : 'DESEQUILIBRAT'}
                                    </div>
                                </div>

                                {/* Marcadors de Moment */}
                                <div className="absolute top-20 w-full px-6 flex justify-between z-20">
                                    <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Moment Esquerra</p>
                                        <p className="text-sm font-mono font-black text-emerald-400">{(torque1 + torqueMare).toFixed(1)} N·m</p>
                                    </div>
                                    <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Moment Dreta</p>
                                        <p className="text-sm font-mono font-black text-orange-400">{torque2.toFixed(1)} N·m</p>
                                    </div>
                                </div>

                                {/* Escenari del Balancí */}
                                <div className="relative w-full flex justify-center items-end h-64 mt-20">
                                    {/* Eix (Fulcre) */}
                                    <div className="absolute bottom-0 w-8 h-16 bg-slate-500 rounded-t-full border-2 border-slate-400 z-20 shadow-lg">
                                        <div className="absolute top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-slate-800 rounded-full"></div>
                                    </div>
                                    
                                    {/* La Taula del Balancí */}
                                    <div 
                                        className="absolute bottom-14 w-[80%] h-4 bg-yellow-600 rounded-full origin-center transition-transform duration-300 shadow-xl z-10"
                                        style={{ transform: `rotate(${angle}deg)` }}
                                    >
                                        {/* Xiquet (Esquerra) */}
                                        <div 
                                            className="absolute bottom-full w-12 h-16 bg-emerald-500 border-2 border-emerald-300 rounded-t-xl flex flex-col items-center justify-end pb-1 shadow-md transition-all"
                                            style={{ left: `calc(50% - ${(r1 / 1.5) * 50}%)`, transform: 'translateX(-50%)' }}
                                        >
                                            <UserIcon size={24} className="text-emerald-950" />
                                            <span className="text-[10px] font-black text-emerald-950 mt-1">{m1}kg</span>
                                            
                                            {/* Vector Pes */}
                                            <div className="absolute top-full flex flex-col items-center pt-1 pointer-events-none" style={{ height: 60 }}>
                                                <div className="w-1 bg-emerald-400 h-full relative">
                                                    <div className="absolute bottom-0 -translate-x-[6px]">{ArrowDownIcon && <ArrowDownIcon size={16} className="text-emerald-400" />}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* La Mare (només cas B, esquerra) */}
                                        {mareActive && (
                                            <div 
                                                className="absolute top-full w-10 h-10 bg-indigo-500/20 border-2 border-indigo-400 border-dashed rounded-full flex flex-col items-center justify-center shadow-md transition-all mt-2"
                                                style={{ left: `calc(50% - ${(rMare / 1.5) * 50}%)`, transform: 'translateX(-50%)' }}
                                            >
                                                <span className="text-[10px] font-black text-indigo-300">Mare</span>
                                                
                                                {/* Vector Força Mare */}
                                                <div className="absolute top-full flex flex-col items-center pt-1 pointer-events-none" style={{ height: (fMare / 196) * 60 }}>
                                                    <div className="w-1.5 bg-indigo-400 h-full relative">
                                                        <div className="absolute bottom-0 -translate-x-[7px]">{ArrowDownIcon && <ArrowDownIcon size={18} className="text-indigo-400" />}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Germana (Dreta) */}
                                        <div 
                                            className="absolute bottom-full w-14 h-20 bg-orange-500 border-2 border-orange-300 rounded-t-xl flex flex-col items-center justify-end pb-1 shadow-md transition-all"
                                            style={{ left: `calc(50% + ${(r2 / 1.5) * 50}%)`, transform: 'translateX(-50%)' }}
                                        >
                                            <UsersIcon size={28} className="text-orange-950" />
                                            <span className="text-[10px] font-black text-orange-950 mt-1">{m2}kg</span>

                                            {/* Vector Pes */}
                                            <div className="absolute top-full flex flex-col items-center pt-1 pointer-events-none" style={{ height: 90 }}>
                                                <div className="w-1 bg-orange-400 h-full relative">
                                                    <div className="absolute bottom-0 -translate-x-[6px]">{ArrowDownIcon && <ArrowDownIcon size={16} className="text-orange-400" />}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Marques de distància centrals */}
                                        <div className="absolute top-1/2 left-1/2 -translate-y-1/2 w-1 h-3 bg-slate-900"></div>
                                    </div>

                                    {/* Regla / Terra */}
                                    <div className="absolute bottom-0 w-full h-8 bg-slate-700 border-t-2 border-slate-600 flex justify-between px-10 text-[10px] font-mono text-slate-400 items-end pb-1">
                                        <span>1.5m</span><span>1.0m</span><span>0.5m</span><span>0</span><span>0.5m</span><span>1.0m</span><span>1.5m</span>
                                    </div>
                                </div>
                            </div>

                            {/* Controls i Resolució */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-6 flex items-center gap-2 text-emerald-400">
                                        {ScaleIcon && <ScaleIcon size={20} />} Paràmetres d'Equilibri
                                    </h3>
                                    
                                    {activeTab === 'casA' ? (
                                        <div className="space-y-5 mb-2">
                                            <p className="text-sm text-slate-400 mb-4">Ajusta la posició de la germana per a compensar el moment de força del xiquet.</p>
                                            <div>
                                                <div className="flex justify-between text-xs mb-1">
                                                    <span className="text-orange-400 font-bold uppercase">Posició Germana (r₂)</span>
                                                    <span className="font-mono bg-slate-900 px-2 py-1 rounded">{r2.toFixed(2)} m</span>
                                                </div>
                                                <input type="range" min="0.1" max="1.5" step="0.05" value={r2} onChange={e => setR2(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-5 mb-2">
                                            <p className="text-sm text-slate-400 mb-4">Ajusta la força de la mare i el lloc on espenta (costat esquerre) per a reequilibrar.</p>
                                            <div>
                                                <div className="flex justify-between text-xs mb-1">
                                                    <span className="text-indigo-400 font-bold uppercase">Força de la Mare</span>
                                                    <span className="font-mono bg-slate-900 px-2 py-1 rounded">{fMare.toFixed(0)} N</span>
                                                </div>
                                                <input type="range" min="50" max="400" step="5" value={fMare} onChange={e => setFMare(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500" />
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs mb-1">
                                                    <span className="text-indigo-400 font-bold uppercase">Posició de la Mare</span>
                                                    <span className="font-mono bg-slate-900 px-2 py-1 rounded">{rMare.toFixed(2)} m</span>
                                                </div>
                                                <input type="range" min="0.1" max="1.5" step="0.05" value={rMare} onChange={e => setRMare(Number(e.target.value))} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500" />
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-emerald-950/20 p-6 rounded-3xl border border-emerald-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-emerald-500/30 pb-2">
                                        <h4 className="font-bold text-emerald-300 flex items-center gap-2">
                                            {InfoIcon && <InfoIcon size={18} />} Resolució Pas a Pas
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Carregant...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="DCL Generat" className="mx-auto max-h-40 rounded-lg" />
                                            <p className="text-[9px] text-slate-400 mt-1">DCL generat per I.A.</p>
                                        </div>
                                    )}

                                    {activeTab === 'casA' ? (
                                        <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                            <p><strong>1. Condició d'Equilibri de Rotació:</strong><br/>
                                            La suma dels moments (torques) respecte al centre ha de ser zero. El moment és Força × Distància.</p>
                                            
                                            <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-emerald-500 font-mono text-emerald-200 shadow-inner">
                                                Σ M = 0  ⇒  M_esq = M_dreta<br/>
                                                (m1 · g) · r1 = (m2 · g) · r2
                                            </div>

                                            <p><strong>2. Càlcul:</strong><br/>
                                            La gravetat (g) s'anul·la a ambdós costats!</p>
                                            <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-orange-500 font-mono text-orange-200">
                                                20 · 1.20 = 30 · r2<br/>
                                                24 = 30 · r2<br/>
                                                <strong>r2 = 24 / 30 = 0.80 m</strong>
                                            </div>
                                            <p className="italic text-slate-400 mt-2">La germana pesa més, per tant s'ha d'asseure més prop de l'eix per a no generar tant de moment de rotació.</p>
                                        </div>
                                    ) : (
                                        <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                            <p><strong>1. Nou escenari:</strong> Ara el xiquet (20kg) està a 0.8m i la germana (30kg) a 1.2m.</p>
                                            
                                            <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-red-500 font-mono text-red-200 shadow-inner">
                                                M_esq = 20 · 9.8 · 0.8 = 156.8 N·m<br/>
                                                M_dreta = 30 · 9.8 · 1.2 = 352.8 N·m<br/>
                                                Desequilibri cap a la dreta: 196 N·m
                                            </div>

                                            <p><strong>2. La Mare a l'acció:</strong> La mare ha de fer una força a l'esquerra que genere exactament un moment de 196 N·m. Hi ha infinites solucions! Depèn d'on s'aplique:</p>
                                            
                                            <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-indigo-500 font-mono text-indigo-200">
                                                F_mare · r_mare = 196 N·m<br/>
                                                Si es posa a l'extrem (1.2m): F = 196 / 1.2 = <strong>163.3 N</strong><br/>
                                                Si espenta al xiquet (0.8m): F = 196 / 0.8 = <strong>245.0 N</strong>
                                            </div>
                                            <p className="italic text-slate-400 mt-2">Pots comprovar-ho amb els controls superiors! A major distància (més "palanca"), menys força necessita fer la mare.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinàmica: Estàtica i Moments de Força
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
