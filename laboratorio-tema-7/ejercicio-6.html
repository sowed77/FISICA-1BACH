<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratori: Cotxe i Remolc</title>
    <!-- Biblioteques -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #14b8a6; /* Teal 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
        }
        .road-pattern {
            background-image: repeating-linear-gradient(90deg, #475569 0, #475569 20px, transparent 20px, transparent 40px);
            background-position: bottom;
            background-size: 40px 4px;
            background-repeat: repeat-x;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Assignació segura d'icones
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var CarIcon = getIcon('Car');
            var TruckIcon = getIcon('Truck');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ImagePlusIcon = getIcon('ImagePlus');
            var GoalIcon = getIcon('Goal');

            var App = () => {
                // Dades interactives de l'enunciat
                const [mc, setMc] = useState(800); // Massa cotxe (kg)
                const [mr, setMr] = useState(1000); // Massa remolc (kg)
                const [ft, setFt] = useState(1200); // Força Tracció (N)
                
                // Estats d'animació
                const [temps, setTemps] = useState(0);
                const [isMoving, setIsMoving] = useState(false);
                const distObjectiu = 20; // metres

                // Càlculs Físics Reals
                const a = ft / (mc + mr);
                const t_max = Math.sqrt((2 * distObjectiu) / a); // Temps per arribar a 20m
                
                // Càlculs en temps real per al renderitzat
                const distActual = 0.5 * a * Math.pow(Math.min(temps, t_max), 2);
                const velActual = a * Math.min(temps, t_max);
                const tensio = mr * a;

                useEffect(() => {
                    let interval;
                    if (isMoving && temps < t_max) {
                        interval = setInterval(() => {
                            setTemps(prev => {
                                const nextT = prev + 0.05;
                                if (nextT >= t_max) {
                                    setIsMoving(false);
                                    return t_max;
                                }
                                return nextT;
                            });
                        }, 50); // Simula el pas del temps (no necessàriament temps real visual)
                    }
                    return () => clearInterval(interval);
                }, [isMoving, temps, t_max]);

                const handlePlay = () => {
                    if (temps < t_max && ft > 0) setIsMoving(true);
                };

                const reset = () => {
                    setTemps(0);
                    setIsMoving(false);
                };

                // Generador de diagrama DCL amb IA
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyANGbXktzJW-3eyczxinPzpE3rM0s2J9qk"; // API Key insertada por entornoAPI Key injectada
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Dos bloques en horizontal conectados por una cuerda. Bloque derecho tiene vector fuerza F tracción hacia la derecha. La cuerda entre ambos tiene vectores de tensión opuestos T. Fondo blanco, minimalista, educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en xarxa");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                // Escala visual
                const pxPerMeter = 15; // 20m * 15 = 300px
                const posVisualX = distActual * pxPerMeter;

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-teal-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Sistemes de Cossos</span>
                                <h1 className="text-3xl font-black text-teal-400 uppercase tracking-tight tracking-widest">Cotxe i Remolc (MRUA)</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciat:</strong> Un automòbil de 800 kg exerceix una força de tracció d'1,2 kN i arrossega un remolc de 1000 kg amb un cable. Sense fregament, calcula: a) acceleració, b) tensió del cable, c) velocitat després de 20 m des del repòs.
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Visualització Gràfica */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex flex-col justify-end">
                                
                                {/* HUD (Head Up Display) Superior */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Distància (Δx)</p>
                                        <p className="text-xl font-mono font-black text-white">{distActual.toFixed(2)} m</p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Velocitat (v)</p>
                                        <p className="text-xl font-mono font-black text-teal-400">{velActual.toFixed(2)} m/s</p>
                                    </div>
                                </div>

                                {/* Escenari de la Carretera */}
                                <div className="relative w-full h-64 mt-10">
                                    {/* Línia de Meta (20m) */}
                                    <div 
                                        className="absolute h-full border-r-4 border-dashed border-emerald-500/50"
                                        style={{ left: `${120 + 20 * pxPerMeter + 40}px` }} // +40 per al front del cotxe
                                    >
                                        <div className="absolute top-10 -left-6 bg-emerald-900/80 text-emerald-400 text-[10px] font-black px-2 py-1 rounded">20 m</div>
                                    </div>

                                    {/* El Conjunt (Cotxe + Remolc) */}
                                    <div 
                                        className="absolute bottom-10 flex items-end transition-all z-20"
                                        style={{ transform: `translateX(${posVisualX}px)`, left: '20px' }}
                                    >
                                        {/* Remolc (Massa r) */}
                                        <div className="relative flex flex-col items-center">
                                            <div className="w-20 h-16 bg-orange-600 border-2 border-orange-400 rounded-lg shadow-lg flex items-center justify-center">
                                                <span className="text-[10px] font-black text-orange-950">m_r: {mr}kg</span>
                                            </div>
                                            {/* Rodes remolc */}
                                            <div className="flex gap-8 -mt-2">
                                                <div className="w-4 h-4 bg-slate-900 rounded-full border-2 border-slate-500"></div>
                                                <div className="w-4 h-4 bg-slate-900 rounded-full border-2 border-slate-500"></div>
                                            </div>

                                            {/* Vector Tensió Remolc (Dreta) */}
                                            <div className="absolute top-1/2 left-full flex items-center pl-1 z-30" style={{ width: Math.max(30, tensio / 20) }}>
                                                <div className="h-1 bg-indigo-400 w-full relative">
                                                    <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon className="text-indigo-400" size={16} />}</div>
                                                </div>
                                                <span className="ml-1 text-[10px] font-black text-indigo-300">T</span>
                                            </div>
                                        </div>

                                        {/* Cable / Bola d'enganxall */}
                                        <div className="w-10 h-1 bg-slate-500 relative mb-4">
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-slate-400 rounded-full"></div>
                                        </div>

                                        {/* Cotxe (Massa c) */}
                                        <div className="relative flex flex-col items-center">
                                            <div className="w-24 h-12 bg-blue-600 border-2 border-blue-400 rounded-lg shadow-lg flex items-center justify-center rounded-tr-3xl">
                                                <span className="text-[10px] font-black text-blue-950">m_c: {mc}kg</span>
                                            </div>
                                            {/* Rodes cotxe */}
                                            <div className="flex gap-12 -mt-2">
                                                <div className="w-4 h-4 bg-slate-900 rounded-full border-2 border-slate-500"></div>
                                                <div className="w-4 h-4 bg-slate-900 rounded-full border-2 border-slate-500"></div>
                                            </div>

                                            {/* Vector Tracció Motor (Dreta) */}
                                            <div className="absolute top-1/2 left-full flex items-center pl-1 z-30" style={{ width: Math.max(40, ft / 20) }}>
                                                <div className="h-1 bg-green-400 w-full relative">
                                                    <div className="absolute right-0 -top-1.5">{ArrowRightIcon && <ArrowRightIcon className="text-green-400" size={16} />}</div>
                                                </div>
                                                <span className="ml-1 text-[10px] font-black text-green-300">F_T</span>
                                            </div>

                                            {/* Vector Tensió Cotxe (Esquerra) */}
                                            <div className="absolute top-1/2 right-full flex items-center pr-1 z-30" style={{ width: Math.max(30, tensio / 20) }}>
                                                <span className="mr-1 text-[10px] font-black text-indigo-300">T</span>
                                                <div className="h-1 bg-indigo-400 w-full relative">
                                                    <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-indigo-400" size={16} />}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Carretera */}
                                    <div className="absolute bottom-0 w-full h-8 bg-slate-700 border-t-2 border-slate-500 road-pattern"></div>
                                </div>
                            </div>

                            {/* Tauler de Control i Resolució */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-teal-400">
                                        {CalculatorIcon && <CalculatorIcon size={20} />} Variables del Sistema
                                    </h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-blue-300 font-bold uppercase">Massa Cotxe (m_c)</span>
                                                <span className="font-mono">{mc} kg</span>
                                            </div>
                                            <input type="range" min="500" max="2000" step="50" value={mc} onChange={e => {setMc(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                                        </div>
                                        
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-orange-300 font-bold uppercase">Massa Remolc (m_r)</span>
                                                <span className="font-mono">{mr} kg</span>
                                            </div>
                                            <input type="range" min="200" max="2000" step="50" value={mr} onChange={e => {setMr(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-green-400 font-bold uppercase">Força de Tracció (F_T)</span>
                                                <span className="font-mono">{ft} N ({(ft/1000).toFixed(1)} kN)</span>
                                            </div>
                                            <input type="range" min="500" max="5000" step="100" value={ft} onChange={e => {setFt(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-green-500" />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || temps >= t_max}
                                            className="flex-1 bg-teal-600 hover:bg-teal-500 text-white font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95"
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} ARRANCAR
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-teal-950/20 p-6 rounded-3xl border border-teal-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-teal-500/30 pb-2">
                                        <h4 className="font-bold text-teal-300 flex items-center gap-2">
                                            {InfoIcon && <InfoIcon size={18} />} Explicació Matemàtica
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Carregant...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cos Lliure" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>a) Acceleració:</strong> Prenem el sistema sencer com un sol bloc de massa {mc + mr} kg.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-teal-500 font-mono">
                                            a = F_T / (m_c + m_r)<br/>
                                            a = {ft} / ({mc} + {mr}) = <strong>{a.toFixed(3)} m/s²</strong>
                                        </div>
                                        
                                        <p className="mt-3"><strong>b) Tensió del cable:</strong> La tensió és l'única força que estira el remolc cap avant.</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-indigo-500 font-mono">
                                            T = m_r · a<br/>
                                            T = {mr} · {a.toFixed(3)} = <strong>{tensio.toFixed(1)} N</strong>
                                        </div>

                                        <p className="mt-3"><strong>c) Velocitat als 20m (MRUA):</strong> Partim del repòs ($v_0 = 0$).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-green-500 font-mono">
                                            v² = v₀² + 2 · a · Δx<br/>
                                            v² = 0 + 2 · {a.toFixed(3)} · 20<br/>
                                            v² = {(2 * a * 20).toFixed(2)}  ⇒  v = <strong>{Math.sqrt(2 * a * 20).toFixed(2)} m/s</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinàmica: Cossos Enllaçats Horitzontals
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
