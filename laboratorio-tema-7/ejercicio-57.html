<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratori: Òrbita Geoestacionària</title>
    <!-- Biblioteques -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #a855f7; /* Purple 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        
        /* Animació per a l'òrbita */
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes counter-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        .animate-orbit {
            animation: orbit linear infinite;
        }
        .animate-counter-orbit {
            animation: counter-orbit linear infinite;
        }
        .star-bg {
            background-image: radial-gradient(#ffffff 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            // Assignació segura d'icones amb components de suport per evitar errors
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var SatelliteIcon = getIcon('Satellite');
            var Globe2Icon = icons.Globe2 || icons.Globe || getIcon('Globe');
            var Loader2Icon = icons.Loader2 || icons.Loader || getIcon('Loader');
            var PlayIcon = getIcon('Play');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var CheckCircle2Icon = icons.CheckCircle2 || icons.CheckCircle || getIcon('CheckCircle');
            var ArrowDownRightIcon = getIcon('ArrowDownRight');

            var App = () => {
                const [activeTab, setActiveTab] = useState('teoria');
                
                // Constants físiques
                const G = 6.67e-11; // N m^2 / kg^2
                const Mt = 5.97e24; // kg
                const Rt = 6371; // km
                
                // Estats del Simulador
                const [hores, setHores] = useState(24); // Període en hores
                
                // Càlculs interactius
                const T_segons = hores * 3600;
                // Tercera Llei de Kepler: r^3 = (G*Mt*T^2) / (4*pi^2)
                const r_cub = (G * Mt * Math.pow(T_segons, 2)) / (4 * Math.pow(Math.PI, 2));
                const r_metres = Math.pow(r_cub, 1/3);
                const r_km = r_metres / 1000;
                const altura_km = r_km - Rt;
                const velocitat_kms = (2 * Math.PI * r_km) / T_segons;

                // Generació d'imatge tècnica (DCL)
                const [imgLoading, setImgLoading] = useState(false);
                const [imgUrl, setImgUrl] = useState(null);
                const [imgError, setImgError] = useState(null);

                useEffect(() => {
                    if (activeTab !== 'teoria' || imgUrl || imgError) return;
                    
                    const fetchImage = async () => {
                        setImgLoading(true);
                        const apiKey = ""; // L'entorn injecta la clau ací
                        try {
                            const response = await fetch(
                                `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                                {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        instances: [{ prompt: "Diagrama técnico de un satélite en órbita alrededor de la Tierra, mostrando vectores de velocidad tangencial y fuerza gravitatoria centrípeta, estilo educativo minimalista fondo blanco" }],
                                        parameters: { sampleCount: 1 }
                                    })
                                }
                            );
                            if (!response.ok) throw new Error("Error en l'API");
                            const data = await response.json();
                            setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                        } catch (error) {
                            setImgError("No s'ha pogut generar el DCL tècnic.");
                        } finally {
                            setImgLoading(false);
                        }
                    };
                    fetchImage();
                }, [activeTab, imgUrl, imgError]);

                // Escala visual per al simulador (Radi de la terra = 20px)
                const baseRadius = 20;
                // Proporció logarítmica/visual suau per a què càpiga en pantalla
                const visualOrbitRadius = baseRadius + (Math.sqrt(Math.max(0, altura_km)) * 1.2); 
                // Velocitat d'animació inversa al període
                const animDuration = Math.max(2, hores * 0.5); 

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-purple-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Tema 8</span>
                                <h1 className="text-3xl font-black text-purple-400 uppercase tracking-tight tracking-widest">Satèl·lit Geoestacionari</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <h2 className="text-purple-300 font-bold mb-1 flex items-center gap-2">
                                    <Globe2Icon size={18} /> Context Real (C. Valenciana)
                                </h2>
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    Pensa en les antenes parabòliques dels balcons de València que reben el senyal de televisió. Si el satèl·lit (com l'Astra o el Meteosat) es moguera respecte a nosaltres, hauríem d'estar girant l'antena tot el dia! Un satèl·lit geoestacionari gira exactament al mateix ritme que la Terra (1 volta cada 24 hores), quedant "clavat" sempre sobre el mateix punt de l'equador.
                                </p>
                            </div>
                        </header>

                        <nav className="max-w-xl mx-auto flex gap-2 mb-8 bg-slate-800 p-1 rounded-xl shadow-inner">
                            <button onClick={() => setActiveTab('teoria')} className={`flex-1 px-4 py-2 rounded-lg transition-all font-bold ${activeTab === 'teoria' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>Teoria i Resolució</button>
                            <button onClick={() => setActiveTab('simulador')} className={`flex-1 px-4 py-2 rounded-lg transition-all font-bold ${activeTab === 'simulador' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:bg-slate-700'}`}>Laboratori Orbital</button>
                        </nav>

                        <main className="max-w-5xl mx-auto">
                            {activeTab === 'teoria' ? (
                                <div className="grid md:grid-cols-2 gap-8">
                                    {/* Pas a Pas */}
                                    <div className="space-y-6">
                                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                            <h3 className="text-xl font-bold mb-4 text-purple-300 border-b border-slate-700 pb-2 flex items-center gap-2">
                                                <CalculatorIcon size={20} /> Pas 1: Dades del Sistema (S.I.)
                                            </h3>
                                            <ul className="space-y-2 text-sm text-slate-300 font-mono">
                                                <li>G = 6.67 × 10⁻¹¹ N·m²/kg²</li>
                                                <li>M<sub>T</sub> = 5.97 × 10²⁴ kg</li>
                                                <li>R<sub>T</sub> = 6371 km = 6.371 × 10⁶ m</li>
                                                <li className="text-purple-400 bg-purple-900/30 p-1 rounded">T = 24 h = 86400 s (Condició geoestacionària)</li>
                                            </ul>
                                        </div>

                                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                            <h3 className="text-xl font-bold mb-4 text-purple-300 border-b border-slate-700 pb-2">
                                                Pas 2: Equacions de la Dinàmica
                                            </h3>
                                            <p className="text-sm text-slate-300 mb-4">L'única força que actua sobre el satèl·lit en l'espai és la gravetat. Com descriu una corba, aquesta força actua com a Força Centrípeta.</p>
                                            <div className="bg-slate-900 p-4 rounded-xl border-l-4 border-purple-500 font-mono text-center text-sm shadow-inner overflow-x-auto text-indigo-200">
                                                <span>{"F"}<sub>g</sub> = {"F"}<sub>c</sub></span><br/><br/>
                                                <span>{"G"} · ({"M"}<sub>T</sub> · m) / r² = m · a<sub>c</sub></span><br/>
                                                <span className="text-slate-500 text-xs">Com que a<sub>c</sub> = ω²·r i ω = 2π/T</span><br/>
                                                <span>{"G"} · {"M"}<sub>T</sub> / r² = (4π²/T²) · r</span>
                                            </div>
                                        </div>

                                        <div className="bg-purple-900/30 p-6 rounded-3xl border border-purple-500/30 shadow-xl">
                                            <h3 className="text-xl font-bold mb-4 text-purple-300 border-b border-purple-500/30 pb-2 flex items-center gap-2">
                                                <CheckCircle2Icon size={20} /> Pas 3: Resolució i Unitats
                                            </h3>
                                            <p className="text-sm text-slate-300 mb-2">Aïllem el radi orbital (r), que és la distància fins al <strong>centre</strong> de la Terra:</p>
                                            <div className="bg-slate-900/80 p-3 rounded-lg font-mono text-center text-emerald-300 text-sm mb-4">
                                                r³ = (G · M<sub>T</sub> · T²) / (4π²)<br/>
                                                r = 4.22 × 10⁷ m = 42.200 km
                                            </div>
                                            <p className="text-sm text-slate-300 mb-2">Però ens pregunten l'altura (h) sobre la superfície!</p>
                                            <div className="bg-slate-900/80 p-3 rounded-lg font-mono text-center font-bold text-white text-lg border-2 border-emerald-500">
                                                h = r - R<sub>T</sub><br/>
                                                h = 42200 - 6371 ≈ 35.800 km
                                            </div>
                                        </div>
                                    </div>

                                    {/* DCL i Imatge */}
                                    <div className="flex flex-col gap-6">
                                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl flex-1 flex flex-col">
                                            <h3 className="text-xl font-bold mb-4 text-purple-300 flex items-center gap-2">
                                                <ArrowDownRightIcon size={20} /> Diagrama de Cos Lliure
                                            </h3>
                                            <div className="flex-1 bg-slate-900 rounded-2xl flex items-center justify-center p-4 border border-slate-700 overflow-hidden relative min-h-[250px]">
                                                {imgLoading ? (
                                                    <div className="flex flex-col items-center text-purple-500">
                                                        <Loader2Icon className="animate-spin mb-2" size={32} />
                                                        <span className="text-xs font-bold uppercase tracking-widest">Generant DCL amb I.A...</span>
                                                    </div>
                                                ) : imgError ? (
                                                    <div className="text-center text-slate-400 p-6">
                                                        <InfoIcon size={32} className="mx-auto mb-2 text-slate-500" />
                                                        <p className="text-sm">{imgError}</p>
                                                    </div>
                                                ) : imgUrl && (
                                                    <img src={imgUrl} alt="Diagrama de forces del satèl·lit" className="max-w-full max-h-full rounded-xl" />
                                                )}
                                            </div>
                                            <p className="text-xs text-slate-400 mt-4 text-center italic">
                                                L'únic vector força aplicat és {"F"}<sub>g</sub>, dirigit cap al centre del planeta.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid md:grid-cols-2 gap-8">
                                    {/* Visor Espacial */}
                                    <div className="bg-slate-950 rounded-3xl border border-slate-700 h-[500px] relative overflow-hidden shadow-2xl flex items-center justify-center">
                                        <div className="absolute inset-0 star-bg"></div>
                                        
                                        {/* Informació a la cantonada */}
                                        <div className="absolute top-4 left-4 z-30 flex flex-col gap-2">
                                            <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700 backdrop-blur-sm">
                                                <p className="text-[10px] text-slate-500 uppercase font-black">Radi total (r)</p>
                                                <p className="text-sm font-mono font-black text-white">{r_km.toFixed(0)} km</p>
                                            </div>
                                            <div className="bg-slate-900/80 p-2 rounded-lg border border-slate-700 backdrop-blur-sm">
                                                <p className="text-[10px] text-slate-500 uppercase font-black">Velocitat lineal</p>
                                                <p className="text-sm font-mono font-black text-emerald-400">{velocitat_kms.toFixed(2)} km/s</p>
                                            </div>
                                        </div>

                                        {/* El Planeta i l'Òrbita */}
                                        <div className="relative flex items-center justify-center">
                                            {/* La Terra */}
                                            <div className="absolute z-20 w-[40px] h-[40px] bg-blue-500 rounded-full shadow-[inset_-5px_-5px_15px_rgba(0,0,0,0.5)] flex items-center justify-center">
                                                <Globe2Icon size={24} className="text-blue-200 opacity-50" />
                                            </div>

                                            {/* Línia d'òrbita */}
                                            <div 
                                                className="absolute rounded-full border border-slate-600/50 border-dashed"
                                                style={{ width: `${visualOrbitRadius * 2}px`, height: `${visualOrbitRadius * 2}px` }}
                                            ></div>

                                            {/* El Satèl·lit girant */}
                                            <div 
                                                className="absolute animate-orbit flex items-center justify-end z-30"
                                                style={{ 
                                                    width: `${visualOrbitRadius * 2}px`, 
                                                    height: `${visualOrbitRadius * 2}px`,
                                                    animationDuration: `${animDuration}s` 
                                                }}
                                            >
                                                <div className="relative animate-counter-orbit" style={{ animationDuration: `${animDuration}s` }}>
                                                    <SatelliteIcon size={20} className="text-purple-400 absolute -top-[10px] -right-[10px] drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]" />
                                                    
                                                    {/* Vector Força Gravitatòria */}
                                                    <div className="absolute top-0 right-0 w-[30px] h-0.5 bg-red-500 origin-right -translate-x-[10px]">
                                                        <div className="absolute left-0 -top-1 w-2 h-2 border-l-2 border-b-2 border-red-500 rotate-45"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Dades a la part inferior */}
                                        <div className="absolute bottom-6 w-full flex justify-center z-30">
                                            <div className="bg-purple-900/80 px-6 py-3 rounded-2xl border border-purple-500/50 shadow-xl backdrop-blur-md text-center">
                                                <p className="text-[10px] text-purple-300 uppercase font-black mb-1">Altura sobre la superfície (h)</p>
                                                <p className="text-3xl font-mono font-black text-white">{altura_km.toFixed(0)} <span className="text-base text-purple-200">km</span></p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Panell de Control */}
                                    <div className="space-y-6">
                                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                            <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                                <InfoIcon className="text-purple-400" size={20} /> Control de Missió
                                            </h3>
                                            
                                            <div className="mb-6">
                                                <div className="flex justify-between mb-2 text-sm">
                                                    <span className="text-slate-400 font-bold uppercase tracking-widest">Període Orbital (T)</span>
                                                    <span className="font-mono text-purple-400 font-bold text-xl">{hores.toFixed(1)} hores</span>
                                                </div>
                                                <input 
                                                    type="range" min="1.5" max="72" step="0.5" value={hores} 
                                                    onChange={e => setHores(Number(e.target.value))} 
                                                    className="w-full h-3 bg-slate-700 rounded-lg appearance-none cursor-pointer" 
                                                />
                                                <div className="flex justify-between text-[10px] font-bold text-slate-500 mt-2">
                                                    <span>Òrbita Baixa (ISS) ~1.5h</span>
                                                    <span>Geoestacionària = 24h</span>
                                                    <span>Llunyana (Lluna) ~27 dies</span>
                                                </div>
                                            </div>

                                            <div className="flex gap-2">
                                                <button onClick={() => setHores(24)} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg text-sm">
                                                    FIJAR ORBITA GEOESTACIONÀRIA
                                                </button>
                                                <button onClick={() => setHores(1.5)} className="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg text-sm">
                                                    ISS
                                                </button>
                                            </div>
                                        </div>

                                        <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                            <h4 className="font-bold text-purple-300 mb-2 flex items-center gap-2">
                                                <InfoIcon size={18} /> Observacions del Profe
                                            </h4>
                                            <ul className="text-xs text-slate-300 space-y-3 leading-relaxed list-disc ml-4">
                                                <li>Prova de posar el període de la <strong>Estació Espacial Internacional (ISS)</strong>, a unes 1.5 hores. Veuràs que ha de volar molt baix (a uns 400 km) i molt de pressa (quasi 8 km/s) per a no caure!</li>
                                                <li>Si fixes el període a <strong>24 hores</strong>, l'altura es clava prop dels 36.000 km. És l'únic lloc on l'atracció gravitatòria et dóna exactament la velocitat necessària per a completar una volta al dia.</li>
                                                <li className="italic text-slate-500">Curiositat "pro": Un dia exacte de rotació de la Terra dura 23 hores i 56 minuts (dia sideral). Si uses aquest temps, et donarà l'altura precisa al mil·límetre de 35.786 km.</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Gravitació Universal i Lleis de Kepler
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
</body>
</html>
