<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Ley de Hooke</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ec4899; /* Fuchsia 500 */
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }
        .ruler-pattern {
            background-image: repeating-linear-gradient(to bottom, #475569 0, #475569 2px, transparent 2px, transparent 20px);
        }
        .spring-path {
            transition: d 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var CalculatorIcon = icons.Calculator || (({className}) => <span className={className}></span>);
            var ArrowUpIcon = icons.ArrowUp || (({className}) => <span className={className}></span>);
            var ArrowDownIcon = icons.ArrowDown || (({className}) => <span className={className}></span>);
            var InfoIcon = icons.Info || (({className}) => <span className={className}></span>);
            var ImagePlusIcon = icons.ImagePlus || (({className}) => <span className={className}></span>);
            var SettingsIcon = icons.Settings || (({className}) => <span className={className}></span>);

            var App = () => {
                const g = 9.8; // m/s^2

                // Estados interactivos (Iniciamos con los datos del problema)
                const [masaGramos, setMasaGramos] = useState(100); // g
                const [k, setK] = useState(32.67); // N/m

                // Cálculos Físicos
                const masaKg = masaGramos / 1000;
                const peso = masaKg * g; // N
                
                // Ley de Hooke: P = Fe -> m*g = k*x -> x = (m*g)/k
                const elongacionM = peso / k;
                const elongacionCm = elongacionM * 100;

                // Escala visual
                const pxPerCm = 25; // 1 cm real = 25 px en pantalla
                const l0 = 80; // Longitud en reposo del muelle (px)
                const visualStretch = elongacionCm * pxPerCm;
                const currentLength = l0 + visualStretch;

                // Generador del trazado SVG del muelle
                const generateSpringPath = () => {
                    const coils = 12;
                    const width = 16;
                    const topPadding = 10;
                    const bottomPadding = 10;
                    
                    let path = `M 50 0 L 50 ${topPadding} `;
                    const coilHeight = (currentLength - topPadding - bottomPadding) / coils;
                    
                    for(let i=0; i<coils; i++) {
                        // Zig-zag alternando izquierda y derecha
                        const x = i % 2 === 0 ? 50 - width : 50 + width;
                        const y = topPadding + coilHeight * (i + 0.5);
                        path += `L ${x} ${y} `;
                    }
                    
                    path += `L 50 ${currentLength - bottomPadding} L 50 ${currentLength}`;
                    return path;
                };

                // Generador DCL
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Una masa colgada de un muelle vertical. Vector Peso P apuntando hacia abajo. Vector Fuerza Elástica Fe apuntando hacia arriba. Ambos vectores del mismo tamaño. Fondo blanco, minimalista, educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error de red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-fuchsia-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Elasticidad</span>
                                <h1 className="text-3xl font-black text-fuchsia-400 uppercase tracking-tight tracking-widest">El Dinamómetro</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Un dinamómetro se alarga 3,00 cm al colgarle una masa de 100 g. ¿Cuál es su constante elástica?
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col pt-16">
                                
                                {/* Marcadores Flotantes */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza Aplicada (P)</p>
                                        <p className="text-xl font-mono font-black text-orange-400">{peso.toFixed(2)} N</p>
                                    </div>
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md text-right">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Alargamiento (x)</p>
                                        <p className="text-xl font-mono font-black text-fuchsia-400">{elongacionCm.toFixed(2)} cm</p>
                                    </div>
                                </div>

                                {/* Escena del Muelle */}
                                <div className="relative w-full h-full flex justify-center mt-4">
                                    
                                    {/* Techo */}
                                    <div className="absolute top-0 w-48 h-4 bg-slate-600 border-b-4 border-slate-500 rounded-b-md z-20">
                                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-4 h-6 bg-slate-400 rounded-b-sm"></div>
                                    </div>

                                    {/* Muelle SVG */}
                                    <div className="absolute top-4 z-10">
                                        <svg width="100" height={currentLength + 20} className="overflow-visible">
                                            <path 
                                                d={generateSpringPath()} 
                                                fill="none" 
                                                stroke="#94a3b8" 
                                                strokeWidth="4" 
                                                strokeLinecap="round" 
                                                strokeLinejoin="round"
                                                className="spring-path"
                                            />
                                        </svg>
                                    </div>

                                    {/* Regla de medición */}
                                    <div className="absolute top-4 left-[calc(50%+60px)] w-8 h-[350px] border-l-2 border-slate-600">
                                        <div className="absolute top-0 -left-6 w-5 border-b-2 border-fuchsia-500"></div>
                                        <span className="absolute -top-2 left-2 text-[10px] font-bold text-fuchsia-400">0 cm</span>
                                        
                                        {/* Marca de longitud natural */}
                                        <div className="absolute -left-6 w-5 border-b-2 border-dashed border-slate-400" style={{ top: `${l0}px` }}></div>
                                        <span className="absolute left-2 text-[8px] text-slate-500 whitespace-nowrap" style={{ top: `${l0 - 6}px` }}>L₀ (Reposo)</span>
                                        
                                        {/* Regla visual cada cm visual (25px) */}
                                        <div className="absolute w-2 h-full ruler-pattern" style={{ top: `${l0}px` }}></div>

                                        {/* Marca de elongación actual */}
                                        <div className="absolute -left-12 w-11 border-b-2 border-fuchsia-500 transition-all duration-300" style={{ top: `${currentLength}px` }}></div>
                                        <div className="absolute left-2 transition-all duration-300 bg-slate-900/80 px-1 rounded" style={{ top: `${currentLength - 8}px` }}>
                                            <span className="text-xs font-mono font-bold text-fuchsia-400">{elongacionCm.toFixed(2)} cm</span>
                                        </div>
                                    </div>

                                    {/* Masa (Bloque) */}
                                    <div 
                                        className="absolute w-16 h-16 bg-orange-600 border-4 border-orange-400 rounded-lg flex items-center justify-center shadow-lg z-20 transition-all duration-300"
                                        style={{ top: `${currentLength + 4}px` }}
                                    >
                                        <span className="font-black text-orange-200 text-xs">{masaGramos}g</span>

                                        {/* Vector Fuerza Elástica (Fuchsia, Hacia arriba) */}
                                        {peso > 0 && (
                                            <div className="absolute bottom-full left-1/2 -translate-x-[12px] flex flex-col items-center pb-1 pointer-events-none" style={{ height: Math.min(120, peso * 50) }}>
                                                <span className="mb-1 text-[10px] font-black text-fuchsia-300 bg-slate-900/80 px-1 rounded shadow">F_e</span>
                                                <div className="w-1.5 bg-fuchsia-500 h-full relative shadow-[0_0_8px_rgba(236,72,153,0.8)]">
                                                    <div className="absolute top-0 -translate-x-[6px]">{ArrowUpIcon && <ArrowUpIcon className="text-fuchsia-500" size={18} />}</div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Vector Peso (Naranja, Hacia abajo) */}
                                        {peso > 0 && (
                                            <div className="absolute top-full left-1/2 translate-x-[6px] flex flex-col items-center pt-1 pointer-events-none" style={{ height: Math.min(120, peso * 50) }}>
                                                <div className="w-1.5 bg-orange-400 h-full relative shadow-[0_0_8px_rgba(249,115,22,0.8)]">
                                                    <div className="absolute bottom-0 -translate-x-[6px]">{ArrowDownIcon && <ArrowDownIcon className="text-orange-400" size={18} />}</div>
                                                </div>
                                                <span className="mt-1 text-[10px] font-black text-orange-300 bg-slate-900/80 px-1 rounded shadow">P</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-fuchsia-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Ajustar Dinamómetro
                                    </h3>
                                    
                                    <div className="space-y-6 mb-2">
                                        <div>
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-orange-400 font-bold uppercase">Masa Colgada (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-orange-200">{masaGramos} g</span>
                                            </div>
                                            <input 
                                                type="range" min="0" max="300" step="10" value={masaGramos} 
                                                onChange={e => setMasaGramos(Number(e.target.value))} 
                                                className="w-full h-3 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" 
                                            />
                                            <p className="text-[10px] text-slate-500 mt-1 italic">
                                                * El problema nos pide probar con exactamente 100 g.
                                            </p>
                                        </div>

                                        <div className="pt-4 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-2">
                                                <span className="text-fuchsia-400 font-bold uppercase">Constante Elástica (k)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-fuchsia-200">{k.toFixed(2)} N/m</span>
                                            </div>
                                            <input 
                                                type="range" min="10" max="100" step="0.1" value={k} 
                                                onChange={e => setK(Number(e.target.value))} 
                                                className="w-full h-3 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-fuchsia-500" 
                                            />
                                            <p className="text-[10px] text-slate-500 mt-1 italic">
                                                * Ajusta este valor (dureza del muelle) para que marque 3.00 cm exactos.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-fuchsia-950/20 p-6 rounded-3xl border border-fuchsia-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-fuchsia-500/30 pb-2">
                                        <h4 className="font-bold text-fuchsia-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                        <p><strong>1. La Trampa de las Unidades (S.I.):</strong><br/>
                                        ¡Nunca uses gramos ni centímetros en las fórmulas de Dinámica!</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-slate-500 font-mono">
                                            m = 100 g = <strong>0.100 kg</strong><br/>
                                            x = 3.00 cm = <strong>0.03 m</strong>
                                        </div>
                                        
                                        <p className="mt-3"><strong>2. Condición de Equilibrio:</strong><br/>
                                        La fuerza que estira el muelle es el peso de la masa (gravedad). Como está quieto, la Fuerza Elástica (F<sub>e</sub>) debe igualar al Peso (P).</p>
                                        <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-orange-500 font-mono">
                                            P = m · g = 0.100 · 9.8 = <strong>0.98 N</strong><br/>
                                            F<sub>e</sub> = P = <strong>0.98 N</strong>
                                        </div>

                                        <p className="mt-3"><strong>3. Ley de Hooke:</strong><br/>
                                        Calculamos "k" (lo duro que es el muelle).</p>
                                        <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-fuchsia-500 font-mono text-fuchsia-200">
                                            F<sub>e</sub> = k · x<br/>
                                            0.98 = k · 0.03<br/>
                                            k = 0.98 / 0.03 = <strong>32.67 N/m</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica de Fuerzas Recuperadoras (Ley de Hooke)
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
