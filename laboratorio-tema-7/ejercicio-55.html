<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Fuerza Horizontal en Rampa</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-mono { font-family: 'Fira Code', monospace; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #a855f7; /* Purple 500 */
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .ramp-pattern {
            background-color: #334155;
            background-image: repeating-linear-gradient(45deg, #1e293b 0, #1e293b 2px, transparent 2px, transparent 10px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        (() => {
            var { useState, useEffect } = React;
            var icons = window.LucideReact || {};
            
            var getIcon = (name) => icons[name] || (({className}) => <span className={className || ''}></span>);
            var PlayIcon = getIcon('Play');
            var RotateCcwIcon = getIcon('RotateCcw');
            var InfoIcon = getIcon('Info');
            var CalculatorIcon = getIcon('Calculator');
            var ArrowRightIcon = getIcon('ArrowRight');
            var ArrowLeftIcon = getIcon('ArrowLeft');
            var ArrowUpIcon = getIcon('ArrowUp');
            var ArrowDownIcon = getIcon('ArrowDown');
            var ImagePlusIcon = getIcon('ImagePlus');
            var SettingsIcon = getIcon('Settings');
            var AlertTriangleIcon = getIcon('AlertTriangle');

            var App = () => {
                // Parámetros fijos
                const g = 9.8; // m/s^2

                // Estados interactivos (Inicializados con el enunciado)
                const [masa, setMasa] = useState(4.0); // kg
                const [angulo, setAngulo] = useState(15); // grados
                const [mu, setMu] = useState(0.65); // Coeficiente de rozamiento
                const [aceleracion, setAceleracion] = useState(0); // m/s² (0 para v=const, 2 para caso B)

                // Estados de animación
                const [pos, setPos] = useState(0); 
                const [vel, setVel] = useState(0);
                const [isMoving, setIsMoving] = useState(false);

                // --- CÁLCULOS FÍSICOS ---
                const anguloRad = angulo * (Math.PI / 180);
                const senA = Math.sin(anguloRad);
                const cosA = Math.cos(anguloRad);

                const peso = masa * g;
                const px = peso * senA;
                const py = peso * cosA;

                // Para hallar F, resolvemos la ecuación:
                // Fx - Px - Fr = m*a
                // F*cos(A) - Px - mu*N = m*a
                // F*cos(A) - Px - mu*(Py + F*sin(A)) = m*a
                // F*cos(A) - mu*F*sin(A) = m*a + Px + mu*Py
                // F*(cos(A) - mu*sin(A)) = m*a + m*g*sin(A) + mu*m*g*cos(A)
                
                const denominador = cosA - mu * senA;
                const autoBloqueo = denominador <= 0;

                const numerador = masa * aceleracion + px + mu * py;
                
                // Si hay autobloqueo, la fuerza tiende a infinito (empuja contra el suelo sin poder subir)
                const fuerzaHorizontal = autoBloqueo ? 0 : numerador / denominador;

                // Componentes de la fuerza horizontal
                const fx = fuerzaHorizontal * cosA; // Sube la rampa
                const fy = fuerzaHorizontal * senA; // Aplasta contra la rampa

                const normal = py + fy;
                const fr = autoBloqueo ? 0 : mu * normal;

                // Animación visual
                const rampLength = 300; // px
                useEffect(() => {
                    let interval;
                    if (isMoving && pos < rampLength) {
                        interval = setInterval(() => {
                            setVel(v => v + (aceleracion === 0 ? 0 : aceleracion) * 0.05); 
                            setPos(p => {
                                // Si a=0, se mueve a velocidad constante visual
                                const velocidadVisual = aceleracion === 0 ? 1 : vel + 1; 
                                const newP = p + velocidadVisual;
                                if (newP >= rampLength) {
                                    setIsMoving(false);
                                    return rampLength;
                                }
                                return newP;
                            });
                        }, 20); // 50 fps
                    }
                    return () => clearInterval(interval);
                }, [isMoving, pos, vel, aceleracion]);

                const handlePlay = () => {
                    if (pos < rampLength && !autoBloqueo) setIsMoving(true);
                };

                const reset = () => {
                    setPos(0);
                    setVel(0);
                    setIsMoving(false);
                };

                // Si cambiamos parámetros, reiniciamos la animación
                useEffect(() => {
                    reset();
                }, [masa, angulo, mu, aceleracion]);

                // Generador de Diagrama de Cuerpo Libre
                const [imgUrl, setImgUrl] = useState(null);
                const [imgLoading, setImgLoading] = useState(false);

                const generarDiagrama = async () => {
                    setImgLoading(true);
                    const apiKey = "AIzaSyDMyUo-WgmdNkCRW6-YK7h-bnRF_FLAjf0"; 
                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    instances: [{ prompt: "Diagrama técnico de física. Un bloque subiendo por un plano inclinado. Un vector grande de Fuerza F empujando horizontalmente hacia la derecha. Vector Peso P hacia abajo. Vector Normal N perpendicular a la rampa hacia arriba. Componentes Fx y Fy marcados con líneas de puntos. Fondo blanco, minimalista, educativo" }],
                                    parameters: { sampleCount: 1 }
                                })
                            }
                        );
                        if (!response.ok) throw new Error("Error en la red");
                        const data = await response.json();
                        setImgUrl(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setImgLoading(false);
                    }
                };

                // Escala para los vectores
                const vScale = 0.5;

                return (
                    <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                        <header className="max-w-5xl mx-auto mb-8 border-b border-slate-700 pb-6">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-purple-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest">Dinámica y Descomposición</span>
                                <h1 className="text-3xl font-black text-purple-400 uppercase tracking-tight tracking-widest">Empuje Horizontal en Rampa</h1>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mt-4">
                                <p className="text-slate-300 text-sm leading-relaxed">
                                    <strong>Enunciado:</strong> Se quiere subir un cuerpo de 4,0 kg por un plano de 15° aplicando una fuerza HORIZONTAL mínima. μ = 0,65. Calcula F si: a) Sube a velocidad constante. b) Sube con a = 2,0 m/s².
                                </p>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8">
                            {/* Panel Visual */}
                            <div className="bg-slate-800 rounded-3xl border border-slate-700 h-[550px] relative overflow-hidden shadow-2xl flex flex-col justify-end pb-8">
                                
                                {/* HUD Superior */}
                                <div className="absolute top-4 w-full px-6 flex justify-between z-30 pointer-events-none">
                                    <div className="bg-slate-900/90 p-3 rounded-lg border border-slate-700 backdrop-blur-md">
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Estado del Bloque</p>
                                        <p className={`text-sm font-mono font-black ${aceleracion === 0 ? 'text-blue-400' : 'text-emerald-400'}`}>
                                            {aceleracion === 0 ? 'Velocidad Constante' : `Acelerando: ${aceleracion.toFixed(1)} m/s²`}
                                        </p>
                                    </div>
                                    <div className={`bg-slate-900/90 p-3 rounded-lg border backdrop-blur-md text-right border-b-4 ${autoBloqueo ? 'border-b-red-500' : 'border-b-purple-500'}`}>
                                        <p className="text-[10px] text-slate-500 uppercase font-black">Fuerza Horizontal (F)</p>
                                        <p className={`text-xl font-mono font-black ${autoBloqueo ? 'text-red-400' : 'text-purple-400'}`}>
                                            {autoBloqueo ? 'AUTO-BLOQUEO' : `${fuerzaHorizontal.toFixed(2)} N`}
                                        </p>
                                    </div>
                                </div>

                                {autoBloqueo && (
                                    <div className="absolute top-24 left-1/2 -translate-x-1/2 z-40 bg-red-900/90 text-red-200 px-6 py-3 rounded-xl border border-red-500 shadow-xl flex items-center gap-3 w-[80%] text-xs font-bold text-center">
                                        <AlertTriangleIcon size={32} className="shrink-0" />
                                        La rampa es tan empinada o rugosa que empujar horizontalmente solo aplasta el bloque contra el suelo. Es imposible subirlo así.
                                    </div>
                                )}

                                {/* Escena de la Rampa */}
                                <div className="relative w-full h-80">
                                    <div className="absolute bottom-10 left-10 w-[400px] h-full pointer-events-none">
                                        
                                        {/* Rampa Rotada (Origen bottom-right para que suba de izquierda a derecha visualmente) */}
                                        <div 
                                            className="absolute bottom-0 left-0 w-full h-full origin-bottom-left transition-transform duration-300 z-20"
                                            style={{ transform: `rotate(${-angulo}deg)` }}
                                        >
                                            {/* La Rampa */}
                                            <div className="absolute bottom-0 left-0 w-full h-4 ramp-pattern shadow-xl rounded-r-full"></div>

                                            {/* El Bloque */}
                                            <div 
                                                className="absolute bottom-4 w-16 h-16 bg-blue-600 border-4 border-blue-400 rounded-lg flex items-center justify-center shadow-lg transition-transform"
                                                style={{ left: `${40 + pos}px` }}
                                            >
                                                <span className="font-black text-blue-200 text-xs text-center leading-tight">{masa.toFixed(1)}<br/>kg</span>

                                                {!autoBloqueo && (
                                                    <>
                                                        {/* Vector Fuerza Horizontal F (Morado). 
                                                            Lo rotamos positivo para contrarrestar la rotación de la rampa y que se vea horizontal. */}
                                                        <div className="absolute top-1/2 right-1/2 flex items-center origin-right opacity-90" 
                                                             style={{ width: Math.min(200, fuerzaHorizontal * vScale), transform: `translateY(-50%) rotate(${angulo}deg)` }}>
                                                            <div className="h-1.5 bg-purple-500 w-full relative shadow-[0_0_8px_rgba(168,85,247,0.8)]">
                                                                <div className="absolute right-0 -top-2">{ArrowRightIcon && <ArrowRightIcon className="text-purple-500" size={20} />}</div>
                                                            </div>
                                                            <span className="ml-1 text-[12px] font-black text-purple-300 bg-slate-900/80 px-1 rounded shadow" style={{ transform: `rotate(${-angulo}deg)` }}>F</span>
                                                        </div>

                                                        {/* Vector Fx (Morado claro, a lo largo de la rampa) */}
                                                        <div className="absolute top-1/2 left-full flex items-center pl-1 opacity-50" style={{ width: fx * vScale }}>
                                                            <div className="h-0.5 bg-purple-300 w-full relative border-t-2 border-dashed border-purple-400"></div>
                                                            <span className="absolute left-4 -top-4 text-[9px] font-black text-purple-200">Fx</span>
                                                        </div>

                                                        {/* Vector Fy (Morado claro, hacia el centro del suelo) */}
                                                        <div className="absolute top-full left-1/2 flex flex-col items-center pt-1 opacity-50" style={{ height: fy * vScale, transform: 'translateX(-50%)' }}>
                                                            <div className="w-0.5 bg-purple-300 h-full relative border-l-2 border-dashed border-purple-400"></div>
                                                            <span className="absolute -left-6 top-4 text-[9px] font-black text-purple-200">Fy</span>
                                                        </div>

                                                        {/* Vector Px (Rojo, frena hacia atrás) */}
                                                        <div className="absolute top-1/4 right-full flex items-center pr-1" style={{ width: px * vScale }}>
                                                            <span className="mr-1 text-[8px] font-black text-red-300 bg-slate-900/80 px-1 rounded">P_x</span>
                                                            <div className="h-1 bg-red-400 w-full relative shadow-[0_0_8px_rgba(239,68,68,0.8)]">
                                                                <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-red-400" size={16} />}</div>
                                                            </div>
                                                        </div>

                                                        {/* Vector Fr (Naranja, frena hacia atrás) */}
                                                        <div className="absolute bottom-1/4 right-full flex items-center pr-1" style={{ width: fr * vScale }}>
                                                            <span className="mr-1 text-[8px] font-black text-orange-300 bg-slate-900/80 px-1 rounded">F_r</span>
                                                            <div className="h-1 bg-orange-400 w-full relative shadow-[0_0_8px_rgba(249,115,22,0.8)]">
                                                                <div className="absolute left-0 -top-1.5">{ArrowLeftIcon && <ArrowLeftIcon className="text-orange-400" size={16} />}</div>
                                                            </div>
                                                        </div>

                                                        {/* Vector Normal N (Azul, hacia arriba del bloque) */}
                                                        <div className="absolute bottom-full left-[20%] flex flex-col items-center pb-1 opacity-60" style={{ height: Math.min(100, normal * vScale) }}>
                                                            <span className="mb-1 text-[10px] font-black text-blue-300 bg-slate-900/80 px-1 rounded">N</span>
                                                            <div className="w-1.5 bg-blue-400 h-full relative">
                                                                <div className="absolute top-0 -translate-x-[6px]">{ArrowUpIcon && <ArrowUpIcon size={18} className="text-blue-400" />}</div>
                                                            </div>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        </div>

                                        {/* Suelo Base y Ángulo */}
                                        <div className="absolute bottom-0 left-0 w-full border-b-2 border-slate-600 border-dashed"></div>
                                        
                                        {angulo > 0 && (
                                            <div className="absolute bottom-0 left-0 w-24 h-24 border-r-2 border-t-2 border-purple-500/50 rounded-tr-full flex items-end justify-end pb-2 pr-2">
                                                <span className="text-purple-300 font-mono text-sm font-bold">{angulo}º</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Controles y Resolución */}
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-purple-400">
                                        {SettingsIcon && <SettingsIcon size={20} />} Ajustar Variables
                                    </h3>
                                    
                                    {/* Botones de atajo a los apartados del problema */}
                                    <div className="grid grid-cols-2 gap-2 mb-6">
                                        <button onClick={() => {setAceleracion(0); reset();}} className={`text-xs font-bold py-3 rounded-xl border transition-all ${aceleracion === 0 ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}>
                                            Caso A: Vel. Constante (a=0)
                                        </button>
                                        <button onClick={() => {setAceleracion(2.0); reset();}} className={`text-xs font-bold py-3 rounded-xl border transition-all ${aceleracion === 2.0 ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}>
                                            Caso B: Acelera (a=2.0)
                                        </button>
                                    </div>

                                    <div className="space-y-5 mb-6">
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-slate-300 font-bold uppercase">Masa (m)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-white">{masa.toFixed(1)} kg</span>
                                            </div>
                                            <input type="range" min="1" max="20" step="0.5" value={masa} onChange={e => {setMasa(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-slate-400" />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-purple-400 font-bold uppercase">Inclinación (α)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-purple-300">{angulo}º</span>
                                            </div>
                                            <input type="range" min="0" max="60" step="1" value={angulo} onChange={e => {setAngulo(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500" />
                                        </div>

                                        <div className="pt-3 border-t border-slate-700">
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-orange-400 font-bold uppercase">Rozamiento (μ)</span>
                                                <span className="font-mono bg-slate-900 px-2 py-0.5 rounded text-orange-200">{mu.toFixed(2)}</span>
                                            </div>
                                            <input type="range" min="0" max="1.5" step="0.05" value={mu} onChange={e => {setMu(Number(e.target.value)); reset();}} className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={handlePlay} 
                                            disabled={isMoving || pos >= rampLength || autoBloqueo}
                                            className={`flex-1 font-black py-3 rounded-xl shadow-lg flex justify-center items-center gap-2 disabled:opacity-50 transition-all active:scale-95 ${autoBloqueo ? 'bg-slate-600 text-slate-400' : 'bg-purple-600 hover:bg-purple-500 text-white'}`}
                                        >
                                            {PlayIcon && <PlayIcon size={18} />} {autoBloqueo ? 'SISTEMA BLOQUEADO' : 'EMPUJAR BLOQUE'}
                                        </button>
                                        <button onClick={reset} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 rounded-xl transition-all shadow-md">
                                            {RotateCcwIcon && <RotateCcwIcon size={18} />}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-purple-950/20 p-6 rounded-3xl border border-purple-500/20">
                                    <div className="flex justify-between items-center mb-4 border-b border-purple-500/30 pb-2">
                                        <h4 className="font-bold text-purple-300 flex items-center gap-2">
                                            {CalculatorIcon && <CalculatorIcon size={18} />} Resolución Paso a Paso
                                        </h4>
                                        <button onClick={generarDiagrama} className="text-[10px] uppercase font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-1 border border-slate-600">
                                            {imgLoading ? <span className="animate-pulse">Cargando...</span> : <>{ImagePlusIcon && <ImagePlusIcon size={14}/>} Generar DCL</>}
                                        </button>
                                    </div>

                                    {imgUrl && (
                                        <div className="mb-4 bg-slate-900 p-2 rounded-xl border border-slate-700 text-center">
                                            <img src={imgUrl} alt="Diagrama de Cuerpo Libre" className="mx-auto max-h-40 rounded-lg" />
                                        </div>
                                    )}

                                    {!autoBloqueo ? (
                                        <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                                            <p><strong>1. El Eje Vertical (Y): El aplastamiento</strong><br/>
                                            Como F es horizontal, al chocar contra la rampa, su componente F_y empuja el bloque contra el suelo, aumentando la Normal.</p>
                                            <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-blue-500 font-mono text-blue-200">
                                                N = P_y + F_y = m·g·cos(α) + F·sin(α)
                                            </div>
                                            
                                            <p className="mt-3"><strong>2. El Eje Horizontal (X): La subida</strong><br/>
                                            La componente F_x empuja hacia arriba. Se oponen P_x y la fricción (que ahora es mayor porque la Normal creció).</p>
                                            <div className="bg-slate-900/80 p-2 rounded-lg border-l-4 border-red-500 font-mono text-red-200 overflow-x-auto">
                                                Σ F_x = F_x - P_x - F_r = m · a<br/>
                                                F·cos(α) - m·g·sin(α) - μ·N = m·a<br/>
                                                F·cos(α) - m·g·sin(α) - μ·(m·g·cos(α) + F·sin(α)) = m·a
                                            </div>

                                            <p className="mt-3"><strong>3. Despejar F (Ecuación Maestra):</strong><br/>
                                            Agrupamos las 'F' a la izquierda y lo demás a la derecha.</p>
                                            <div className="bg-slate-900/80 p-3 rounded-lg border-l-4 border-purple-500 font-mono text-purple-200 shadow-inner overflow-x-auto">
                                                F · (cos(α) - μ·sin(α)) = m·a + m·g·sin(α) + μ·m·g·cos(α)<br/>
                                                F · ({cosA.toFixed(4)} - {mu}·{senA.toFixed(4)}) = {masa}·{aceleracion.toFixed(1)} + {px.toFixed(2)} + {(mu*py).toFixed(2)}<br/>
                                                F · ({denominador.toFixed(4)}) = {(masa*aceleracion).toFixed(1)} + {px.toFixed(2)} + {(mu*py).toFixed(2)}<br/>
                                                F = {numerador.toFixed(2)} / {denominador.toFixed(4)} = <strong>{fuerzaHorizontal.toFixed(2)} N</strong>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-xs text-red-300 space-y-3 leading-relaxed bg-red-900/20 p-4 rounded-xl border border-red-500/30">
                                            <p><strong>¡El Bloqueo por Fricción!</strong><br/>
                                            Fíjate en el denominador de la fórmula: <code>cos(α) - μ·sin(α)</code>.</p>
                                            <p>Si este valor es negativo o cero (<code>cos(α) ≤ μ·sin(α)</code>), significa que por cada Newton de fuerza horizontal que aplicas, generas más fricción de la que aportas para subir.</p>
                                            <p>En esta configuración, <strong>es físicamente imposible subir el bloque empujando en horizontal</strong>. ¡Romperías la rampa antes de moverlo!</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </main>

                        <footer className="max-w-5xl mx-auto mt-12 pt-6 border-t border-slate-800 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                            Profe Física | Dinámica Avanzada: Vector Fuerzas en Ángulo Diferente al Plano
                        </footer>
                    </div>
                );
            };

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        })();
    </script>
	<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); z-index: 10000; backdrop-filter: blur(10px);">
    <button id="navPrev" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">← Ant.</button>
    <a href="index.html" style="padding: 8px 20px; background: #059669; color: white; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; font-size: 12px; display: flex; align-items: center;">Índice</a>
    <button id="navNext" style="padding: 8px 15px; background: #334155; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Sig. →</button>
</div>

<script>
    (function() {
        const match = window.location.pathname.match(/ejercicio-(\d+)\.html/);
        if (match) {
            const n = parseInt(match[1]);
            const total = 70; // Cambiar a 44 para tema 8
            const prev = document.getElementById('navPrev');
            const next = document.getElementById('navNext');

            if (n > 1) prev.onclick = () => window.location.href = `ejercicio-${n-1}.html`;
            else prev.style.opacity = "0.3";

            if (n < total) next.onclick = () => window.location.href = `ejercicio-${n+1}.html`;
            else next.style.opacity = "0.3";
        }
    })();
</script>
</body>
</html>
